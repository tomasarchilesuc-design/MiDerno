// Arma la receta de un producto (nuevo o existente) con varios insumos a la vez.
// Si falta un insumo se puede crear ahí mismo, sin salir del formulario.
function unidadesPara(base) {
  // unidades en que se puede escribir la cantidad de un insumo (la suya y las convertibles)
  const extra = Object.keys(CONVERSIONES).filter((k) => k.startsWith(norm(base) + '>')).map((k) => k.split('>')[1]).filter((u) => u !== 'g' && u !== norm(base));
  return [base, ...extra];
}
function filaReceta(ins, f) {
  return `<div class="rec-row">
    <select class="in rec-ins" aria-label="Insumo">${opt('', 'Elige un insumo…')}${ins.map((i) => opt(i.id, `${i.nombre} (${money(i.costo_unitario)} / ${i.unidad})`, f?.insumo_id)).join('')}<option value="__nuevo">+ Insumo nuevo…</option></select>
    <input class="in rec-cant" inputmode="decimal" placeholder="Cantidad" aria-label="Cantidad por unidad" value="${f ? esc(String(Math.round(Number(f.cantidad) * 10000) / 10000).replace('.', ',')) : ''}">
    <select class="in rec-uni" aria-label="Unidad de medida">${unidades().map((u) => opt(u, u)).join('')}</select>
    <button type="button" class="btn icon-btn ghost rec-del" aria-label="Quitar fila">${icon('x')}</button>
    <div class="rec-nuevo" hidden>
      <input class="in rec-n-nombre" placeholder="Nombre del insumo" aria-label="Nombre del insumo nuevo">
      <input class="in rec-n-costo" inputmode="decimal" placeholder="Costo por unidad" aria-label="Costo por unidad de medida">
    </div>
  </div>`;
}
// precio sugerido según el margen que se quiere ganar, redondeado como precio de vitrina
const precioVitrina = (p) => (p >= 10000 ? Math.ceil(p / 1000) * 1000 - 10 : p >= 1000 ? Math.ceil(p / 100) * 100 - 10 : Math.ceil(p / 50) * 50);
function formReceta(prodId, editar = false) {
  const fsAct = prodId ? db.all('formulas').filter((f) => f.producto_id === prodId) : [];
  if (prodId && fsAct.length) editar = true;
  const sinReceta = db.all('productos').filter((p) => p.activo !== false && !db.all('formulas').some((f) => f.producto_id === p.id));
  const ins = [...db.all('insumos')].sort((a, b) => a.nombre.localeCompare(b.nombre));
  const sel = prodId || (sinReceta[0]?.id ?? '__nuevo'); const pAct = editar ? db.get('productos', prodId) : null;
  abrirSheet(editar ? 'Editar receta' : 'Nueva receta', `<div class="form">
    ${editar ? `<input type="hidden" id="rec-prod" value="${esc(prodId)}">${field('Producto', `<input class="in" id="rec-p-renombrar" value="${esc(pAct.nombre)}" aria-label="Nombre del producto">`, 'Puedes cambiarle el nombre aquí mismo.')}`
    : `${field('¿Para qué producto?', `<select class="in" id="rec-prod">${sinReceta.map((p) => opt(p.id, p.nombre, sel)).join('')}<option value="__nuevo" ${sel === '__nuevo' ? 'selected' : ''}>+ Producto nuevo…</option></select>`)}
    <div id="rec-prod-nuevo" ${sel === '__nuevo' ? '' : 'hidden'}>${field('Nombre del producto', '<input class="in" id="rec-p-nombre" placeholder="Ej: Vela de coco 200 g">')}</div>`}
    <div class="field"><label>¿Qué lleva una unidad?</label><span class="hint" style="margin-top:-2px">Elige la medida que te acomode en cada fila: por ejemplo 180 gr aunque compres la cera por kilo.${editar ? ' Toca la ✕ para sacar un insumo.' : ''}</span>
      <div class="stack" id="rec-filas">${editar ? fsAct.map((f) => filaReceta(ins, f)).join('') : filaReceta(ins) + filaReceta(ins)}</div>
      <button type="button" class="btn sm" id="rec-mas" style="align-self:flex-start">${icon('plus')}Agregar otro insumo</button></div>
    <div class="banner" id="rec-resumen" style="background:var(--accent-soft)">Agrega los insumos para ver cuánto te cuesta hacer una unidad.</div>
    <div class="field" id="rec-precio-box"><label for="rec-p-precio">Precio de venta</label>
      <div class="chips" id="rec-sugerencias"></div>
      <input class="in" id="rec-p-precio" inputmode="numeric" placeholder="Escribe tu precio o elige una sugerencia" value="${sel !== '__nuevo' ? esc(db.get('productos', sel)?.precio_venta || '') : ''}">
      <span class="hint" id="rec-margen"></span></div>
  </div>`, {
    submit: () => guardarReceta(),
    ...(editar ? { pie: `<div class="sheet-foot" style="justify-content:space-between"><button type="button" class="btn danger" data-act="del-receta" data-id="${esc(prodId)}">${icon('trash')}Borrar receta</button><div class="hstack"><button type="button" class="btn" data-close>Cancelar</button><button class="btn pri" type="submit">Guardar cambios</button></div></div>` } : {}),
  });
  const form = $('#sheet-form');
  const ajustarUnidades = (r) => {
    const id = r.querySelector('.rec-ins').value; const selU = r.querySelector('.rec-uni');
    if (!id || id === '__nuevo') { if (selU.dataset.base) { selU.innerHTML = unidades().map((u) => opt(u, u)).join(''); delete selU.dataset.base; } return; }
    const i = db.get('insumos', id); if (selU.dataset.base === i.unidad) return;
    selU.innerHTML = unidadesPara(i.unidad).map((u) => opt(u, u, i.unidad)).join(''); selU.dataset.base = i.unidad;
  };
  const costoFila = (r) => {
    const id = r.querySelector('.rec-ins').value; const cant = Number(String(r.querySelector('.rec-cant').value).replace(',', '.')) || 0; const u = r.querySelector('.rec-uni').value;
    if (id === '__nuevo') return cant * (Number(String(r.querySelector('.rec-n-costo').value).replace(',', '.')) || 0);
    const i = db.get('insumos', id); if (!i) return 0;
    return cant * (u === i.unidad ? 1 : factorUnidad(u, i.unidad) || 1) * Number(i.costo_unitario || 0);
  };
  const recalcular = () => {
    let costo = 0;
    form.querySelectorAll('.rec-row').forEach((r) => { r.querySelector('.rec-nuevo').hidden = r.querySelector('.rec-ins').value !== '__nuevo'; ajustarUnidades(r); costo += costoFila(r); });
    const res = $('#rec-resumen'); const pv = num($('#rec-p-precio').value);
    res.innerHTML = costo ? `Hacer una unidad te cuesta <b class="num">${money(costo)}</b>` : 'Agrega los insumos para ver cuánto te cuesta hacer una unidad.';
    // solo se redibuja si cambió, para no perder el toque sobre un botón
    const sugHtml = costo ? [50, 60, 70].map((m) => { const p = precioVitrina(costo / (1 - m / 100)); return `<button type="button" class="chip rec-sug" data-p="${p}">Ganar ${m}% → <b class="num">${money(p)}</b></button>`; }).join('') : '';
    if ($('#rec-sugerencias').dataset.html !== sugHtml) { $('#rec-sugerencias').innerHTML = sugHtml; $('#rec-sugerencias').dataset.html = sugHtml; }
    $('#rec-sugerencias').querySelectorAll('.rec-sug').forEach((b) => b.classList.toggle('on', Number(b.dataset.p) === pv));
    $('#rec-margen').innerHTML = costo && pv ? `Con ${money(pv)} ganas <b class="num ${pv - costo < 0 ? 'down' : ''}">${money(pv - costo)}</b> por unidad (${Math.round(((pv - costo) / pv) * 100)}% del precio).` : costo ? 'Elige una sugerencia o escribe tu propio precio.' : '';
  };
  form.addEventListener('input', recalcular);
  form.addEventListener('change', (e) => {
    if (e.target.id === 'rec-prod') { $('#rec-prod-nuevo').hidden = e.target.value !== '__nuevo'; $('#rec-p-precio').value = e.target.value !== '__nuevo' ? db.get('productos', e.target.value)?.precio_venta || '' : ''; }
    recalcular();
  });
  form.addEventListener('click', (e) => {
    if (e.target.closest('#rec-mas')) { $('#rec-filas').insertAdjacentHTML('beforeend', filaReceta(ins)); }
    const del = e.target.closest('.rec-del'); if (del) { if (form.querySelectorAll('.rec-row').length > 1) del.closest('.rec-row').remove(); recalcular(); }
    const sug = e.target.closest('.rec-sug'); if (sug) { $('#rec-p-precio').value = sug.dataset.p; formatearMonto($('#rec-p-precio'), false); recalcular(); }
  });
  recalcular();
}
function guardarReceta() {
  const form = $('#sheet-form'); let prodId = $('#rec-prod').value; const precio = num($('#rec-p-precio').value);
  const editando = !!$('#rec-p-renombrar'); const nuevoNombre = editando ? $('#rec-p-renombrar').value.trim() : '';
  if (editando && !nuevoNombre) return toast('Escribe el nombre del producto', true);
  if (prodId === '__nuevo' && !$('#rec-p-nombre').value.trim()) return toast('Escribe el nombre del producto', true);
  const lineas = [];
  for (const r of form.querySelectorAll('.rec-row')) {
    const id = r.querySelector('.rec-ins').value; const cant = Number(String(r.querySelector('.rec-cant').value).replace(',', '.')) || 0; const u = r.querySelector('.rec-uni').value;
    if (!id && !cant) continue;
    if (!id) return toast('Elige el insumo de cada fila', true);
    if (cant <= 0) return toast('Escribe cuánto lleva de cada insumo', true);
    if (id === '__nuevo') {
      const nombre = r.querySelector('.rec-n-nombre').value.trim(); if (!nombre) return toast('Escribe el nombre del insumo nuevo', true);
      lineas.push({ nuevo: { nombre, unidad: u, costo_unitario: Number(String(r.querySelector('.rec-n-costo').value).replace(',', '.')) || 0, stock_minimo: 0 }, cant });
    } else {
      // la cantidad se guarda en la unidad del insumo (180 gr de una cera en kg = 0,18 kg)
      const i = db.get('insumos', id); const f = u === i.unidad ? 1 : factorUnidad(u, i.unidad) || 1;
      lineas.push({ id, cant: Math.round(cant * f * 10000) / 10000 });
    }
  }
  if (!lineas.length) return toast('Agrega al menos un insumo', true);
  const ids = lineas.map((l) => l.id).filter(Boolean); if (new Set(ids).size !== ids.length) return toast('Hay un insumo repetido en la receta', true);
  if (!(precio > 0)) return toast('Elige una sugerencia o escribe el precio de venta', true);
  if (prodId === '__nuevo') prodId = db.insert('productos', { nombre: $('#rec-p-nombre').value.trim(), sku: '', precio_venta: precio, costo: 0, stock_minimo: 0, activo: true }).id;
  else if (Number(db.get('productos', prodId).precio_venta) !== precio) db.update('productos', prodId, { precio_venta: precio });
  if (editando) {
    if (nuevoNombre !== db.get('productos', prodId).nombre) db.update('productos', prodId, { nombre: nuevoNombre });
    db.removeMany('formulas', db.all('formulas').filter((f) => f.producto_id === prodId).map((f) => f.id));
  }
  for (const l of lineas) {
    const insumoId = l.id || db.insert('insumos', l.nuevo).id;
    db.insert('formulas', { producto_id: prodId, insumo_id: insumoId, cantidad: l.cant });
  }
  const p = db.get('productos', prodId);
  cerrarSheet(); S.ui.prod.tab = 'recetas'; toast(`${editando ? 'Receta actualizada' : 'Receta guardada'}: ${p.nombre} cuesta ${money(costoReceta(prodId))} y se vende a ${money(p.precio_venta)}`); render();
}

/* ---------- cambio de unidad (kg ↔ gr, lt ↔ ml, mt ↔ cm) ---------- */
const CONVERSIONES = { 'kg>gr': 1000, 'gr>kg': 0.001, 'lt>ml': 1000, 'ml>lt': 0.001, 'mt>cm': 100, 'cm>mt': 0.01, 'kg>g': 1000, 'g>kg': 0.001, 'gr>g': 1, 'g>gr': 1 };
const factorUnidad = (de, a) => CONVERSIONES[`${norm(de)}>${norm(a)}`] || 0;
function convertirInsumo(id, f) {
  db.all('movimientos_stock').filter((m) => m.tipo_item === 'insumo' && m.item_id === id).forEach((m) => db.update('movimientos_stock', m.id, { cantidad: Math.round(Number(m.cantidad) * f * 1000) / 1000 }));
  db.all('formulas').filter((x) => x.insumo_id === id).forEach((x) => db.update('formulas', x.id, { cantidad: Math.round(Number(x.cantidad) * f * 10000) / 10000 }));
}

const fechaConAnio = (f) => fechaCorta(f) + (String(f).slice(0, 4) !== hoy().slice(0, 4) ? ' ' + String(f).slice(0, 4) : '');
// dos columnas: cuándo y qué fue el último movimiento, y cuánto entró o salió
function celdasMov(tipo, id) {
  const ms = db.all('movimientos_stock').filter((m) => m.tipo_item === tipo && m.item_id === id);
  if (!ms.length) return '<td class="small muted">—</td><td class="n muted">—</td>';
  const un = tipo === 'insumo' ? ' ' + (db.get('insumos', id)?.unidad || '') : '';
  const u = ms.reduce((a, b) => (b.fecha > a.fecha ? b : a)); const c = qtyFmt(Math.abs(u.cantidad)) + un;
  const que = { venta: `se vendieron ${c}`, compra: `entraron ${c}`, produccion: `se fabricaron ${c}`, consumo: `se usaron ${c}`, ajuste: u.cantidad > 0 ? `ajuste: +${c}` : `ajuste: −${c}` }[u.motivo] || c;
  // última entrada: la cantidad que llegó (compra o producción), siempre en positivo
  const ent = ms.filter((m) => m.cantidad > 0 && (m.motivo === 'compra' || m.motivo === 'produccion')).reduce((a, b) => (!a || b.fecha > a.fecha ? b : a), null);
  return `<td class="small" style="white-space:nowrap">${fechaConAnio(u.fecha)}<div class="muted">${que}</div></td><td class="n small" style="white-space:nowrap">${ent ? `<b class="num">${qtyFmt(ent.cantidad)}${esc(un)}</b><div class="muted">${fechaConAnio(ent.fecha)}</div>` : '<span class="muted">—</span>'}</td>`;
}

function borrarInsumo(id) {
  const i = db.get('insumos', id); if (!i) return;
  const fs = db.all('formulas').filter((f) => f.insumo_id === id); const prods = [...new Set(fs.map((f) => db.get('productos', f.producto_id)?.nombre).filter(Boolean))];
  confirmar(`Se eliminará <b>${esc(i.nombre)}</b>${prods.length ? ` y se sacará de ${prods.length === 1 ? 'la receta' : 'las recetas'} de ${esc(prods.join(', '))}` : ''}.`, () => {
    db.removeMany('formulas', fs.map((f) => f.id));
    db.removeMany('movimientos_stock', db.all('movimientos_stock').filter((m) => m.tipo_item === 'insumo' && m.item_id === id).map((m) => m.id));
    db.remove('insumos', id); toast('Insumo eliminado'); render();
  });
}
function borrarReceta(prodId) {
  const p = db.get('productos', prodId); if (!p) return;
  confirmar(`Se borrará la receta de <b>${esc(p.nombre)}</b>. El producto y sus insumos se mantienen.`, () => {
    db.removeMany('formulas', db.all('formulas').filter((f) => f.producto_id === prodId).map((f) => f.id)); toast('Receta borrada'); render();
  }, 'Borrar receta');
}

/* =========================================================
   Agenda (para todos los negocios) y Equipo
   - Citas: horas de servicio con cliente, servicio y persona
   - Entregas: pedidos o despachos con dirección y monto
   - Recordatorios: cualquier cosa que haya que hacer un día
   ========================================================= */

const ESTADOS_CITA = { solicitada: ['Por confirmar', 'warn'], agendada: ['Agendada', ''], confirmada: ['Confirmada', 'acc'], completada: ['Pagada', 'ok'], no_asistio: ['No vino', 'bad'], cancelada: ['Cancelada', 'bad'], rechazada: ['Rechazada', 'bad'] };
const ESTADOS_EV = { pendiente: ['Pendiente', ''], entregada: ['Entregada', 'ok'], hecha: ['Hecha', 'ok'], cancelada: ['Cancelada', 'bad'] };
const INACTIVOS = ['cancelada', 'rechazada', 'no_asistio'];
const DIAS_CORTOS = ['lun', 'mar', 'mié', 'jue', 'vie', 'sáb', 'dom'];
const lunesDe = (iso) => { const d = new Date(iso + 'T12:00:00'); const dow = (d.getDay() + 6) % 7; return addDays(iso, -dow); };
const mapsLink = (dir) => `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(dir)}`;

function itemsDelDia(f, emp = S.ui.agenda.emp) {
  const out = [];
  const cli = (id) => db.get('clientes', id);
  for (const c of db.all('citas')) {
    if (c.fecha !== f) continue;
    if (emp !== 'todos' && c.empleado_id !== emp) continue;
    const s = db.get('servicios', c.servicio_id); const e = db.get('empleados', c.empleado_id);
    out.push({ kind: 'cita', id: c.id, hora: hhmm(c.hora), titulo: cli(c.cliente_id)?.nombre || 'Cliente', sub: [s?.nombre, e?.nombre].filter(Boolean).join(' · '), estado: c.estado, ref: c, s, cl: cli(c.cliente_id) });
  }
  if (emp === 'todos') for (const ev of db.all('eventos')) {
    if (ev.fecha !== f || ev.tipo === 'bloqueo') continue; const cl = cli(ev.cliente_id);
    out.push({ kind: ev.tipo, id: ev.id, hora: hhmm(ev.hora), titulo: ev.tipo === 'entrega' ? (cl?.nombre || ev.titulo || 'Entrega') : ev.titulo, sub: ev.tipo === 'entrega' ? [ev.titulo && cl ? ev.titulo : '', ev.direccion].filter(Boolean).join(' · ') : (ev.nota || ''), estado: ev.estado, ref: ev, cl });
  }
  return out.sort((a, b) => (a.hora || '99').localeCompare(b.hora || '99'));
}
const enAgenda = (i) => !INACTIVOS.includes(i.estado) && i.estado !== 'cancelada';
const KIND = { cita: { label: 'Cita', cls: 'k-cita' }, entrega: { label: 'Entrega', cls: 'k-entrega' }, tarea: { label: 'Recordatorio', cls: 'k-tarea' } };

/* ---------- AGENDA ---------- */
function vistaAgenda() {
  const ui = S.ui.agenda; ui.fecha ||= hoy(); ui.vista ||= esMovil() ? 'dia' : 'semana';
  const emps = db.all('empleados').filter((e) => e.activo !== false);
  const pend = db.all('citas').filter((c) => c.estado === 'solicitada' && c.fecha >= hoy()).sort((a, b) => (a.fecha + a.hora).localeCompare(b.fecha + b.hora));
  let titulo, cuerpo, paso;
  if (ui.vista === 'mes') { titulo = nombreMes(mesDe(ui.fecha)); cuerpo = agendaMes(); paso = 'mes'; }
  else if (ui.vista === 'semana') { titulo = tituloCalendario(); cuerpo = agendaCalendario(); paso = esMovil() ? 3 : 7; }
  else { titulo = fechaLarga(ui.fecha); cuerpo = agendaDia(); paso = 1; }
  return `${head('Agenda', esc(titulo), `<button class="btn" data-act="bloqueo-nuevo">${icon('lock')}<span class="solo-desk">Bloquear horario</span></button><button class="btn pri" data-act="agendar">${icon('plus')}Agendar</button>`)}
  ${pend.length ? `<div class="ag-pend-box ${ui.verPend ? 'on' : ''}"><button class="ag-pend" data-act="ag-pend" aria-expanded="${!!ui.verPend}"><span><b>${pend.length}</b> reserva${pend.length > 1 ? 's' : ''} por confirmar</span><span class="ag-pend-ver">${ui.verPend ? 'Ocultar' : 'Ver'}</span></button>
    ${ui.verPend ? `<div class="list">${pend.slice(0, 5).map((c) => { const cl = db.get('clientes', c.cliente_id); const s = db.get('servicios', c.servicio_id); return `<div class="row" style="flex-wrap:wrap"><div class="grow"><div class="t">${esc(cl?.nombre || 'Cliente')} · ${esc(s?.nombre || '')}</div><div class="s">${esc(fechaLarga(c.fecha))}, ${hhmm(c.hora)}${c.empleado_id ? ' · ' + esc(db.get('empleados', c.empleado_id)?.nombre || '') : ''}</div></div>
      <div class="hstack"><button class="btn sm" data-act="cita-estado" data-id="${c.id}" data-e="rechazada">Rechazar</button><button class="btn sm pri" data-act="confirmar-reserva" data-id="${c.id}">Confirmar</button></div></div>`; }).join('')}</div>` : ''}</div>` : ''}
  <div class="card stack ag-ctrl">
    <div class="between">
      <div class="hstack"><button class="btn icon-btn" data-act="ag-mover" data-d="-1" data-p="${paso}" aria-label="Anterior">${icon('left')}</button><button class="btn sm" data-act="ag-hoy">Hoy</button><button class="btn icon-btn" data-act="ag-mover" data-d="1" data-p="${paso}" aria-label="Siguiente">${icon('right')}</button>
        <input type="date" class="in ag-fecha-in" style="width:auto;min-height:34px;padding:4px 8px" data-change="ag-fecha" value="${ui.fecha}" aria-label="Ir a una fecha"></div>
      <div class="seg">${[['dia', 'Día'], ['semana', esMovil() ? '3 días' : 'Semana'], ['mes', 'Mes']].map(([k, v]) => `<button data-act="ag-vista" data-v="${k}" class="${ui.vista === k ? 'on' : ''}">${v}</button>`).join('')}</div>
    </div>
    ${emps.length > 1 ? `<div class="chips scroll"><button class="chip ${ui.emp === 'todos' ? 'on' : ''}" data-act="ag-emp" data-e="todos">Todo</button>${emps.map((e) => `<button class="chip ${ui.emp === e.id ? 'on' : ''}" data-act="ag-emp" data-e="${e.id}">${esc(e.nombre.split(' ')[0])}</button>`).join('')}</div>` : ''}
  </div>
  ${cuerpo}`;
}

function agendaDia() {
  const ui = S.ui.agenda; const items = itemsDelDia(ui.fecha);
  const semana = Array.from({ length: 7 }, (_, i) => addDays(ui.fecha, i - 3));
  const esperado = sum(items.filter((i) => i.kind === 'cita' && enAgenda(i)), (i) => Number(i.s?.precio || 0)) + sum(items.filter((i) => i.kind === 'entrega' && enAgenda(i) && !i.ref.pagado), (i) => Number(i.ref.monto || 0));
  const cobrado = sum(db.all('ventas').filter((v) => v.fecha === ui.fecha), (v) => Number(v.total));
  return `<div class="chips scroll" aria-label="Días cercanos">${semana.map((f) => `<button class="chip ${f === ui.fecha ? 'on' : ''}" data-act="ag-set" data-f="${f}">${new Date(f + 'T12:00:00').toLocaleDateString('es-CL', { weekday: 'short', day: 'numeric' })} · ${itemsDelDia(f).filter(enAgenda).length}</button>`).join('')}</div>
  <div class="card ag-dia-card"><div class="card-head"><h2>${items.filter(enAgenda).length} en agenda</h2><p class="num ag-cuentas"><span>Cobrado <b id="ag-cobrado">${money(cobrado)}</b></span>${esperado ? `<span>· ${money(esperado)} por cobrar</span>` : ''}</p></div>
    ${bloqueosDel(ui.fecha).map((b) => `<button class="ag-bloq" data-act="bloqueo" data-id="${b.id}">${icon('lock')}<span><b>Bloqueado ${esc(textoBloqueo(b))}</b>${b.titulo && b.titulo !== 'Bloqueado' ? ` · ${esc(b.titulo)}` : ''}</span><small>Nadie puede reservar</small></button>`).join('')}
    ${diaCerrado(ui.fecha) ? `<p class="small muted ag-cerrado">${icon('clock')}Según tu horario no atiendes este día. Igual puedes agendar.</p>` : ''}
    <div class="ag-lista">${items.length ? conRayaAhora(items, items.map(filaAgendaCorta)) : `<div class="empty">Página en blanco. Toca <b>Agendar</b> para anotar una hora, una entrega o un recordatorio.</div>`}</div></div>`;
}

function filaAgenda(i) {
  const r = i.ref; const k = KIND[i.kind];
  const [est, cls] = (i.kind === 'cita' ? ESTADOS_CITA : ESTADOS_EV)[i.estado] || ['', ''];
  const abierta = enAgenda(i) && !['completada', 'entregada', 'hecha'].includes(i.estado);
  const acciones = [];

  } else {
    if (abierta) acciones.push(`<button class="btn sm pri" data-act="ev-estado" data-id="${r.id}" data-e="hecha">Hecho</button>`);
    acciones.push(`<button class="btn sm ghost" data-act="evento" data-id="${r.id}" aria-label="Editar">${icon('edit')}</button>`);
  }
  const monto = i.kind === 'cita' ? (i.s ? money(i.s.precio) : '') : i.kind === 'entrega' && Number(r.monto) ? `${money(r.monto)}${r.pagado ? ' · pagado' : ''}` : '';

    <span class="pill ${cls}">${est}</span>

}

function chipAgenda(i) {

function agendaSemana() {
  const ui = S.ui.agenda; const l = lunesDe(ui.fecha);
  return `<div class="week">${Array.from({ length: 7 }, (_, d) => {
    const f = addDays(l, d); const items = itemsDelDia(f);
    return `<div class="week-day ${f === hoy() ? 'today' : ''}"><button class="week-head" data-act="ag-ir-dia" data-f="${f}"><span>${DIAS_CORTOS[d]}</span><b>${Number(f.slice(8))}</b></button>
      <div class="stack" style="gap:4px">${items.length ? items.map(chipAgenda).join('') : '<span class="small muted" style="padding:2px 4px">—</span>'}</div></div>`;
  }).join('')}</div>`;
}
function agendaMes() {
  const ui = S.ui.agenda; const ym = mesDe(ui.fecha); const ini = lunesDe(ym + '-01');
  const ultimo = `${ym}-${pad(diasDelMes(ym))}`; const semanas = Math.ceil((diasEntre(ini, ultimo) + 1) / 7);
  return `<div class="card month-wrap"><div class="month">${DIAS_CORTOS.map((d) => `<div class="month-dow">${d}</div>`).join('')}
    ${Array.from({ length: semanas * 7 }, (_, k) => {

        <span class="month-items">${items.slice(0, 3).map((i) => `<span class="m-item ${KIND[i.kind].cls}">${i.hora ? i.hora + ' ' : ''}${esc(i.titulo)}</span>`).join('')}${items.length > 3 ? `<span class="m-more">+${items.length - 3} más</span>` : ''}</span>
        ${items.length ? `<span class="month-dots">${kinds.map((x) => `<i class="${KIND[x].cls}"></i>`).join('')}<small>${items.length}</small></span>` : ''}
      </button>`;
    }).join('')}</div>
    <div class="legend" style="margin-top:10px">${tiene('servicios') ? '<span><i class="k-cita"></i>Citas</span>' : ''}<span><i class="k-entrega"></i>Entregas</span><span><i class="k-tarea"></i>Recordatorios</span></div></div>`;
}

function vistaEquipo() {
  const ui = S.ui.equipo; ui.mes ||= mesActual();
  const todos = db.all('empleados');
  const items = db.all('venta_items').filter((i) => i.empleado_id); const ventaMes = new Map(ventasDelMes(ui.mes).map((v) => [v.id, v]));
  const filas = todos.map((e) => {
    const its = items.filter((i) => i.empleado_id === e.id && ventaMes.has(i.venta_id));
    const coms = db.all('comisiones').filter((c) => c.empleado_id === e.id && mesDe(c.fecha) === ui.mes);
    return { e, n: sum(its, (i) => Number(i.cantidad)), vendido: sum(its, (i) => i.cantidad * i.precio_unitario), com: sum(coms, (c) => Number(c.monto)), pend: sum(coms.filter((c) => !c.pagada), (c) => Number(c.monto)) };
  });
  // quienes ya no están solo aparecen si ese mes tuvieron movimiento
  const visibles = filas.filter((f) => f.e.activo !== false || f.n || f.com);
  const totV = sum(filas, (f) => f.vendido); const totC = sum(filas, (f) => f.com);
  return `${head('Equipo', 'Servicios', `${monthNav('eq-mes', ui.mes)}<button class="btn pri" data-act="empleado">${icon('plus')}Agregar persona</button>`)}
  <div class="grid g3">
    <div class="card kpi"><span class="lbl">Servicios del equipo</span><span class="val">${money(totV)}</span><span class="sub">${qtyFmt(sum(filas, (f) => f.n))} atenciones</span></div>
    <div class="card kpi"><span class="lbl">Comisiones del mes</span><span class="val">${money(totC)}</span><span class="sub">${money(sum(filas, (f) => f.pend))} por pagar</span></div>
    <div class="card kpi"><span class="lbl">Queda para el local</span><span class="val">${money(totV - totC)}</span><span class="sub">${totV ? Math.round(((totV - totC) / totV) * 100) : 0}% de lo atendido</span></div>
  </div>
  ${tarjetaAccesos(todos)}
  <div class="card"><div class="tbl-wrap">${visibles.length ? `<table><thead><tr><th>Persona</th><th class="n">Comisión</th><th class="n">Atenciones</th><th class="n">Vendido</th><th class="n">Le corresponde</th><th class="n">Por pagar</th><th></th></tr></thead><tbody>${visibles.map((f) => `<tr>
      <td><div class="hstack" style="flex-wrap:nowrap"><div class="avatar">${esc(iniciales(f.e.nombre))}</div><div><b>${esc(f.e.nombre)}</b>${f.e.activo === false ? '<div class="small muted">Ya no está en el equipo</div>' : ''}</div></div></td>
      <td class="n">${qtyFmt(f.e.pct_comision)}%</td><td class="n">${qtyFmt(f.n)}</td><td class="n">${money(f.vendido)}</td><td class="n"><b>${money(f.com)}</b></td>
      <td class="n">${f.pend ? `<span class="pill warn">${money(f.pend)}</span>` : '<span class="pill ok">Al día</span>'}</td>
      <td class="n" style="white-space:nowrap">${f.pend ? `<button class="btn sm" data-act="pagar-com" data-id="${f.e.id}">Marcar pagado</button>` : ''}<button class="btn sm ghost" data-act="empleado" data-id="${f.e.id}" aria-label="Editar o eliminar">${icon('edit')}</button></td></tr>`).join('')}</tbody></table>` : '<div class="empty">Agrega a las personas que atienden para calcular sus comisiones automáticamente.</div>'}</div>
    <p class="small muted" style="margin-top:10px">Arriba, en <b>Accesos del equipo</b>, creas el usuario de cada persona para que vea sus horas y lo que lleva en el mes. La comisión se calcula sobre cada servicio cobrado. Si cambias el porcentaje de alguien, se recalcula lo que aún no le pagas; lo ya pagado no cambia.</p></div>`;
}

// Ajusta las comisiones que aún no se pagan al nuevo porcentaje
function recalcularComisiones(empId, antes, ahora) {
  const pend = db.all('comisiones').filter((c) => c.empleado_id === empId && !c.pagada);
  for (const c of pend) {
    const it = db.get('venta_items', c.venta_item_id);
    const base = it ? Number(it.cantidad) * Number(it.precio_unitario) : (antes ? Number(c.monto) * 100 / antes : 0);
    db.update('comisiones', c.id, { monto: Math.round(base * ahora / 100) });
  }
  return pend.length;
}

async function abrirArchivo(file) {
  if (!file) return;
  try {
    const nombre = file.name; const ext = nombre.split('.').pop().toLowerCase();
    if (ext === 'xls') return toast('Ese es el formato antiguo de Excel. Ábrelo y guárdalo como .xlsx (Libro de Excel) o CSV.', true);
    toast('Leyendo ' + nombre + '…'); cargando(true);
    let hojas;
    if (ext === 'csv' || ext === 'txt') hojas = [{ nombre: nombre.replace(/\.[^.]+$/, ''), filas: leerCSV(await file.text()) }];
    else hojas = await leerXLSX(await file.arrayBuffer());
    hojas = hojas.filter((h) => h.filas.some((f) => f.some((c) => String(c ?? '').trim())));
    if (!hojas.length) return toast('El archivo está vacío', true);
    // el año de los meses sin año ("Enero") se toma de las fechas que trae el archivo
    const anios = hojas.flatMap((h) => h.filas.flat()).map((c) => (typeof c === 'number' && c > 30000 && c < 60000 ? parseFecha(c) : typeof c === 'string' && /\d{4}/.test(c) ? parseFecha(c) : null)).filter(Boolean).map((f) => f.slice(0, 4));
    // si no hay fechas, se mira el nombre de la hoja o del archivo ("Resumen 2025", "ventas_2024.xlsx")
    if (!anios.length) [nombre, ...hojas.map((h) => h.nombre)].forEach((x) => { const y = String(x).match(/(?:^|\D)(20\d{2})(?:\D|$)/); if (y) anios.push(y[1]); });
    ANIO_IMPORT = anios.length ? Number(Object.entries(anios.reduce((a, y) => ((a[y] = (a[y] || 0) + 1), a), {})).sort((a, b) => b[1] - a[1])[0][0]) : Number(hoy().slice(0, 4));
    S.imp = { archivo: nombre, hojas: hojas.map((h) => analizarHoja(h.nombre, h.filas)) };
    const reconocidas = S.imp.hojas.filter((h) => h.tipo !== 'ninguno').length;
    render(); toast(reconocidas ? `Reconocimos ${reconocidas} de ${hojas.length} hoja${hojas.length > 1 ? 's' : ''}. Revisa y confirma.` : 'No reconocimos las hojas. Elige qué contiene cada una.');
  } catch (e) { console.error(e); toast('No pudimos leer el archivo: ' + (e.message || e), true); }
  finally { cargando(false); }
}

/* ---------- guardar ---------- */
function importarTodo() {
  const cont = { clientes: 0, productos: 0, servicios: 0, insumos: 0, ventas: 0, gastos: 0, actualizados: 0, repetidos: 0, movidos: 0 };
  const avisos = []; const H = hoy();
  const clientePorNombre = new Map(db.all('clientes').map((c) => [norm(c.nombre), c]));
  const clientePorTel = new Map(db.all('clientes').filter((c) => c.telefono).map((c) => [telLimpio(c.telefono), c]));
  const porNombre = (t) => new Map(db.all(t).map((x) => [norm(x.nombre), x]));
  const lotes = { ventas: [], venta_items: [], movimientos_stock: [], gastos: [], clientes: [] };
  const buscarCliente = (nombre) => {
    if (!nombre) return null; const k = norm(nombre); let c = clientePorNombre.get(k);
    if (!c) { c = { id: uid(), nombre: nombre.trim(), telefono: '', cumpleanos: null, notas: '', creado_en: H }; lotes.clientes.push(c); clientePorNombre.set(k, c); cont.clientes++; }
    return c;
  };
  const ajustarStock = (tipo, item, deseado) => {
    if (deseado == null) return; const dif = deseado - stockDe(tipo, item.id) - sum(lotes.movimientos_stock.filter((m) => m.item_id === item.id), (m) => m.cantidad);
    if (dif) lotes.movimientos_stock.push({ id: uid(), tipo_item: tipo, item_id: item.id, cantidad: dif, motivo: 'ajuste', ref_id: null, fecha: H, nota: 'Importado desde Excel' });
  };
  const firmaV = (fecha, total, nombre, cli) => [fecha, Math.round(total), norm(nombre), cli || ''].join('|');
  // repetidos: se cuentan las veces que ya existe cada fila, así dos atenciones iguales el mismo día no se pierden,
  // pero si subes el mismo archivo dos veces no se duplica nada
  const contar = (arr) => arr.reduce((m, k) => m.set(k, (m.get(k) || 0) + 1), new Map());
  const vEx = contar(db.all('ventas').map((v) => firmaV(v.fecha, v.total, itemsDeVenta(v.id)[0]?.nombre, v.cliente_id)));
  const gEx = contar(db.all('gastos').map((g) => [g.fecha, Math.round(g.monto), norm(g.descripcion)].join('|')));
  const vVistos = new Map(), gVistos = new Map();
  const repetida = (ex, vistos, k) => { const n = vistos.get(k) || 0; vistos.set(k, n + 1); return n < (ex.get(k) || 0); };
  IMP_NUEVOS.cats.clear(); IMP_NUEVOS.metodos.clear();
  const registrarIngreso = (o, det, monto, cant) => {
    const item = buscarEnCatalogo(det);
    // en servicios el ingreso va con su cliente: de la columna Cliente o, si no hay, del mismo detalle ("Manicure Paula Rojas")
    const nombreCli = o.cliente || clienteEnDetalle(det, item);
    const cli = buscarCliente(nombreCli); const nombre = item?.x.nombre || det || 'Venta';
    const f = firmaV(o.fecha, monto, nombre, cli?.id); if (repetida(vEx, vVistos, f)) { cont.repetidos++; return; }
    const v = { id: uid(), fecha: o.fecha, cliente_id: cli?.id || null, total: monto, metodo_pago: parseMetodo(o.metodo_pago), canal: 'local', nota: monto ? 'Importado desde Excel' : 'Importado desde Excel (sin cobro: ' + (o.metodo_pago || 'giftcard') + ')' };
    lotes.ventas.push(v);
    lotes.venta_items.push({ id: uid(), venta_id: v.id, tipo_item: item ? item.tipo : 'libre', item_id: item?.x.id || null, nombre, cantidad: cant, precio_unitario: Math.round((monto / cant) * 100) / 100, empleado_id: null });
    cont.ventas++;
  };
  const registrarGasto = (o, det, monto) => {
    const k = [o.fecha, Math.round(monto), norm(det)].join('|'); if (repetida(gEx, gVistos, k)) { cont.repetidos++; return; }
    lotes.gastos.push({ id: uid(), fecha: o.fecha, categoria: parseCategoria(o.categoria, det), monto, descripcion: det || o.categoria || '' });

  // orden: catálogos y clientes primero, después ventas y egresos que los usan
  const orden = ['clientes', 'servicios', 'productos', 'insumos', 'ventas', 'gastos', 'caja', 'resumen'];
  const hojas = [...S.imp.hojas].filter((h) => h.tipo !== 'ninguno').sort((a, b) => orden.indexOf(a.tipo) - orden.indexOf(b.tipo));
  for (const h of hojas) {
    const filas = datosDe(h).map((f) => filaAObjeto(h, f)).filter((o) => filaValida(h.tipo, o));
    if (h.tipo === 'clientes') for (const o of filas) {

    } if (filas.some((o) => o.stock != null) && !tiene('inventario')) { db.modulo('inventario', true); avisos.push('Activamos Productos e inventario porque tu archivo trae stock.'); } }
    if (h.tipo === 'insumos') { const ex = porNombre('insumos'); for (const o of filas) {
      const e = ex.get(norm(o.nombre)); const fila = { nombre: o.nombre, unidad: o.unidad || 'unidad', costo_unitario: o.costo_unitario || 0, stock_minimo: o.stock_minimo || 0 };
      let i; if (e) { if (o.costo_unitario) db.update('insumos', e.id, { costo_unitario: o.costo_unitario }); i = e; cont.actualizados++; } else { i = db.insert('insumos', fila); ex.set(norm(i.nombre), i); cont.insumos++; }
      ajustarStock('insumo', i, o.stock);
    } if (filas.length && !tiene('produccion')) { if (!tiene('inventario')) db.modulo('inventario', true); db.modulo('produccion', true); avisos.push('Activamos Producción porque tu archivo trae insumos.'); } }
    if (['ventas', 'caja', 'gastos'].includes(h.tipo)) {
      // cada fila se decide sola: lo que es egreso va a egresos y lo que es ingreso va a ventas, con su cliente
      for (const o of filas) {
        const det = o.detalle || o.descripcion || '';
        const partes = claseFila(h.tipo, o);
        for (const c of partes) {
          if (c.clase === 'venta') registrarIngreso(o, det, c.monto, h.tipo === 'ventas' && o.cantidad > 0 ? o.cantidad : 1);
          else registrarGasto(o, det, c.monto);
          if (h.tipo !== 'caja' && (c.clase === 'venta') !== (h.tipo === 'ventas')) cont.movidos++;
        }
      }
      if (filas.some((o) => o.fecha > H)) avisos.push('Algunas filas tienen fecha futura; revisa que el formato de fecha sea día/mes/año.');

  }

  // resumen mensual: si el archivo trae el detalle, solo sirve para comparar; si no, se cargan los totales del mes

      const gas = o.gastos != null ? Math.abs(o.gastos) : (o.balance < 0 && o.ingresos == null ? Math.abs(o.balance) : (o.ingresos != null && o.balance != null ? o.ingresos - o.balance : null));
      const yaHay = db.all('ventas').some((v) => mesDe(v.fecha) === o.mes) || db.all('gastos').some((g) => mesDe(g.fecha) === o.mes) || lotes.ventas.some((v) => mesDe(v.fecha) === o.mes) || lotes.gastos.some((g) => mesDe(g.fecha) === o.mes);
      if (!hayDetalle && !yaHay) {

        if (ing > 0) { const v = { id: uid(), fecha, cliente_id: null, total: ing, metodo_pago: Object.keys(metodos())[0], canal: 'local', nota: 'Total del mes desde resumen' }; lotes.ventas.push(v); lotes.venta_items.push({ id: uid(), venta_id: v.id, tipo_item: 'libre', item_id: null, nombre: `Ingresos de ${nombreMes(o.mes)} (resumen)`, cantidad: 1, precio_unitario: ing, empleado_id: null }); cont.ventas++; }

        cont.meses = (cont.meses || 0) + 1;

  }
  // guardado en bloque (mucho más rápido en la nube que fila por fila)
  for (const t of ['clientes', 'ventas', 'venta_items', 'movimientos_stock', 'gastos']) if (lotes[t].length) db.insertMany(t, lotes[t]);
  const catsNuevas = [...IMP_NUEVOS.cats.values()].filter((c) => !catGastos().includes(c)); const metNuevos = [...IMP_NUEVOS.metodos].filter(([k]) => !metodos()[k]);
  if (catsNuevas.length || metNuevos.length) {
    guardarConfig({ ...(catsNuevas.length ? { categorias_gasto: [...catGastos(), ...catsNuevas] } : {}), ...(metNuevos.length ? { metodos: [...Object.entries(metodos()).map(([k, l]) => ({ k, l })), ...metNuevos.map(([k, l]) => ({ k, l }))] } : {}) });
    avisos.push(`Agregamos a tus listas: ${[...catsNuevas, ...metNuevos.map((m) => m[1])].join(', ')}.`);

  const lineas = [cont.recetas ? `${cont.recetas} ${cont.recetas === 1 ? 'receta' : 'recetas'} de producción` : null, n('ventas', 'ingreso', 'ingresos'), n('gastos', 'gasto', 'gastos'), n('clientes', 'cliente nuevo', 'clientes nuevos'), n('productos', 'producto', 'productos'), n('servicios', 'servicio', 'servicios'), n('insumos', 'insumo', 'insumos'),
    cont.actualizados ? (cont.actualizados === 1 ? '1 registro que ya tenías quedó al día' : `${cont.actualizados} registros que ya tenías quedaron al día`) : null, cont.repetidos ? (cont.repetidos === 1 ? '1 fila ya estaba en MiDerno y se saltó' : `${cont.repetidos} filas ya estaban en MiDerno y se saltaron (no se duplica nada)`) : null, cont.movidos ? `${cont.movidos} filas estaban en la hoja equivocada y las ordenamos (gasto o ingreso)` : null].filter(Boolean);
  if (cont.meses) lineas.push(`${cont.meses} mes${cont.meses > 1 ? 'es' : ''} cargado${cont.meses > 1 ? 's' : ''} desde tu resumen como totales del mes`);
  // con todo guardado, se compara lo que dice el resumen con lo que calcula MiDerno
  const cmp = comparacion.map((c) => {
    const ing = sum(ventasDelMes(c.mes), (v) => Number(v.total)); const gas = sum(gastosDelMes(c.mes), (g) => Number(g.monto));

  }).sort((a, b) => a.mes.localeCompare(b.mes));
  S.imp.resultado = { lineas: lineas.length ? lineas : ['No había registros nuevos para agregar'], avisos, cmp };
  window.scrollTo(0, 0); render(); toast('Importación lista');
}

/* =========================================================
   Planillas "a mano": recetas en bloques y listas sin fecha
   Ej: un bloque con el nombre del producto arriba (home spray), debajo cada insumo con su costo
   (frasco 450 · 120 ml), después el costo total y el precio de venta.
   ========================================================= */
const ENVASE_RE = /frasco|caja|bolsa|etiqueta|sticker|envase|tapa|varilla|palito|pabilo|mecha|tarro|botella|cinta|tag/;
const esTexto = (v) => typeof v === 'string' && /[a-záéíóúñü]/i.test(v);
const esNum = (v) => typeof v === 'number' || (typeof v === 'string' && v.trim() !== '' && parseNumero(v) != null && /^[\s$\d.,-]+$/.test(v));
const valNum = (v) => typeof v === 'number' ? v : parseNumero(v);
const titulo = (s) => { let t = String(s).trim().replace(/\s+/g, ' '); if (t === t.toUpperCase()) t = t.toLowerCase(); return t.replace(/^./, (c) => c.toUpperCase()); };
function parseCantidad(v) {
  const m = String(v ?? '').trim().toLowerCase().match(/^(\d+(?:[.,]\d+)?)\s*(ml|cc|lt|l|gr|g|grs|kg|un|unid|unidades?)?\.?$/);
  if (!m) return null;
  const u = { cc: 'ml', l: 'lt', g: 'gr', grs: 'gr', un: 'unidad', unid: 'unidad', unidades: 'unidad' }[m[2]] || m[2] || 'unidad';
  return { n: Number(m[1].replace(',', '.')), u };
}
function leerBloques(filas) {
  const F = filas.map((f) => f || []); const ancho = Math.max(0, ...F.map((f) => f.length));
  const cel = (r, c) => (F[r] || [])[c];
  const usadas = new Set(); const recetas = []; const listas = [];
  // recetas: encabezado de texto y debajo filas "insumo | costo | cantidad?", cerradas por el total (y el precio)
  for (let c = 0; c < ancho - 1; c++) for (let r = 0; r < F.length - 2; r++) {
    if (usadas.has(r + ',' + c) || !esTexto(cel(r, c))) continue;
    const lineas = []; let k = r + 1;
    while (k < F.length && esTexto(cel(k, c)) && esNum(cel(k, c + 1))) { lineas.push({ insumo: cel(k, c), costo: valNum(cel(k, c + 1)), cant: parseCantidad(cel(k, c + 2)) }); k++; }
    if (lineas.length < 3 || /venta|gasto|compra|total/.test(norm(cel(r, c)))) continue;
    const suma = sum(lineas, (l) => l.costo);
    const t1 = !esTexto(cel(k, c)) && esNum(cel(k, c + 1)) ? valNum(cel(k, c + 1)) : null;
    if (t1 == null || Math.abs(t1 - suma) > Math.max(2, suma * 0.03)) continue;
    const t2 = !esTexto(cel(k + 1, c)) && esNum(cel(k + 1, c + 1)) ? valNum(cel(k + 1, c + 1)) : null;
    const tam = parseCantidad(cel(r, c + 1));
    recetas.push({ nombre: titulo(cel(r, c)) + (tam ? ` ${qtyFmt(tam.n)} ${tam.u}` : ''), base: titulo(cel(r, c)), costo: t1, precio: t2 && t2 > t1 ? t2 : null, lineas });
    for (let x = r; x <= k + 1; x++) for (let y = c; y <= c + 2; y++) usadas.add(x + ',' + y);
  }
  // si dos recetas se llaman igual, se distinguen por el tamaño del frasco ("Mikado 50 ml")
  for (const rc of recetas) if (rc.nombre === rc.base && recetas.filter((x) => norm(x.base) === norm(rc.base)).length > 1) { const env = rc.lineas.find((l) => ENVASE_RE.test(norm(l.insumo)) && l.cant && l.cant.u !== 'unidad'); if (env) rc.nombre = `${rc.base} ${qtyFmt(env.cant.n)} ${env.cant.u}`; }
  // listas sin fecha: "monto | nombre" hacia abajo, con el total al final. Si arriba dice ventas, son ingresos
  for (let c = 0; c < ancho - 1; c++) for (let r = 0; r < F.length; r++) {
    if (usadas.has(r + ',' + c) || !esNum(cel(r, c)) || !esTexto(cel(r, c + 1))) continue;
    if (r > 0 && esNum(cel(r - 1, c)) && esTexto(cel(r - 1, c + 1))) continue; // no es el comienzo
    const items = []; let k = r;
    while (k < F.length && esNum(cel(k, c)) && esTexto(cel(k, c + 1))) { items.push({ monto: valNum(cel(k, c)), nombre: titulo(cel(k, c + 1)), nota: esTexto(cel(k, c + 2)) ? String(cel(k, c + 2)).trim() : '' }); k++; }
    if (items.length < 3) continue;
    const total = esNum(cel(k, c)) && !esTexto(cel(k, c + 1)) ? valNum(cel(k, c)) : null;
    const encabezado = norm([cel(r - 1, c), cel(r - 1, c + 1), cel(r, c - 1), cel(Math.max(0, r - 1), c - 1)].filter(esTexto).join(' ')) || norm(String(cel(0, c) ?? ''));
    const tipo = /venta|ingreso|vendido/.test(encabezado) ? 'ingreso' : 'egreso';
    listas.push({ tipo, items, total: total != null && Math.abs(total - sum(items, (i) => i.monto)) <= 2 ? total : sum(items, (i) => i.monto) });
    for (let x = r; x <= k; x++) for (let y = c; y <= c + 2; y++) usadas.add(x + ',' + y);
  }
  return { recetas, listas };
}

// guarda productos, insumos y recetas; los insumos con el mismo nombre se comparten si cuestan lo mismo por unidad
function importarBloques(h, cont, avisos) {
  const insPorNombre = new Map(db.all('insumos').map((i) => [norm(i.nombre), i]));
  const prodPorNombre = new Map(db.all('productos').map((p) => [norm(p.nombre), p]));
  for (const rc of h.recetas) {
    let p = prodPorNombre.get(norm(rc.nombre));
    if (!p) { p = db.insert('productos', { nombre: rc.nombre, sku: '', precio_venta: rc.precio || 0, costo: rc.costo, stock_minimo: 3, activo: true }); prodPorNombre.set(norm(p.nombre), p); cont.productos++; }
    else if (rc.precio && !Number(p.precio_venta)) db.update('productos', p.id, { precio_venta: rc.precio });
    db.removeMany('formulas', db.all('formulas').filter((f) => f.producto_id === p.id).map((f) => f.id)); // la receta del archivo reemplaza a la anterior
    for (const l of rc.lineas) {
      const envase = ENVASE_RE.test(norm(l.insumo));
      const usaCant = l.cant && !envase && l.cant.n > 0;
      const unidad = usaCant ? l.cant.u : 'unidad'; const cantidad = usaCant ? l.cant.n : 1;
      const cu = l.costo / cantidad;
      let nombre = titulo(l.insumo) + (envase && l.cant && l.cant.u !== 'unidad' ? ` ${qtyFmt(l.cant.n)} ${l.cant.u}` : '');
      // se comparte el insumo solo si tiene la misma unidad y el mismo costo; si no, se crea uno con el nombre del producto
      const calza = (i) => i && i.unidad === unidad && Math.abs(Number(i.costo_unitario) - cu) <= Math.max(0.5, cu * 0.005);
      const base = nombre; let ins = insPorNombre.get(norm(nombre));
      for (let n = 0; ins && !calza(ins); n++) { nombre = `${base} (${rc.nombre}${n ? ' ' + (n + 1) : ''})`; ins = insPorNombre.get(norm(nombre)); }
      if (!ins) { ins = db.insert('insumos', { nombre, unidad, costo_unitario: Math.round(cu * 10000) / 10000, stock_minimo: 0 }); insPorNombre.set(norm(nombre), ins); cont.insumos++; }
      db.insert('formulas', { producto_id: p.id, insumo_id: ins.id, cantidad });
    }

    }

}

/* =========================================================
   Página pública de reservas
   Los clientes del negocio eligen servicio, persona, día y hora
   libre; la hora llega a la agenda como "Por confirmar".
   ========================================================= */

const HORARIO_DEF = { dias: [1, 2, 3, 4, 5, 6], desde: '10:00', hasta: '19:00', intervalo: 30 };
const DIAS_SEMANA = [[1, 'Lun'], [2, 'Mar'], [3, 'Mié'], [4, 'Jue'], [5, 'Vie'], [6, 'Sáb'], [0, 'Dom']];
const horarioDe = (n) => ({ ...HORARIO_DEF, ...(typeof n?.horario === 'string' ? JSON.parse(n.horario) : n?.horario || {}) });
// horario de un día de la semana (0 = domingo): null si está cerrado
const horarioDia = (h, dow) => (h.dias.includes(dow) ? { desde: h.porDia?.[dow]?.desde || h.desde, hasta: h.porDia?.[dow]?.hasta || h.hasta } : null);
const slugDe = (nombre) => norm(nombre).replace(/ /g, '-').slice(0, 40) || 'mi-negocio';
const aMin = (h) => { const [a, b] = hhmm(h).split(':').map(Number); return a * 60 + (b || 0); };
const deMin = (m) => `${pad(Math.floor(m / 60))}:${pad(m % 60)}`;

// Horas libres de un día: recorre el horario de atención y deja las que no chocan
function horasLibres({ horario, fecha, dur, ocupadas, empleados, empleadoId }) {
  const dow = new Date(fecha + 'T12:00:00').getDay(); const hd = horarioDia(horario, dow); if (!hd) return [];
  const ini = aMin(hd.desde), fin = aMin(hd.hasta), paso = Number(horario.intervalo) || 30;
  const n = new Date(); const minimo = fecha === hoy() ? n.getHours() * 60 + n.getMinutes() + 60 : fecha < hoy() ? 99999 : 0;
  const ids = empleados.map((e) => e.id); const out = [];
  for (let m = ini; m + dur <= fin; m += paso) {
    if (m < minimo) continue;
    const cruzan = ocupadas.filter((o) => m < aMin(o.hora) + Number(o.dur) && aMin(o.hora) < m + dur);
    if (cruzan.some((o) => o.todos)) continue; // horario bloqueado por el negocio
    if (!ids.length) { if (!cruzan.length) out.push({ hora: deMin(m), empleado_id: null }); continue; }
    // cada hora sin persona asignada ocupa a alguien del equipo
    const sinAsignar = cruzan.filter((o) => o.empleado_id == null).length;
    const libres = ids.filter((id) => !cruzan.some((o) => o.empleado_id === id));
    if (libres.length <= sinAsignar) continue;
    if (empleadoId) { if (libres.includes(empleadoId)) out.push({ hora: deMin(m), empleado_id: empleadoId }); }
    else out.push({ hora: deMin(m), empleado_id: libres[0] });
  }
  return out;
}

const llenar = (tpl, v) => String(tpl || '').replace(/\{(\w+)\}/g, (_, x) => v[x] ?? '').trim();
const ReservaLocal = {
  async info() {
    if (!S.negocio) throw new Error('Negocio no encontrado');
    return { negocio: { nombre: S.negocio.nombre, telefono: S.negocio.telefono || '' }, horario: horarioDe(S.negocio),
      perfil: { logo: cfg().logo || '', direccion: cfg().direccion || '', maps_url: cfg().maps_url || '', resenas_url: cfg().resenas_url || '', fotos: cfg().fotos || [] },
      config: { abono: cfg().abono || null, mensajes: { abono: plantilla('abono'), comprobante: plantilla('comprobante') }, auto_abono: autoOn('abono') },
      servicios: db.all('servicios').filter((s) => s.activo !== false).map(({ id, nombre, duracion_min, precio }) => ({ id, nombre, duracion_min, precio })),
      empleados: db.all('empleados').filter((e) => e.activo !== false).map((e) => ({ id: e.id, nombre: e.nombre.split(' ')[0] })) };

    return [...db.all('citas').filter((c) => c.fecha === fecha && !INACTIVOS.includes(c.estado)).map((c) => ({ hora: hhmm(c.hora), dur: Number(db.get('servicios', c.servicio_id)?.duracion_min || 60), empleado_id: c.empleado_id })),

    if (!c) c = db.insert('clientes', { nombre: r.nombre, telefono: r.telefono, cumpleanos: r.cumple || null, notas: '', creado_en: hoy() });
    else if (r.cumple && !c.cumpleanos) db.update('clientes', c.id, { cumpleanos: r.cumple });
    db.insert('citas', { cliente_id: c.id, servicio_id: r.servicio_id, empleado_id: r.empleado_id, fecha: r.fecha, hora: r.hora, estado: 'solicitada', venta_id: null, nota: 'Reservó desde la página' + (r.nota ? ': ' + r.nota : '') });
    return { ok: true };
  },
};
function ReservaNube(slug) {

  };
}

async function pubEnviar(d) {
  const p = S.pub;
  if (!d.nombre.trim() || telLimpio(d.telefono).length < 8) return toast('Escribe tu nombre y un WhatsApp válido', true);
  p.datos = { nombre: d.nombre.trim(), telefono: d.telefono.trim(), cumple: d.cumple || '' }; p.enviando = true; render();
  try {
    // vuelve a revisar que la hora siga libre justo antes de reservar
    const ocupadas = await conCarga(p.api.ocupadas(p.fecha));
    const libre = horasLibres({ horario: p.info.horario, fecha: p.fecha, dur: Number(p.servicio.duracion_min || 60), ocupadas, empleados: p.info.empleados, empleadoId: p.empleado || null }).find((h) => h.hora === p.hora.hora);
    if (!libre) { p.enviando = false; p.hora = null; await pubCargarHoras(); return toast('Alguien acaba de tomar esa hora. Elige otra.', true); }
    await p.api.reservar({ servicio_id: p.servicio.id, empleado_id: libre.empleado_id, fecha: p.fecha, hora: libre.hora, nombre: p.datos.nombre, telefono: p.datos.telefono, cumple: p.datos.cumple || null, nota: d.nota.trim() });
    p.enviado = true;
  } catch (e) { toast('No se pudo reservar: ' + (e.message || e), true); }
  p.enviando = false; window.scrollTo(0, 0); render();
}

function guardarReservas(form) {
  const fd = new FormData(form); const dias = fd.getAll('dia').map(Number);
  if (!dias.length) return toast('Elige al menos un día de atención', true);
  const porDia = {};
  for (const d of dias) {
    const desde = fd.get('desde_' + d) || '10:00', hasta = fd.get('hasta_' + d) || '19:00';
    if (aMin(hasta) <= aMin(desde)) return toast(`${DIAS_SEMANA.find((x) => x[0] === d)[1]}: la hora de cierre debe ser después de la de apertura`, true);
    porDia[d] = { desde, hasta };
  }
  // el horario general queda como el más amplio (sirve de respaldo para versiones anteriores)
  const desde = deMin(Math.min(...dias.map((d) => aMin(porDia[d].desde)))), hasta = deMin(Math.max(...dias.map((d) => aMin(porDia[d].hasta))));
  const slug = slugDe(fd.get('slug') || S.negocio.nombre);
  db.negocio({ horario: { dias, desde, hasta, porDia, intervalo: Number(fd.get('intervalo')) || 30 }, telefono: String(fd.get('telefono') || '').trim(), slug });
  toast('Horario guardado'); render();
}

function botonesCalendario(p, info) {

/* =========================================================
   Proveedores y contactos
   Cada producto o insumo puede tener su proveedor. Cuando algo
   queda bajo el mínimo, MiDerno arma el pedido y lo deja listo
   para mandar por WhatsApp.
   ========================================================= */

const TIPOS_CONTACTO = { proveedor: 'Proveedor', web: 'Página web', contacto: 'Contacto' };
const esProveedor = (c) => c && c.tipo !== 'contacto';

// Productos e insumos que surte un proveedor, con su stock
function itemsDeProveedor(provId) {
  const out = [];
  for (const p of db.all('productos')) if (p.proveedor_id === provId && p.activo !== false) out.push({ tipo: 'producto', item: p, st: stockDe('producto', p.id), min: Number(p.stock_minimo || 0), unidad: 'un.' });
  for (const i of db.all('insumos')) if (i.proveedor_id === provId) out.push({ tipo: 'insumo', item: i, st: stockDe('insumo', i.id), min: Number(i.stock_minimo || 0), unidad: i.unidad });
  return out;
}
const bajoMinimo = (x) => x.st <= x.min;
const sugerido = (x) => Math.max(1, Math.ceil(x.min * 2 - x.st));
function porReponer() {
  // proveedores con algo bajo el mínimo, y lo que no tiene proveedor asignado
  const control = tiene('inventario');
  const provs = db.all('proveedores').map((p) => ({ p, bajos: itemsDeProveedor(p.id).filter(bajoMinimo) })).filter((x) => x.bajos.length && control);
  const sinProv = control ? [...db.all('productos').filter((p) => p.activo !== false && !p.proveedor_id && stockDe('producto', p.id) <= Number(p.stock_minimo || 0)),
    ...(tiene('produccion') ? db.all('insumos').filter((i) => !i.proveedor_id && stockDe('insumo', i.id) <= Number(i.stock_minimo || 0)) : [])] : [];
  return { provs, sinProv };
}

/* ---------- vista ---------- */

  const lista = [...db.all('proveedores')].sort((a, b) => (a.tipo === b.tipo ? a.nombre.localeCompare(b.nombre) : a.tipo === 'proveedor' ? -1 : 1));
  const { provs, sinProv } = porReponer();
  const reponer = provs.length || sinProv.length ? `<div class="card stack" style="border-color:var(--warn)"><div class="between"><h2>Para reponer</h2><span class="small muted">Productos e insumos en el mínimo o bajo él</span></div>

  const tarjeta = (c) => {

      ${items.length ? `<div class="small">${items.slice(0, 6).map((x) => `<span class="pill ${bajoMinimo(x) ? 'warn' : ''}" style="margin:0 4px 4px 0">${esc(x.item.nombre)}${bajoMinimo(x) ? ' · quedan ' + qtyFmt(x.st) : ''}</span>`).join('')}${items.length > 6 ? `<span class="small muted">y ${items.length - 6} más</span>` : ''}</div>` : ''}
      ${c.telefono || c.email || c.web ? `<div class="small muted num" style="overflow-wrap:anywhere">${esc([c.telefono, c.email, c.web && c.web.replace(/^https?:\/\//, '')].filter(Boolean).join(' · '))}</div>` : ''}
      ${c.notas ? `<p class="small muted">${esc(c.notas)}</p>` : ''}
      <div class="hstack">
        ${c.telefono ? `<a class="btn sm" target="_blank" rel="noopener" href="${waLink(c.telefono, `Hola${c.contacto ? ' ' + primerNombre(c.contacto) : ''}, te escribo de ${S.negocio.nombre}.`)}">${icon('chat')}WhatsApp</a><a class="btn sm" href="tel:${esc(String(c.telefono).replace(/[^\d+]/g, ''))}">Llamar</a>` : ''}

      </div></div>`;
  };
  return `${head('Proveedores y contactos', 'A quién llamar', `<button class="btn pri" data-act="proveedor">${icon('plus')}Nuevo contacto</button>`)}
  ${reponer}
  ${lista.length ? `<div class="grid g2">${lista.map(tarjeta).join('')}</div>` : `<div class="card empty">Anota aquí a tus proveedores y contactos clave (el técnico, la contadora, el que te trae los envases). Si les asignas productos o insumos, MiDerno te avisa cuándo pedirles y te deja el mensaje listo.</div>`}`;
}

/* =========================================================
   Clientes repetidos: si dos fichas tienen el mismo nombre o el
   mismo teléfono, se pueden unir en una sola con todo su historial.
   ========================================================= */

const tel8 = (t) => telLimpio(t).slice(-8);
function buscarGemelo(id, nombre, telefono) {
  const n = norm(nombre); const t = tel8(telefono);
  return db.all('clientes').find((c) => c.id !== id && ((n && norm(c.nombre) === n) || (t.length === 8 && tel8(c.telefono) === t)));
}
function gruposDuplicados() {
  const visto = new Set(); const grupos = [];
  for (const c of db.all('clientes')) {
    if (visto.has(c.id)) continue;
    const g = db.all('clientes').filter((x) => x.id === c.id || norm(x.nombre) === norm(c.nombre) || (tel8(c.telefono).length === 8 && tel8(x.telefono) === tel8(c.telefono)));
    g.forEach((x) => visto.add(x.id));
    if (g.length > 1) grupos.push(g);
  }
  return grupos;
}
const comprasDe = (id) => db.all('ventas').filter((v) => v.cliente_id === id).length;

// Mueve todo el historial de "sobra" a "queda" y borra la ficha repetida
function unificarClientes(quedaId, sobraId) {
  const queda = db.get('clientes', quedaId); const sobra = db.get('clientes', sobraId); if (!queda || !sobra || quedaId === sobraId) return;
  db.all('ventas').filter((v) => v.cliente_id === sobraId).forEach((v) => db.update('ventas', v.id, { cliente_id: quedaId }));
  db.all('citas').filter((c) => c.cliente_id === sobraId).forEach((c) => db.update('citas', c.id, { cliente_id: quedaId }));
  db.all('eventos').filter((e) => e.cliente_id === sobraId).forEach((e) => db.update('eventos', e.id, { cliente_id: quedaId }));
  const patch = {};
  if (!queda.telefono && sobra.telefono) patch.telefono = sobra.telefono;
  if (!queda.cumpleanos && sobra.cumpleanos) patch.cumpleanos = sobra.cumpleanos;
  if (sobra.notas && !String(queda.notas || '').includes(sobra.notas)) patch.notas = [queda.notas, sobra.notas].filter(Boolean).join(' · ');
  if (sobra.creado_en && (!queda.creado_en || sobra.creado_en < queda.creado_en)) patch.creado_en = sobra.creado_en;
  if (Object.keys(patch).length) db.update('clientes', quedaId, patch);
  db.remove('clientes', sobraId);
}

// Pregunta antes de guardar una ficha que se parece a otra

  const n = comprasDe(gemelo.id);
  abrirSheet('¿Es la misma persona?', `<p>Ya tienes a <b>${esc(gemelo.nombre)}</b>${gemelo.telefono ? ` (<span class="num">${esc(gemelo.telefono)}</span>)` : ''} con ${n} compra${n === 1 ? '' : 's'}.</p>
    <p class="small muted">Si unificas, queda una sola ficha con todas sus compras, horas y datos.</p>`, {
    pie: `<div class="sheet-foot"><button type="button" class="btn" id="dup-no">Son personas distintas</button><button type="button" class="btn pri" id="dup-si">Unificar fichas</button></div>`,
  });

  $('#dup-no').onclick = () => { cerrarSheet(); alSeparar(); };
}

function revisarDuplicados() {
  const grupos = gruposDuplicados();
  if (!grupos.length) { cerrarSheet(); return toast('No hay fichas repetidas'); }
  abrirSheet('Fichas repetidas', `<p class="small muted">Tienen el mismo nombre o el mismo teléfono. Al unificar, la ficha con más compras se queda con todo el historial.</p>
    <div class="list">${grupos.map((g, i) => `<div class="row" style="flex-wrap:wrap"><div class="grow">${g.map((c) => `<div class="t" style="font-weight:500">${esc(c.nombre)} <span class="small muted">${esc(c.telefono || 'sin teléfono')} · ${comprasDe(c.id)} compras</span></div>`).join('')}</div>
      <button type="button" class="btn sm pri" data-act="unificar-grupo" data-i="${i}">Unificar</button></div>`).join('')}</div>`, { pie: '<div class="sheet-foot"><button type="button" class="btn" data-close>Cerrar</button></div>' });
}
function unificarGrupo(i) {
  const g = gruposDuplicados()[i]; if (!g) return;
  const [queda, ...resto] = [...g].sort((a, b) => comprasDe(b.id) - comprasDe(a.id) || String(a.creado_en || '').localeCompare(String(b.creado_en || '')));
  resto.forEach((c) => unificarClientes(queda.id, c.id));
  toast(`Unificamos ${g.length} fichas de ${queda.nombre}`); render(); revisarDuplicados();
}

// Achica la foto antes de guardarla para que la página cargue rápido
function achicarFoto(file, max = 900) {
  return new Promise((ok, fail) => {
    const img = new Image(); const url = URL.createObjectURL(file);
    img.onload = () => { const k = Math.min(1, max / Math.max(img.width, img.height)); const cv = document.createElement('canvas'); cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k); cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height); URL.revokeObjectURL(url); ok(cv.toDataURL('image/jpeg', 0.72)); };
    img.onerror = () => fail(new Error('No pudimos leer esa imagen')); img.src = url;
  });
}
// logo: cuadrado, PNG para respetar fondos transparentes
function achicarLogo(file, lado = 320) {
  return new Promise((ok, fail) => {
    const img = new Image(); const url = URL.createObjectURL(file);
    img.onload = () => { const k = Math.min(1, lado / Math.max(img.width, img.height)); const cv = document.createElement('canvas'); cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k); cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height); URL.revokeObjectURL(url); const png = cv.toDataURL('image/png'); ok(png.length > 180000 ? cv.toDataURL('image/jpeg', 0.85) : png); };
    img.onerror = () => fail(new Error('No pudimos leer esa imagen')); img.src = url;
  });
}

function tablaMeses(hasta, sel = hasta) {
  const meses = Array.from({ length: 12 }, (_, i) => addMonths(hasta, i - 11));
  const filas = meses.map((m) => { const ing = sum(ventasDelMes(m), (v) => Number(v.total)); const gas = sum(gastosDelMes(m), (g) => Number(g.monto)) + sum(db.all('comisiones').filter((c) => mesDe(c.fecha) === m), (c) => Number(c.monto)); return { m, ing, gas, res: ing - gas }; }).filter((f, i, a) => f.ing || f.gas || f.m === mesActual() || f.m === sel || (a.slice(0, i).some((x) => x.ing || x.gas) && a.slice(i + 1).some((x) => x.ing || x.gas)));
  if (!filas.length) return '';
  const max = Math.max(1, ...filas.map((f) => Math.abs(f.res)));
  const tot = filas.reduce((a, f) => ({ ing: a.ing + f.ing, gas: a.gas + f.gas, res: a.res + f.res }), { ing: 0, gas: 0, res: 0 });
  return `<div class="card"><div class="card-head"><h2>Mes a mes</h2></div><div class="tbl-wrap"><table class="mes-a-mes"><thead><tr><th>Mes</th><th class="n">Ingresos</th><th class="n">Egresos</th><th class="n">Resultado</th><th class="barra-col"></th></tr></thead><tbody>
    ${filas.slice().reverse().map((f) => `<tr class="click-mes ${f.m === sel ? 'on' : ''}" data-act="caja-ir-mes" data-m="${f.m}"><td style="white-space:nowrap">${esc(nombreMes(f.m))}</td><td class="n">${money(f.ing)}</td><td class="n">${money(f.gas)}</td><td class="n"><b class="${f.res < 0 ? 'down' : ''}">${money(f.res)}</b></td>
      <td class="barra-col"><span class="mini-barra ${f.res < 0 ? 'neg' : ''}" style="width:${Math.round((Math.abs(f.res) / max) * 100)}%"></span></td></tr>`).join('')}
    </tbody><tfoot><tr><td><b>Total</b></td><td class="n"><b>${money(tot.ing)}</b></td><td class="n"><b>${money(tot.gas)}</b></td><td class="n"><b class="${tot.res < 0 ? 'down' : ''}">${money(tot.res)}</b></td><td class="barra-col"></td></tr></tfoot></table></div></div>`;
}

const EquipoLocal = (empId) => ({
  async datos(desde, hasta) {
    const e = db.get('empleados', empId);
    const citas = db.all('citas').filter((c) => c.empleado_id === empId && c.fecha >= desde && c.fecha <= hasta).map((c) => {
      const s = db.get('servicios', c.servicio_id); return { id: c.id, fecha: c.fecha, hora: hhmm(c.hora), cliente: db.get('clientes', c.cliente_id)?.nombre || 'Cliente', servicio: s?.nombre || '', duracion: s?.duracion_min || 60, precio: s?.precio || 0, estado: c.estado, nota: c.nota || '' };
    });
    const ventas = new Map(db.all('ventas').filter((v) => v.fecha >= desde && v.fecha <= hasta).map((v) => [v.id, v]));
    const atenciones = db.all('venta_items').filter((i) => i.empleado_id === empId && ventas.has(i.venta_id)).map((i) => {
      const v = ventas.get(i.venta_id); const co = db.all('comisiones').find((c) => c.venta_item_id === i.id);
      return { fecha: v.fecha, servicio: i.nombre, monto: i.cantidad * i.precio_unitario, comision: co ? Number(co.monto) : 0, pagada: !!co?.pagada, cliente: db.get('clientes', v.cliente_id)?.nombre || '' };
    });
    return { negocio: { nombre: S.negocio.nombre }, empleado: { id: e.id, nombre: e.nombre, pct_comision: e.pct_comision }, citas, atenciones };
  },
});

  }

    <div class="credenciales"><div><span>Enlace</span><b>${esc(appUrl())}</b></div><div><span>Correo</span><b>${esc(email)}</b></div><div><span>Contraseña</span><b>${esc(clave)}</b></div></div>`, {

  });

        let { error } = await sb.auth.signInWithPassword({ email, password: d.password });
        if (error && codigo) {
          const r = await sb.auth.signUp({ email, password: d.password, options: { emailRedirectTo: appUrl() || undefined } });

function vistaInicio() {

  const ing = sum(ventasDelMes(ym), (v) => Number(v.total));

  const res = ing - egr; const meta = metaDelMes(ym);
  const avance = meta && Number(meta.monto_objetivo) > 0 ? Math.min(100, (ing / meta.monto_objetivo) * 100) : null;
  const restantes = esActual ? diasDelMes(ym) - Number(H.slice(8)) + 1 : 0;
  const falta = meta ? Math.max(0, meta.monto_objetivo - ing) : 0;

  // para hoy
  const alertas = [];
  const solicitadas = db.all('citas').filter((c) => c.estado === 'solicitada' && c.fecha >= H).length;

  if (tiene('inventario')) { const sinProv = db.all('productos').filter((p) => p.activo !== false && !p.proveedor_id && stockDe('producto', p.id) <= Number(p.stock_minimo || 0)); if (sinProv.length) alertas.push({ sev: 'warn', t: t_('stock_bajo', sinProv.length), s: sinProv.slice(0, 3).map((p) => p.nombre).join(', '), href: 'inventario' }); }
  const reactivar = resumenClientes().filter((r) => porReactivar(r) && r.dias < 120).length;
  if (reactivar) alertas.push({ sev: '', t: t_('reactivar', reactivar), href: 'clientes', act: 'filtro-reactivar' });

  // últimos movimientos (ingresos y egresos juntos)

  const movs = [

/* =========================================================
   Fluidez: montos con puntos de miles, cifras que cuentan y transiciones
   ========================================================= */

// Montos: 1500000 → 1.500.000 mientras se escribe (los campos de dinero usan inputmode="numeric")
const conMiles = (v) => { const d = String(v ?? '').replace(/\D/g, '').replace(/^0+(?=\d)/, ''); return d.replace(/\B(?=(\d{3})+(?!\d))/g, '.'); };
const esMonto = (el) => el?.tagName === 'INPUT' && el.getAttribute('inputmode') === 'numeric' && !el.hasAttribute('data-nofmt');
function formatearMonto(el, mantenerCursor = true, inicial = false) {
  // un valor recién traído de los datos puede venir con decimales (1170.5): se redondea antes de poner puntos
  if (inicial && !el.dataset.fmt && /^-?\d+\.\d+$/.test(el.value)) el.value = String(Math.round(Number(el.value)));
  el.dataset.fmt = '1'; const antes = el.value;
  const pos = el.selectionStart ?? el.value.length; const digitosAntes = el.value.slice(0, pos).replace(/\D/g, '').length;
  const nuevo = conMiles(el.value); if (nuevo === antes) return;
  el.value = nuevo;
  if (mantenerCursor && document.activeElement === el) {
    let i = 0, n = 0; while (i < nuevo.length && n < digitosAntes) { if (/\d/.test(nuevo[i])) n++; i++; }
    try { el.setSelectionRange(i, i); } catch {}
  }
}
function prepararMontos(raiz = document) { raiz.querySelectorAll?.('input[inputmode="numeric"]:not([data-nofmt])').forEach((el) => { if (el.value && !el.dataset.fmt) formatearMonto(el, false, true); }); }
document.addEventListener('input', (e) => { if (esMonto(e.target)) formatearMonto(e.target); }, true);
document.addEventListener('focusout', (e) => { if (esMonto(e.target)) formatearMonto(e.target, false); }, true);
// Contraseñas: botón de ojo para ver lo que se escribió
function prepararClaves(raiz = document) {
  raiz.querySelectorAll?.('input[type="password"]:not([data-ojo])').forEach((el) => {
    el.dataset.ojo = '1'; const w = document.createElement('div'); w.className = 'clave-wrap';
    el.parentNode.insertBefore(w, el); w.appendChild(el);
    w.insertAdjacentHTML('beforeend', `<button type="button" class="ver-clave" aria-label="Mostrar contraseña" aria-pressed="false" tabindex="0">${icon('ojo')}</button>`);
  });
}
document.addEventListener('click', (e) => {
  const b = e.target.closest('.ver-clave'); if (!b) return; e.preventDefault();
  const el = b.parentNode.querySelector('input'); const ver = el.type === 'password';
  el.type = ver ? 'text' : 'password'; b.setAttribute('aria-pressed', String(ver)); b.setAttribute('aria-label', ver ? 'Ocultar contraseña' : 'Mostrar contraseña');
  b.innerHTML = icon(ver ? 'ojo-no' : 'ojo'); el.focus({ preventScroll: true });
});
// cualquier campo nuevo en pantalla (vistas y ventanas) se muestra con puntos
let _montosPend = false;
new MutationObserver(() => { if (_montosPend) return; _montosPend = true; queueMicrotask(() => { _montosPend = false; prepararMontos(); prepararClaves(); }); }).observe(document.documentElement, { childList: true, subtree: true });

// Cifras grandes que suben desde cero al entrar a una vista
function animarCifras(raiz = document) {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  raiz.querySelectorAll('[data-cuenta]').forEach((el) => {
    const fin = Number(el.dataset.cuenta) || 0; if (!fin) return;
    const t0 = performance.now(), dur = 900; const ease = (x) => 1 - Math.pow(1 - x, 4);
    const paso = (t) => { if (!el.isConnected) return; const k = Math.min(1, (t - t0) / dur); el.textContent = money(Math.round(fin * ease(k))); if (k < 1) requestAnimationFrame(paso); };
    requestAnimationFrame(paso);
  });
}

// Cambio de pantalla suave donde el navegador lo permite (View Transitions)
// (v24) Se pinta directo: la pantalla nueva aparece al tiro y su contenido entra suave con .entra
function conTransicion(fn) {
  return fn();
  if (!document.startViewTransition || matchMedia('(prefers-reduced-motion: reduce)').matches || navigator.webdriver) return fn();
  try { document.startViewTransition(fn); } catch { fn(); }
}

// Ventas importadas que todavía no están unidas a un servicio o producto del catálogo, agrupadas por nombre
function conceptosLibres() {
  const g = new Map();
  for (const i of db.all('venta_items')) {
    if (i.item_id || i.tipo_item !== 'libre' || /\(resumen\)$/.test(i.nombre || '')) continue;
    const k = norm(i.nombre); if (!k) continue;
    const e = g.get(k) || { nombres: new Map(), precios: new Map(), ids: [], n: 0 };
    e.nombres.set(i.nombre, (e.nombres.get(i.nombre) || 0) + 1);
    const pu = Math.round(Number(i.precio_unitario)); if (pu > 0) e.precios.set(pu, (e.precios.get(pu) || 0) + 1);
    e.ids.push(i.id); e.n += Number(i.cantidad) || 1; g.set(k, e);
  }
  const moda = (m) => [...m].sort((a, b) => b[1] - a[1])[0]?.[0];
  return [...g.values()].map((e) => ({ nombre: moda(e.nombres), precio: moda(e.precios) || 0, ids: e.ids, n: e.n })).sort((a, b) => b.n - a.n);
}
const PRODUCTO_RE = /aceite|crema|esmalte|lima|kit|vela|aromatiz|mikado|anillo|collar|bandeja|perfume|jabon|serum|^gel\b|\bgel$|botella|frasco|accesorio|cargador|funda|audifono/;
const OTRO_RE = /retiro|ajuste|devoluc|giftcard|gift card|vale|abono|deposito|traspaso/;
function tipoSugerido(nombre) {
  const n = norm(nombre);
  if (OTRO_RE.test(n)) return 'otro';
  if (/soft ?gel|semi|manicure|pedicure|nivelacion|rubber|esculpid|acrilic|corte|tinte|masaje|depil|sesion|clase/.test(n)) return 'servicio';
  if (PRODUCTO_RE.test(n)) return 'producto';
  return tiene('servicios') ? 'servicio' : 'producto';
}

function abrirOrdenar() {
  const lista = conceptosLibres().slice(0, 40);
  if (!lista.length) return toast('Todo lo que vendes ya está ordenado en tu catálogo');

    <div class="ordenar">${lista.map((c, i) => { const t = tipoSugerido(c.nombre); return `<div class="ord-fila" data-i="${i}">
      <div class="ord-nom"><b>${esc(c.nombre)}</b><small>${qtyFmt(c.n)} ${c.n === 1 ? 'venta' : 'ventas'}${c.precio ? ' · ' + money(c.precio) : ''}</small></div>
      <div class="seg ord-seg">${[['servicio', 'Servicio'], ['producto', 'Producto'], ['otro', 'Dejar así']].map(([k, l]) => `<label class="${t === k ? 'on' : ''}"><input type="radio" name="tipo_${i}" value="${k}" ${t === k ? 'checked' : ''}>${l}</label>`).join('')}</div>
      <div class="ord-stock" ${t === 'producto' ? '' : 'hidden'}><input class="in" name="stock_${i}" inputmode="decimal" placeholder="¿Cuántos tienes hoy?" aria-label="Stock actual de ${esc(c.nombre)}"></div>
    </div>`; }).join('')}</div>`, {
    pie: '<div class="sheet-foot"><button type="button" class="btn" data-close>Ahora no</button><button class="btn pri" type="submit">Ordenar</button></div>',
    submit: (d) => aplicarOrden(lista, d),
  });
  $('#sheet-form').addEventListener('change', (e) => {
    const f = e.target.closest('.ord-fila'); if (!f || e.target.type !== 'radio') return;
    f.querySelectorAll('.ord-seg label').forEach((l) => l.classList.toggle('on', l.querySelector('input').checked));
    f.querySelector('.ord-stock').hidden = e.target.value !== 'producto';
  });
}
function aplicarOrden(lista, d) {
  let serv = 0, prod = 0, unidas = 0;
  const porNombre = (t) => new Map(db.all(t).map((x) => [norm(x.nombre), x]));
  const exS = porNombre('servicios'), exP = porNombre('productos');
  lista.forEach((c, i) => {
    const tipo = d['tipo_' + i]; if (tipo !== 'servicio' && tipo !== 'producto') return;
    let item;
    if (tipo === 'servicio') { item = exS.get(norm(c.nombre)) || db.insert('servicios', { nombre: c.nombre, precio: c.precio, duracion_min: 60, activo: true }); if (!exS.has(norm(c.nombre))) { serv++; exS.set(norm(c.nombre), item); } }
    else {
      item = exP.get(norm(c.nombre)) || db.insert('productos', { nombre: c.nombre, sku: '', precio_venta: c.precio, costo: 0, stock_minimo: 3, activo: true });
      if (!exP.has(norm(c.nombre))) { prod++; exP.set(norm(c.nombre), item); }
      const st = String(d['stock_' + i] ?? '').trim();
      if (st !== '') { const dif = Number(st.replace(',', '.')) - stockDe('producto', item.id); if (dif) db.insert('movimientos_stock', { tipo_item: 'producto', item_id: item.id, cantidad: dif, motivo: 'ajuste', ref_id: null, fecha: hoy(), nota: 'Stock inicial' }); }
    }
    db.updateMany('venta_items', c.ids, { tipo_item: tipo, item_id: item.id }); unidas += c.ids.length;
  });
  if (prod && !tiene('inventario')) db.modulo('inventario', true);
  cerrarSheet(); render();
  toast(unidas ? `Listo: ${unidas} ventas unidas${serv ? ` · ${serv} servicio${serv > 1 ? 's' : ''} nuevo${serv > 1 ? 's' : ''}` : ''}${prod ? ` · ${prod} producto${prod > 1 ? 's' : ''} en inventario` : ''}` : 'No marcaste nada para ordenar');
}

// borra el historial elegido; el catálogo, el equipo y los ajustes no se tocan
function borrarHistorial({ ventas, gastos, clientes, stock } = {}) {
  const ids = (t, fn = () => true) => db.all(t).filter(fn).map((r) => r.id);
  if (ventas || clientes) {
    const vs = ids('ventas'); const vset = new Set(vs);
    db.removeMany('comisiones', ids('comisiones', (c) => vset.has(c.venta_id)));
    db.removeMany('movimientos_stock', ids('movimientos_stock', (m) => m.motivo === 'venta' && vset.has(m.ref_id)));
    db.removeMany('venta_items', ids('venta_items', (i) => vset.has(i.venta_id)));
    db.removeMany('ventas', vs);
  }
  if (gastos) db.removeMany('gastos', ids('gastos'));
  if (stock) db.removeMany('movimientos_stock', ids('movimientos_stock'));
  // las clientas con horas en la agenda se mantienen (borrarlas borraría sus citas)
  if (clientes) { const conCita = new Set(db.all('citas').map((c) => c.cliente_id).filter(Boolean)); db.removeMany('clientes', ids('clientes', (c) => !conCita.has(c.id))); }
}

   v22: la hoja del día, anotar escribiendo, hoja de cobrar
   y animaciones que explican lo que pasa

const quieto = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
const esMovil = () => matchMedia('(max-width: 860px)').matches;
// acción que corre justo después del próximo render (para animar lo que cambió)
function despues(fn) { S._post = fn; }

/* ---------- anotar escribiendo: "manicure paula 15000 débito" ---------- */
const PAL_EGRESO = /^(-|gast[oe]s?\b|egreso\b|pagu[eé]\b|pague\b|compr[eé]\b|compre\b|pago\b)/;
const PAL_METODO = [[/\b(efectivo|efec|cash|plata)\b/, 'efectivo'], [/\b(debito|deb|redcompra)\b/, 'debito'], [/\b(credito|cred|tarjeta)\b/, 'credito'], [/\b(transferencia|transf|transfer|trans)\b/, 'transferencia']];
const VACIAS = new Set(['de', 'la', 'el', 'a', 'en', 'con', 'por', 'para', 'y', 'los', 'las', 'un', 'una', 'al', 'del']);
function leerMonto(txt) {
  let mejor = 0, hallado = '';
  for (const m of txt.matchAll(/\$?\s?(\d{1,3}(?:[.,]\d{3})+|\d+(?:[.,]\d+)?)\s*(k|mil|lucas?)?\b/gi)) {
    let v = m[1].includes('.') && /\.\d{3}$/.test(m[1]) ? Number(m[1].replace(/[.,]/g, '')) : Number(m[1].replace(',', '.'));
    if (m[2]) v *= 1000;
    if (v > mejor) { mejor = v; hallado = m[0]; }
  }
  return { monto: Math.round(mejor), hallado };
}
function parecido(nombre, palabras) {
  const ps = norm(nombre).split(' ').filter((w) => w.length >= 3 && !VACIAS.has(w));
  if (!ps.length) return { s: 0, usadas: [] };
  const usadas = ps.filter((w) => palabras.some((p) => p.length >= 3 && (p === w || (p.length >= 4 && (w.startsWith(p) || p.startsWith(w))))));
  return { s: usadas.length / ps.length + (usadas.length ? usadas.length * 0.1 : 0), usadas };
}
// devuelve las palabras originales (con tildes) que quedaron sin usar
function textoOriginal(raw, quedan) {
  const q = [...quedan]; const out = [];
  for (const w of raw.split(/\s+/)) { const nw = norm(w); const k = q.indexOf(nw); if (nw && k >= 0) { out.push(w.replace(/[.,;:]+$/, '')); q.splice(k, 1); } }
  const t = out.join(' '); return t ? t.charAt(0).toUpperCase() + t.slice(1) : '';
}
function entenderAnotacion(texto) {
  const raw = String(texto || '').trim(); if (raw.length < 2) return null;
  const n = norm(raw); const egreso = PAL_EGRESO.test(n.replace(/^\$/, '')) || raw.startsWith('-');
  const { monto, hallado } = leerMonto(raw);
  let resto = norm(raw.replace(hallado, ' '));
  // medio de pago (también los que el negocio agregó, como "Giftcard")
  let metodo = null;
  for (const [k, l] of Object.entries(metodos())) { const nl = norm(l); if (nl && new RegExp(`\\b${nl}\\b`).test(resto)) { metodo = k; resto = resto.replace(nl, ' '); break; } }
  if (!metodo) for (const [re, k] of PAL_METODO) if (re.test(resto) && metodos()[k]) { metodo = k; resto = resto.replace(re, ' '); break; }
  resto = resto.replace(PAL_EGRESO, ' ');
  const palabras = resto.split(' ').filter(Boolean);
  if (egreso) {
    const cats = catGastos(); let cat = null, best = 0;
    for (const c of cats) { const p = parecido(c, palabras); if (p.s > best) { best = p.s; cat = c; } }
    return { tipo: 'egreso', monto, categoria: cat || (cats.includes('Otros') ? 'Otros' : cats[0]), descripcion: textoOriginal(raw, palabras.filter((w) => !VACIAS.has(w))) };
  }
  // lo que se vendió: el servicio o producto que más se parece
  const catalogo = [...(tiene('servicios') ? db.all('servicios').filter((s) => s.activo !== false).map((s) => ({ tipo: 'servicio', x: s, precio: Number(s.precio) })) : []),
    ...db.all('productos').filter((p) => p.activo !== false).map((p) => ({ tipo: 'producto', x: p, precio: Number(p.precio_venta) }))];
  let item = null, bestI = 0, usadasI = [];
  for (const c of catalogo) { const p = parecido(c.x.nombre, palabras); if (p.s > bestI && p.s >= 0.5) { bestI = p.s; item = c; usadasI = p.usadas; } }
  const libres = palabras.filter((w) => !usadasI.some((u) => u === w || u.startsWith(w) || w.startsWith(u)));
  // la clienta: nombre (y apellido si lo escribieron)
  let cliente = null, bestC = 0, usadasC = [];
  for (const c of db.all('clientes')) {
    const ps = norm(c.nombre).split(' ').filter(Boolean); const usadas = ps.filter((w) => libres.includes(w));
    if (!usadas.length || !libres.includes(ps[0])) continue;
    const s = usadas.length + (usadas.length === ps.length ? 0.5 : 0);
    if (s > bestC) { bestC = s; cliente = c; usadasC = usadas; }
  }
  return { tipo: 'ingreso', monto: monto || item?.precio || 0, item, cliente, metodo: metodo || nuevoCarro().metodo, descripcion: textoOriginal(raw, libres.filter((w) => !usadasC.includes(w) && !VACIAS.has(w))) };
}
function resumenAnotacion(a) {
