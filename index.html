/* ---------- lectura de archivos ---------- */
function cargarScript(src, global) {
  if (window[global]) return Promise.resolve(window[global]);
  return new Promise((ok, fail) => { const s = document.createElement('script'); s.src = src; s.onload = () => ok(window[global]); s.onerror = () => fail(new Error('No se pudo cargar el lector de Excel. Revisa tu conexión.')); document.head.appendChild(s); });
}
function leerCSV(texto) {
  texto = texto.replace(/^﻿/, '');
  const primera = texto.split(/\r?\n/)[0] || '';
  const sep = [';', ',', '\t'].sort((a, b) => primera.split(b).length - primera.split(a).length)[0];
  const filas = []; let fila = []; let celda = ''; let comillas = false;
  for (let i = 0; i < texto.length; i++) {
    const c = texto[i];
    if (comillas) { if (c === '"') { if (texto[i + 1] === '"') { celda += '"'; i++; } else comillas = false; } else celda += c; continue; }
    if (c === '"') comillas = true;
    else if (c === sep) { fila.push(celda); celda = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && texto[i + 1] === '\n') i++; fila.push(celda); filas.push(fila); fila = []; celda = ''; }
    else celda += c;
  }
  if (celda || fila.length) { fila.push(celda); filas.push(fila); }
  return filas;
}
// Lector de .xlsx propio: un .xlsx es un zip con XML adentro
async function leerXLSX(buffer) {
  const JSZip = await cargarScript('https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js', 'JSZip');
  const zip = await JSZip.loadAsync(buffer);
  const xml = async (ruta) => { const f = zip.file(ruta); return f ? new DOMParser().parseFromString(await f.async('string'), 'application/xml') : null; };
  const tags = (doc, n) => (doc ? [...doc.getElementsByTagNameNS('*', n)] : []);
  const compartidos = tags(await xml('xl/sharedStrings.xml'), 'si').map((si) => tags(si, 't').map((t) => t.textContent).join(''));
  const wb = await xml('xl/workbook.xml'); const rels = await xml('xl/_rels/workbook.xml.rels');
  const destino = Object.fromEntries(tags(rels, 'Relationship').map((r) => [r.getAttribute('Id'), r.getAttribute('Target')]));
  const hojas = [];
  for (const sh of tags(wb, 'sheet')) {
    const rid = sh.getAttribute('r:id') || sh.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships', 'id');
    let ruta = destino[rid] || ''; ruta = ruta.startsWith('/') ? ruta.slice(1) : 'xl/' + ruta.replace(/^\.\//, '');
    const doc = await xml(ruta); if (!doc) continue;
    const filas = [];
    for (const row of tags(doc, 'row')) {
      const r = Number(row.getAttribute('r')) - 1; const arr = [];
      for (const c of tags(row, 'c')) {
        const ref = c.getAttribute('r') || ''; const letras = ref.replace(/\d+/g, '');
        const col = letras ? [...letras].reduce((a, ch) => a * 26 + ch.charCodeAt(0) - 64, 0) - 1 : arr.length;
        const t = c.getAttribute('t'); const v = tags(c, 'v')[0]?.textContent;
        let val = '';
        if (t === 's') val = compartidos[Number(v)] ?? '';
        else if (t === 'inlineStr') val = tags(c, 't').map((x) => x.textContent).join('');
        else if (t === 'b') val = v === '1';
        else if (t === 'str' || t === 'e') val = v ?? '';
        else if (v != null && v !== '') val = Number(v);
        arr[col] = val;
      }
      filas[r >= 0 ? r : filas.length] = Array.from(arr, (x) => x ?? '');
    }
    hojas.push({ nombre: sh.getAttribute('name'), filas: Array.from(filas, (x) => x || []) });
  }
  return hojas;
}

/* ---------- interpretación de valores ---------- */
function parseNumero(v) {
  if (typeof v === 'number') return v;
  let s = String(v ?? '').trim(); if (!s) return null;
  const neg = /^\(.*\)$/.test(s) || /^-/.test(s) || /^\$\s*-/.test(s);
  s = s.replace(/[^\d.,]/g, ''); if (!s) return null;
  const ultPunto = s.lastIndexOf('.'), ultComa = s.lastIndexOf(',');
  if (ultPunto >= 0 && ultComa >= 0) s = ultComa > ultPunto ? s.replace(/\./g, '').replace(',', '.') : s.replace(/,/g, '');
  else if (ultComa >= 0) s = /^\d{1,3}(,\d{3})+$/.test(s) ? s.replace(/,/g, '') : s.replace(',', '.');
  else if (ultPunto >= 0 && /^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, '');
  const n = Number(s); return Number.isFinite(n) ? (neg ? -n : n) : null;
}
const MESES = { ene: 1, feb: 2, mar: 3, abr: 4, may: 5, jun: 6, jul: 7, ago: 8, sep: 9, set: 9, oct: 10, nov: 11, dic: 12 };
function parseFecha(v) {
  if (v instanceof Date && !isNaN(v)) return isoDate(v);
  if (typeof v === 'number' && v > 59 && v < 80000) { const d = new Date(Date.UTC(1899, 11, 30) + Math.round(v) * 86400000); return `${d.getUTCFullYear()}-${pad(d.getUTCMonth() + 1)}-${pad(d.getUTCDate())}`; }
  const s = String(v ?? '').trim().toLowerCase(); if (!s) return null;
  let m = s.match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})/);
  if (m) return valida(+m[1], +m[2], +m[3]);
  m = s.match(/^(\d{1,2})[-/.](\d{1,2})(?:[-/.](\d{2,4}))?/);
  if (m) { let y = m[3] ? +m[3] : 2000; if (y < 100) y += y > 50 ? 1900 : 2000; return valida(y, +m[2], +m[1]); }
  m = norm(s).match(/^(\d{1,2}) (?:de )?([a-z]{3})[a-z]*(?: (?:de )?(\d{4}))?/);
  if (m && MESES[m[2]]) return valida(m[3] ? +m[3] : 2000, MESES[m[2]], +m[1]);
  return null;
}
function valida(y, mo, d) { if (mo < 1 || mo > 12 || d < 1 || d > 31 || y < 1900 || y > 2100) return null; return `${y}-${pad(mo)}-${pad(d)}`; }
function parseMetodo(v) {
  const s = norm(v);
  if (/transf|deposit/.test(s)) return 'transferencia';
  if (/cred/.test(s)) return 'credito';
  if (/deb|redcompra|tarjeta|pos|tbk|transbank/.test(s)) return 'debito';
  return 'efectivo';
}
function parseCategoria(v, desc) {
  const s = norm(v + ' ' + (desc || ''));
  const reglas = [[/arriendo|alquiler|renta/, 'Arriendo'], [/sueldo|remunera|honorario|comision/, 'Sueldos'], [/luz|agua|internet|gas|telefon|plan|electric/, 'Servicios básicos'],
    [/publicidad|anuncio|ads|instagram|facebook|meta|marketing/, 'Publicidad'], [/envio|despacho|starken|chilexpress|bluexpress|correos|flete/, 'Envíos'],
    [/insumo|material|materia prima|esmalte|cera|frasco|esencia/, 'Insumos'], [/mercaderia|compra|stock|proveedor/, 'Mercadería']];
  const exacta = CATEGORIAS_GASTO.find((c) => norm(c) === norm(v)); if (exacta) return exacta;

function puntaje(h, syn) { if (!h) return 0; let best = 0; for (const s of syn) { if (h === s) return 3; if (s.length >= 4 && (h.startsWith(s + ' ') || h.endsWith(' ' + s) || h.includes(s))) best = Math.max(best, 1.5); } return best; }
function mapear(headers, tipo) {

  for (const [f, def] of Object.entries(campos)) headers.forEach((h, i) => { const p = puntaje(h, def.syn); if (p) pares.push([p - def.syn.indexOf(h) * 0.01, f, i]); });
  pares.sort((a, b) => b[0] - a[0]);
  const map = Object.fromEntries(Object.keys(campos).map((f) => [f, -1])); const usadas = new Set(); let total = 0; let n = 0;
  for (const [p, f, i] of pares) if (map[f] === -1 && !usadas.has(i)) { map[f] = i; usadas.add(i); total += p; n++; }
  return { map, total, n };
}
function analizarHoja(nombre, filas) {
  // la fila de títulos es la primera (de las 10 primeras) con al menos 2 textos
  let hr = filas.slice(0, 10).findIndex((f) => f.filter((c) => typeof c === 'string' && c.trim() && isNaN(parseNumero(c) ?? NaN)).length >= 2);
  if (hr < 0) hr = 0;
  const headers = (filas[hr] || []).map(norm);
  const datos = filas.slice(hr + 1).filter((f) => f.some((c) => String(c ?? '').trim() !== ''));
  const nh = norm(nombre); let mejor = { tipo: 'ninguno', total: 0, map: {} };
  for (const tipo of Object.keys(IMP)) {
    const { map, total, n } = mapear(headers, tipo);
    const reqOk = Object.entries(IMP[tipo].campos).every(([f, d]) => !d.req || map[f] >= 0);
    const pista = IMP[tipo].pistas.some((p) => nh.includes(p));
    if (n < 2 && !pista) continue; // una sola columna parecida no basta para adivinar
    let score = total + (reqOk ? 3 : -10) + (pista ? 5 : 0);
    if (tipo === 'ventas' && headers.some((h) => /categoria|proveedor|gasto|egreso/.test(h))) score -= 3;
    if (tipo === 'gastos' && headers.some((h) => /cliente|producto|servicio/.test(h))) score -= 3;
    if (score > mejor.total) mejor = { tipo, total: score, map };
  }
  if (mejor.total < 4) mejor.tipo = 'ninguno';
  return { nombre, headers: (filas[hr] || []).map((h) => String(h ?? '').trim()), headersN: headers, datos, tipo: mejor.tipo, map: mejor.tipo === 'ninguno' ? {} : mejor.map };
}
function filaAObjeto(h, fila) {
  const o = {};
  for (const [f, def] of Object.entries(IMP[h.tipo].campos)) {
    const i = h.map[f]; const raw = i >= 0 ? fila[i] : '';
    o[f] = def.tipo === 'num' ? parseNumero(raw) : def.tipo === 'fecha' ? parseFecha(raw) : String(raw ?? '').trim();
  }
  // si el monto de la venta viene como precio unitario, se multiplica por la cantidad
  if (h.tipo === 'ventas' && h.map.total >= 0 && /unit|^precio$/.test(h.headersN[h.map.total]) && o.cantidad > 0) o.total = o.total * o.cantidad;
  return o;
}
function filaValida(tipo, o) {
  return Object.entries(IMP[tipo].campos).every(([f, d]) => !d.req || (d.tipo === 'num' ? o[f] != null && o[f] > 0 : !!o[f]));
}

async function abrirArchivo(file) {
  if (!file) return;
  try {
    const nombre = file.name; const ext = nombre.split('.').pop().toLowerCase();
    if (ext === 'xls') return toast('Ese es el formato antiguo de Excel. Ábrelo y guárdalo como .xlsx (Libro de Excel) o CSV.', true);
    toast('Leyendo ' + nombre + '…');
    let hojas;
    if (ext === 'csv' || ext === 'txt') hojas = [{ nombre: nombre.replace(/\.[^.]+$/, ''), filas: leerCSV(await file.text()) }];
    else hojas = await leerXLSX(await file.arrayBuffer());
    hojas = hojas.filter((h) => h.filas.some((f) => f.some((c) => String(c ?? '').trim())));
    if (!hojas.length) return toast('El archivo está vacío', true);
    S.imp = { archivo: nombre, hojas: hojas.map((h) => analizarHoja(h.nombre, h.filas)) };
    const reconocidas = S.imp.hojas.filter((h) => h.tipo !== 'ninguno').length;
    render(); toast(reconocidas ? `Reconocimos ${reconocidas} de ${hojas.length} hoja${hojas.length > 1 ? 's' : ''}. Revisa y confirma.` : 'No reconocimos las hojas. Elige qué contiene cada una.');
  } catch (e) { console.error(e); toast('No pudimos leer el archivo: ' + (e.message || e), true); }
}

/* ---------- guardar ---------- */
function importarTodo() {
  const cont = { clientes: 0, productos: 0, servicios: 0, insumos: 0, ventas: 0, gastos: 0, actualizados: 0, repetidos: 0 };
  const avisos = []; const H = hoy();
  const clientePorNombre = new Map(db.all('clientes').map((c) => [norm(c.nombre), c]));
  const clientePorTel = new Map(db.all('clientes').filter((c) => c.telefono).map((c) => [telLimpio(c.telefono), c]));
  const porNombre = (t) => new Map(db.all(t).map((x) => [norm(x.nombre), x]));
  const lotes = { ventas: [], venta_items: [], movimientos_stock: [], gastos: [], clientes: [] };
  const buscarCliente = (nombre) => {
    if (!nombre) return null; const k = norm(nombre); let c = clientePorNombre.get(k);
    if (!c) { c = { id: uid(), nombre: nombre.trim(), telefono: '', cumpleanos: null, notas: '', creado_en: H }; lotes.clientes.push(c); clientePorNombre.set(k, c); cont.clientes++; }
    return c;
  };
  const ajustarStock = (tipo, item, deseado) => {
    if (deseado == null) return; const dif = deseado - stockDe(tipo, item.id) - sum(lotes.movimientos_stock.filter((m) => m.item_id === item.id), (m) => m.cantidad);
    if (dif) lotes.movimientos_stock.push({ id: uid(), tipo_item: tipo, item_id: item.id, cantidad: dif, motivo: 'ajuste', ref_id: null, fecha: H, nota: 'Importado desde Excel' });
  };
  // orden: catálogos y clientes primero, después ventas y gastos que los usan
  const orden = ['clientes', 'servicios', 'productos', 'insumos', 'ventas', 'gastos'];
  const hojas = [...S.imp.hojas].filter((h) => h.tipo !== 'ninguno').sort((a, b) => orden.indexOf(a.tipo) - orden.indexOf(b.tipo));
  for (const h of hojas) {
    const filas = h.datos.map((f) => filaAObjeto(h, f)).filter((o) => filaValida(h.tipo, o));
    if (h.tipo === 'clientes') for (const o of filas) {
      const tel = telLimpio(o.telefono); const ex = (tel && clientePorTel.get(tel)) || clientePorNombre.get(norm(o.nombre));
      const fila = { nombre: o.nombre, telefono: o.telefono, cumpleanos: o.cumpleanos, notas: o.notas };
      if (ex) { const patch = {}; for (const k of ['telefono', 'cumpleanos', 'notas']) if (fila[k] && !ex[k]) patch[k] = fila[k]; if (Object.keys(patch).length) { if (db.get('clientes', ex.id)) db.update('clientes', ex.id, patch); else Object.assign(ex, patch); cont.actualizados++; } else cont.repetidos++; }
      else { const c = { id: uid(), ...fila, cumpleanos: fila.cumpleanos || null, creado_en: H }; lotes.clientes.push(c); clientePorNombre.set(norm(c.nombre), c); if (tel) clientePorTel.set(tel, c); cont.clientes++; }
    }
    if (h.tipo === 'servicios') { const ex = porNombre('servicios'); for (const o of filas) {
      const e = ex.get(norm(o.nombre)); const fila = { nombre: o.nombre, precio: o.precio, duracion_min: Math.round(o.duracion_min || 60), activo: true };
      if (e) { db.update('servicios', e.id, { precio: fila.precio, ...(o.duracion_min ? { duracion_min: fila.duracion_min } : {}) }); cont.actualizados++; } else { ex.set(norm(o.nombre), db.insert('servicios', fila)); cont.servicios++; }
    } if (filas.length && !tiene('servicios')) { db.modulo('servicios', true); avisos.push('Activamos Servicios y agenda porque tu archivo trae servicios.'); } }
    if (h.tipo === 'productos') { const ex = porNombre('productos'); const exSku = new Map(db.all('productos').filter((p) => p.sku).map((p) => [norm(p.sku), p])); for (const o of filas) {
      const e = (o.sku && exSku.get(norm(o.sku))) || ex.get(norm(o.nombre));
      const fila = { nombre: o.nombre, sku: o.sku || '', precio_venta: o.precio_venta, costo: o.costo || 0, stock_minimo: o.stock_minimo ?? 3, activo: true };
      let p; if (e) { const patch = { precio_venta: fila.precio_venta }; if (o.costo) patch.costo = o.costo; if (o.stock_minimo != null) patch.stock_minimo = o.stock_minimo; db.update('productos', e.id, patch); p = e; cont.actualizados++; }
      else { p = db.insert('productos', fila); ex.set(norm(p.nombre), p); cont.productos++; }
      ajustarStock('producto', p, o.stock);
    } if (filas.some((o) => o.stock != null) && !tiene('inventario')) { db.modulo('inventario', true); avisos.push('Activamos Productos e inventario porque tu archivo trae stock.'); } }
    if (h.tipo === 'insumos') { const ex = porNombre('insumos'); for (const o of filas) {
      const e = ex.get(norm(o.nombre)); const fila = { nombre: o.nombre, unidad: o.unidad || 'unidad', costo_unitario: o.costo_unitario || 0, stock_minimo: o.stock_minimo || 0 };
      let i; if (e) { if (o.costo_unitario) db.update('insumos', e.id, { costo_unitario: o.costo_unitario }); i = e; cont.actualizados++; } else { i = db.insert('insumos', fila); ex.set(norm(i.nombre), i); cont.insumos++; }
      ajustarStock('insumo', i, o.stock);
    } if (filas.length && !tiene('produccion')) { if (!tiene('inventario')) db.modulo('inventario', true); db.modulo('produccion', true); avisos.push('Activamos Producción porque tu archivo trae insumos.'); } }
    if (h.tipo === 'ventas') {
      const prod = porNombre('productos'); const serv = porNombre('servicios');
      const firma = (fecha, total, nombre, cli) => [fecha, Math.round(total), norm(nombre), cli || ''].join('|');
      const existentes = new Set(db.all('ventas').map((v) => firma(v.fecha, v.total, itemsDeVenta(v.id)[0]?.nombre, v.cliente_id)));
      for (const o of filas) {
        const cli = buscarCliente(o.cliente); const nombre = o.detalle || 'Venta importada';
        const f = firma(o.fecha, o.total, nombre, cli?.id); if (existentes.has(f)) { cont.repetidos++; continue; } existentes.add(f);
        const p = prod.get(norm(o.detalle)); const s = serv.get(norm(o.detalle)); const cant = o.cantidad > 0 ? o.cantidad : 1;
        const v = { id: uid(), fecha: o.fecha, cliente_id: cli?.id || null, total: o.total, metodo_pago: parseMetodo(o.metodo_pago), canal: 'local', nota: 'Importado desde Excel' };
        lotes.ventas.push(v);
        lotes.venta_items.push({ id: uid(), venta_id: v.id, tipo_item: p ? 'producto' : s ? 'servicio' : 'libre', item_id: p?.id || s?.id || null, nombre: p?.nombre || s?.nombre || nombre, cantidad: cant, precio_unitario: Math.round((o.total / cant) * 100) / 100, empleado_id: null });
        cont.ventas++;
      }
      if (filas.some((o) => o.fecha > H)) avisos.push('Algunas ventas tienen fecha futura; revisa que el formato de fecha sea día/mes/año.');
    }
    if (h.tipo === 'gastos') {
      const existentes = new Set(db.all('gastos').map((g) => [g.fecha, Math.round(g.monto), norm(g.descripcion)].join('|')));
      for (const o of filas) {
        const k = [o.fecha, Math.round(o.monto), norm(o.descripcion)].join('|'); if (existentes.has(k)) { cont.repetidos++; continue; } existentes.add(k);
        lotes.gastos.push({ id: uid(), fecha: o.fecha, categoria: parseCategoria(o.categoria, o.descripcion), monto: o.monto, descripcion: o.descripcion || o.categoria || '' });
        cont.gastos++;
      }
    }
  }
  // guardado en bloque (mucho más rápido en la nube que fila por fila)
  for (const t of ['clientes', 'ventas', 'venta_items', 'movimientos_stock', 'gastos']) if (lotes[t].length) db.insertMany(t, lotes[t]);
  const n = (k, s, p) => (cont[k] ? `${cont[k]} ${cont[k] === 1 ? s : p}` : null);
  const lineas = [n('ventas', 'venta', 'ventas'), n('gastos', 'gasto', 'gastos'), n('clientes', 'cliente nuevo', 'clientes nuevos'), n('productos', 'producto', 'productos'), n('servicios', 'servicio', 'servicios'), n('insumos', 'insumo', 'insumos'),
    cont.actualizados ? `${cont.actualizados} registros que ya tenías quedaron al día` : null, cont.repetidos ? `${cont.repetidos} filas repetidas se saltaron` : null].filter(Boolean);
  S.imp.resultado = { lineas: lineas.length ? lineas : ['No había registros nuevos para agregar'], avisos };
  window.scrollTo(0, 0); render(); toast('Importación lista');
}

/* =========================================================
   Página pública de reservas
   Los clientes del negocio eligen servicio, persona, día y hora
   libre; la hora llega a la agenda como "Por confirmar".
   ========================================================= */

const HORARIO_DEF = { dias: [1, 2, 3, 4, 5, 6], desde: '10:00', hasta: '19:00', intervalo: 30 };
const DIAS_SEMANA = [[1, 'Lun'], [2, 'Mar'], [3, 'Mié'], [4, 'Jue'], [5, 'Vie'], [6, 'Sáb'], [0, 'Dom']];
const horarioDe = (n) => ({ ...HORARIO_DEF, ...(typeof n?.horario === 'string' ? JSON.parse(n.horario) : n?.horario || {}) });
const slugDe = (nombre) => norm(nombre).replace(/ /g, '-').slice(0, 40) || 'mi-negocio';
const aMin = (h) => { const [a, b] = hhmm(h).split(':').map(Number); return a * 60 + (b || 0); };
const deMin = (m) => `${pad(Math.floor(m / 60))}:${pad(m % 60)}`;

// Horas libres de un día: recorre el horario de atención y deja las que no chocan
function horasLibres({ horario, fecha, dur, ocupadas, empleados, empleadoId }) {
  const dow = new Date(fecha + 'T12:00:00').getDay(); if (!horario.dias.includes(dow)) return [];
  const ini = aMin(horario.desde), fin = aMin(horario.hasta), paso = Number(horario.intervalo) || 30;
  const n = new Date(); const minimo = fecha === hoy() ? n.getHours() * 60 + n.getMinutes() + 60 : fecha < hoy() ? 99999 : 0;
  const ids = empleados.map((e) => e.id); const out = [];
  for (let m = ini; m + dur <= fin; m += paso) {
    if (m < minimo) continue;
    const cruzan = ocupadas.filter((o) => m < aMin(o.hora) + Number(o.dur) && aMin(o.hora) < m + dur);
    if (!ids.length) { if (!cruzan.length) out.push({ hora: deMin(m), empleado_id: null }); continue; }
    // cada hora sin persona asignada ocupa a alguien del equipo
    const sinAsignar = cruzan.filter((o) => o.empleado_id == null).length;
    const libres = ids.filter((id) => !cruzan.some((o) => o.empleado_id === id));
    if (libres.length <= sinAsignar) continue;
    if (empleadoId) { if (libres.includes(empleadoId)) out.push({ hora: deMin(m), empleado_id: empleadoId }); }
    else out.push({ hora: deMin(m), empleado_id: libres[0] });
  }
  return out;
}

const ReservaLocal = {
  async info() {
    if (!S.negocio) throw new Error('Negocio no encontrado');
    return { negocio: { nombre: S.negocio.nombre, telefono: S.negocio.telefono || '' }, horario: horarioDe(S.negocio),
      servicios: db.all('servicios').filter((s) => s.activo !== false).map(({ id, nombre, duracion_min, precio }) => ({ id, nombre, duracion_min, precio })),
      empleados: db.all('empleados').filter((e) => e.activo !== false).map((e) => ({ id: e.id, nombre: e.nombre.split(' ')[0] })) };
  },
  async ocupadas(fecha) {
    return db.all('citas').filter((c) => c.fecha === fecha && !INACTIVOS.includes(c.estado)).map((c) => ({ hora: hhmm(c.hora), dur: Number(db.get('servicios', c.servicio_id)?.duracion_min || 60), empleado_id: c.empleado_id }));
  },
  async reservar(r) {
    const tel = telLimpio(r.telefono);
    let c = db.all('clientes').find((x) => tel && telLimpio(x.telefono).slice(-8) === tel.slice(-8));

async function pubEnviar(d) {
  const p = S.pub;
  if (!d.nombre.trim() || telLimpio(d.telefono).length < 8) return toast('Escribe tu nombre y un WhatsApp válido', true);
  p.datos = { nombre: d.nombre.trim(), telefono: d.telefono.trim() }; p.enviando = true; render();
  try {
    // vuelve a revisar que la hora siga libre justo antes de reservar
    const ocupadas = await p.api.ocupadas(p.fecha);
    const libre = horasLibres({ horario: p.info.horario, fecha: p.fecha, dur: Number(p.servicio.duracion_min || 60), ocupadas, empleados: p.info.empleados, empleadoId: p.empleado || null }).find((h) => h.hora === p.hora.hora);
    if (!libre) { p.enviando = false; p.hora = null; await pubCargarHoras(); return toast('Alguien acaba de tomar esa hora. Elige otra.', true); }
    await p.api.reservar({ servicio_id: p.servicio.id, empleado_id: libre.empleado_id, fecha: p.fecha, hora: libre.hora, nombre: p.datos.nombre, telefono: p.datos.telefono, nota: d.nota.trim() });
    p.enviado = true;
  } catch (e) { toast('No se pudo reservar: ' + (e.message || e), true); }
  p.enviando = false; window.scrollTo(0, 0); render();
}

function guardarReservas(form) {
  const fd = new FormData(form); const dias = fd.getAll('dia').map(Number);
  const desde = fd.get('desde') || '10:00', hasta = fd.get('hasta') || '19:00';
  if (!dias.length) return toast('Elige al menos un día de atención', true);
  if (aMin(hasta) <= aMin(desde)) return toast('La hora de cierre debe ser después de la de apertura', true);
  const slug = slugDe(fd.get('slug') || S.negocio.nombre);
  db.negocio({ horario: { dias, desde, hasta, intervalo: Number(fd.get('intervalo')) || 30 }, telefono: String(fd.get('telefono') || '').trim(), slug });
  toast('Horario guardado'); render();
}

  'pub-emp': (el) => { const p = S.pub; p.empleado = el.dataset.id || null; p.hora = null; if (p.fecha) pubCargarHoras(); else render(); },
  'pub-dia': (el) => { const p = S.pub; p.fecha = el.dataset.f; p.hora = null; pubCargarHoras(); },
  'pub-hora': (el) => { const p = S.pub; p.hora = p.horas[+el.dataset.i]; render(); setTimeout(() => $('#form-reserva')?.scrollIntoView({ behavior: 'smooth', block: 'center' }), 50); },
  'pub-otra': () => { Object.assign(S.pub, { enviado: false, hora: null, fecha: null, horas: null, servicio: null }); render(); },
  'copiar-link': () => { const t = $('#link-reservas')?.textContent || ''; navigator.clipboard?.writeText(t).then(() => toast('Enlace copiado'), () => toast('Mantén presionado el enlace para copiarlo')); },
  'ag-hoy': () => { S.ui.agenda.fecha = hoy(); render(); },
  'ag-set': (el) => { S.ui.agenda.fecha = el.dataset.f; render(); },
  'ag-emp': (el) => { S.ui.agenda.emp = el.dataset.e; render(); },
  cita: (el) => formCita(el.dataset.id),
  'cita-estado': (el) => { db.update('citas', el.dataset.id, { estado: el.dataset.e }); render(); },
  'cita-cobrar': (el) => cobrarCita(el.dataset.id),
  'del-cita': (el) => { db.remove('citas', el.dataset.id); cerrarSheet(); toast('Cita eliminada'); render(); },
  'cliente-nuevo-cita': () => formCliente(null, (r) => { formCita(); const s = $('#f-cliente_id'); if (s) s.value = r.id; }),
  // equipo
  'eq-mes': (el) => { S.ui.equipo.mes = addMonths(S.ui.equipo.mes, +el.dataset.d); render(); },
  empleado: (el) => formEmpleado(el.dataset.id),
  'pagar-com': (el) => {
    const e = db.get('empleados', el.dataset.id); const pend = db.all('comisiones').filter((c) => c.empleado_id === e.id && mesDe(c.fecha) === S.ui.equipo.mes && !c.pagada);
    confirmar(`Marcar como pagadas las comisiones de <b>${esc(e.nombre)}</b> en ${nombreMes(S.ui.equipo.mes)}: <b>${money(sum(pend, (c) => Number(c.monto)))}</b>.`, () => { pend.forEach((c) => db.update('comisiones', c.id, { pagada: true })); toast('Comisiones pagadas'); render(); }, 'Marcar pagado');
  },
  // inventario
  'inv-tab': (el) => { S.ui.inv.tab = el.dataset.tab; render(); },
  ingreso: (el) => formIngreso(el.dataset.id),
  ajuste: () => formAjuste(),
  // producción
  'prod-tab': (el) => { S.ui.prod.tab = el.dataset.tab; render(); },
  formula: (el) => formFormula(el.dataset.id),
  'del-formula': (el) => { db.remove('formulas', el.dataset.id); render(); },
  insumo: (el) => formInsumo(el.dataset.id),
  'compra-insumo': (el) => formCompraInsumo(el.dataset.id),
  lote: () => formLote(),
  receta: (el) => formReceta(el.dataset.id),
  // importar
  'imp-reset': () => { S.imp = null; render(); },
  'imp-go': (el) => { el.disabled = true; el.textContent = 'Importando…'; setTimeout(importarTodo, 30); },
};

const CAMBIOS = {
  'linea-emp': (el) => { S.cart.lineas[+el.dataset.i].empleado_id = el.value || null; },
  'cart-cliente': (el) => { S.cart.cliente_id = el.value; },
  'cart-fecha': (el) => { S.cart.fecha = el.value || hoy(); },
  'imp-file': (el) => abrirArchivo(el.files[0]),
  'imp-tipo': (el) => { const h = S.imp.hojas[+el.dataset.h]; h.tipo = el.value; h.map = el.value === 'ninguno' ? {} : mapear(h.headersN, el.value).map; render(); },
  'imp-map': (el) => { S.imp.hojas[+el.dataset.h].map[el.dataset.f] = +el.value; render(); },
  'cart-entrega': (el) => { S.cart.entrega = el.checked ? { fecha: addDays(hoy(), 1), hora: '', direccion: '' } : null; if (el.checked && tiene('inventario')) S.cart.canal = 'online'; render(); },
  'cart-ent': (el) => { S.cart.entrega[el.dataset.k] = el.value; },
  'reservas-on': (el) => { const patch = { reservas_activas: el.checked }; if (el.checked && !S.negocio.slug) patch.slug = slugDe(S.negocio.nombre); if (el.checked && !S.negocio.horario) patch.horario = { ...HORARIO_DEF }; db.negocio(patch); toast(el.checked ? 'Página de reservas activada' : 'Página de reservas apagada'); render(); },
  'dia-chip': (el) => { el.closest('.chip').classList.toggle('on', el.checked); },
  'ag-fecha': (el) => { if (el.value) { S.ui.agenda.fecha = el.value; render(); } },
  modulo: (el) => {
    const m = el.dataset.m; const on = el.checked;
    db.modulo(m, on);
    if (on && MODULOS[m].requiere && !tiene(MODULOS[m].requiere)) db.modulo(MODULOS[m].requiere, true);
    if (!on) Object.entries(MODULOS).filter(([, x]) => x.requiere === m).forEach(([k]) => tiene(k) && db.modulo(k, false));
    toast(`${MODULOS[m].nombre}: ${on ? 'activado' : 'desactivado'}`); render();
  },
};

document.addEventListener('click', (e) => {
  if (e.target.closest('[data-stop]')) return; // enlaces (WhatsApp) dentro de filas clicables
  const cerrar = e.target.closest('[data-close]');
  if (cerrar) { if (cerrar.tagName !== 'A') e.preventDefault(); cerrarSheet(); if (cerrar.tagName === 'A') return; }
  const el = e.target.closest('[data-act]'); if (!el) return;
  const fn = ACCIONES[el.dataset.act]; if (!fn) return;
  if (el.tagName !== 'A' || !el.getAttribute('href')?.startsWith('#')) e.preventDefault();
  try { fn(el); } catch (err) { console.error(err); toast('Algo falló: ' + err.message, true); }
});
document.addEventListener('change', (e) => { const el = e.target.closest('[data-change]'); if (el && CAMBIOS[el.dataset.change]) CAMBIOS[el.dataset.change](el); });
document.addEventListener('submit', (e) => {
  e.preventDefault();
  const f = e.target; const d = formData(f);
  if (f.id === 'sheet-form' && _onSubmit) return _onSubmit(d);
  if (f.id === 'form-reservas') return guardarReservas(f);
  if (f.id === 'form-reserva') return pubEnviar(d);
  if (f.id === 'form-meta') { guardarMeta(d.monto); return render(); }
  if (f.id === 'form-negocio') { if (!d.nombre.trim()) return toast('Escribe el nombre', true); db.negocio({ nombre: d.nombre.trim(), rubro: d.rubro, moneda: d.moneda }); toast('Datos guardados'); render(); }
});
document.addEventListener('input', (e) => {
  if (e.target.id === 'q-vender') { S.ui.vender.q = e.target.value; $('#catalogo-grid').innerHTML = gridCatalogo(); }
  if (e.target.id === 'q-clientes') { S.ui.clientes.q = e.target.value; const pos = e.target.selectionStart; render(); const i = $('#q-clientes'); i.focus(); i.setSelectionRange(pos, pos); }
});
document.addEventListener('dragover', (e) => { const d = e.target.closest?.('#imp-drop'); if (d) { e.preventDefault(); d.classList.add('over'); } });
document.addEventListener('dragleave', (e) => { e.target.closest?.('#imp-drop')?.classList.remove('over'); });
document.addEventListener('drop', (e) => { const d = e.target.closest?.('#imp-drop'); if (d) { e.preventDefault(); d.classList.remove('over'); abrirArchivo(e.dataTransfer.files[0]); } });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && $('#scrim')) cerrarSheet(); });
window.addEventListener('hashchange', () => { cerrarSheet(); if (S.negocio) render(); });

// trae los datos guardados con el nombre anterior de la app
function migrarClaves() {
  try {
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.startsWith('cuadra:')) { const n = 'miderno:' + k.slice(7); if (localStorage.getItem(n) == null) localStorage.setItem(n, localStorage.getItem(k)); }
    }
  } catch (e) {}
}

(async function arrancar() {
  migrarClaves();
  // página pública: ?reservar=nombre-del-negocio
  const slug = new URLSearchParams(location.search).get('reservar');
  if (slug && CONFIG.supabaseUrl && CONFIG.supabaseAnonKey) return abrirReservas(ReservaNube(slug), false);
  if (CONFIG.supabaseUrl && CONFIG.supabaseAnonKey) {
    try { if (await abrirNube()) return; } catch (e) { console.error(e); toast('No pudimos conectar con la nube: ' + (e.message || e), true); }
  }
  const ultimo = LS.get('miderno:ultimo');
  if (ultimo) abrirLocal(ultimo); else render();
})();

</script>
