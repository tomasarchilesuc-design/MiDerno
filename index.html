  const que = a.item ? a.item.x.nombre : a.descripcion || 'Venta';
  return `<span class="an-tipo in">Ingreso</span> ${esc(que)}${a.cliente ? ' · ' + esc(a.cliente.nombre) : ''} · ${esc(metodoLabel(a.metodo))} · <b class="num">${a.monto ? money(a.monto) : 'falta el monto'}</b>`;
}
function anotar(texto) {
  const a = entenderAnotacion(texto);

  if (!(a.monto > 0)) return toast('Falta el monto. Ej: ' + (a.tipo === 'egreso' ? 'gasto algodón 3500' : 'manicure paula 15000'), true);

    S._recien = g.id; toast(`${t_('gasto_ok')}: ${money(a.monto)}`); render(); return;

  S.cart = { ...nuevoCarro(), cliente_id: a.cliente?.id || '', metodo: a.metodo, lineas: [linea] };
  const n = db.all('ventas').length; cobrar();
  const v = db.all('ventas')[n]; if (v) S._recien = v.id;

}

/* =========================================================
   Calendario por horas + horarios bloqueados
   - La vista "Semana" muestra cada día como una columna con sus horas:
     citas, reservas por confirmar, entregas y bloqueos en su lugar.
   - Tocar un espacio vacío permite agendar ahí o bloquear ese horario.
   - Fuera del horario de atención se ve sombreado, pero igual se puede
     agendar (el dueño manda; solo la página pública respeta el horario).
   ========================================================= */

const MIN_PX = 1.1; // alto de un minuto en el calendario
const bloqueosDel = (f) => db.all('eventos').filter((e) => e.tipo === 'bloqueo' && e.fecha === f && e.estado !== 'cancelada');
// [inicio, fin] en minutos; sin hora = todo el día
const rangoBloqueo = (b) => (b.hora ? [aMin(b.hora), b.hasta ? aMin(b.hasta) : aMin(b.hora) + 60] : [0, 24 * 60]);
const textoBloqueo = (b) => (b.hora ? `${hhmm(b.hora)}–${b.hasta ? hhmm(b.hasta) : ''}` : 'Todo el día');
const diaCerrado = (f) => !horarioDia(horarioDe(S.negocio), new Date(f + 'T12:00:00').getDay());
const bloqueoTotal = (f) => bloqueosDel(f).some((b) => !b.hora);

function duracionItem(i) {
  if (i.kind === 'cita') return Number(i.s?.duracion_min || 60);
  return 30;
}
// reparte en carriles los que se cruzan, para que no queden uno encima del otro
function carriles(items) {
  const orden = [...items].sort((a, b) => a.ini - b.ini || b.fin - a.fin); let grupo = []; let finGrupo = -1;
  const cerrar = () => { const n = Math.max(...grupo.map((x) => x.carril)) + 1; grupo.forEach((x) => { x.de = n; }); grupo = []; };
  for (const it of orden) {
    if (grupo.length && it.ini >= finGrupo) cerrar();
    const usados = grupo.filter((x) => x.fin > it.ini).map((x) => x.carril);
    let c = 0; while (usados.includes(c)) c++;
    it.carril = c; grupo.push(it); finGrupo = Math.max(finGrupo, it.fin);
  }
  if (grupo.length) cerrar();
  return orden;
}

function diasCalendario() {
  const ui = S.ui.agenda;
  if (esMovil()) return Array.from({ length: 3 }, (_, k) => addDays(ui.fecha, k));
  const l = lunesDe(ui.fecha); return Array.from({ length: 7 }, (_, k) => addDays(l, k));
}
function tituloCalendario() {
  const d = diasCalendario(); return `${fechaCorta(d[0])} al ${fechaCorta(d.at(-1))}`;
}

function agendaCalendario() {
  const h = horarioDe(S.negocio); const dias = diasCalendario();
  // rango visible: el horario de atención más amplio y cualquier cosa agendada fuera de él
  let ini = 24 * 60, fin = 0;
  for (const f of dias) {
    const hd = horarioDia(h, new Date(f + 'T12:00:00').getDay()); if (hd) { ini = Math.min(ini, aMin(hd.desde)); fin = Math.max(fin, aMin(hd.hasta)); }
    for (const i of itemsDelDia(f).filter(enAgenda)) if (i.hora) { const m = aMin(i.hora); ini = Math.min(ini, m); fin = Math.max(fin, m + duracionItem(i)); }
    for (const b of bloqueosDel(f)) if (b.hora) { const [a, z] = rangoBloqueo(b); ini = Math.min(ini, a); fin = Math.max(fin, z); }
  }
  if (fin <= ini) { ini = 9 * 60; fin = 20 * 60; }
  ini = Math.max(0, Math.floor(ini / 60) * 60 - 60); fin = Math.min(24 * 60, Math.ceil(fin / 60) * 60 + 60);
  const alto = (fin - ini) * MIN_PX; const y = (m) => (m - ini) * MIN_PX;
  const horas = []; for (let m = ini; m < fin; m += 60) horas.push(m);
  const ahora = new Date(); const minAhora = ahora.getHours() * 60 + ahora.getMinutes();

  const col = (f) => {
    const dow = new Date(f + 'T12:00:00').getDay(); const hd = horarioDia(h, dow);
    const items = itemsDelDia(f).filter(enAgenda);
    const sinHora = items.filter((i) => !i.hora);
    const conHora = carriles(items.filter((i) => i.hora).map((i) => { const a = aMin(i.hora); return { i, ini: a, fin: a + duracionItem(i) }; }));
    const bloq = bloqueosDel(f);
    // zonas sombreadas fuera del horario
    const sombras = hd ? [[ini, aMin(hd.desde)], [aMin(hd.hasta), fin]].filter(([a, z]) => z > a) : [[ini, fin]];
    return `<div class="cal-col ${f === hoy() ? 'hoy' : ''} ${hd ? '' : 'cerrado'}" data-f="${f}" data-ini="${ini}" style="height:${alto}px">
      ${sombras.map(([a, z]) => `<div class="cal-fuera" style="top:${y(a)}px;height:${(z - a) * MIN_PX}px"></div>`).join('')}
      ${bloq.map((b) => { const [a, z] = rangoBloqueo(b); const ta = Math.max(a, ini), tz = Math.min(z, fin); return tz > ta ? `<button class="cal-bloq" data-act="bloqueo" data-id="${b.id}" style="top:${y(ta)}px;height:${(tz - ta) * MIN_PX}px"><b>Bloqueado</b><small>${esc(b.titulo && b.titulo !== 'Bloqueado' ? b.titulo : textoBloqueo(b))}</small></button>` : ''; }).join('')}
      ${conHora.map(({ i, ini: a, fin: z, carril, de }) => {
        const [est] = (i.kind === 'cita' ? ESTADOS_CITA : ESTADOS_EV)[i.estado] || [''];
        const corto = (z - a) * MIN_PX < 52;
        return `<button class="cal-ev ${KIND[i.kind].cls} ${i.estado === 'solicitada' ? 'req' : ''} ${['completada', 'entregada', 'hecha'].includes(i.estado) ? 'hecho' : ''} ${corto ? 'corto' : ''}" data-act="ag-detalle" data-id="${i.id}" data-kind="${i.kind}"
          style="top:${y(a)}px;height:${Math.max(22, (z - a) * MIN_PX - 2)}px;left:calc(${(carril / de) * 100}% + 2px);width:calc(${100 / de}% - 4px)" title="${esc(`${i.hora} ${i.titulo} · ${i.sub} · ${est}`)}">
          <span class="cal-h num">${i.hora}</span><b>${esc(i.titulo)}</b>${corto ? '' : `<small>${esc(i.kind === 'cita' ? i.s?.nombre || '' : i.sub)}</small>`}${i.estado === 'solicitada' ? '<em>Por confirmar</em>' : ''}</button>`;
      }).join('')}
      ${f === hoy() && minAhora >= ini && minAhora <= fin ? `<div class="cal-ahora" style="top:${y(minAhora)}px"></div>` : ''}
    </div>${sinHora.length ? '' : ''}`;
  };

  const cab = dias.map((f) => {
    const d = new Date(f + 'T12:00:00'); const sinHora = itemsDelDia(f).filter(enAgenda).filter((i) => !i.hora);
    return `<div class="cal-cab ${f === hoy() ? 'hoy' : ''}"><button class="cal-dia" data-act="ag-ir-dia" data-f="${f}"><span>${d.toLocaleDateString('es-CL', { weekday: 'short' })}</span><b>${d.getDate()}</b></button>
      ${diaCerrado(f) ? '<small class="cal-nota">Cerrado</small>' : bloqueoTotal(f) ? '<small class="cal-nota">Bloqueado</small>' : ''}
      ${sinHora.map((i) => `<button class="cal-todo ${KIND[i.kind].cls}" data-act="ag-detalle" data-id="${i.id}" data-kind="${i.kind}">${esc(i.titulo)}</button>`).join('')}</div>`;
  }).join('');

  return `<div class="card cal-card"><div class="cal" style="--dias:${dias.length}">
    <div class="cal-esq"></div>${cab}
    <div class="cal-horas" style="height:${alto}px">${horas.map((m) => `<span style="top:${y(m)}px">${deMin(m)}</span>`).join('')}</div>
    ${dias.map(col).join('')}
  </div>
  <div class="legend cal-ley"><span><i class="ley-conf"></i>Agendada</span><span><i class="ley-req"></i>Por confirmar</span><span><i class="ley-bloq"></i>Bloqueado</span><span><i class="ley-fuera"></i>Fuera de tu horario</span><span class="muted">Toca un espacio libre para agendar o bloquear</span></div></div>`;
}

// tocar un espacio libre del calendario
document.addEventListener('click', (e) => {
  const c = e.target.closest?.('.cal-col'); if (!c || e.target.closest('button')) return;
  const r = c.getBoundingClientRect(); const paso = 10;
  const m = Math.floor(((e.clientY - r.top) / MIN_PX + Number(c.dataset.ini)) / paso) * paso;
  elegirEnHueco(c.dataset.f, deMin(Math.max(0, Math.min(m, 23 * 60 + 50))));
});
function elegirEnHueco(f, hora) {
  const h = horarioDe(S.negocio); const hd = horarioDia(h, new Date(f + 'T12:00:00').getDay());
  const fuera = !hd || aMin(hora) < aMin(hd.desde) || aMin(hora) >= aMin(hd.hasta);
  const bq = bloqueosDel(f).find((b) => { const [a, z] = rangoBloqueo(b); return aMin(hora) >= a && aMin(hora) < z; });
  const ops = [
    tiene('servicios') && ['cita', 'cal', 'Agendar una hora aquí', fuera ? 'Para una clienta, aunque sea fuera de tu horario' : 'Para una clienta, con servicio y quién atiende'],
    ['bloqueo-aqui', 'lock', 'Bloquear este horario', 'Nadie podrá reservar en tu página a esta hora'],
    ['tarea', 'edit', 'Recordatorio', 'Algo que tienes que hacer a esta hora'],
  ].filter(Boolean);
  abrirSheet(`${fechaLarga(f)}, ${hora}`, `${fuera ? `<div class="banner warn-soft">${icon('clock')}<span>${hd ? `Atiendes de ${hd.desde} a ${hd.hasta}.` : 'Este día no atiendes según tu horario de reservas.'} Tú puedes agendar igual; tu página pública no lo ofrece.</span></div>` : ''}
    ${bq ? `<div class="banner">${icon('lock')}<span>Este horario está bloqueado (${esc(textoBloqueo(bq))}). Puedes agendar igual o <a href="#" data-act="bloqueo" data-id="${bq.id}">editar el bloqueo</a>.</span></div>` : ''}
    <div class="stack">${ops.map(([k, ic, t, d]) => `<button type="button" class="alert-row hueco-op" data-act="hueco" data-k="${k}" data-f="${f}" data-h="${hora}">${icon(ic)}<div class="grow"><b>${t}</b><small>${d}</small></div>${icon('right')}</button>`).join('')}</div>`);
}

/* ---------- bloquear horarios ---------- */
function formBloqueo(id, pre = {}) {
  const b = id ? db.get('eventos', id) : { fecha: pre.fecha || S.ui.agenda.fecha || hoy(), hora: pre.hora || '13:00', hasta: pre.hasta || '', titulo: '', ...pre };
  const todo = id ? !b.hora : !!pre.todo;
  const hasta = b.hasta ? hhmm(b.hasta) : deMin(Math.min(aMin(hhmm(b.hora) || '13:00') + 60, 23 * 60 + 50));
  abrirSheet(id ? 'Editar bloqueo' : 'Bloquear horario', `<p class="small muted" style="margin-top:-6px">En ese horario tu página de reservas no ofrece horas. Tú igual puedes agendar si lo necesitas.</p>
    ${field('Motivo', `<input class="in" name="titulo" id="f-bq-titulo" value="${esc(b.titulo && b.titulo !== 'Bloqueado' ? b.titulo : '')}" placeholder="Almuerzo, trámite, vacaciones… (opcional)">`)}
    <div class="form-row">${field('Fecha', `<input class="in" type="date" name="fecha" id="f-bq-fecha" value="${b.fecha}" required>`)}${id ? '<span></span>' : field('Repetir hasta', `<input class="in" type="date" name="repetir" id="f-bq-rep" min="${b.fecha}">`, 'Opcional. Para vacaciones o varios días seguidos.')}</div>
    <label class="hstack" style="gap:10px"><span class="toggle"><input type="checkbox" name="todo" id="f-bq-todo" ${todo ? 'checked' : ''} data-change="bq-todo"><span></span></span><span>Todo el día</span></label>
    <div class="form-row bq-horas" ${todo ? 'hidden' : ''}>${field('Desde', selHora('hora', hhmm(b.hora) || '13:00', { id: 'f-bq-desde', desde: '05:00', hasta: '23:40' }))}${field('Hasta', selHora('hasta', hasta, { id: 'f-bq-hasta', desde: '05:10', hasta: '23:50' }))}</div>
    ${id ? `<button type="button" class="btn ghost danger" data-act="del-bloqueo" data-id="${id}" style="align-self:flex-start">${icon('trash')}Quitar bloqueo</button>` : ''}`, {
    submit: (d) => {
      const todoDia = !!d.todo; const desde = todoDia ? null : d.hora; const hastaH = todoDia ? null : d.hasta;
      if (!todoDia && aMin(hastaH) <= aMin(desde)) return errorCampo('#f-bq-hasta', 'Tiene que terminar después de que empieza');
      const row = { tipo: 'bloqueo', titulo: d.titulo.trim() || 'Bloqueado', fecha: d.fecha, hora: desde, hasta: hastaH, cliente_id: null, direccion: '', monto: 0, pagado: false, nota: '' };
      if (id) { db.update('eventos', id, row); toast('Bloqueo actualizado'); }
      else {
        const fin = d.repetir && d.repetir > d.fecha ? d.repetir : d.fecha; let f = d.fecha; let n = 0;
        while (f <= fin && n < 62) { db.insert('eventos', { ...row, fecha: f, estado: 'pendiente', venta_id: null }); f = addDays(f, 1); n++; }
        toast(n > 1 ? `${n} días bloqueados` : 'Horario bloqueado');
      }
      cerrarSheet(); S.ui.agenda.fecha = d.fecha; render();
    },
  });
}

// ¿la hora elegida para una cita cae fuera del horario o en un bloqueo? se avisa, pero se deja agendar
function avisoHorarioCita() {
  const f = $('#sheet-form [name=fecha]')?.value; const hora = $('#f-hora')?.value; const box = $('#cita-aviso'); if (!box || !f || !hora) return;
  const hd = horarioDia(horarioDe(S.negocio), new Date(f + 'T12:00:00').getDay());
  const bq = bloqueosDel(f).find((b) => { const [a, z] = rangoBloqueo(b); return aMin(hora) >= a && aMin(hora) < z; });
  const txt = !hd ? 'Este día no atiendes según tu horario. Se agenda igual, solo tú la ves.'
    : aMin(hora) < aMin(hd.desde) || aMin(hora) >= aMin(hd.hasta) ? `Queda fuera de tu horario (${hd.desde} a ${hd.hasta}). Se agenda igual.`
    : bq ? `Ese horario está bloqueado (${esc(bq.titulo !== 'Bloqueado' ? bq.titulo : textoBloqueo(bq))}). Se agenda igual.` : '';
  box.hidden = !txt; box.innerHTML = txt ? `${icon('clock')}<span>${txt}</span>` : '';
}
document.addEventListener('change', (e) => { if (e.target.closest?.('#sheet-form') && ['fecha', 'hora'].includes(e.target.name) && $('#cita-aviso')) avisoHorarioCita(); });

document.addEventListener('click', (e) => {
  if (e.target.closest('[data-stop]')) return; // enlaces (WhatsApp) dentro de filas clicables
  const cerrar = e.target.closest('[data-close]');
  if (cerrar) { if (cerrar.tagName !== 'A') e.preventDefault(); cerrarSheet(); if (cerrar.tagName === 'A') return; }
  const el = e.target.closest('[data-act]'); if (!el) return;
  const fn = ACCIONES[el.dataset.act]; if (!fn) return;
  if (el.tagName !== 'A' || !el.getAttribute('href')?.startsWith('#') || el.getAttribute('href') === '#') e.preventDefault();
  try { fn(el); } catch (err) { console.error(err); toast('Algo falló: ' + err.message, true); }
});
document.addEventListener('change', (e) => { const el = e.target.closest('[data-change]'); if (el && CAMBIOS[el.dataset.change]) CAMBIOS[el.dataset.change](el); });
document.addEventListener('submit', (e) => {
  e.preventDefault();
  const f = e.target; const d = formData(f);
  if (f.id === 'sheet-form' && _onSubmit) {
    const r = _onSubmit(d);
    // si guardar toma tiempo (nube, inicio de sesión), el botón muestra que está trabajando
    if (r && typeof r.then === 'function') {
      const b = f.querySelector('[type=submit]'); if (b) { b.disabled = true; b.classList.add('cargando'); }
      cargando(true);
      r.finally(() => { cargando(false); if (b && b.isConnected) { b.disabled = false; b.classList.remove('cargando'); } });
    }
    return;
  }
  if (f.id === 'form-reservas') return guardarReservas(f);
  if (f.id === 'form-reserva') return pubEnviar(d);
  if (f.id === 'form-meta') { guardarMeta(d.monto); return render(); }
  if (f.id === 'form-negocio') { if (!d.nombre.trim()) return toast('Escribe el nombre', true); db.negocio({ nombre: d.nombre.trim(), rubro: d.rubro, moneda: d.moneda }); toast('Datos guardados'); render(); }
});
document.addEventListener('input', (e) => {
  if (e.target.id === 'q-vender') { S.ui.vender.q = e.target.value; $('#catalogo-grid').innerHTML = gridCatalogo(); }
  if (e.target.id === 'q-clientes') { S.ui.clientes.q = e.target.value; const pos = e.target.selectionStart; render(); const i = $('#q-clientes'); i.focus(); i.setSelectionRange(pos, pos); }
});
document.addEventListener('dragover', (e) => { const d = e.target.closest?.('#imp-drop'); if (d) { e.preventDefault(); d.classList.add('over'); } });
document.addEventListener('dragleave', (e) => { e.target.closest?.('#imp-drop')?.classList.remove('over'); });
document.addEventListener('drop', (e) => { const d = e.target.closest?.('#imp-drop'); if (d) { e.preventDefault(); d.classList.remove('over'); abrirArchivo(e.dataTransfer.files[0]); } });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && $('#scrim')) cerrarSheet(); });
window.addEventListener('hashchange', () => { cerrarSheet(); if (S.negocio) conTransicion(render); });

// trae los datos guardados con el nombre anterior de la app
function migrarClaves() {
  try {
    // los ejemplos ya no se guardan: limpia copias antiguas
    for (const k of Object.keys(localStorage)) if (/^(miderno|cuadra):data:demo-/.test(k)) localStorage.removeItem(k);
    if (/^demo-/.test(LS.get('miderno:ultimo') || '')) LS.del('miderno:ultimo');
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.startsWith('cuadra:')) { const n = 'miderno:' + k.slice(7); if (localStorage.getItem(n) == null) localStorage.setItem(n, localStorage.getItem(k)); }
    }
  } catch (e) {}
}

(async function arrancar() {
  migrarClaves();
  // página pública: ?reservar=nombre-del-negocio
  const slug = new URLSearchParams(location.search).get('reservar') || (location.pathname.match(/\/agenda\/([a-z0-9-]+)\/?$/) || [])[1];
  if (slug && CONFIG.supabaseUrl && CONFIG.supabaseAnonKey) return abrirReservas(ReservaNube(slug), false);
  // si el enlace del correo venció o falló, Supabase lo indica en la dirección
  const err = new URLSearchParams(location.hash.slice(1)).get('error_description') || new URLSearchParams(location.search).get('error_description');
  if (err) setTimeout(() => toast(/expired|invalid/i.test(err) ? 'El enlace del correo venció o ya se usó. Inicia sesión con tu correo y contraseña.' : 'Problema con el enlace: ' + err, true), 300);
  if (/type=recovery/.test(location.hash + location.search)) S.recuperar = true;
  if (CONFIG.supabaseUrl && CONFIG.supabaseAnonKey) {
    // apertura instantánea: se muestra lo último guardado y la nube se pone al día por detrás
    const vieneDeCorreo = S.recuperar || /access_token|refresh_token|[?&]code=/.test(location.href);
    if (!vieneDeCorreo && await abrirDesdeCache()) {
      abrirNube({ fondo: true }).then((ok) => {
        if (ok) return revisarRecuperacion();
        LS.del('miderno:nube-uid'); CacheNube.borrar(); S.negocio = null; S.modo = null; S.sincronizando = false; adapter = LocalAdapter; render();
        toast('Tu sesión se cerró. Vuelve a entrar para ver tus datos.', true);
      }).catch((e) => { console.error(e); S.sincronizando = false; render(); toast('Sin conexión: estás viendo lo último guardado en este dispositivo. Los cambios se enviarán al volver la conexión.', true); });
      return;
    }
    try { if (await abrirNube()) { revisarRecuperacion(); return; } } catch (e) { console.error(e); pantallaCarga(false); toast('No pudimos conectar con la nube: ' + (e.message || e), true); }
  }
  const ultimo = LS.get('miderno:ultimo');
  if (ultimo) abrirLocal(ultimo); else render();
})();

// elegir uno de los negocios de ejemplo (no aparecen en la portada)
function elegirEjemplo() {
  const mods = (id) => DEMOS[id].crear === demoSalon ? ['servicios'] : DEMOS[id].crear === demoTienda ? ['inventario'] : ['inventario', 'produccion'];
  abrirSheet('Elige un ejemplo', `<p class="muted" style="margin:-6px 0 0">Datos ficticios. Toca todo: nada se guarda.</p>
    <div class="ej-lista">${Object.entries(DEMOS).map(([id, d], k) => `<button type="button" class="ej" data-act="demo" data-id="${id}" style="--i:${k}">
      <span class="ej-ini">${esc(iniciales(d.nombre))}</span>
      <span class="grow"><b>${esc(d.nombre)}</b><small>${esc(d.desc)}</small>
      <span class="mods">${mods(id).map((m) => `<span class="pill">${MODULOS[m].nombre}</span>`).join('')}</span></span>${icon('right')}</button>`).join('')}</div>`);
}
