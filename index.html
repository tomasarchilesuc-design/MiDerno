<style>
/* Layout: app shell — sidebar on desktop, bottom tab bar + "Más" sheet on phones. Brand idea: the entrepreneur's notebook — ink blue, highlighter yellow, margin red */
/* Minimal: white paper, one typeface, ink-black actions; the notebook blue only marks what is active or linked */
:root {
  --marca: #0B6870;
  --primary: var(--ink);
  --primary-ink: var(--bg);
  --bg: #FFFFFF;
  --surface: #FFFFFF;
  --surface-2: #F4F4F2;
  --line: #E8E8E5;
  --ink: #141414;
  --muted: #6E6E6E;
  --accent: #2346A3;
  --accent-ink: #FFFFFF;
  --accent-soft: #EEF1FA;
  --gold: #C99A10;
  --gold-soft: #FBF3DC;
  --hl: #FFE98A;
  --margin: #D8483B;
  --rule: #DCE3EE;
  --paper: #FFFFFF;
  --ok: #1F7A4A;
  --ok-soft: #E7F4EC;
  --warn: #8F5E0E;
  --warn-soft: #FBF1DE;
  --bad: #B23A2B;
  --bad-soft: #FBE8E4;
  --shadow: 0 1px 2px rgba(0, 0, 0, .04), 0 16px 40px rgba(0, 0, 0, .10);
  --f-display: "Geist", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-body: "Geist", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-serif: "Instrument Serif", "Iowan Old Style", Georgia, serif;
  --ease-out: cubic-bezier(.16, 1, .3, 1);
  --ease-back: cubic-bezier(.34, 1.56, .64, 1);
  --f-hand: "Caveat", "Segoe Print", "Bradley Hand", cursive;
  --r: 16px;
  --r-sm: 12px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --marca: #5CC8C9;
    --bg: #0E0E0F; --surface: #0E0E0F; --surface-2: #1A1A1C; --line: #262629;
    --ink: #F1F1F1; --muted: #9B9BA0; --accent: #94ABF7; --accent-ink: #0B1430; --accent-soft: #1A2240;
    --gold: #E6C04F; --gold-soft: #2F2914; --hl: #6E5D12; --margin: #F07A6E; --rule: #2B3446; --paper: #151517;
    --ok: #62C48F; --ok-soft: #14271C; --warn: #E9B54E; --warn-soft: #2E2614; --bad: #EE7D6A; --bad-soft: #33201C;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 16px 40px rgba(0,0,0,.5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E0E0F; --surface: #0E0E0F; --surface-2: #1A1A1C; --line: #262629;
  --ink: #F1F1F1; --muted: #9B9BA0; --accent: #94ABF7; --accent-ink: #0B1430; --accent-soft: #1A2240;
  --gold: #E6C04F; --gold-soft: #2F2914; --hl: #6E5D12; --margin: #F07A6E; --rule: #2B3446; --paper: #151517;
  --ok: #62C48F; --ok-soft: #14271C; --warn: #E9B54E; --warn-soft: #2E2614; --bad: #EE7D6A; --bad-soft: #33201C;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 16px 40px rgba(0,0,0,.5);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--f-body); -webkit-font-smoothing: antialiased; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 650; line-height: 1.15; margin: 0; text-wrap: balance; letter-spacing: -.01em; }
h1 { font-size: 1.7rem; }
h2 { font-size: 1.15rem; }
h3 { font-size: 1rem; }
p { margin: 0; }
a { color: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }
.num, td.n, .money { font-variant-numeric: tabular-nums; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
svg.i { width: 20px; height: 20px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- shell ---------- */
.shell { display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: 100vh; }
.side { position: sticky; top: 0; height: 100vh; padding: 20px 14px; border-right: 1px solid var(--line); background: var(--surface); display: flex; flex-direction: column; gap: 18px; overflow-y: auto; }
.brand { display: flex; align-items: center; gap: 10px; padding: 0 8px; }
.brand-mark { width: 30px; height: 30px; flex: none; display: block; overflow: visible; }
.brand b { font: 700 1.25rem var(--f-display); letter-spacing: -.02em; }
.biz { padding: 10px; border-radius: var(--r-sm); background: var(--surface-2); }
.biz small { display: block; color: var(--muted); font-size: .75rem; }
.biz strong { display: block; font-weight: 600; line-height: 1.25; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav-label { font-size: .7rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); padding: 12px 10px 4px; }
.nav a { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: var(--r-sm); color: var(--ink); text-decoration: none; font-weight: 500; }
.nav a:hover { background: var(--surface-2); }
.nav a.on { background: var(--accent-soft); color: var(--accent); }
.side .grow { flex: 1; }
.mode-pill { font-size: .75rem; color: var(--muted); padding: 0 10px; display: flex; gap: 6px; align-items: center; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--gold); display: inline-block; }
.dot.cloud { background: var(--ok); }

.main { min-width: 0; padding-inline: 28px; padding-block: 26px 60px; }
.wrap { max-width: 1080px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.page-head .eyebrow { font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
.page-head .actions { display: flex; gap: 8px; flex-wrap: wrap; }

.tabbar { display: none; }

@media (max-width: 860px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .side { display: none; }
  .main { padding-inline: 16px; padding-block: 16px 110px; }
  h1 { font-size: 1.45rem; }
  .tabbar { display: grid; grid-template-columns: repeat(5, 1fr); position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line); padding: 6px 4px calc(6px + env(safe-area-inset-bottom, 0px)); }
  .tabbar a, .tabbar button { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: .68rem; font-weight: 500; color: var(--muted); text-decoration: none; background: none; border: 0; padding: 4px 0; cursor: pointer; }
  .tabbar .on { color: var(--accent); }
  .tabbar .sell span.plus { width: 44px; height: 44px; margin-top: -18px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; box-shadow: var(--shadow); }
  .mobile-top { display: flex !important; }
}
.mobile-top { display: none; align-items: center; justify-content: space-between; gap: 10px; }
.mobile-top .brand b { font-size: 1.1rem; }

/* ---------- surfaces ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; min-width: 0; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
.card-head p { color: var(--muted); font-size: .85rem; }
.grid { display: grid; gap: 14px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.span2 { grid-column: span 2; }
@media (max-width: 1000px) { .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .g3 { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 720px) { .g2 { grid-template-columns: minmax(0, 1fr); } .span2 { grid-column: auto; } }

.kpi { display: flex; flex-direction: column; gap: 4px; }
.kpi .lbl { font-size: .78rem; color: var(--muted); }
.kpi .val { font: 650 1.45rem/1.1 var(--f-display); font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.kpi .sub { font-size: .78rem; color: var(--muted); }
.up { color: var(--ok); } .down { color: var(--bad); }

/* meta (goal) */
.goal { background: var(--ink); color: var(--bg); border: 0; }
.goal .lbl, .goal .sub { color: color-mix(in srgb, var(--bg) 70%, transparent); }
.goal-row { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
.goal-big { font: 650 2.2rem/1 var(--f-display); font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.bar { height: 12px; border-radius: 99px; background: color-mix(in srgb, var(--bg) 18%, transparent); overflow: hidden; margin: 14px 0 10px; }
.bar i { display: block; height: 100%; border-radius: 99px; background: var(--gold); }
.goal-facts { display: flex; gap: 22px; flex-wrap: wrap; font-size: .85rem; }
.goal-facts b { display: block; font: 600 1.05rem var(--f-display); font-variant-numeric: tabular-nums; }

/* lists & tables */
.list { display: flex; flex-direction: column; }
.row { display: flex; align-items: center; gap: 12px; padding: 11px 2px; border-top: 1px solid var(--line); min-width: 0; }
.row:first-child { border-top: 0; }
.row .grow { flex: 1; min-width: 0; }
.row .t { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .s { font-size: .82rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .r { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.row.click { cursor: pointer; }
.row.click:hover { background: var(--surface-2); }
.avatar { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-weight: 600; font-size: .85rem; background: var(--accent-soft); color: var(--accent); flex: none; }
.tbl-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: .9rem; }
th { text-align: left; font-weight: 500; font-size: .75rem; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
td.n, th.n { text-align: right; white-space: nowrap; }
tr:last-child td { border-bottom: 0; }

.pill { display: inline-flex; align-items: center; gap: 5px; font-size: .74rem; font-weight: 600; padding: 3px 9px; border-radius: 99px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.acc { background: var(--accent-soft); color: var(--accent); }
.empty { padding: 26px 12px; text-align: center; color: var(--muted); font-size: .9rem; }

/* controls */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 9px 15px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-weight: 600; font-size: .9rem; cursor: pointer; text-decoration: none; white-space: nowrap; }
.btn:hover { background: var(--surface-2); }
.btn.pri { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.pri:hover { filter: brightness(1.06); }
.btn.danger { color: var(--bad); }
.btn.sm { padding: 6px 10px; font-size: .8rem; border-radius: 8px; }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.block { width: 100%; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.icon-btn { width: 34px; height: 34px; padding: 0; border-radius: 9px; }

.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field label { font-size: .8rem; font-weight: 600; color: var(--muted); }
.field .hint { font-size: .76rem; color: var(--muted); }
.in { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); min-height: 42px; }
.in:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
.form { display: flex; flex-direction: column; gap: 14px; }
.form-row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 480px) { .form-row { grid-template-columns: minmax(0, 1fr); } }

.seg { display: inline-flex; background: var(--surface-2); border-radius: 10px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: none; padding: 7px 12px; border-radius: 8px; font-size: .85rem; font-weight: 600; color: var(--muted); cursor: pointer; }
.seg button.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.08); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 6px 12px; font-size: .82rem; font-weight: 600; cursor: pointer; color: var(--muted); }
.chips.scroll { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.chips.scroll .chip { flex: none; }
.chip.on { background: var(--primary); color: var(--primary-ink); border-color: var(--primary); }

.toggle { position: relative; width: 44px; height: 26px; flex: none; }
.toggle input { opacity: 0; width: 100%; height: 100%; position: absolute; inset: 0; margin: 0; cursor: pointer; z-index: 1; }
.toggle span { position: absolute; inset: 0; border-radius: 99px; background: var(--line); transition: background .15s; }
.toggle span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--surface); box-shadow: 0 1px 2px rgba(0,0,0,.2); transition: transform .15s; }
.toggle input:checked + span { background: var(--accent); }
.toggle input:checked + span::after { transform: translateX(18px); }
.toggle input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }

.monthnav { display: inline-flex; align-items: center; gap: 4px; }
.monthnav strong { min-width: 130px; text-align: center; font-weight: 600; display: inline-block; }
.monthnav strong::first-letter { text-transform: uppercase; }

/* chart */
.chart svg { width: 100%; height: auto; display: block; }
.chart text { fill: var(--muted); font: 11px var(--f-body); }
.legend { display: flex; gap: 14px; font-size: .8rem; color: var(--muted); flex-wrap: wrap; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }

/* caja de hoy */
.caja-dia { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; }
.caja-dia div { background: var(--surface-2); border-radius: var(--r-sm); padding: 10px 12px; }
.caja-dia small { display: block; color: var(--muted); font-size: .75rem; }
.caja-dia b { font-variant-numeric: tabular-nums; font-weight: 650; }

/* sell */
.sell { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 900px) { .sell { grid-template-columns: minmax(0, 1fr); } }
.catalog { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.item-btn { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 11px 12px; cursor: pointer; display: flex; flex-direction: column; gap: 3px; min-height: 76px; }
.item-btn:hover { border-color: var(--accent); }
.item-btn b { font-weight: 600; font-size: .9rem; line-height: 1.25; }
.item-btn small { color: var(--muted); font-size: .78rem; font-variant-numeric: tabular-nums; }
.item-btn:disabled { opacity: .45; cursor: not-allowed; }
.cart { position: sticky; top: 16px; }
.cart-line { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 10px; padding: 10px 0; border-top: 1px solid var(--line); }
.cart-line:first-child { border-top: 0; }
.qty { display: inline-flex; align-items: center; gap: 4px; }
.qty button { width: 28px; height: 28px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 700; }
.total-row { display: flex; justify-content: space-between; align-items: baseline; padding: 14px 0 6px; border-top: 2px solid var(--ink); margin-top: 8px; }
.total-row b { font: 650 1.6rem var(--f-display); font-variant-numeric: tabular-nums; }

/* sheet (modal) */
.scrim { position: fixed; inset: 0; background: rgba(8, 14, 12, .45); z-index: 40; display: flex; align-items: center; justify-content: center; padding: 16px; }
.sheet { background: var(--surface); border-radius: 18px; width: min(560px, 100%); max-height: calc(100vh - 32px); overflow-y: auto; padding: 20px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 16px; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.sheet-foot { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
@media (max-width: 600px) {
  .scrim { align-items: flex-end; padding: 0; }
  .sheet { border-radius: 18px 18px 0 0; max-height: 92vh; padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px)); }
}

.toast { position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-weight: 600; font-size: .9rem; z-index: 60; box-shadow: var(--shadow); max-width: calc(100% - 32px); }
.toast.err { background: var(--bad); color: #fff; }

.alert-row { display: flex; gap: 10px; align-items: center; padding: 10px 12px; border-radius: var(--r-sm); background: var(--surface-2); text-decoration: none; color: var(--ink); }
.alert-row .grow { flex: 1; min-width: 0; }
.alert-row small { display: block; color: var(--muted); font-size: .8rem; }
.sev { width: 8px; align-self: stretch; border-radius: 4px; flex: none; background: var(--muted); }
.sev.warn { background: var(--warn); } .sev.bad { background: var(--bad); } .sev.ok { background: var(--ok); } .sev.acc { background: var(--accent); }

.rec-row { display: grid; grid-template-columns: minmax(0, 1fr) 96px 92px 34px; gap: 6px; align-items: center; }
.rec-nuevo { grid-column: 1 / -1; display: grid; grid-template-columns: minmax(0, 1fr) 150px; gap: 6px; padding: 8px; border-radius: 10px; background: var(--surface-2); }
@media (max-width: 480px) { .rec-row { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) 34px; } .rec-row .rec-ins { grid-column: 1 / -1; } .rec-nuevo { grid-template-columns: minmax(0, 1fr); } }

/* ---------- landing ---------- */

.notebook { position: relative; background-color: var(--paper); border: 1px solid var(--line); border-radius: 6px 16px 16px 6px; box-shadow: var(--shadow);
  padding: 22px 16px 26px 58px; min-width: 0;
  background-image: linear-gradient(to right, transparent 43px, var(--margin) 43px, var(--margin) 45px, transparent 45px),
    repeating-linear-gradient(to bottom, transparent 0 39px, var(--rule) 39px 40px);
  background-position: 0 0, 0 50px; }

  background: radial-gradient(circle at 7px 7px, var(--bg) 0 4.5px, var(--line) 4.5px 5.5px, transparent 6px) 0 0 / 14px 30px repeat-y; }

.nb-line .tag { justify-self: start; font: 600 .7rem/1 var(--f-body); letter-spacing: .02em; padding: 5px 8px; border-radius: 6px; background: var(--surface-2); color: var(--ink); white-space: nowrap;
  animation: tag-in .45s cubic-bezier(.2, .8, .2, 1) backwards; }

/* ---------- Inicio simple y Registrar ---------- */

.accion { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 16px 8px; border-radius: 16px; background: var(--surface-2); color: var(--ink); text-decoration: none; font-weight: 600; font-size: .92rem; }

.gasto-rapido { max-width: 560px; gap: 14px; }
.monto-grande { display: flex; align-items: baseline; gap: 6px; border-bottom: 2px solid var(--line); padding: 6px 0 10px; font-size: 2.6rem; font-weight: 700; }

.monto-grande input { border: 0; outline: 0; background: transparent; font: inherit; width: 100%; min-width: 0; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }

.sis-fila { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding: 10px 0; border-top: 1px solid var(--line); }

.swatches { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.swatch { width: 32px; height: 32px; border-radius: 50%; border: 2px solid var(--bg); background: var(--sw); box-shadow: 0 0 0 1px var(--line); cursor: pointer; padding: 0; position: relative; display: grid; place-items: center; color: var(--muted); font-weight: 700; }
.swatch.on { box-shadow: 0 0 0 2px var(--ink); }
.swatch-custom input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
.nav a.on { color: var(--ink); }

.mes-a-mes tr.click-mes { cursor: pointer; } .mes-a-mes tr.click-mes:hover td { background: var(--surface-2); } .mes-a-mes tr.on td { background: var(--surface-2); }
.mes-a-mes tfoot td { border-top: 2px solid var(--ink); border-bottom: 0; }
.barra-col { width: 22%; min-width: 80px; }
.mini-barra { display: block; height: 8px; border-radius: 99px; background: var(--ok); opacity: .8; }
.mini-barra.neg { background: var(--bad); }
@media (max-width: 600px) { .barra-col { display: none; } }
.margen-vivo { font-size: .9rem; padding: 10px 12px; border-radius: 12px; background: var(--surface-2); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.margen-vivo:empty { display: none; }
.link-precio { border: 0; background: none; padding: 2px 4px; margin: -2px -4px; border-radius: 6px; font: inherit; font-variant-numeric: tabular-nums; cursor: pointer; color: var(--ink); text-decoration: underline dotted var(--muted); text-underline-offset: 3px; }
.link-precio:hover { background: var(--surface-2); }
.link-precio.falta { color: var(--warn); font-weight: 600; text-decoration: none; }
.tipo-cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.tipo-card { display: flex; flex-direction: column; gap: 4px; padding: 12px; border: 1px solid var(--line); border-radius: 14px; cursor: pointer; transition: border-color .15s, background .15s; }
.tipo-card input { position: absolute; opacity: 0; pointer-events: none; }
.tipo-card b { font-size: .92rem; } .tipo-card small { color: var(--muted); font-size: .76rem; line-height: 1.3; }
.tipo-card:has(input:checked) { border-color: var(--primary); background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--primary); }
.tipo-card:has(input:focus-visible) { outline: 2px solid var(--primary); outline-offset: 2px; }
@media (max-width: 480px) { .tipo-cards { grid-template-columns: minmax(0, 1fr); } .tipo-card { flex-direction: row; align-items: center; flex-wrap: wrap; } .tipo-card small { width: 100%; padding-left: 28px; } }

/* ---------- identidad: logo, letras y movimiento ---------- */
.wordmark { display: inline-flex; align-items: baseline; font: 600 1.32rem/1 var(--f-body); letter-spacing: -.045em; color: var(--ink); }
.wordmark i { font: italic 400 1.5rem/1 var(--f-serif); letter-spacing: -.01em; margin-right: .04em; display: inline-flex; color: var(--marca); }
.wordmark span { display: inline-block; }
.logo-anim .lm-bg { transform-box: fill-box; transform-origin: 50% 60%; animation: lm-pop .7s var(--ease-back) both; }
.logo-anim .lm-hoja { transform-box: fill-box; transform-origin: 50% 100%; animation: lm-hoja .6s .2s var(--ease-out) both; }
.logo-anim .lm-cinta { transform-box: fill-box; transform-origin: 50% 0; animation: lm-cinta .6s .55s var(--ease-back) both; }
.logo-anim .lm-m { animation: lm-escribe .8s .7s cubic-bezier(.65, 0, .35, 1) both; }
.wm-anim span { animation: wm-up .7s calc(.35s + var(--i) * 45ms) var(--ease-out) both; }
@keyframes lm-pop { 0% { transform: scale(.3) rotate(-10deg); opacity: 0; } 60% { opacity: 1; } 100% { transform: none; } }
@keyframes lm-hoja { from { transform: translateY(40%) scale(.85); opacity: 0; } }
@keyframes lm-cinta { from { transform: scaleY(0); } }
@keyframes lm-escribe { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
@keyframes wm-up { from { transform: translateY(70%); opacity: 0; filter: blur(5px); } to { transform: none; opacity: 1; filter: none; } }

.hero h1 { font: 400 clamp(2.6rem, 6.4vw, 4.4rem)/1 var(--f-serif); letter-spacing: -.02em; }
.hero h1 mark { font-style: italic; }
.res-num { font-family: var(--f-body); font-weight: 650; letter-spacing: -.045em; font-size: clamp(2.5rem, 7.5vw, 3.5rem); font-variant-numeric: tabular-nums; font-feature-settings: 'tnum' 1, 'ss01' 1; }
.monto-grande { font-family: var(--f-body); font-weight: 650; font-size: 2.6rem; letter-spacing: -.04em; }
.hola h1 { letter-spacing: -.03em; }
.land-top .brand { padding: 0; }

/* portada: entra por partes */
.hero.entra > div:first-child > * { animation: sube .8s var(--ease-out) both; }
.hero.entra > div:first-child > :nth-child(2) { animation-delay: .08s; }
.hero.entra > div:first-child > :nth-child(3) { animation-delay: .16s; }
.hero.entra > div:first-child > :nth-child(4) { animation-delay: .24s; }
.hero.entra .notebook { animation: sube-gira 1s .2s var(--ease-out) both; }
@keyframes sube { from { opacity: 0; transform: translateY(18px); filter: blur(6px); } to { opacity: 1; transform: none; filter: none; } }
@keyframes sube-gira { from { opacity: 0; transform: translateY(30px) rotate(2.5deg) scale(.97); } to { opacity: 1; transform: rotate(-.6deg); } }

/* cambio de pantalla, ventanas y avisos */
.wrap.entra { animation: entra .35s var(--ease-out) both; }
@keyframes entra { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.scrim { animation: aparece .2s ease both; }
.sheet { animation: sheet-in .38s var(--ease-out) both; }
@keyframes aparece { from { opacity: 0; } }
@keyframes sheet-in { from { opacity: 0; transform: translateY(14px) scale(.97); } }
@media (max-width: 600px) { .sheet { animation-name: sheet-sube; } @keyframes sheet-sube { from { transform: translateY(100%); } } }
.toast { animation: toast-in .4s var(--ease-back) both; }
@keyframes toast-in { from { opacity: 0; transform: translate(-50%, 16px) scale(.9); } }
.btn, .accion, .item-btn, .tipo-card, .ej, .swatch { transition: transform .12s ease, background .15s, border-color .15s, opacity .15s; }
.btn:active, .accion:active, .item-btn:active, .ej:active { transform: scale(.97); }

/* cargando: barra arriba, botón con ruedita y pantalla con logo */
#carga-barra { position: fixed; top: 0; left: 0; right: 0; height: 3px; z-index: 200; overflow: hidden; pointer-events: none; transition: opacity .3s; }
#carga-barra::before { content: ""; position: absolute; top: 0; bottom: 0; width: 40%; border-radius: 0 3px 3px 0; background: var(--primary); animation: barra 1.1s cubic-bezier(.65, 0, .35, 1) infinite; }
#carga-barra.fin { opacity: 0; }
@keyframes barra { from { left: -40%; } to { left: 100%; } }
.btn.cargando { position: relative; color: transparent !important; pointer-events: none; }
.btn.cargando > * { visibility: hidden; }
.btn.cargando::after { content: ""; position: absolute; inset: 0; margin: auto; width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--ink); border-right-color: transparent; animation: gira .7s linear infinite; }
.btn.pri.cargando::after { border-color: var(--primary-ink); border-right-color: transparent; }
@keyframes gira { to { transform: rotate(360deg); } }
.splash { position: fixed; inset: 0; z-index: 150; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; }
#splash-over { animation: aparece .25s ease both; }
.splash .brand { transform: scale(1.7); gap: 8px; }
.splash-txt { color: var(--muted); font-size: .9rem; margin: 18px 0 0; animation: sube .6s .9s var(--ease-out) both; }
.splash-bar { width: 120px; height: 3px; border-radius: 99px; background: var(--surface-2); position: relative; overflow: hidden; margin-top: 14px; animation: aparece .4s 1s both; }
.splash-bar::before { content: ""; position: absolute; top: 0; bottom: 0; width: 40%; border-radius: 99px; background: var(--primary); animation: barra 1.1s cubic-bezier(.65, 0, .35, 1) infinite; }

.version { color: var(--muted); font-size: .75rem; text-align: center; margin: 0; opacity: .7; }
/* recetas leídas de una planilla */
.recetas-imp { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
.receta-imp { border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
.receta-imp table { width: 100%; } .receta-imp td { padding: 3px 0; border: 0; }
/* observaciones del cliente */
.obs { display: flex; flex-direction: column; gap: 8px; padding: 14px; border-radius: 14px; background: var(--surface-2); }
.obs h3 { font-size: .95rem; margin: 0; }
.obs-general { margin: 0; white-space: pre-line; font-size: .92rem; }
.obs-lista { display: flex; flex-direction: column; gap: 8px; border-left: 2px solid var(--line); padding-left: 12px; }
.obs-item p { margin: 2px 0 0; font-size: .92rem; white-space: pre-line; }
.obs-nueva { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; } .obs-nueva .in { background: var(--bg); width: 100%; box-sizing: border-box; }
/* movimientos */
.rangos { margin-top: -6px; }
.fechas-caja { gap: 12px; flex-wrap: wrap; } .fechas-caja label { display: flex; flex-direction: column; gap: 4px; } .fechas-caja .in { min-width: 160px; }
.resumen-caja { display: flex; flex-direction: column; gap: 14px; }
.rc-titulo { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.rc-nums { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.rc-nums > div { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.rc-nums b { font-size: clamp(1.15rem, 3.4vw, 1.7rem); letter-spacing: -.03em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rc-detalle p { margin: 2px 0; line-height: 1.6; }
@media (max-width: 520px) { .rc-nums { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } .rc-nums > div:last-child { grid-column: 1 / -1; } }
.dia-mov + .dia-mov { margin-top: 14px; }
.dia-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; padding: 4px 2px 8px; border-bottom: 1px solid var(--line); margin-bottom: 4px; }
.mov-fila .icon-btn { opacity: .55; } .mov-fila:hover .icon-btn { opacity: 1; }
.num.up { color: var(--ok); }
/* ordenar lo importado */
.ordenar { display: flex; flex-direction: column; gap: 8px; }
.ord-fila { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 12px; align-items: center; padding: 10px 12px; border: 1px solid var(--line); border-radius: 14px; }
.ord-nom { display: flex; flex-direction: column; min-width: 0; } .ord-nom small { color: var(--muted); font-size: .8rem; }
.ord-seg label { padding: 6px 10px; border-radius: 9px; font-size: .82rem; font-weight: 600; cursor: pointer; color: var(--muted); }
.ord-seg label.on { background: var(--bg); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.ord-seg input { position: absolute; opacity: 0; pointer-events: none; }
.ord-stock { grid-column: 1 / -1; }
@media (max-width: 520px) { .ord-fila { grid-template-columns: minmax(0, 1fr); } }
/* elegir un ejemplo */
.ej-lista { display: flex; flex-direction: column; gap: 10px; }
.ej { display: flex; align-items: center; gap: 14px; text-align: left; padding: 14px; border: 1px solid var(--line); border-radius: 16px; background: var(--bg); color: var(--ink); cursor: pointer; font: inherit; animation: sube .5s calc(.08s + var(--i) * 70ms) var(--ease-out) both; }
.ej:hover { border-color: var(--ink); }
.ej .grow { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.ej b { font-size: 1rem; } .ej small { color: var(--muted); font-size: .84rem; line-height: 1.35; }
.ej .mods { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
.ej-ini { width: 44px; height: 44px; border-radius: 13px; display: grid; place-items: center; background: var(--surface-2); font: italic 400 1.35rem var(--f-serif); flex: none; }

::view-transition-old(root), ::view-transition-new(root) { animation-duration: .22s; }
/* números que no se salen de las tarjetas */
.card.kpi { container-type: inline-size; min-width: 0; }
.kpi .val { font-size: clamp(1rem, 12.5cqi, 1.45rem); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: -.03em; }
.kpi .sub, .kpi .lbl { overflow-wrap: anywhere; }
td.n, th.n { white-space: nowrap; }
@media (max-width: 1240px) and (min-width: 821px) { .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

/* fluidez: todo responde al toque */
:root { --ease-suave: cubic-bezier(.22, 1, .36, 1); }
.btn, .accion, .item-btn, .tipo-card, .ej, .swatch, .chip, .row.click, .seg button, .nav a, .tabbar a, .card.click, .link-precio { transition: transform .18s var(--ease-suave), background-color .2s ease, border-color .2s ease, color .2s ease, opacity .2s ease, box-shadow .25s ease; -webkit-tap-highlight-color: transparent; }
.btn:active, .accion:active, .item-btn:active, .ej:active, .chip:active, .tabbar a:active, .seg button:active, .swatch:active { transform: scale(.955); transition-duration: .08s; }
@media (hover: hover) { .accion:hover, .item-btn:hover, .ej:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,.07); } }
.wrap.entra > * { animation: entra .5s var(--ease-suave) both; }
.wrap.entra > :nth-child(2) { animation-delay: .04s; } .wrap.entra > :nth-child(3) { animation-delay: .08s; } .wrap.entra > :nth-child(4) { animation-delay: .12s; } .wrap.entra > :nth-child(n+5) { animation-delay: .16s; }
.wrap.entra { animation: none; }
@keyframes entra { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.sheet { animation: sheet-in .45s var(--ease-suave) both; }
@keyframes sheet-in { from { opacity: 0; transform: translateY(18px) scale(.97); } }
.scrim.cerrando { animation: desaparece .22s ease forwards; pointer-events: none; }
.scrim.cerrando .sheet { animation: sheet-out .22s ease forwards; }
@keyframes desaparece { to { opacity: 0; } }
@keyframes sheet-out { to { opacity: 0; transform: translateY(14px) scale(.98); } }
@media (max-width: 600px) { .scrim.cerrando .sheet { animation-name: sheet-baja; } @keyframes sheet-baja { to { transform: translateY(100%); } } }
.toast.sale { animation: toast-out .25s ease forwards; }
@keyframes toast-out { to { opacity: 0; transform: translate(-50%, 10px) scale(.96); } }
.wrap.entra .bar-fina i, .wrap.entra .mini-barra { transform-origin: left; animation: crece .9s .15s var(--ease-suave) both; }
@keyframes crece { from { transform: scaleX(0); } }
.res-num { display: inline-block; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation-duration: .01ms !important; animation-delay: 0s !important; animation-iteration-count: 1 !important; } }

/* ---------- v20: portada "Anota. MiDerno suma." ---------- */

  background: radial-gradient(1100px 560px at 82% 38%, #14919C 0%, #0B6870 58%, #095961 100%); padding: 22px clamp(16px, 5vw, 56px) 22px; overflow-x: hidden; }

.por-nav { display: flex; align-items: center; gap: 4px; }

.portada .btn.sol { background: var(--sol); border-color: var(--sol); color: #10282A; font-weight: 600; }

.pp-mov.m1 { animation: sube .5s 1s both; } .pp-mov.m2 { animation: sube .5s 1.15s both; } .pp-mov.m3 { animation: sube .5s 1.3s both; }

/* =========================================================
   v22 · la hoja del día, anotar, hoja de cobrar, agenda corta y movimiento
   ========================================================= */
:root { --papel: #FFFDF8; --renglon: #E3ECEA; --sol: #FFB547; --lapiz: #B5473A; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --papel: #141516; --renglon: #24302F; --lapiz: #EE7D6A; } }
:root[data-theme="dark"] { --papel: #141516; --renglon: #24302F; --lapiz: #EE7D6A; }

/* Inicio */
.inicio { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, .9fr); gap: 28px; align-items: start; }
.ini-col { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
@media (max-width: 980px) { .inicio { grid-template-columns: minmax(0, 1fr); gap: 18px; } }
.ini-dia h1 { font: 400 clamp(2.3rem, 6vw, 3rem)/1 var(--f-serif); letter-spacing: -.01em; margin: 0; }
.ini-dia p { margin: 4px 0 0; font-size: .92rem; }
.hoja-dia { position: relative; background: var(--surface); border-radius: 18px; padding: 6px 16px 10px 46px; box-shadow: 0 1px 0 var(--renglon), 0 10px 30px rgba(14,124,134,.07); border: 1px solid var(--renglon);
  background-image: repeating-linear-gradient(transparent 0 43px, var(--renglon) 43px 44px); background-position: 0 6px; }
.hoja-dia::before { content: ""; position: absolute; left: 32px; top: 0; bottom: 0; width: 1px; background: color-mix(in srgb, var(--lapiz) 35%, transparent); }
.hd-ln { display: flex; align-items: center; justify-content: space-between; gap: 12px; height: 44px; color: var(--ink); text-decoration: none; }
.hd-t { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 1rem; }
.hd-t small { color: var(--muted); font-size: .85rem; }
.hd-ln b { font-variant-numeric: tabular-nums; font-weight: 600; }
.hd-ln.out b { color: var(--lapiz); }
.hd-ln.recien { animation: hd-escribe .7s var(--ease-out, ease) both; }
.hd-ln.recien b { animation: hd-resalta 1.6s ease; border-radius: 4px; }
@keyframes hd-escribe { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
@keyframes hd-resalta { 0%, 35% { background: color-mix(in srgb, var(--sol) 70%, transparent); } 100% { background: transparent; } }
.hd-prox { color: var(--muted); font-size: .92rem; }
.hd-prox .hd-t { color: var(--muted); }
.hd-prox .i { width: 16px; height: 16px; flex: none; }
.hd-vacia { min-height: 88px; display: flex; align-items: center; color: var(--muted); font-size: .95rem; }
.hd-mas { display: block; height: 44px; line-height: 44px; font-size: .85rem; color: var(--muted); }
.hd-total { display: flex; justify-content: space-between; align-items: baseline; border-top: 2px solid var(--ink); margin-top: 2px; padding-top: 8px; color: var(--muted); }
.hd-total b { font-size: clamp(1.8rem, 6vw, 2.2rem); color: var(--ink); letter-spacing: -.035em; font-weight: 650; padding: 0 2px;
  background: linear-gradient(transparent 58%, var(--sol) 58%, var(--sol) 90%, transparent 90%) no-repeat 0 0 / 100% 100%; }
.hd-total b.down { color: var(--lapiz); background-image: none; }
.entra .hd-total b { animation: hd-subraya .7s .55s var(--ease-out, ease) both; }
@keyframes hd-subraya { from { background-size: 0 100%; } }
/* anotar escribiendo */
.anota { position: sticky; bottom: 14px; z-index: 5; display: flex; flex-direction: column; gap: 6px; }
@media (max-width: 860px) { .anota { bottom: calc(78px + env(safe-area-inset-bottom, 0px)); } }
.anota-fila { display: flex; gap: 6px; background: var(--ink); border-radius: 16px; padding: 6px; box-shadow: 0 12px 30px rgba(16,40,42,.22); }
.anota-in { flex: 1; min-width: 0; border: 0; background: transparent; color: var(--bg); font: 500 .98rem var(--f-body); padding: 8px 10px; outline: none; }
.anota-in::placeholder { color: color-mix(in srgb, var(--bg) 60%, transparent); }
.anota-btn { border: 0; border-radius: 11px; background: var(--sol); color: #10282A; font: 600 .92rem var(--f-body); padding: 0 16px; cursor: pointer; }
.anota-fila:focus-within { box-shadow: 0 0 0 3px color-mix(in srgb, var(--sol) 55%, transparent), 0 12px 30px rgba(16,40,42,.22); }
.anota-prev { font-size: .88rem; background: var(--surface); border: 1px solid var(--renglon); border-radius: 12px; padding: 0 12px; max-height: 0; opacity: 0; overflow: hidden; transition: max-height .25s var(--ease-out, ease), opacity .2s, padding .25s; }
.anota-prev.on { max-height: 80px; opacity: 1; padding: 8px 12px; }
.an-tipo { font-size: .75rem; font-weight: 600; border-radius: 6px; padding: 1px 6px; margin-right: 4px; }
.an-tipo.in { background: var(--ok-soft); color: var(--ok); } .an-tipo.out { background: var(--bad-soft); color: var(--lapiz); }
/* mes en tres datos */
.ini-mes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.ini-mes a { display: flex; flex-direction: column; gap: 1px; padding: 12px; border-radius: 14px; background: var(--surface); border: 1px solid var(--renglon); color: var(--ink); text-decoration: none; min-width: 0; }
.ini-mes small { color: var(--muted); font-size: .78rem; }
.ini-mes b { font-size: 1.15rem; letter-spacing: -.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ini-mes b.down { color: var(--lapiz); }
.ini-mes span { font-size: .74rem; color: var(--muted); line-height: 1.25; }
.ini-mes .bar-fina { margin-top: 6px; }
.ini-todo { display: inline-flex; align-items: center; gap: 4px; font-size: .9rem; align-self: flex-start; }
.ini-todo .i { width: 16px; height: 16px; }

/* hoja de cobrar */
.cobro { display: flex; flex-direction: column; gap: 14px; }
.cobro-lineas { display: flex; flex-direction: column; gap: 8px; }
.cobro-ln { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; padding: 10px 12px; border-radius: 14px; background: var(--surface-2); }
.cobro-ln small { display: block; color: var(--muted); }
.cobro-chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.cobro-chips.w100 { width: 100%; }
.cobro-chips .lbl { font-size: .78rem; color: var(--muted); margin-right: 2px; }
.cobro-sel { width: auto; min-height: 34px; padding: 4px 8px; font-size: .88rem; max-width: 150px; }
.cobro-fecha { display: flex; align-items: center; gap: 8px; }
.cobro-fecha .in { width: auto; min-height: 32px; padding: 3px 8px; }
.cobro-pie { justify-content: space-between; }
.cobro-pie .btn.pri { flex: 1; max-width: 260px; font-size: 1rem; }
.cobro-barra { display: none; }
@media (max-width: 860px) {
  .cobro-barra { display: flex; position: fixed; left: 12px; right: 12px; bottom: calc(76px + env(safe-area-inset-bottom, 0px)); z-index: 15; justify-content: space-between; align-items: center; gap: 10px; border: 0; border-radius: 16px; padding: 13px 16px; background: var(--primary); color: var(--primary-ink, #fff); font: 500 .95rem var(--f-body); box-shadow: 0 12px 30px rgba(14,124,134,.3); animation: sube .3s var(--ease-out, ease); cursor: pointer; }
  .cobro-barra span { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; opacity: .9; }
}
.vuela { position: fixed; z-index: 200; font-weight: 700; color: var(--ok); pointer-events: none; background: var(--surface); border-radius: 8px; padding: 2px 8px; box-shadow: var(--shadow); transition: transform .7s cubic-bezier(.5, 0, .3, 1), opacity .7s; }
#ag-cobrado.late { animation: late .5s var(--ease-out, ease); display: inline-block; }
@keyframes late { 40% { transform: scale(1.18); color: var(--ok); } }

/* agenda corta */
.ag-pend-box { border: 1px solid color-mix(in srgb, var(--sol) 70%, transparent); background: color-mix(in srgb, var(--sol) 12%, var(--surface)); border-radius: 14px; overflow: hidden; }
.ag-pend { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 10px; border: 0; background: none; padding: 11px 14px; font: 500 .95rem var(--f-body); color: var(--ink); cursor: pointer; text-align: left; }
.ag-pend-ver { background: var(--sol); color: #10282A; border-radius: 8px; padding: 2px 9px; font-size: .82rem; font-weight: 600; }
.ag-pend-box .list { padding: 0 14px 6px; animation: sube .3s var(--ease-out, ease); }
.ag-cuentas { display: flex; gap: 6px; flex-wrap: wrap; }
.ag-lista { display: flex; flex-direction: column; }
.ag-fila { display: grid; grid-template-columns: 50px minmax(0, 1fr) auto; gap: 10px; align-items: center; min-height: 58px; padding: 6px 4px 6px 10px; border-bottom: 1px solid var(--line); cursor: pointer; position: relative; border-radius: 10px; }
.ag-fila::before { content: ""; position: absolute; left: 0; top: 12px; bottom: 12px; width: 3px; border-radius: 3px; background: var(--primary); }
.ag-fila.k-entrega::before { background: var(--sol); } .ag-fila.k-tarea::before { background: var(--muted); }
.ag-fila.req::before { background: repeating-linear-gradient(var(--sol) 0 4px, transparent 4px 7px); }
.ag-fila:hover { background: var(--surface-2); }
.ag-fila:focus-visible { outline: 2px solid var(--primary); outline-offset: 1px; }
.ag-h { font-weight: 600; font-size: .95rem; }
.ag-q { min-width: 0; display: flex; flex-direction: column; }
.ag-q b { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ag-q small { color: var(--muted); font-size: .82rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ag-a .btn { min-width: 84px; justify-content: center; }
.btn.sol { background: var(--sol); border-color: var(--sol); color: #10282A; }
.ag-hecho { display: inline-block; font-size: .82rem; font-weight: 600; color: var(--ok); background: var(--ok-soft); border-radius: 9px; padding: 6px 10px; min-width: 84px; text-align: center; }
.ag-hecho.pop { animation: pop .35s var(--ease-out, ease); }
@keyframes pop { from { transform: scale(.7); opacity: 0; } }
.ag-fila.apagada .ag-h, .ag-fila.apagada .ag-q { opacity: .55; }
.ag-fila.recien { animation: aterriza .6s var(--ease-out, ease) both; background: color-mix(in srgb, var(--sol) 14%, transparent); }
@keyframes aterriza { from { transform: translateY(-28px) scale(.96); opacity: 0; } }
.ag-fila.pagada-ahora .ag-hecho { animation: pop .4s .55s var(--ease-out, ease) both; }
.ag-ahora { position: relative; height: 0; border-top: 2px solid var(--lapiz); margin: 3px 0 3px 4px; }
.ag-ahora::before { content: ""; position: absolute; left: -5px; top: -6px; width: 10px; height: 10px; border-radius: 50%; background: var(--lapiz); }
.ag-ahora span { position: absolute; right: 0; top: -10px; font-size: .7rem; font-weight: 600; color: var(--lapiz); background: var(--surface); padding: 0 4px; }
.ag-dia-card.entra-der { animation: desliza-der .32s var(--ease-out, ease); } .ag-dia-card.entra-izq { animation: desliza-izq .32s var(--ease-out, ease); }
@keyframes desliza-der { from { transform: translateX(40px); opacity: 0; } } @keyframes desliza-izq { from { transform: translateX(-40px); opacity: 0; } }
.ag-det-acc .hstack, .ag-det-acc { display: flex; flex-wrap: wrap; gap: 8px; }
@media (max-width: 860px) { .ag-fila { grid-template-columns: 44px minmax(0, 1fr) auto; } .ag-a .btn, .ag-hecho { min-width: 76px; } }

/* portada viva y entrar */
.pp-feed { display: flex; flex-direction: column; }
.pp-mov.nueva { animation: pp-nueva .55s var(--ease-out, ease); }
.pp-mov.nueva b { animation: hd-resalta 1.4s ease; border-radius: 4px; padding: 0 2px; }
@keyframes pp-nueva { from { opacity: 0; transform: translateY(-12px); } }
.campo-err { animation: vaiven .38s; }
.campo-err .in, input.campo-err { border-color: var(--bad) !important; }
@keyframes vaiven { 20% { transform: translateX(-7px); } 45% { transform: translateX(6px); } 70% { transform: translateX(-3px); } }
.err-msg { display: block; color: var(--bad); font-size: .85rem; margin-top: 4px; }

/* reservas */
.pub-horas.aparecen .pub-hora { animation: sube .35s calc(var(--i) * 35ms) var(--ease-out, ease) both; }
.pub-opt.on { border-color: var(--primary); background: color-mix(in srgb, var(--primary) 7%, var(--surface)); box-shadow: inset 0 0 0 1px var(--primary); }
.pub-opt { transition: border-color .2s, background .2s, box-shadow .2s; }
.pub-ok .stamp-ok { animation: timbre .5s cubic-bezier(.3, 1.5, .5, 1) .1s both; display: inline-block; align-self: flex-start; }
@keyframes timbre { from { transform: rotate(-2deg) scale(2.2); opacity: 0; } 60% { opacity: 1; } }

@media (prefers-reduced-motion: reduce) {
  .hd-ln.recien, .hd-ln.recien b, .entra .hd-total b, .ag-fila.recien, .ag-fila.pagada-ahora .ag-hecho, .ag-hecho.pop, .ag-dia-card.entra-der, .ag-dia-card.entra-izq, .pp-mov.nueva, .pp-mov.nueva b, .campo-err, .pub-horas.aparecen .pub-hora, .pub-ok .stamp-ok, .cobro-barra, #ag-cobrado.late, .anota-prev { animation: none !important; transition: none !important; }
}
@media (max-width: 860px) {
  .ag-ctrl { padding: 10px 12px; gap: 8px; }
  .ag-ctrl > .between { flex-wrap: nowrap; gap: 8px; }
  .ag-ctrl .ag-fecha-in { display: none; }
  .ag-ctrl .seg button { padding-inline: 10px; }
}

/* v23 · buscar clienta, precio editable, hora en lista, formularios más livianos */
.busca-cli { position: relative; flex: 1; min-width: 0; }
.busca-cli .bc-in { width: 100%; }
.busca-cli.con .bc-in { padding-right: 40px; font-weight: 600; background: color-mix(in srgb, var(--primary) 6%, var(--surface)); border-color: color-mix(in srgb, var(--primary) 40%, var(--line)); }
.bc-x { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); width: 34px; height: 34px; border: 0; background: none; color: var(--muted); border-radius: 9px; cursor: pointer; display: grid; place-items: center; }
.bc-x .i { width: 16px; height: 16px; }
.bc-lista { position: absolute; left: 0; right: 0; top: calc(100% + 4px); z-index: 30; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 16px 40px rgba(16,40,42,.16); padding: 4px; max-height: 280px; overflow: auto; animation: sube .18s var(--ease-out, ease); }
.bc-op { display: flex; justify-content: space-between; align-items: center; gap: 10px; width: 100%; border: 0; background: none; padding: 10px 12px; border-radius: 10px; font: inherit; color: var(--ink); text-align: left; cursor: pointer; }
.bc-op small { color: var(--muted); }
.bc-op.act, .bc-op:hover { background: var(--surface-2); }
.bc-nueva { justify-content: flex-start; color: var(--primary); font-weight: 600; }
.bc-nueva .i { width: 16px; height: 16px; }
.precio-wrap { display: inline-flex; align-items: center; gap: 2px; border-bottom: 1px dashed color-mix(in srgb, var(--muted) 60%, transparent); }
.precio-ln { border: 0 !important; background: transparent !important; padding: 2px 0 !important; min-height: 0 !important; width: 8ch; font: inherit; color: inherit; box-shadow: none !important; }
.precio-ln:focus { outline: none; }
.precio-wrap:focus-within { border-bottom: 2px solid var(--primary); }
.cobro-precio { display: inline-flex; align-items: center; gap: 4px; color: var(--muted); font-size: .92rem; }
.cart-precio { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
.sel-hora { font-variant-numeric: tabular-nums; }
.mas-datos { border-top: 1px solid var(--line); padding-top: 10px; }
.mas-datos summary { cursor: pointer; color: var(--muted); font-size: .9rem; font-weight: 500; list-style: none; display: flex; align-items: center; gap: 6px; }

/* ---------- adaptadores de datos ---------- */
const LocalAdapter = {
  modo: 'local',
  _pend: false,
  // agrupa varias escrituras seguidas (una venta crea varias filas) en un solo guardado
  persistir() {
    if (this._pend || !S.negocio || S.negocio.id.startsWith('demo-')) return; // los ejemplos nunca se guardan
    this._pend = true;
    const id = S.negocio.id;
    queueMicrotask(() => { this._pend = false; if (S.negocio?.id === id) LS.set('miderno:data:' + id, { negocio: S.negocio, modulos: S.modulos, t: S.t, ...(id.startsWith('demo-') ? { version: DEMO_VERSION } : {}) }); });
  },
  insert() { this.persistir(); },
  insertMany() { this.persistir(); },
  update() { this.persistir(); },
  remove() { this.persistir(); },
  updateMany() { this.persistir(); },
  removeMany() { this.persistir(); },
  guardarNegocio() { this.persistir(); if (S.negocio.id.startsWith('demo-')) return; const idx = (LS.get('miderno:negocios') || []).map((n) => n.id === S.negocio.id ? { ...n, nombre: S.negocio.nombre, rubro: S.negocio.rubro } : n); LS.set('miderno:negocios', idx); },
  guardarModulo() { this.persistir(); },
};

const NubeAdapter = {
  modo: 'nube',
  sb: null,
  // las escrituras van en fila, en orden, para que una venta exista antes que sus ítems
  cola: Promise.resolve(),
  // mientras se confirma la sesión (apertura instantánea desde la copia guardada) las escrituras esperan aquí
  listo: Promise.resolve(),
  tocados: {},
  marcar(t, ids, borrado = false) { const m = (this.tocados[t] ||= new Map()); for (const id of [].concat(ids)) if (id) m.set(id, borrado ? 'del' : 'ok'); this.cachear(); },
  cachear() { clearTimeout(this._tc); this._tc = setTimeout(() => guardarCacheNube(), 1200); },
  enviar(fn) {
    this.cola = this.cola.then(() => this.listo).then(fn).then(({ error } = {}) => {
      if (error) { console.error(error); const dup = /duplicate|unique/i.test(error.message || '') && /slug/i.test(error.message || ''); toast(dup ? 'Esa dirección de página ya la usa otro negocio. Elige otra en Ajustes.' : 'No se pudo guardar en la nube: ' + (error.message || error), true); }
    }).catch((e) => toast('Sin conexión: el último cambio no se guardó (' + (e.message || e) + ')', true));
  },
  insert(t, row) { const nid = S.negocio.id; this.marcar(t, row.id); this.enviar(() => this.sb.from(t).insert({ ...row, negocio_id: nid })); },
  insertMany(t, rows) { const nid = S.negocio.id; this.marcar(t, rows.map((r) => r.id)); for (let i = 0; i < rows.length; i += 500) { const parte = rows.slice(i, i + 500).map((r) => ({ ...r, negocio_id: nid })); this.enviar(() => this.sb.from(t).insert(parte)); } },
  update(t, id, patch) { this.marcar(t, id); this.enviar(() => this.sb.from(t).update(patch).eq('id', id)); },
  remove(t, id) { this.marcar(t, id, true); this.enviar(() => this.sb.from(t).delete().eq('id', id)); },
  // cambios en bloque: 200 filas por envío en vez de una por una
  updateMany(t, ids, patch) { this.marcar(t, ids); for (let i = 0; i < ids.length; i += 200) { const parte = ids.slice(i, i + 200); this.enviar(() => this.sb.from(t).update(patch).in('id', parte)); } },
  removeMany(t, ids) { this.marcar(t, ids, true); for (let i = 0; i < ids.length; i += 200) { const parte = ids.slice(i, i + 200); this.enviar(() => this.sb.from(t).delete().in('id', parte)); } },
  guardarNegocio(patch) { const nid = S.negocio.id; this._negLocal = { ...(this._negLocal || {}), ...patch }; this.cachear(); this.enviar(() => this.sb.from('negocios').update(patch).eq('id', nid)); },
  guardarModulo(modulo, activo) { const nid = S.negocio.id; this.enviar(() => this.sb.from('negocio_modulos').upsert({ negocio_id: nid, modulo, activo })); },
  async traerTodo(t) {
    const filas = []; const paso = 1000;
    for (let desde = 0; ; desde += paso) {
      const { data, error } = await this.sb.from(t).select('*').order('id').range(desde, desde + paso - 1);
      // si falta una tabla nueva (no se corrió la actualización), la app sigue funcionando sin ella
      if (error && (error.code === '42P01' || error.code === 'PGRST205' || /does not exist|could not find the table/i.test(error.message || ''))) { console.warn('Falta la tabla', t); this.faltan = [...new Set([...(this.faltan || []), t])]; return []; }
      if (error) throw error;
      filas.push(...data.map(({ negocio_id, ...r }) => r));
      if (data.length < paso) break;
    }
    return filas;
  },
};

let adapter = LocalAdapter;

/* ---------- copia local de la nube (IndexedDB) para abrir al instante ---------- */
const CacheNube = {
  _db: null,
  abrir() { return (this._db ||= new Promise((ok, fail) => { const r = indexedDB.open('miderno', 1); r.onupgradeneeded = () => r.result.createObjectStore('nube'); r.onsuccess = () => ok(r.result); r.onerror = () => fail(r.error); })); },
  async get(k) { try { const d = await this.abrir(); return await new Promise((ok) => { const q = d.transaction('nube').objectStore('nube').get(k); q.onsuccess = () => ok(q.result || null); q.onerror = () => ok(null); }); } catch { return null; } },
  async set(k, v) { try { const d = await this.abrir(); d.transaction('nube', 'readwrite').objectStore('nube').put(v, k); } catch {} },
  async borrar() { try { const d = await this.abrir(); d.transaction('nube', 'readwrite').objectStore('nube').clear(); } catch {} },
};
function guardarCacheNube() {
  const uid = S.usuarioId; if (S.modo !== 'nube' || !uid || !S.negocio) return;
  CacheNube.set('u:' + uid, { negocio: S.negocio, modulos: S.modulos, t: S.t, nombre: S.usuarioNombre || '', at: Date.now() });
}

const db = {
  all: (t) => S.t[t] || (S.t[t] = []),
  get: (t, id) => db.all(t).find((r) => r.id === id),
  insert(t, row) { row.id = row.id || uid(); db.all(t).push(row); adapter.insert(t, row); return row; },
  insertMany(t, rows) { rows.forEach((r) => { r.id = r.id || uid(); db.all(t).push(r); }); adapter.insertMany(t, rows); },
  update(t, id, patch) { const r = db.get(t, id); if (r) Object.assign(r, patch); adapter.update(t, id, patch); return r; },
  remove(t, id) { S.t[t] = db.all(t).filter((r) => r.id !== id); adapter.remove(t, id); },
  removeWhere(t, fn) { db.all(t).filter(fn).forEach((r) => db.remove(t, r.id)); },
  updateMany(t, ids, patch) { if (!ids.length) return; const set = new Set(ids); db.all(t).forEach((r) => { if (set.has(r.id)) Object.assign(r, patch); }); adapter.updateMany(t, ids, patch); },
  removeMany(t, ids) { if (!ids.length) return; const set = new Set(ids); S.t[t] = db.all(t).filter((r) => !set.has(r.id)); adapter.removeMany(t, ids); },
  negocio(patch) { Object.assign(S.negocio, patch); _fmt = null; adapter.guardarNegocio(patch); },
  modulo(m, activo) {
    S.modulos = activo ? [...new Set([...S.modulos, m])] : S.modulos.filter((x) => x !== m);
    adapter.guardarModulo(m, activo);
  },
};

/* ---------- cálculos de negocio ---------- */
function stockDe(tipo, id) { return sum(db.all('movimientos_stock').filter((m) => m.tipo_item === tipo && m.item_id === id), (m) => Number(m.cantidad)); }
function costoReceta(productoId) {
  return sum(db.all('formulas').filter((f) => f.producto_id === productoId), (f) => Number(f.cantidad) * Number(db.get('insumos', f.insumo_id)?.costo_unitario || 0));
}
function costoProducto(p) { return tiene('produccion') && db.all('formulas').some((f) => f.producto_id === p.id) ? costoReceta(p.id) : Number(p.costo || 0); }
function ventasDelMes(ym) { return db.all('ventas').filter((v) => mesDe(v.fecha) === ym); }
function gastosDelMes(ym) { return db.all('gastos').filter((g) => mesDe(g.fecha) === ym); }
function itemsDeVenta(ventaId) { return db.all('venta_items').filter((i) => i.venta_id === ventaId); }
function metaDelMes(ym) { return db.all('metas').find((m) => m.periodo === ym); }
function resumenClientes() {
  const map = new Map(db.all('clientes').map((c) => [c.id, { c, total: 0, visitas: 0, ultima: null }]));
  for (const v of db.all('ventas')) {
    const r = map.get(v.cliente_id); if (!r) continue;
    r.total += Number(v.total); r.visitas += 1;
    if (!r.ultima || v.fecha > r.ultima) r.ultima = v.fecha;
  }
  return [...map.values()].map((r) => ({ ...r, dias: r.ultima ? diasEntre(r.ultima, hoy()) : null }));
}
function eliminarVenta(id) {
  db.removeWhere('venta_items', (i) => i.venta_id === id);
  db.removeWhere('movimientos_stock', (m) => m.ref_id === id && m.motivo === 'venta');
  db.removeWhere('comisiones', (c) => c.venta_id === id);
  db.all('citas').filter((c) => c.venta_id === id).forEach((c) => db.update('citas', c.id, { venta_id: null, estado: 'confirmada' }));
  db.remove('ventas', id);
}

function rng(seed) {
  let a = seed >>> 0;
  const r = () => { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  r.int = (min, max) => Math.floor(r() * (max - min + 1)) + min;
  r.pick = (arr) => arr[Math.floor(r() * arr.length)];
  r.wpick = (pairs) => { const tot = sum(pairs, (p) => p[1]); let x = r() * tot; for (const [v, w] of pairs) { if ((x -= w) <= 0) return v; } return pairs[0][0]; };
  return r;
}

/* ---------- indicadores de carga ---------- */
let _cargas = 0;
function cargando(on) {
  _cargas = Math.max(0, _cargas + (on ? 1 : -1));
  let b = document.getElementById('carga-barra');
  if (_cargas && !b) { b = document.createElement('div'); b.id = 'carga-barra'; b.setAttribute('role', 'progressbar'); b.setAttribute('aria-label', 'Cargando'); document.body.appendChild(b); }
  if (!_cargas && b) { b.classList.add('fin'); setTimeout(() => { if (!_cargas) b.remove(); }, 350); }
  else if (b) b.classList.remove('fin');
}
// envuelve una promesa con la barra de carga
async function conCarga(p) { cargando(true); try { return await p; } finally { cargando(false); } }

function partirTel(v) {
  const s = String(v || '').trim(); if (!s) return ['+56', ''];
  const d = '+' + s.replace(/\D/g, '');
  if (s.startsWith('+')) { const p = [...PREFIJOS].sort((a, b) => b[0].length - a[0].length).find(([c]) => d.startsWith(c)); if (p) return [p[0], d.slice(p[0].length)]; }

function selHora(name, val = '', { id = 'f-' + name, desde = '06:00', hasta = '23:50', paso = 10, vacio = '', attrs = '' } = {}) {
  const aM = (h) => { const [a, b] = String(h).split(':').map(Number); return a * 60 + (b || 0); };
  const v = String(val || '').slice(0, 5); const ops = [];
  for (let m = aM(desde); m <= aM(hasta); m += paso) ops.push(`${String(Math.floor(m / 60)).padStart(2, '0')}:${String(m % 60).padStart(2, '0')}`);
  if (v && !ops.includes(v)) { ops.push(v); ops.sort(); }
  return `<select class="in sel-hora" name="${name}" id="${id}" ${attrs}>${vacio ? `<option value="">${vacio}</option>` : ''}${ops.map((h) => `<option value="${h}" ${h === v ? 'selected' : ''}>${h}</option>`).join('')}</select>`;
}

function entenderNegocio(texto) {
  const t = norm(texto); if (!t) return { mods: [], nombres: [], servicios: [], productos: [] };
  const hits = PERFILES.filter((p) => p.re.test(t));
  const mods = [...new Set(hits.flatMap((h) => h.mods))];
  const servicios = hits.flatMap((h) => h.servicios || []).slice(0, 6);
  const productos = hits.flatMap((h) => h.productos || []).slice(0, 4);
  // si el texto menciona esmaltes, cremas, etc. junto a "vende", sugerimos ese producto
  const m = t.match(/vend[eo]\w* (?:tambien )?([a-z ]{3,30})/);
  if (m && mods.includes('inventario') && !productos.length) { const cosa = m[1].trim().split(' ').slice(0, 3).join(' '); if (cosa) productos.push([cosa.charAt(0).toUpperCase() + cosa.slice(1), 0]); }
  return { mods, nombres: hits.map((h) => h.nombre).filter(Boolean), servicios, productos };
}

async function registrarNube(d) {
  try {
    if (!d.email || (d.password || '').length < 6) return toast('Escribe tu correo y una contraseña de al menos 6 caracteres', true);
    const sb = await cargarSupabase();
    const pendiente = { nombre: d.nombre, rubro: d.rubro, modulos: d.modulos, sugeridos: d.sugeridos, telefono: d.telefono, nacimiento: d.nacimiento };
    LS.set('miderno:pendiente', pendiente);
    const { data, error } = await sb.auth.signUp({ email: d.email, password: d.password, options: { emailRedirectTo: appUrl() || undefined, data: { negocio: pendiente } } });
    if (error) throw error;
    let session = data.session;
    if (!session) { const r = await sb.auth.signInWithPassword({ email: d.email, password: d.password }); session = r.data?.session; }
    if (session) return crearNegocioNube(pendiente);
    // Supabase pide confirmar el correo: el negocio queda guardado y se crea al volver
    abrirSheet('Revisa tu correo', `<p>Te enviamos un enlace a <b>${esc(d.email)}</b>. Al tocarlo vuelves a MiDerno y tu negocio <b>${esc(d.nombre)}</b> queda creado.</p><p class="small muted">Si no llega en unos minutos, revisa la carpeta de spam.</p>`, { pie: '<div class="sheet-foot"><button type="button" class="btn pri" data-close>Entendido</button></div>' });
  } catch (e) {
    const msg = /already registered|already exists/i.test(e.message || '') ? 'Ese correo ya tiene cuenta. Usa “Iniciar sesión”.' : 'No pudimos crear la cuenta: ' + (e.message || e);
    toast(msg, true);
  }
}

const pct = (a, b) => (b ? Math.round(((a - b) / b) * 100) : null);

function graficoMeses() {
  const meses = Array.from({ length: 6 }, (_, i) => addMonths(mesActual(), i - 5));
  const datos = meses.map((m) => ({ m, v: sum(ventasDelMes(m), (x) => Number(x.total)), g: sum(gastosDelMes(m), (x) => Number(x.monto)) }));
  const max = Math.max(1, ...datos.flatMap((d) => [d.v, d.g]));
  const paso = (() => { const raw = max / 4; const p = 10 ** Math.floor(Math.log10(raw)); return [1, 2, 2.5, 5, 10].map((k) => k * p).find((k) => k >= raw); })();
  const top = paso * Math.ceil(max / paso);
  const W = 640, Hh = 230, L = 58, B = 26, T = 10, R = 8; const ih = Hh - B - T; const cw = (W - L - R) / 6; const bw = Math.min(26, cw / 3.2);
  const y = (v) => T + ih - (v / top) * ih;
  const corto = (v) => (v >= 1e6 ? (v / 1e6).toLocaleString('es-CL', { maximumFractionDigits: 1 }) + ' M' : v >= 1e3 ? Math.round(v / 1e3) + ' mil' : String(v));
  let s = `<svg viewBox="0 0 ${W} ${Hh}" role="img" aria-label="Gráfico de ventas y egresos por mes">`;
  for (let v = 0; v <= top; v += paso) s += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end">$${corto(v)}</text>`;
  datos.forEach((d, i) => {
    const cx = L + cw * i + cw / 2; const actual = i === 5;
    s += `<rect x="${cx - bw - 2}" y="${y(d.v)}" width="${bw}" height="${Math.max(0, T + ih - y(d.v))}" rx="4" fill="var(--accent)" opacity="${actual ? 1 : .78}"><title>Ventas ${nombreMes(d.m)}: ${money(d.v)}</title></rect>`;
    s += `<rect x="${cx + 2}" y="${y(d.g)}" width="${bw}" height="${Math.max(0, T + ih - y(d.g))}" rx="4" fill="var(--gold)" opacity="${actual ? 1 : .78}"><title>Egresos ${nombreMes(d.m)}: ${money(d.g)}</title></rect>`;
    s += `<text x="${cx}" y="${Hh - 8}" text-anchor="middle" style="${actual ? 'font-weight:700;fill:var(--ink)' : ''}">${nombreMes(d.m, true).replace('.', '')}</text>`;
  });
  return s + '</svg>';
}

function cobrar() {

  const v = db.insert('ventas', { fecha: c.fecha || hoy(), cliente_id: c.cliente_id || null, total: sum(c.lineas, (l) => l.cantidad * l.precio_unitario), metodo_pago: c.metodo, canal: c.canal, nota: '' });
  for (const l of c.lineas) {
    const it = db.insert('venta_items', { venta_id: v.id, tipo_item: l.tipo_item, item_id: l.item_id || null, nombre: l.nombre, cantidad: l.cantidad, precio_unitario: l.precio_unitario, empleado_id: l.empleado_id || null });

  }
  if (c.cita_id) db.update('citas', c.cita_id, { estado: 'completada', venta_id: v.id });
  if (c.evento_id) db.update('eventos', c.evento_id, { pagado: true, venta_id: v.id });
  if (c.entrega) db.insert('eventos', { tipo: 'entrega', titulo: c.lineas.map((l) => (l.cantidad > 1 ? qtyFmt(l.cantidad) + '× ' : '') + l.nombre).join(', '), cliente_id: c.cliente_id || null, fecha: c.entrega.fecha || hoy(), hora: c.entrega.hora || null, direccion: (c.entrega.direccion || '').trim(), monto: v.total, pagado: true, estado: 'pendiente', venta_id: v.id, nota: '' });

  volver ? ir(volver) : render();
  if (autoOn('resena') && v.cliente_id) setTimeout(() => pedirResena(db.get('clientes', v.cliente_id)), 150);
}

const RANGOS = [['hoy', 'Hoy'], ['ayer', 'Ayer'], ['semana', 'Esta semana'], ['7d', '7 días'], ['15d', '15 días'], ['mes', 'Este mes'], ['mesant', 'Mes anterior'], ['mesSel', 'Por mes'], ['fechas', 'Elegir fechas']];
function rangoCaja(ui) {

  switch (ui.rango) {

    case 'semana': return [addDays(H, -dow), H, 'Esta semana'];
    case '7d': return [addDays(H, -6), H, 'Últimos 7 días'];
    case '15d': return [addDays(H, -14), H, 'Últimos 15 días'];
    case 'mes': return [mesActual() + '-01', finMes(mesActual()), nombreMes(mesActual())];
    case 'mesant': { const m = addMonths(mesActual(), -1); return [m + '-01', finMes(m), nombreMes(m)]; }

}

// Próxima hora agendada del cliente (dentro de los próximos 30 días): si la tiene, no hace falta reactivarlo
const CITA_VIVA = ['solicitada', 'agendada', 'confirmada'];
function proximaCita(clienteId) {
  const H = hoy(), lim = addDays(H, 30);
  return db.all('citas').filter((c) => c.cliente_id === clienteId && CITA_VIVA.includes(c.estado) && c.fecha >= H && c.fecha <= lim).sort((a, b) => (a.fecha + a.hora).localeCompare(b.fecha + b.hora))[0] || null;
}
const inactivo = (r) => r.dias != null && r.dias > DIAS_REACTIVAR;
const porReactivar = (r) => inactivo(r) && !proximaCita(r.c.id);
function vistaClientes() {
  const ui = S.ui.clientes; const mes = hoy().slice(5, 7);

  const nCumple = rs.filter((r) => r.c.cumpleanos && r.c.cumpleanos.slice(5, 7) === mes).length;
  if (ui.f === 'reactivar') rs = rs.filter(porReactivar).sort((a, b) => a.dias - b.dias);
  else if (ui.f === 'cumple') rs = rs.filter((r) => r.c.cumpleanos && r.c.cumpleanos.slice(5, 7) === mes).sort((a, b) => a.c.cumpleanos.slice(8).localeCompare(b.c.cumpleanos.slice(8)));
  else if (ui.f === 'top') rs = rs.sort((a, b) => b.total - a.total);

function partirNotas(n) {
  const general = [], fechadas = [];
  for (const l of String(n || '').split('\n')) { const m = l.match(/^\[(\d{4}-\d{2}-\d{2})\] (.*)$/); if (m) fechadas.push({ f: m[1], t: m[2] }); else general.push(l); }
  return { general: general.join('\n').trim(), fechadas: fechadas.sort((a, b) => b.f.localeCompare(a.f)) };
}
const unirNotas = (general, fechadas) => [general, ...fechadas.slice().sort((a, b) => a.f.localeCompare(b.f)).map((x) => `[${x.f}] ${x.t.replace(/\n/g, ' ')}`)].filter(Boolean).join('\n');

// muestra cuánto se gana por unidad mientras se escribe el precio
function lineaMargen(pv, costo) {
  if (!(pv > 0)) return '<span class="muted">Escribe el precio de venta para ver cuánto ganas.</span>';
  if (!(costo > 0)) return `<span class="muted">Agrega el costo para ver tu ganancia.</span>`;
  const g = pv - costo; const pct = Math.round((g / pv) * 100);
  return `Ganas <b class="num ${g < 0 ? 'down' : 'up'}">${money(g)}</b> por unidad <span class="pill ${pct >= 40 ? 'ok' : pct >= 20 ? 'warn' : 'bad'}">${pct}%</span>`;
}
function escucharMargen(selPv, selCosto, selOut, costoFijo) {
  const f = $('#sheet-form'); const out = $(selOut); if (!f || !out) return;
  const calc = () => { out.innerHTML = lineaMargen(num($(selPv)?.value), costoFijo ?? num($(selCosto)?.value)); };
  f.addEventListener('input', calc); calc();
}

function camposCompra(unidad, costoActual) {
  return `<div class="form-row">${field(`Cantidad que llegó${unidad && unidad !== 'unidad' ? ' (' + esc(unidad) + ')' : ''}`, '<input class="in" id="f-cantidad" name="cantidad" inputmode="decimal" required placeholder="0">')}${field('Total pagado', '<input class="in" id="f-total" name="total" inputmode="numeric" placeholder="Opcional">')}</div>
    <div class="banner" id="compra-costo" style="background:var(--surface-2)">Costo actual: <b class="num">${money(costoActual || 0)}</b> por ${esc(unidad || 'unidad')}. Si anotas el total pagado, lo calculamos solo.</div>`;
}
function escucharCompra(unidad, costoActual) {
  const f = $('#sheet-form');
  const calc = () => {
    const cant = Number(String($('#f-cantidad').value).replace(',', '.')) || 0; const total = num($('#f-total').value);
    $('#compra-costo').innerHTML = cant > 0 && total > 0 ? `Costo por ${esc(unidad || 'unidad')}: <b class="num">${money(total / cant)}</b>${costoActual ? ` (antes ${money(costoActual)})` : ''}. Se usará en tus costos y recetas.` : `Costo actual: <b class="num">${money(costoActual || 0)}</b> por ${esc(unidad || 'unidad')}. Si anotas el total pagado, lo calculamos solo.`;
  };
  f.addEventListener('input', calc);
}
const leerCompra = (d) => { const cant = Number(String(d.cantidad).replace(',', '.')) || 0; const total = num(d.total); return { cant, total, unit: cant > 0 && total > 0 ? total / cant : 0 }; };
function formIngreso(prodId) {
