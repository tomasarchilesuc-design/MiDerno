<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2346A3">
<title>MiDerno</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,650;12..96,700&family=Figtree:wght@400;500;600;700&family=Caveat:wght@500;600&display=swap">
<style>
/* Layout: app shell — sidebar on desktop, bottom tab bar + "Más" sheet on phones. Brand idea: the entrepreneur's notebook — ink blue, highlighter yellow, margin red */
:root {
  --bg: #F2F4F7;
  --surface: #FFFFFF;
  --surface-2: #E8EDF4;
  --line: #D3DBE6;
  --ink: #152033;
  --muted: #586478;
  --accent: #2346A3;
  --accent-ink: #FFFFFF;
  --accent-soft: #DCE4F6;
  --gold: #D9A514;
  --gold-soft: #FBEFC4;
  --hl: #FFE36E;
  --margin: #D8483B;
  --rule: #C9D6EA;
  --paper: #FFFFFF;
  --ok: #22744A;
  --ok-soft: #D8EEDF;
  --warn: #946010;
  --warn-soft: #F7E9CC;
  --bad: #B23A2B;
  --bad-soft: #F6DCD6;
  --shadow: 0 1px 2px rgba(21, 32, 51, .06), 0 8px 24px rgba(21, 32, 51, .07);
  --f-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body: "Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-hand: "Caveat", "Segoe Print", "Bradley Hand", cursive;
  --r: 14px;
  --r-sm: 9px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E131D; --surface: #161D2A; --surface-2: #1D2535; --line: #2A3446;
    --ink: #E5EAF3; --muted: #95A0B4; --accent: #88A7F6; --accent-ink: #0A1531; --accent-soft: #1C2949;
    --gold: #F0C94A; --gold-soft: #3A3117; --hl: #8A7413; --margin: #F07A6E; --rule: #2B3A55; --paper: #161D2A;
    --ok: #5DC58B; --ok-soft: #163323; --warn: #E9B54E; --warn-soft: #3A2F18; --bad: #EE7D6A; --bad-soft: #3D211C;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.28);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E131D; --surface: #161D2A; --surface-2: #1D2535; --line: #2A3446;
  --ink: #E5EAF3; --muted: #95A0B4; --accent: #88A7F6; --accent-ink: #0A1531; --accent-soft: #1C2949;
  --gold: #F0C94A; --gold-soft: #3A3117; --hl: #8A7413; --margin: #F07A6E; --rule: #2B3A55; --paper: #161D2A;
  --ok: #5DC58B; --ok-soft: #163323; --warn: #E9B54E; --warn-soft: #3A2F18; --bad: #EE7D6A; --bad-soft: #3D211C;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.28);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--f-body); -webkit-font-smoothing: antialiased; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 650; line-height: 1.15; margin: 0; text-wrap: balance; letter-spacing: -.01em; }
h1 { font-size: 1.7rem; }
h2 { font-size: 1.15rem; }
h3 { font-size: 1rem; }
p { margin: 0; }
a { color: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }
.num, td.n, .money { font-variant-numeric: tabular-nums; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
svg.i { width: 20px; height: 20px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- shell ---------- */
.shell { display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: 100vh; }
.side { position: sticky; top: 0; height: 100vh; padding: 20px 14px; border-right: 1px solid var(--line); background: var(--surface); display: flex; flex-direction: column; gap: 18px; overflow-y: auto; }
.brand { display: flex; align-items: center; gap: 10px; padding: 0 8px; }
.brand-mark { width: 30px; height: 32px; flex: none; display: block; }
.brand b { font: 700 1.25rem var(--f-display); letter-spacing: -.02em; }
.biz { padding: 10px; border-radius: var(--r-sm); background: var(--surface-2); }
.biz small { display: block; color: var(--muted); font-size: .75rem; }
.biz strong { display: block; font-weight: 600; line-height: 1.25; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav-label { font-size: .7rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); padding: 12px 10px 4px; }
.nav a { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: var(--r-sm); color: var(--ink); text-decoration: none; font-weight: 500; }
.nav a:hover { background: var(--surface-2); }
.nav a.on { background: var(--accent-soft); color: var(--accent); }
.side .grow { flex: 1; }
.mode-pill { font-size: .75rem; color: var(--muted); padding: 0 10px; display: flex; gap: 6px; align-items: center; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--gold); display: inline-block; }
.dot.cloud { background: var(--ok); }

.main { min-width: 0; padding-inline: 28px; padding-block: 26px 60px; }
.wrap { max-width: 1080px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.page-head .eyebrow { font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
.page-head .actions { display: flex; gap: 8px; flex-wrap: wrap; }

.tabbar { display: none; }

@media (max-width: 860px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .side { display: none; }
  .main { padding-inline: 16px; padding-block: 16px 110px; }
  h1 { font-size: 1.45rem; }
  .tabbar { display: grid; grid-template-columns: repeat(5, 1fr); position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line); padding: 6px 4px calc(6px + env(safe-area-inset-bottom, 0px)); }
  .tabbar a, .tabbar button { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: .68rem; font-weight: 500; color: var(--muted); text-decoration: none; background: none; border: 0; padding: 4px 0; cursor: pointer; }
  .tabbar .on { color: var(--accent); }
  .tabbar .sell span.plus { width: 44px; height: 44px; margin-top: -18px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; box-shadow: var(--shadow); }
  .mobile-top { display: flex !important; }
}
.mobile-top { display: none; align-items: center; justify-content: space-between; gap: 10px; }
.mobile-top .brand b { font-size: 1.1rem; }

/* ---------- surfaces ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; min-width: 0; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
.card-head p { color: var(--muted); font-size: .85rem; }
.grid { display: grid; gap: 14px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.span2 { grid-column: span 2; }
@media (max-width: 1000px) { .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .g3 { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 720px) { .g2 { grid-template-columns: minmax(0, 1fr); } .span2 { grid-column: auto; } }

.kpi { display: flex; flex-direction: column; gap: 4px; }
.kpi .lbl { font-size: .78rem; color: var(--muted); }
.kpi .val { font: 650 1.45rem/1.1 var(--f-display); font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.kpi .sub { font-size: .78rem; color: var(--muted); }
.up { color: var(--ok); } .down { color: var(--bad); }

/* meta (goal) */
.goal { background: var(--ink); color: var(--bg); border: 0; }
.goal .lbl, .goal .sub { color: color-mix(in srgb, var(--bg) 70%, transparent); }
.goal-row { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
.goal-big { font: 650 2.2rem/1 var(--f-display); font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.bar { height: 12px; border-radius: 99px; background: color-mix(in srgb, var(--bg) 18%, transparent); overflow: hidden; margin: 14px 0 10px; }
.bar i { display: block; height: 100%; border-radius: 99px; background: var(--gold); }
.goal-facts { display: flex; gap: 22px; flex-wrap: wrap; font-size: .85rem; }
.goal-facts b { display: block; font: 600 1.05rem var(--f-display); font-variant-numeric: tabular-nums; }

/* lists & tables */
.list { display: flex; flex-direction: column; }
.row { display: flex; align-items: center; gap: 12px; padding: 11px 2px; border-top: 1px solid var(--line); min-width: 0; }
.row:first-child { border-top: 0; }
.row .grow { flex: 1; min-width: 0; }
.row .t { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .s { font-size: .82rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .r { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.row.click { cursor: pointer; }
.row.click:hover { background: var(--surface-2); }
.avatar { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-weight: 600; font-size: .85rem; background: var(--accent-soft); color: var(--accent); flex: none; }
.tbl-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: .9rem; }
th { text-align: left; font-weight: 500; font-size: .75rem; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
td.n, th.n { text-align: right; white-space: nowrap; }
tr:last-child td { border-bottom: 0; }

.pill { display: inline-flex; align-items: center; gap: 5px; font-size: .74rem; font-weight: 600; padding: 3px 9px; border-radius: 99px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.acc { background: var(--accent-soft); color: var(--accent); }
.empty { padding: 26px 12px; text-align: center; color: var(--muted); font-size: .9rem; }

/* controls */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 9px 15px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-weight: 600; font-size: .9rem; cursor: pointer; text-decoration: none; white-space: nowrap; }
.btn:hover { background: var(--surface-2); }
.btn.pri { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.pri:hover { filter: brightness(1.06); }
.btn.danger { color: var(--bad); }
.btn.sm { padding: 6px 10px; font-size: .8rem; border-radius: 8px; }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.block { width: 100%; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.icon-btn { width: 34px; height: 34px; padding: 0; border-radius: 9px; }

.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field label { font-size: .8rem; font-weight: 600; color: var(--muted); }
.field .hint { font-size: .76rem; color: var(--muted); }
.in { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); min-height: 42px; }
.in:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
.form { display: flex; flex-direction: column; gap: 14px; }
.form-row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 480px) { .form-row { grid-template-columns: minmax(0, 1fr); } }

.seg { display: inline-flex; background: var(--surface-2); border-radius: 10px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: none; padding: 7px 12px; border-radius: 8px; font-size: .85rem; font-weight: 600; color: var(--muted); cursor: pointer; }
.seg button.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.08); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 6px 12px; font-size: .82rem; font-weight: 600; cursor: pointer; color: var(--muted); }
.chips.scroll { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.chips.scroll .chip { flex: none; }
.chip.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }

.toggle { position: relative; width: 44px; height: 26px; flex: none; }
.toggle input { opacity: 0; width: 100%; height: 100%; position: absolute; inset: 0; margin: 0; cursor: pointer; z-index: 1; }
.toggle span { position: absolute; inset: 0; border-radius: 99px; background: var(--line); transition: background .15s; }
.toggle span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--surface); box-shadow: 0 1px 2px rgba(0,0,0,.2); transition: transform .15s; }
.toggle input:checked + span { background: var(--accent); }
.toggle input:checked + span::after { transform: translateX(18px); }
.toggle input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }

.monthnav { display: inline-flex; align-items: center; gap: 4px; }
.monthnav strong { min-width: 130px; text-align: center; font-weight: 600; text-transform: capitalize; }

/* chart */
.chart svg { width: 100%; height: auto; display: block; }
.chart text { fill: var(--muted); font: 11px var(--f-body); }
.legend { display: flex; gap: 14px; font-size: .8rem; color: var(--muted); flex-wrap: wrap; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }

/* caja de hoy */
.caja-dia { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; }
.caja-dia div { background: var(--surface-2); border-radius: var(--r-sm); padding: 10px 12px; }
.caja-dia small { display: block; color: var(--muted); font-size: .75rem; }
.caja-dia b { font-variant-numeric: tabular-nums; font-weight: 650; }

/* sell */
.sell { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 900px) { .sell { grid-template-columns: minmax(0, 1fr); } }
.catalog { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.item-btn { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 11px 12px; cursor: pointer; display: flex; flex-direction: column; gap: 3px; min-height: 76px; }
.item-btn:hover { border-color: var(--accent); }
.item-btn b { font-weight: 600; font-size: .9rem; line-height: 1.25; }
.item-btn small { color: var(--muted); font-size: .78rem; font-variant-numeric: tabular-nums; }
.item-btn:disabled { opacity: .45; cursor: not-allowed; }
.cart { position: sticky; top: 16px; }
.cart-line { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 10px; padding: 10px 0; border-top: 1px solid var(--line); }
.cart-line:first-child { border-top: 0; }
.qty { display: inline-flex; align-items: center; gap: 4px; }
.qty button { width: 28px; height: 28px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 700; }
.total-row { display: flex; justify-content: space-between; align-items: baseline; padding: 14px 0 6px; border-top: 2px solid var(--ink); margin-top: 8px; }
.total-row b { font: 650 1.6rem var(--f-display); font-variant-numeric: tabular-nums; }

/* sheet (modal) */
.scrim { position: fixed; inset: 0; background: rgba(8, 14, 12, .45); z-index: 40; display: flex; align-items: center; justify-content: center; padding: 16px; }
.sheet { background: var(--surface); border-radius: 18px; width: min(560px, 100%); max-height: calc(100vh - 32px); overflow-y: auto; padding: 20px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 16px; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.sheet-foot { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
@media (max-width: 600px) {
  .scrim { align-items: flex-end; padding: 0; }
  .sheet { border-radius: 18px 18px 0 0; max-height: 92vh; padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px)); }
}

.toast { position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-weight: 600; font-size: .9rem; z-index: 60; box-shadow: var(--shadow); max-width: calc(100% - 32px); }
.toast.err { background: var(--bad); color: #fff; }

.alert-row { display: flex; gap: 10px; align-items: center; padding: 10px 12px; border-radius: var(--r-sm); background: var(--surface-2); text-decoration: none; color: var(--ink); }
.alert-row .grow { flex: 1; min-width: 0; }
.alert-row small { display: block; color: var(--muted); font-size: .8rem; }
.sev { width: 8px; align-self: stretch; border-radius: 4px; flex: none; background: var(--muted); }
.sev.warn { background: var(--warn); } .sev.bad { background: var(--bad); } .sev.ok { background: var(--ok); } .sev.acc { background: var(--accent); }

.rec-row { display: grid; grid-template-columns: minmax(0, 1fr) 110px 38px 34px; gap: 6px; align-items: center; }
.rec-nuevo { grid-column: 1 / -1; display: grid; grid-template-columns: minmax(0, 1fr) 112px 130px; gap: 6px; padding: 8px; border-radius: 10px; background: var(--surface-2); }
@media (max-width: 480px) { .rec-row { grid-template-columns: minmax(0, 1fr) 84px 34px; } .rec-uni { display: none; } .rec-nuevo { grid-template-columns: minmax(0, 1fr) 1fr; } .rec-nuevo .rec-n-nombre { grid-column: 1 / -1; } }
.drop { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; text-align: center; padding: 34px 20px; min-height: 240px; border: 2px dashed var(--rule); border-radius: var(--r); cursor: pointer;
  background-color: var(--paper); background-image: repeating-linear-gradient(to bottom, transparent 0 31px, color-mix(in srgb, var(--rule) 45%, transparent) 31px 32px); }
.drop:hover, .drop.over { border-color: var(--accent); }
.drop svg.i { width: 34px; height: 34px; color: var(--accent); }
.drop b { font: 650 1.15rem var(--f-display); }
.map-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; }
.muted { color: var(--muted); }
.small { font-size: .85rem; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.hstack { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.between { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.banner { background: var(--gold-soft); color: var(--ink); border-radius: var(--r-sm); padding: 10px 14px; font-size: .85rem; display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }

/* ---------- landing ---------- */
.landing { max-width: 1040px; margin: 0 auto; padding-inline: 20px; padding-block: 36px 70px; display: flex; flex-direction: column; gap: 36px; }
.land-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.hero { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 36px; align-items: center; }
.hero h1 { font-size: clamp(2.2rem, 5.5vw, 3.6rem); letter-spacing: -.035em; line-height: 1.02; }
.hero h1 em { font-style: normal; color: var(--accent); }
.hero p { font-size: 1.08rem; color: var(--muted); max-width: 46ch; margin-top: 16px; }
.eyebrow-hand { font: 600 1.35rem/1 var(--f-hand); color: var(--margin); margin-bottom: 10px; transform: rotate(-1.5deg); display: inline-block; }
.hero mark { background: linear-gradient(transparent 58%, var(--hl) 58%, var(--hl) 92%, transparent 92%); color: inherit; padding: 0 .06em; }
.notebook { position: relative; background-color: var(--paper); border: 1px solid var(--line); border-radius: 6px 16px 16px 6px; box-shadow: var(--shadow);
  padding: 22px 16px 26px 58px; min-width: 0;
  background-image: linear-gradient(to right, transparent 43px, var(--margin) 43px, var(--margin) 45px, transparent 45px),
    repeating-linear-gradient(to bottom, transparent 0 39px, var(--rule) 39px 40px);
  background-position: 0 0, 0 50px; }
.notebook::before { content: ""; position: absolute; left: 12px; top: 18px; bottom: 18px; width: 14px;
  background: radial-gradient(circle at 7px 7px, var(--bg) 0 4.5px, var(--line) 4.5px 5.5px, transparent 6px) 0 0 / 14px 30px repeat-y; }
.nb-date { font: 600 1.15rem/30px var(--f-hand); color: var(--muted); height: 30px; text-align: right; margin-bottom: -2px; }
.nb-line { display: grid; grid-template-columns: minmax(0, 1fr) auto 84px; gap: 10px; align-items: end; height: 40px; padding-bottom: 3px; }

<body>
<div id="app"></div>
<script>
"use strict";
/* =========================================================
   MIDERNO — núcleo: configuración, utilidades, datos
   ========================================================= */

// Para conectar a la nube, pega aquí los datos de tu proyecto Supabase
// (Project Settings → API). Si quedan vacíos, la app funciona en modo local.
const CONFIG = {
  supabaseUrl: 'https://bszgtliphyxmskkmufbl.supabase.co',
  supabaseAnonKey: 'sb_publishable_aewlWELSwqurE7tqpoHZUA_3va4B4Fl',
};

const TABLAS = ['clientes', 'ventas', 'venta_items', 'gastos', 'metas', 'servicios', 'empleados', 'citas',
  'comisiones', 'productos', 'insumos', 'formulas', 'lotes', 'movimientos_stock', 'eventos'];

const MODULOS = {
  servicios: { nombre: 'Servicios y agenda', desc: 'Agenda de horas, equipo, comisiones y recordatorios por WhatsApp' },
  inventario: { nombre: 'Productos e inventario', desc: 'Stock, alertas de stock bajo, ingresos y ventas online' },
  produccion: { nombre: 'Producción', desc: 'Insumos, recetas de costo, margen real y lotes', requiere: 'inventario' },
};

const RUBROS = {
  salon: { nombre: 'Salón de uñas, peluquería o barbería', modulos: ['servicios'] },
  estetica: { nombre: 'Estética, spa o masajes', modulos: ['servicios'] },
  tienda: { nombre: 'Tienda o venta de productos', modulos: ['inventario'] },
  fabrica: { nombre: 'Fabricación artesanal (velas, jabones, comida)', modulos: ['inventario', 'produccion'] },
  otro: { nombre: 'Otro tipo de negocio', modulos: [] },
};

const METODOS = { efectivo: 'Efectivo', debito: 'Débito', credito: 'Crédito', transferencia: 'Transferencia' };
const CATEGORIAS_GASTO = ['Arriendo', 'Insumos', 'Mercadería', 'Sueldos', 'Servicios básicos', 'Publicidad', 'Envíos', 'Otros'];
const DIAS_REACTIVAR = 21;

/* ---------- utilidades ---------- */
const $ = (s, el = document) => el.querySelector(s);
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : 'id-' + Math.random().toString(36).slice(2) + Date.now().toString(36));
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const num = (v) => { const n = Number(String(v ?? '').replace(/\./g, '').replace(',', '.')); return Number.isFinite(n) ? n : 0; };
const pad = (n) => String(n).padStart(2, '0');
const isoDate = (d = new Date()) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const hoy = () => isoDate();
const mesDe = (fecha) => String(fecha).slice(0, 7);
const mesActual = () => hoy().slice(0, 7);
const addDays = (iso, n) => { const d = new Date(iso + 'T12:00:00'); d.setDate(d.getDate() + n); return isoDate(d); };
const addMonths = (ym, n) => { const [y, m] = ym.split('-').map(Number); const d = new Date(y, m - 1 + n, 1); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}`; };
const diasEntre = (a, b) => Math.round((new Date(b + 'T12:00:00') - new Date(a + 'T12:00:00')) / 86400000);
const diasDelMes = (ym) => { const [y, m] = ym.split('-').map(Number); return new Date(y, m, 0).getDate(); };
const nombreMes = (ym, corto = false) => { const [y, m] = ym.split('-').map(Number); return new Date(y, m - 1, 1).toLocaleDateString('es-CL', corto ? { month: 'short' } : { month: 'long', year: 'numeric' }); };
const fechaLarga = (iso) => new Date(iso + 'T12:00:00').toLocaleDateString('es-CL', { weekday: 'long', day: 'numeric', month: 'long' });
const fechaCorta = (iso) => new Date(iso + 'T12:00:00').toLocaleDateString('es-CL', { day: 'numeric', month: 'short' });
const iniciales = (n) => String(n || '?').trim().split(/\s+/).slice(0, 2).map((p) => p[0]).join('').toUpperCase();
const sum = (arr, f) => arr.reduce((a, x) => a + (f ? f(x) : x), 0);
let _fmt = null;
function money(v) {
  if (!_fmt) {
    const cur = S.negocio?.moneda || 'CLP';
    _fmt = new Intl.NumberFormat('es-CL', { style: 'currency', currency: cur, maximumFractionDigits: cur === 'CLP' ? 0 : 2 });
  }
  const n = Math.round(Number(v) || 0);
  return (n < 0 ? '−' : '') + _fmt.format(Math.abs(n));
}
const qtyFmt = (v) => (Math.round(Number(v) * 1000) / 1000).toLocaleString('es-CL');
const telLimpio = (t) => { let d = String(t || '').replace(/\D/g, ''); if (d.length === 9 && d.startsWith('9')) d = '56' + d; return d; };
const waLink = (tel, texto) => `https://wa.me/${telLimpio(tel)}?text=${encodeURIComponent(texto)}`;

/* ---------- almacenamiento del navegador (con respaldo en memoria) ---------- */
const _mem = {};
const LS = {
  get(k) { try { const v = localStorage.getItem(k); if (v != null) return JSON.parse(v); } catch (e) {} return _mem[k] ?? null; },
  set(k, v) { _mem[k] = v; try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { delete _mem[k]; try { localStorage.removeItem(k); } catch (e) {} },
};

/* ---------- estado ---------- */
const S = {
  modo: null,        // 'local' | 'nube'
  negocio: null,     // { id, nombre, rubro, moneda }
  modulos: [],       // ['servicios', ...]
  t: {},             // filas por tabla
  ui: { caja: { mes: null, tab: 'ventas' }, agenda: { fecha: null, emp: 'todos', vista: 'dia' }, clientes: { q: '', f: 'todos' }, inv: { tab: 'stock' }, prod: { tab: 'recetas' }, cat: { tab: null }, equipo: { mes: null }, vender: { q: '' } },
  cart: null,
};
function resetUI() { S.imp = null; S.pub = null; Object.assign(S.ui, { inicio: null, caja: { mes: null, tab: 'ventas' }, agenda: { fecha: null, emp: 'todos', vista: 'dia' }, clientes: { q: '', f: 'todos' }, inv: { tab: 'stock' }, prod: { tab: 'recetas' }, cat: { tab: null }, equipo: { mes: null }, vender: { q: '' } }); }
const tiene = (m) => !m || S.modulos.includes(m);

/* ---------- adaptadores de datos ---------- */
const LocalAdapter = {
  modo: 'local',
  _pend: false,
  // agrupa varias escrituras seguidas (una venta crea varias filas) en un solo guardado
  persistir() {
    if (this._pend || !S.negocio) return; this._pend = true;
    const id = S.negocio.id;
    queueMicrotask(() => { this._pend = false; if (S.negocio?.id === id) LS.set('miderno:data:' + id, { negocio: S.negocio, modulos: S.modulos, t: S.t, ...(id.startsWith('demo-') ? { version: DEMO_VERSION } : {}) }); });
  },
  insert() { this.persistir(); },
  insertMany() { this.persistir(); },
  update() { this.persistir(); },
  remove() { this.persistir(); },
  guardarNegocio() { this.persistir(); const idx = (LS.get('miderno:negocios') || []).map((n) => n.id === S.negocio.id ? { ...n, nombre: S.negocio.nombre, rubro: S.negocio.rubro } : n); LS.set('miderno:negocios', idx); },
  guardarModulo() { this.persistir(); },
};

const NubeAdapter = {
  modo: 'nube',
  sb: null,
  // las escrituras van en fila, en orden, para que una venta exista antes que sus ítems
  cola: Promise.resolve(),
  enviar(fn) {
    this.cola = this.cola.then(fn).then(({ error } = {}) => {
      if (error) { console.error(error); const dup = /duplicate|unique/i.test(error.message || '') && /slug/i.test(error.message || ''); toast(dup ? 'Esa dirección de página ya la usa otro negocio. Elige otra en Ajustes.' : 'No se pudo guardar en la nube: ' + (error.message || error), true); }
    }).catch((e) => toast('Sin conexión: el último cambio no se guardó (' + (e.message || e) + ')', true));
  },
  insert(t, row) { const nid = S.negocio.id; this.enviar(() => this.sb.from(t).insert({ ...row, negocio_id: nid })); },
  insertMany(t, rows) { const nid = S.negocio.id; for (let i = 0; i < rows.length; i += 500) { const parte = rows.slice(i, i + 500).map((r) => ({ ...r, negocio_id: nid })); this.enviar(() => this.sb.from(t).insert(parte)); } },
  update(t, id, patch) { this.enviar(() => this.sb.from(t).update(patch).eq('id', id)); },
  remove(t, id) { this.enviar(() => this.sb.from(t).delete().eq('id', id)); },
  guardarNegocio(patch) { const nid = S.negocio.id; this.enviar(() => this.sb.from('negocios').update(patch).eq('id', nid)); },
  guardarModulo(modulo, activo) { const nid = S.negocio.id; this.enviar(() => this.sb.from('negocio_modulos').upsert({ negocio_id: nid, modulo, activo })); },
  async traerTodo(t) {
    const filas = []; const paso = 1000;
    for (let desde = 0; ; desde += paso) {
      const { data, error } = await this.sb.from(t).select('*').range(desde, desde + paso - 1);
      if (error) throw error;
      filas.push(...data.map(({ negocio_id, ...r }) => r));
      if (data.length < paso) break;
    }
    return filas;
  },
};

let adapter = LocalAdapter;

const db = {
  all: (t) => S.t[t] || (S.t[t] = []),
  get: (t, id) => db.all(t).find((r) => r.id === id),
  insert(t, row) { row.id = row.id || uid(); db.all(t).push(row); adapter.insert(t, row); return row; },
  insertMany(t, rows) { rows.forEach((r) => { r.id = r.id || uid(); db.all(t).push(r); }); adapter.insertMany(t, rows); },
  update(t, id, patch) { const r = db.get(t, id); if (r) Object.assign(r, patch); adapter.update(t, id, patch); return r; },
  remove(t, id) { S.t[t] = db.all(t).filter((r) => r.id !== id); adapter.remove(t, id); },
  removeWhere(t, fn) { db.all(t).filter(fn).forEach((r) => db.remove(t, r.id)); },
  negocio(patch) { Object.assign(S.negocio, patch); _fmt = null; adapter.guardarNegocio(patch); },
  modulo(m, activo) {
    S.modulos = activo ? [...new Set([...S.modulos, m])] : S.modulos.filter((x) => x !== m);
    adapter.guardarModulo(m, activo);
  },
};

/* ---------- cálculos de negocio ---------- */
function stockDe(tipo, id) { return sum(db.all('movimientos_stock').filter((m) => m.tipo_item === tipo && m.item_id === id), (m) => Number(m.cantidad)); }
function costoReceta(productoId) {
  return sum(db.all('formulas').filter((f) => f.producto_id === productoId), (f) => Number(f.cantidad) * Number(db.get('insumos', f.insumo_id)?.costo_unitario || 0));
}
function costoProducto(p) { return tiene('produccion') && db.all('formulas').some((f) => f.producto_id === p.id) ? costoReceta(p.id) : Number(p.costo || 0); }
function ventasDelMes(ym) { return db.all('ventas').filter((v) => mesDe(v.fecha) === ym); }
function gastosDelMes(ym) { return db.all('gastos').filter((g) => mesDe(g.fecha) === ym); }
function itemsDeVenta(ventaId) { return db.all('venta_items').filter((i) => i.venta_id === ventaId); }
function metaDelMes(ym) { return db.all('metas').find((m) => m.periodo === ym); }
function resumenClientes() {
  const map = new Map(db.all('clientes').map((c) => [c.id, { c, total: 0, visitas: 0, ultima: null }]));
  for (const v of db.all('ventas')) {
    const r = map.get(v.cliente_id); if (!r) continue;
    r.total += Number(v.total); r.visitas += 1;
    if (!r.ultima || v.fecha > r.ultima) r.ultima = v.fecha;
  }
  return [...map.values()].map((r) => ({ ...r, dias: r.ultima ? diasEntre(r.ultima, hoy()) : null }));
}
function eliminarVenta(id) {
  db.removeWhere('venta_items', (i) => i.venta_id === id);
  db.removeWhere('movimientos_stock', (m) => m.ref_id === id && m.motivo === 'venta');
  db.removeWhere('comisiones', (c) => c.venta_id === id);
  db.all('citas').filter((c) => c.venta_id === id).forEach((c) => db.update('citas', c.id, { venta_id: null, estado: 'confirmada' }));
  db.remove('ventas', id);
}

/* =========================================================
   Datos de ejemplo (negocios ficticios) para probar la app
   ========================================================= */

function rng(seed) {
  let a = seed >>> 0;
  const r = () => { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  r.int = (min, max) => Math.floor(r() * (max - min + 1)) + min;
  r.pick = (arr) => arr[Math.floor(r() * arr.length)];
  r.wpick = (pairs) => { const tot = sum(pairs, (p) => p[1]); let x = r() * tot; for (const [v, w] of pairs) { if ((x -= w) <= 0) return v; } return pairs[0][0]; };
  return r;
}

/* ---------- nube (Supabase) ---------- */
async function cargarSupabase() {
  if (NubeAdapter.sb) return NubeAdapter.sb;
  if (!window.supabase) await new Promise((ok, fail) => { const s = document.createElement('script'); s.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js'; s.onload = ok; s.onerror = () => fail(new Error('No se pudo cargar Supabase')); document.head.appendChild(s); });
  NubeAdapter.sb = window.supabase.createClient(CONFIG.supabaseUrl, CONFIG.supabaseAnonKey);
  return NubeAdapter.sb;
}
function formLogin() {
  abrirSheet('Iniciar sesión', `${field('Correo', input('email', '', 'type="email" autocomplete="email" required'))}${field('Contraseña', input('password', '', 'type="password" autocomplete="current-password" required'))}
    <p class="small muted">¿No tienes cuenta? <a href="#" data-act="registro">Crea tu negocio</a></p>`, {
    submit: async (d) => {
      try { const sb = await cargarSupabase(); const { error } = await sb.auth.signInWithPassword({ email: d.email, password: d.password }); if (error) throw error; cerrarSheet(); await abrirNube(); }
      catch (e) { toast('No pudimos iniciar sesión: ' + (e.message || e), true); }
    },
  });
}
async function registrarNube(d) {
  try {
    const sb = await cargarSupabase();
    const { data, error } = await sb.auth.signUp({ email: d.email, password: d.password });
    if (error) throw error;
    if (!data.session) { cerrarSheet(); return toast('Te enviamos un correo para confirmar la cuenta. Luego inicia sesión.'); }
    await crearNegocioNube(d);
  } catch (e) { toast('No pudimos crear la cuenta: ' + (e.message || e), true); }
}
async function crearNegocioNube(d) {
  try {
    const sb = await cargarSupabase();
    const { error } = await sb.rpc('crear_negocio', { p_nombre: d.nombre.trim(), p_rubro: d.rubro, p_modulos: RUBROS[d.rubro].modulos });
    if (error) throw error;
    cerrarSheet(); await abrirNube(); location.hash = 'catalogo';
  } catch (e) { toast('No pudimos crear el negocio: ' + (e.message || e), true); }
}
async function abrirNube() {
  const sb = await cargarSupabase();
  const { data: { user } } = await sb.auth.getUser();
  if (!user) return false;
  const { data: u, error } = await sb.from('usuarios').select('negocio_id').eq('id', user.id).maybeSingle();
  if (error) throw error;
  if (!u) { toast('Tu cuenta aún no tiene un negocio. Créalo para continuar.'); formNegocio('solo-nube'); return false; }
  const [{ data: neg }, { data: mods }] = await Promise.all([sb.from('negocios').select('*').eq('id', u.negocio_id).single(), sb.from('negocio_modulos').select('*').eq('negocio_id', u.negocio_id)]);
  const t = {}; for (const x of TABLAS) t[x] = await NubeAdapter.traerTodo(x);
  adapter = NubeAdapter; S.modo = 'nube';
  S.negocio = neg; S.modulos = (mods || []).filter((m) => m.activo).map((m) => m.modulo); S.t = t; _fmt = null; S.cart = null; resetUI();
  render(); return true;
}
async function salir() {
  if (S.modo === 'nube' && NubeAdapter.sb) await NubeAdapter.sb.auth.signOut();
  S.negocio = null; S.modo = null; LS.del('miderno:ultimo'); history.replaceState(null, '', location.pathname); render();
}

const pct = (a, b) => (b ? Math.round(((a - b) / b) * 100) : null);

/* ---------- INICIO ---------- */
function vistaInicio() {
  S.ui.inicio ||= { mes: mesActual() };
  const ym = S.ui.inicio.mes; const esActual = ym === mesActual(); const prev = addMonths(ym, -1); const H = hoy();
  const vM = ventasDelMes(ym); const vP = ventasDelMes(prev);
  const ing = sum(vM, (v) => Number(v.total)); const ingP = sum(esActual ? vP.filter((v) => Number(v.fecha.slice(8)) <= Number(H.slice(8))) : vP, (v) => Number(v.total));
  const gas = sum(gastosDelMes(ym), (g) => Number(g.monto));
  const com = tiene('servicios') ? sum(db.all('comisiones').filter((c) => mesDe(c.fecha) === ym), (c) => Number(c.monto)) : 0;
  const util = ing - gas - com;
  const ticket = vM.length ? ing / vM.length : 0;
  const delta = pct(ing, ingP);

  // meta del mes
  const meta = metaDelMes(ym);
  let metaHtml = '';
  if (meta && Number(meta.monto_objetivo) > 0) {
    const obj = Number(meta.monto_objetivo); const avance = Math.min(100, (ing / obj) * 100);
    const restantes = esActual ? diasDelMes(ym) - Number(H.slice(8)) + 1 : 0; const falta = Math.max(0, obj - ing);
    metaHtml = `<div class="card goal">
      <div class="goal-row"><div><div class="lbl small">Meta de ${esc(nombreMes(ym))}</div><div class="goal-big">${money(ing)}</div><div class="sub small">de ${money(obj)}</div></div>
      <div class="goal-big" style="color:var(--gold)">${Math.floor(avance)}%</div></div>
      <div class="bar" role="progressbar" aria-valuenow="${Math.round(avance)}" aria-valuemin="0" aria-valuemax="100"><i style="width:${avance}%"></i></div>
      ${esActual ? `<div class="goal-facts"><div><span class="sub">Falta</span><b>${money(falta)}</b></div><div><span class="sub">Días restantes</span><b>${restantes}</b></div><div><span class="sub">Necesitas por día</span><b>${falta ? money(falta / restantes) : '¡Meta cumplida!'}</b></div></div>`
        : `<div class="goal-facts"><div><span class="sub">Resultado</span><b>${falta ? `Faltaron ${money(falta)}` : `Superada por ${money(ing - obj)}`}</b></div></div>`}
    </div>`;
  } else if (esActual) {
    metaHtml = `<div class="card between"><div><h3>Ponle una meta a este mes</h3><p class="small muted">Verás cuánto llevas, cuánto falta y cuánto necesitas vender por día.</p></div><button class="btn" data-act="meta">Definir meta</button></div>`;
  }

  // caja de hoy (cierre por medio de pago)
  const vH = db.all('ventas').filter((v) => v.fecha === H); const gH = db.all('gastos').filter((g) => g.fecha === H);
  const porMetodo = Object.keys(METODOS).map((k) => [k, sum(vH.filter((v) => v.metodo_pago === k), (v) => Number(v.total))]);
  const totalH = sum(vH, (v) => Number(v.total)); const gastoH = sum(gH, (g) => Number(g.monto));

  // alertas
  const alertas = [];
  const solicitadas = db.all('citas').filter((c) => c.estado === 'solicitada' && c.fecha >= H).length;
  if (solicitadas) alertas.push({ sev: 'warn', t: `${solicitadas} reserva${solicitadas > 1 ? 's' : ''} por confirmar`, s: 'Llegaron desde tu página de reservas', href: 'agenda' });
  {
    const deHoy = itemsDelDia(H, 'todos').filter(enAgenda);
    const pend = deHoy.filter((i) => !['completada', 'entregada', 'hecha'].includes(i.estado));
    const partes = [['cita', 'cita', 'citas'], ['entrega', 'entrega', 'entregas'], ['tarea', 'recordatorio', 'recordatorios']].map(([k, s1, s2]) => { const n = pend.filter((i) => i.kind === k).length; return n ? `${n} ${n > 1 ? s2 : s1}` : null; }).filter(Boolean);
    if (deHoy.length) alertas.push({ sev: 'acc', t: pend.length ? `Agenda de hoy: ${partes.join(', ')}` : 'Agenda de hoy al día', s: pend.length ? pend.slice(0, 3).map((i) => (i.hora ? i.hora + ' ' : '') + i.titulo).join(' · ') : `${deHoy.length} listos`, href: 'agenda', act: 'ag-hoy-nav' });
  }
  const reactivar = resumenClientes().filter((r) => r.dias != null && r.dias > DIAS_REACTIVAR && r.dias < 120);
  if (reactivar.length) alertas.push({ sev: 'warn', t: `${reactivar.length} clientes sin volver hace más de ${DIAS_REACTIVAR} días`, s: 'Escríbeles por WhatsApp para que vuelvan', href: 'clientes', act: 'filtro-reactivar' });
  if (tiene('inventario')) {
    const bajos = db.all('productos').filter((p) => p.activo !== false && stockDe('producto', p.id) <= Number(p.stock_minimo || 0));
    if (bajos.length) alertas.push({ sev: bajos.some((p) => stockDe('producto', p.id) <= 0) ? 'bad' : 'warn', t: `${bajos.length} productos con stock bajo`, s: bajos.slice(0, 3).map((p) => p.nombre).join(', ') + (bajos.length > 3 ? '…' : ''), href: 'inventario' });
  }
  if (tiene('produccion')) {
    const ib = db.all('insumos').filter((i) => stockDe('insumo', i.id) <= Number(i.stock_minimo || 0));
    if (ib.length) alertas.push({ sev: 'warn', t: `${ib.length} insumos por reponer`, s: ib.map((i) => i.nombre).slice(0, 3).join(', '), href: 'produccion', act: 'tab-insumos' });
    const curando = db.all('lotes').filter((l) => l.listo_desde > H);
    if (curando.length) alertas.push({ sev: 'acc', t: `${curando.length} lote${curando.length > 1 ? 's' : ''} en curado`, s: `Listo desde el ${fechaCorta(curando.map((l) => l.listo_desde).sort()[0])}`, href: 'produccion', act: 'tab-lotes' });
  }

  // más vendidos del mes
  const top = new Map();
  for (const v of vM) for (const i of itemsDeVenta(v.id)) { const k = i.nombre; const r = top.get(k) || { n: 0, m: 0 }; r.n += Number(i.cantidad); r.m += i.cantidad * i.precio_unitario; top.set(k, r); }
  const topArr = [...top.entries()].sort((a, b) => b[1].m - a[1].m).slice(0, 5);

  return `${head(`Hola, ${esc(S.negocio.nombre)}`, esc(fechaLarga(H)), `${monthNav('inicio-mes', ym)}<a class="btn pri" href="#vender">${icon('plus')}Registrar venta</a>`)}
  ${metaHtml}
  <div class="grid g4">
    <div class="card kpi"><span class="lbl">Ventas del mes</span><span class="val">${money(ing)}</span><span class="sub">${delta == null ? '&nbsp;' : `<span class="${delta >= 0 ? 'up' : 'down'}">${delta >= 0 ? '▲' : '▼'} ${Math.abs(delta)}%</span> vs. ${esActual ? 'mismo día de ' : ''}${nombreMes(prev, true)}`}</span></div>
    <div class="card kpi"><span class="lbl">Gastos${com ? ' y comisiones' : ''}</span><span class="val">${money(gas + com)}</span><span class="sub">${com ? `${money(com)} en comisiones` : `${gastosDelMes(ym).length} registros`}</span></div>
    <div class="card kpi"><span class="lbl">Ganancia del mes</span><span class="val ${util < 0 ? 'down' : ''}">${money(util)}</span><span class="sub">${ing && util > 0 ? Math.round((util / ing) * 100) + '% de margen' : esActual && Number(H.slice(8)) <= 7 ? 'el mes recién empieza' : '&nbsp;'}</span></div>
    <div class="card kpi"><span class="lbl">Ticket promedio</span><span class="val">${money(ticket)}</span><span class="sub">${vM.length} ventas</span></div>
  </div>
  <div class="grid g3">
    <div class="card span2 chart"><div class="card-head"><h2>Ventas y gastos, últimos 6 meses</h2><div class="legend"><span><i style="background:var(--accent)"></i>Ventas</span><span><i style="background:var(--gold)"></i>Gastos</span></div></div>${graficoMeses()}</div>
    <div class="card"><div class="card-head"><h2>Para hoy</h2></div><div class="stack">${alertas.length ? alertas.map((a) => `<a class="alert-row" href="#${a.href}" ${a.act ? `data-act="${a.act}"` : ''}><span class="sev ${a.sev}"></span><div class="grow"><b>${esc(a.t)}</b><small>${esc(a.s)}</small></div>${icon('right')}</a>`).join('') : '<div class="empty">Todo en orden por ahora.</div>'}</div></div>
  </div>
  <div class="grid g2">
    <div class="card"><div class="card-head"><h2>Caja de hoy</h2><p>${vH.length} ventas</p></div>
      <div class="caja-dia">${porMetodo.map(([k, v]) => `<div><small>${METODOS[k]}</small><b>${money(v)}</b></div>`).join('')}</div>
      <div class="between" style="margin-top:12px"><span class="muted small">Ventas ${money(totalH)} − gastos ${money(gastoH)}</span><b class="num">Neto ${money(totalH - gastoH)}</b></div></div>
    <div class="card"><div class="card-head"><h2>Lo más vendido</h2><p>${esc(nombreMes(ym))}</p></div>
      ${topArr.length ? `<div class="list">${topArr.map(([n, r]) => `<div class="row"><div class="grow"><div class="t">${esc(n)}</div><div class="s">${qtyFmt(r.n)} vendidos</div></div><div class="r">${money(r.m)}</div></div>`).join('')}</div>` : '<div class="empty">Aún no hay ventas este mes.</div>'}</div>
  </div>`;
}

function graficoMeses() {
  const meses = Array.from({ length: 6 }, (_, i) => addMonths(mesActual(), i - 5));
  const datos = meses.map((m) => ({ m, v: sum(ventasDelMes(m), (x) => Number(x.total)), g: sum(gastosDelMes(m), (x) => Number(x.monto)) }));
  const max = Math.max(1, ...datos.flatMap((d) => [d.v, d.g]));
  const paso = (() => { const raw = max / 4; const p = 10 ** Math.floor(Math.log10(raw)); return [1, 2, 2.5, 5, 10].map((k) => k * p).find((k) => k >= raw); })();
  const top = paso * Math.ceil(max / paso);
  const W = 640, Hh = 230, L = 58, B = 26, T = 10, R = 8; const ih = Hh - B - T; const cw = (W - L - R) / 6; const bw = Math.min(26, cw / 3.2);
  const y = (v) => T + ih - (v / top) * ih;
  const corto = (v) => (v >= 1e6 ? (v / 1e6).toLocaleString('es-CL', { maximumFractionDigits: 1 }) + ' M' : v >= 1e3 ? Math.round(v / 1e3) + ' mil' : String(v));
  let s = `<svg viewBox="0 0 ${W} ${Hh}" role="img" aria-label="Gráfico de ventas y gastos por mes">`;
  for (let v = 0; v <= top; v += paso) s += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end">$${corto(v)}</text>`;
  datos.forEach((d, i) => {
    const cx = L + cw * i + cw / 2; const actual = i === 5;
    s += `<rect x="${cx - bw - 2}" y="${y(d.v)}" width="${bw}" height="${Math.max(0, T + ih - y(d.v))}" rx="4" fill="var(--accent)" opacity="${actual ? 1 : .78}"><title>Ventas ${nombreMes(d.m)}: ${money(d.v)}</title></rect>`;
    s += `<rect x="${cx + 2}" y="${y(d.g)}" width="${bw}" height="${Math.max(0, T + ih - y(d.g))}" rx="4" fill="var(--gold)" opacity="${actual ? 1 : .78}"><title>Gastos ${nombreMes(d.m)}: ${money(d.g)}</title></rect>`;
    s += `<text x="${cx}" y="${Hh - 8}" text-anchor="middle" style="${actual ? 'font-weight:700;fill:var(--ink)' : ''}">${nombreMes(d.m, true).replace('.', '')}</text>`;
  });
  return s + '</svg>';
}

        </div>`).join('') : '<div class="empty">Toca un servicio o producto para agregarlo.</div>'}</div>

function gridCatalogo() {
  const q = S.ui.vender.q.trim().toLowerCase(); const tab = S.ui.vender.tab;
  const match = (n) => !q || n.toLowerCase().includes(q);
  if (tab === 'servicios') {
    const s = db.all('servicios').filter((x) => x.activo !== false && match(x.nombre));
    return s.length ? s.map((x) => `<button class="item-btn" data-act="add" data-tipo="servicio" data-id="${x.id}"><b>${esc(x.nombre)}</b><small>${money(x.precio)} · ${x.duracion_min} min</small></button>`).join('') : `<div class="empty">No hay servicios. <a href="#catalogo">Agrégalos en el catálogo</a>.</div>`;
  }
  if (tab === 'productos') {
    const p = db.all('productos').filter((x) => x.activo !== false && match(x.nombre + ' ' + (x.sku || '')));
    return p.length ? p.map((x) => { const st = stockDe('producto', x.id); if (!tiene('inventario')) return `<button class="item-btn" data-act="add" data-tipo="producto" data-id="${x.id}"><b>${esc(x.nombre)}</b><small>${money(x.precio_venta)}</small></button>`;
      return `<button class="item-btn" data-act="add" data-tipo="producto" data-id="${x.id}" ${st <= 0 ? 'disabled' : ''}><b>${esc(x.nombre)}</b><small>${money(x.precio_venta)} · ${st <= 0 ? 'Agotado' : 'Stock ' + qtyFmt(st)}</small></button>`; }).join('') : `<div class="empty">No hay productos. <a href="#catalogo">Agrégalos en el catálogo</a>.</div>`;
  }
  return '<div class="empty">Usa “Otro monto” para registrar una venta.</div>';
}
function cobrar() {
  const c = S.cart; if (!c.lineas.length) return;
  const conStock = tiene('inventario');
  if (conStock) for (const l of c.lineas) if (l.tipo_item === 'producto') { const st = stockDe('producto', l.item_id); if (st < l.cantidad) return toast(`Solo quedan ${qtyFmt(st)} de ${l.nombre}. Ajusta la cantidad o ingresa stock.`, true); }
  const v = db.insert('ventas', { fecha: c.fecha || hoy(), cliente_id: c.cliente_id || null, total: sum(c.lineas, (l) => l.cantidad * l.precio_unitario), metodo_pago: c.metodo, canal: c.canal, nota: '' });
  for (const l of c.lineas) {
    const it = db.insert('venta_items', { venta_id: v.id, tipo_item: l.tipo_item, item_id: l.item_id || null, nombre: l.nombre, cantidad: l.cantidad, precio_unitario: l.precio_unitario, empleado_id: l.empleado_id || null });
    if (l.tipo_item === 'producto' && conStock) db.insert('movimientos_stock', { tipo_item: 'producto', item_id: l.item_id, cantidad: -l.cantidad, motivo: 'venta', ref_id: v.id, fecha: v.fecha, nota: c.canal === 'online' ? 'Venta online' : '' });
    if (l.empleado_id && tiene('servicios')) { const e = db.get('empleados', l.empleado_id); if (e && Number(e.pct_comision)) db.insert('comisiones', { empleado_id: e.id, venta_id: v.id, venta_item_id: it.id, fecha: v.fecha, monto: Math.round(l.cantidad * l.precio_unitario * Number(e.pct_comision) / 100), pagada: false }); }
  }
  if (c.cita_id) db.update('citas', c.cita_id, { estado: 'completada', venta_id: v.id });
  if (c.evento_id) db.update('eventos', c.evento_id, { pagado: true, venta_id: v.id });
  if (c.entrega) db.insert('eventos', { tipo: 'entrega', titulo: c.lineas.map((l) => (l.cantidad > 1 ? qtyFmt(l.cantidad) + '× ' : '') + l.nombre).join(', '), cliente_id: c.cliente_id || null, fecha: c.entrega.fecha || hoy(), hora: c.entrega.hora || null, direccion: (c.entrega.direccion || '').trim(), monto: v.total, pagado: true, estado: 'pendiente', venta_id: v.id, nota: '' });
  if (c.entrega) S.ui.agenda.fecha = c.entrega.fecha;
  const volver = c.cita_id || c.evento_id ? 'agenda' : null;
  S.cart = nuevoCarro(); toast(`Venta registrada: ${money(v.total)}`);
  volver ? ir(volver) : render();
}

  filas.sort((a, b) => { const r = (f) => (f.st <= 0 ? 0 : f.st <= Number(f.p.stock_minimo || 0) ? 1 : 2); return r(a) - r(b) || a.p.nombre.localeCompare(b.p.nombre); });
  const movs = [...db.all('movimientos_stock')].filter((m) => m.tipo_item === 'producto').sort((a, b) => b.fecha.localeCompare(a.fecha)).slice(0, 60);
  const pmap = new Map(db.all('productos').map((p) => [p.id, p.nombre]));
  const MOTIVOS = { venta: 'Venta', compra: 'Ingreso', produccion: 'Producción', ajuste: 'Ajuste', consumo: 'Consumo' };
  return `${head('Inventario', 'Productos', `<button class="btn" data-act="ajuste">Ajuste o merma</button><button class="btn pri" data-act="ingreso">${icon('plus')}Ingresar stock</button>`)}

      const faltan = fs.map((f) => { const i = db.get('insumos', f.insumo_id); const need = f.cantidad * cant; const st = stockDe('insumo', i.id); return st < need ? `${i.nombre} (faltan ${qtyFmt(need - st)} ${i.unidad})` : null; }).filter(Boolean);

      fs.forEach((f) => db.insert('movimientos_stock', { tipo_item: 'insumo', item_id: f.insumo_id, cantidad: -(f.cantidad * cant), motivo: 'consumo', ref_id: L.id, fecha, nota: '' }));
      db.insert('movimientos_stock', { tipo_item: 'producto', item_id: d.producto, cantidad: cant, motivo: 'produccion', ref_id: L.id, fecha, nota: 'Lote' });

// Arma la receta de un producto (nuevo o existente) con varios insumos a la vez.
// Si falta un insumo se puede crear ahí mismo, sin salir del formulario.
function filaReceta(ins) {
  return `<div class="rec-row">
    <select class="in rec-ins" aria-label="Insumo">${opt('', 'Elige un insumo…')}${ins.map((i) => opt(i.id, `${i.nombre} (${money(i.costo_unitario)} / ${i.unidad})`)).join('')}<option value="__nuevo">+ Insumo nuevo…</option></select>

    <span class="rec-uni muted small"></span>
    <button type="button" class="btn icon-btn ghost rec-del" aria-label="Quitar fila">${icon('x')}</button>
    <div class="rec-nuevo" hidden>
      <input class="in rec-n-nombre" placeholder="Nombre del insumo" aria-label="Nombre del insumo nuevo">
      <select class="in rec-n-unidad" aria-label="Unidad">${['unidad', 'kg', 'gr', 'lt', 'ml', 'mt', 'cm'].map((u) => opt(u, u)).join('')}</select>
      <input class="in rec-n-costo" inputmode="decimal" placeholder="Costo por unidad" aria-label="Costo por unidad de medida">
    </div>
  </div>`;
}
function formReceta(prodId) {
  const sinReceta = db.all('productos').filter((p) => p.activo !== false && !db.all('formulas').some((f) => f.producto_id === p.id));
  const ins = [...db.all('insumos')].sort((a, b) => a.nombre.localeCompare(b.nombre));
  const sel = prodId || (sinReceta[0]?.id ?? '__nuevo');
  abrirSheet('Nueva receta', `<div class="form">
    ${field('¿Para qué producto?', `<select class="in" id="rec-prod">${sinReceta.map((p) => opt(p.id, p.nombre, sel)).join('')}<option value="__nuevo" ${sel === '__nuevo' ? 'selected' : ''}>+ Producto nuevo…</option></select>`)}
    <div class="form-row" id="rec-prod-nuevo" ${sel === '__nuevo' ? '' : 'hidden'}>${field('Nombre del producto', '<input class="in" id="rec-p-nombre" placeholder="Ej: Vela de coco 200 g">')}${field('Precio de venta', '<input class="in" id="rec-p-precio" inputmode="numeric" placeholder="0">')}</div>
    <div class="field"><label>¿Qué lleva una unidad?</label><div class="stack" id="rec-filas">${filaReceta(ins)}${filaReceta(ins)}</div>
      <button type="button" class="btn sm" id="rec-mas" style="align-self:flex-start">${icon('plus')}Agregar otro insumo</button></div>
    <div class="banner" id="rec-resumen" style="background:var(--accent-soft)">Agrega los insumos para ver el costo.</div>
  </div>`, {
    submit: () => guardarReceta(),
  });
  const form = $('#sheet-form');
  const precio = () => { const v = $('#rec-prod').value; return v === '__nuevo' ? num($('#rec-p-precio').value) : Number(db.get('productos', v)?.precio_venta || 0); };
  const recalcular = () => {
    let costo = 0;
    form.querySelectorAll('.rec-row').forEach((r) => {
      const id = r.querySelector('.rec-ins').value; const cant = Number(String(r.querySelector('.rec-cant').value).replace(',', '.')) || 0;
      const nuevo = id === '__nuevo'; r.querySelector('.rec-nuevo').hidden = !nuevo;
      const i = nuevo ? null : db.get('insumos', id);
      const unidad = nuevo ? r.querySelector('.rec-n-unidad').value : i?.unidad || '';
      const cu = nuevo ? Number(String(r.querySelector('.rec-n-costo').value).replace(',', '.')) || 0 : Number(i?.costo_unitario || 0);
      r.querySelector('.rec-uni').textContent = unidad;
      costo += cant * cu;
    });
    const pv = precio(); const res = $('#rec-resumen');
    res.innerHTML = costo ? `<span>Costo por unidad <b class="num">${money(costo)}</b></span>${pv ? `<span>Ganas <b class="num">${money(pv - costo)}</b> (${Math.round(((pv - costo) / pv) * 100)}%)</span>` : '<span class="muted">Pon un precio para ver el margen</span>'}` : 'Agrega los insumos para ver el costo.';
  };
  form.addEventListener('input', recalcular);
  form.addEventListener('change', (e) => { if (e.target.id === 'rec-prod') $('#rec-prod-nuevo').hidden = e.target.value !== '__nuevo'; recalcular(); });
  form.addEventListener('click', (e) => {
    if (e.target.closest('#rec-mas')) { $('#rec-filas').insertAdjacentHTML('beforeend', filaReceta(ins)); }
    const del = e.target.closest('.rec-del'); if (del) { if (form.querySelectorAll('.rec-row').length > 1) del.closest('.rec-row').remove(); recalcular(); }
  });
}
function guardarReceta() {
  const form = $('#sheet-form'); let prodId = $('#rec-prod').value;
  if (prodId === '__nuevo') {
    const nombre = $('#rec-p-nombre').value.trim(); const precio = num($('#rec-p-precio').value);
    if (!nombre || precio <= 0) return toast('Escribe el nombre y el precio del producto', true);
  }
  const lineas = [];
  for (const r of form.querySelectorAll('.rec-row')) {
    const id = r.querySelector('.rec-ins').value; const cant = Number(String(r.querySelector('.rec-cant').value).replace(',', '.')) || 0;
    if (!id && !cant) continue;
    if (!id) return toast('Elige el insumo de cada fila', true);
    if (cant <= 0) return toast('Escribe cuánto lleva de cada insumo', true);
    if (id === '__nuevo') {
      const nombre = r.querySelector('.rec-n-nombre').value.trim(); if (!nombre) return toast('Escribe el nombre del insumo nuevo', true);
      lineas.push({ nuevo: { nombre, unidad: r.querySelector('.rec-n-unidad').value, costo_unitario: Number(String(r.querySelector('.rec-n-costo').value).replace(',', '.')) || 0, stock_minimo: 0 }, cant });
    } else lineas.push({ id, cant });
  }
  if (!lineas.length) return toast('Agrega al menos un insumo', true);
  const ids = lineas.map((l) => l.id).filter(Boolean); if (new Set(ids).size !== ids.length) return toast('Hay un insumo repetido en la receta', true);
  if (prodId === '__nuevo') prodId = db.insert('productos', { nombre: $('#rec-p-nombre').value.trim(), sku: '', precio_venta: num($('#rec-p-precio').value), costo: 0, stock_minimo: 0, activo: true }).id;
  for (const l of lineas) {
    const insumoId = l.id || db.insert('insumos', l.nuevo).id;
    db.insert('formulas', { producto_id: prodId, insumo_id: insumoId, cantidad: l.cant });
  }
  const p = db.get('productos', prodId);
  cerrarSheet(); S.ui.prod.tab = 'recetas'; toast(`Receta guardada: ${p.nombre} cuesta ${money(costoReceta(prodId))} por unidad`); render();
}

/* =========================================================
   Agenda (para todos los negocios) y Equipo
   - Citas: horas de servicio con cliente, servicio y persona
   - Entregas: pedidos o despachos con dirección y monto
   - Recordatorios: cualquier cosa que haya que hacer un día
   ========================================================= */

const ESTADOS_CITA = { solicitada: ['Por confirmar', 'warn'], agendada: ['Agendada', ''], confirmada: ['Confirmada', 'acc'], completada: ['Pagada', 'ok'], no_asistio: ['No vino', 'bad'], cancelada: ['Cancelada', 'bad'], rechazada: ['Rechazada', 'bad'] };
const ESTADOS_EV = { pendiente: ['Pendiente', ''], entregada: ['Entregada', 'ok'], hecha: ['Hecha', 'ok'], cancelada: ['Cancelada', 'bad'] };
const INACTIVOS = ['cancelada', 'rechazada', 'no_asistio'];
const DIAS_CORTOS = ['lun', 'mar', 'mié', 'jue', 'vie', 'sáb', 'dom'];
const lunesDe = (iso) => { const d = new Date(iso + 'T12:00:00'); const dow = (d.getDay() + 6) % 7; return addDays(iso, -dow); };
const mapsLink = (dir) => `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(dir)}`;

function itemsDelDia(f, emp = S.ui.agenda.emp) {
  const out = [];
  const cli = (id) => db.get('clientes', id);
  for (const c of db.all('citas')) {
    if (c.fecha !== f) continue;
    if (emp !== 'todos' && c.empleado_id !== emp) continue;
    const s = db.get('servicios', c.servicio_id); const e = db.get('empleados', c.empleado_id);
    out.push({ kind: 'cita', id: c.id, hora: hhmm(c.hora), titulo: cli(c.cliente_id)?.nombre || 'Cliente', sub: [s?.nombre, e?.nombre].filter(Boolean).join(' · '), estado: c.estado, ref: c, s, cl: cli(c.cliente_id) });
  }
  if (emp === 'todos') for (const ev of db.all('eventos')) {
    if (ev.fecha !== f) continue; const cl = cli(ev.cliente_id);
    out.push({ kind: ev.tipo, id: ev.id, hora: hhmm(ev.hora), titulo: ev.tipo === 'entrega' ? (cl?.nombre || ev.titulo || 'Entrega') : ev.titulo, sub: ev.tipo === 'entrega' ? [ev.titulo && cl ? ev.titulo : '', ev.direccion].filter(Boolean).join(' · ') : (ev.nota || ''), estado: ev.estado, ref: ev, cl });
  }
  return out.sort((a, b) => (a.hora || '99').localeCompare(b.hora || '99'));
}
const enAgenda = (i) => !INACTIVOS.includes(i.estado) && i.estado !== 'cancelada';
const KIND = { cita: { label: 'Cita', cls: 'k-cita' }, entrega: { label: 'Entrega', cls: 'k-entrega' }, tarea: { label: 'Recordatorio', cls: 'k-tarea' } };

/* ---------- AGENDA ---------- */
function vistaAgenda() {
  const ui = S.ui.agenda; ui.fecha ||= hoy(); ui.vista ||= 'dia';
  const emps = db.all('empleados').filter((e) => e.activo !== false);
  const pend = db.all('citas').filter((c) => c.estado === 'solicitada' && c.fecha >= hoy()).sort((a, b) => (a.fecha + a.hora).localeCompare(b.fecha + b.hora));
  let titulo, cuerpo, paso;
  if (ui.vista === 'mes') { titulo = nombreMes(mesDe(ui.fecha)); cuerpo = agendaMes(); paso = 'mes'; }
  else if (ui.vista === 'semana') { const l = lunesDe(ui.fecha); titulo = `${fechaCorta(l)} al ${fechaCorta(addDays(l, 6))}`; cuerpo = agendaSemana(); paso = 7; }
  else { titulo = fechaLarga(ui.fecha); cuerpo = agendaDia(); paso = 1; }
  return `${head('Agenda', esc(titulo), `<button class="btn pri" data-act="agendar">${icon('plus')}Agendar</button>`)}
  ${pend.length ? `<div class="card stack" style="border-color:var(--warn)"><div class="between"><h2>${pend.length} reserva${pend.length > 1 ? 's' : ''} por confirmar</h2><span class="small muted">Llegaron desde tu página de reservas</span></div>
    <div class="list">${pend.slice(0, 5).map((c) => { const cl = db.get('clientes', c.cliente_id); const s = db.get('servicios', c.servicio_id); return `<div class="row" style="flex-wrap:wrap"><div class="grow"><div class="t">${esc(cl?.nombre || 'Cliente')} · ${esc(s?.nombre || '')}</div><div class="s">${esc(fechaLarga(c.fecha))}, ${hhmm(c.hora)}${c.empleado_id ? ' · ' + esc(db.get('empleados', c.empleado_id)?.nombre || '') : ''}</div></div>
      <div class="hstack"><button class="btn sm" data-act="cita-estado" data-id="${c.id}" data-e="rechazada">Rechazar</button><button class="btn sm pri" data-act="confirmar-reserva" data-id="${c.id}">Confirmar</button></div></div>`; }).join('')}</div></div>` : ''}
  <div class="card stack">
    <div class="between">
      <div class="hstack"><button class="btn icon-btn" data-act="ag-mover" data-d="-1" data-p="${paso}" aria-label="Anterior">${icon('left')}</button><button class="btn sm" data-act="ag-hoy">Hoy</button><button class="btn icon-btn" data-act="ag-mover" data-d="1" data-p="${paso}" aria-label="Siguiente">${icon('right')}</button>
        <input type="date" class="in" style="width:auto;min-height:34px;padding:4px 8px" data-change="ag-fecha" value="${ui.fecha}" aria-label="Ir a una fecha"></div>
      <div class="seg">${[['dia', 'Día'], ['semana', 'Semana'], ['mes', 'Mes']].map(([k, v]) => `<button data-act="ag-vista" data-v="${k}" class="${ui.vista === k ? 'on' : ''}">${v}</button>`).join('')}</div>
    </div>
    ${emps.length > 1 ? `<div class="chips scroll"><button class="chip ${ui.emp === 'todos' ? 'on' : ''}" data-act="ag-emp" data-e="todos">Todo</button>${emps.map((e) => `<button class="chip ${ui.emp === e.id ? 'on' : ''}" data-act="ag-emp" data-e="${e.id}">${esc(e.nombre.split(' ')[0])}</button>`).join('')}</div>` : ''}
  </div>
  ${cuerpo}`;
}

function agendaDia() {
  const ui = S.ui.agenda; const items = itemsDelDia(ui.fecha);
  const semana = Array.from({ length: 7 }, (_, i) => addDays(ui.fecha, i - 3));
  const esperado = sum(items.filter((i) => i.kind === 'cita' && enAgenda(i)), (i) => Number(i.s?.precio || 0)) + sum(items.filter((i) => i.kind === 'entrega' && enAgenda(i) && !i.ref.pagado), (i) => Number(i.ref.monto || 0));
  return `<div class="chips scroll" aria-label="Días cercanos">${semana.map((f) => `<button class="chip ${f === ui.fecha ? 'on' : ''}" data-act="ag-set" data-f="${f}">${new Date(f + 'T12:00:00').toLocaleDateString('es-CL', { weekday: 'short', day: 'numeric' })} · ${itemsDelDia(f).filter(enAgenda).length}</button>`).join('')}</div>
  <div class="card"><div class="card-head"><h2>${items.filter(enAgenda).length} en agenda</h2>${esperado ? `<p class="num">${money(esperado)} por cobrar</p>` : ''}</div>
    <div class="list">${items.length ? items.map(filaAgenda).join('') : `<div class="empty">Página en blanco. Toca <b>Agendar</b> para anotar una hora, una entrega o un recordatorio.</div>`}</div></div>`;
}

function filaAgenda(i) {
  const r = i.ref; const k = KIND[i.kind];
  const [est, cls] = (i.kind === 'cita' ? ESTADOS_CITA : ESTADOS_EV)[i.estado] || ['', ''];
  const abierta = enAgenda(i) && !['completada', 'entregada', 'hecha'].includes(i.estado);
  const acciones = [];
  const tel = i.cl?.telefono;
  if (i.kind === 'cita') {
    if (abierta && tel) acciones.push(`<a class="btn sm" target="_blank" rel="noopener" href="${waLink(tel, `Hola ${primerNombre(i.cl.nombre)}, te recordamos tu hora de ${i.s?.nombre || 'atención'} el ${fechaLarga(r.fecha)} a las ${hhmm(r.hora)} en ${S.negocio.nombre}. ¿Nos confirmas?`)}">${icon('chat')}Recordar</a>`);
    if (i.estado === 'solicitada') acciones.push(`<button class="btn sm" data-act="cita-estado" data-id="${r.id}" data-e="rechazada">Rechazar</button><button class="btn sm pri" data-act="confirmar-reserva" data-id="${r.id}">Confirmar</button>`);
    else if (abierta) acciones.push(`${i.estado === 'agendada' ? `<button class="btn sm" data-act="cita-estado" data-id="${r.id}" data-e="confirmada">Confirmar</button>` : ''}<button class="btn sm" data-act="cita-estado" data-id="${r.id}" data-e="no_asistio">No vino</button><button class="btn sm pri" data-act="cita-cobrar" data-id="${r.id}">Cobrar</button>`);
    acciones.push(`<button class="btn sm ghost" data-act="cita" data-id="${r.id}" aria-label="Editar">${icon('edit')}</button>`);
  } else if (i.kind === 'entrega') {
    if (abierta && tel) acciones.push(`<a class="btn sm" target="_blank" rel="noopener" href="${waLink(tel, `Hola ${primerNombre(i.cl.nombre)}, te escribimos de ${S.negocio.nombre}. Tu pedido${r.titulo ? ' (' + r.titulo + ')' : ''} llega el ${fechaLarga(r.fecha)}${r.hora ? ' cerca de las ' + hhmm(r.hora) : ''}.`)}">${icon('chat')}Avisar</a>`);
    if (r.direccion) acciones.push(`<a class="btn sm" target="_blank" rel="noopener" href="${mapsLink(r.direccion)}">Mapa</a>`);
    if (abierta && !r.pagado && Number(r.monto)) acciones.push(`<button class="btn sm" data-act="ev-cobrar" data-id="${r.id}">Cobrar</button>`);
    if (abierta) acciones.push(`<button class="btn sm pri" data-act="ev-estado" data-id="${r.id}" data-e="entregada">Entregada</button>`);
    acciones.push(`<button class="btn sm ghost" data-act="evento" data-id="${r.id}" aria-label="Editar">${icon('edit')}</button>`);
  } else {
    if (abierta) acciones.push(`<button class="btn sm pri" data-act="ev-estado" data-id="${r.id}" data-e="hecha">Hecho</button>`);
    acciones.push(`<button class="btn sm ghost" data-act="evento" data-id="${r.id}" aria-label="Editar">${icon('edit')}</button>`);
  }
  const monto = i.kind === 'cita' ? (i.s ? money(i.s.precio) : '') : i.kind === 'entrega' && Number(r.monto) ? `${money(r.monto)}${r.pagado ? ' · pagado' : ''}` : '';
  return `<div class="row ag-row ${k.cls}" style="flex-wrap:wrap">
    <div class="ag-hora num"><b>${i.hora || '—'}</b><div class="small muted">${k.label}</div></div>
    <div class="grow"><div class="t">${esc(i.titulo)}</div><div class="s">${esc(i.sub)}${monto ? ` · ${monto}` : ''}</div></div>
    <span class="pill ${cls}">${est}</span>
    <div class="hstack">${acciones.join('')}</div></div>`;
}

function chipAgenda(i) {
  return `<button class="ag-chip ${KIND[i.kind].cls} ${enAgenda(i) ? '' : 'off'} ${i.estado === 'solicitada' ? 'req' : ''}" data-act="${i.kind === 'cita' ? 'cita' : 'evento'}" data-id="${i.id}" title="${esc(KIND[i.kind].label + ': ' + i.titulo)}"><span class="num">${i.hora || '•'}</span> ${esc(i.titulo)}</button>`;
}
function agendaSemana() {
  const ui = S.ui.agenda; const l = lunesDe(ui.fecha);
  return `<div class="week">${Array.from({ length: 7 }, (_, d) => {
    const f = addDays(l, d); const items = itemsDelDia(f);
    return `<div class="week-day ${f === hoy() ? 'today' : ''}"><button class="week-head" data-act="ag-ir-dia" data-f="${f}"><span>${DIAS_CORTOS[d]}</span><b>${Number(f.slice(8))}</b></button>
      <div class="stack" style="gap:4px">${items.length ? items.map(chipAgenda).join('') : '<span class="small muted" style="padding:2px 4px">—</span>'}</div></div>`;
  }).join('')}</div>`;
}
function agendaMes() {
  const ui = S.ui.agenda; const ym = mesDe(ui.fecha); const ini = lunesDe(ym + '-01');
  const ultimo = `${ym}-${pad(diasDelMes(ym))}`; const semanas = Math.ceil((diasEntre(ini, ultimo) + 1) / 7);
  return `<div class="card month-wrap"><div class="month">${DIAS_CORTOS.map((d) => `<div class="month-dow">${d}</div>`).join('')}
    ${Array.from({ length: semanas * 7 }, (_, k) => {
      const f = addDays(ini, k); const items = itemsDelDia(f).filter(enAgenda); const fuera = mesDe(f) !== ym;
      const kinds = ['cita', 'entrega', 'tarea'].filter((x) => items.some((i) => i.kind === x));
      return `<button class="month-cell ${fuera ? 'out' : ''} ${f === hoy() ? 'today' : ''}" data-act="ag-ir-dia" data-f="${f}" aria-label="${fechaLarga(f)}: ${items.length} en agenda">
        <span class="month-num">${Number(f.slice(8))}</span>
        <span class="month-items">${items.slice(0, 3).map((i) => `<span class="m-item ${KIND[i.kind].cls}">${i.hora ? i.hora + ' ' : ''}${esc(i.titulo)}</span>`).join('')}${items.length > 3 ? `<span class="m-more">+${items.length - 3} más</span>` : ''}</span>
        ${items.length ? `<span class="month-dots">${kinds.map((x) => `<i class="${KIND[x].cls}"></i>`).join('')}<small>${items.length}</small></span>` : ''}
      </button>`;
    }).join('')}</div>
    <div class="legend" style="margin-top:10px">${tiene('servicios') ? '<span><i class="k-cita"></i>Citas</span>' : ''}<span><i class="k-entrega"></i>Entregas</span><span><i class="k-tarea"></i>Recordatorios</span></div></div>`;
}

function elegirAgendar() {
  const ops = [
    tiene('servicios') && ['cita', 'cal', 'Hora para un cliente', 'Un servicio con fecha, hora y quién atiende'],
    ['entrega', 'box', 'Entrega o pedido', 'Despacho o retiro con dirección y monto'],

}

  const ui = S.ui.agenda;
  const c = id ? db.get('citas', id) : { cliente_id: '', servicio_id: '', empleado_id: ui.emp !== 'todos' ? ui.emp : '', fecha: ui.fecha || hoy(), hora: '10:00', estado: 'agendada', nota: '', ...pre };

  const servs = db.all('servicios').filter((s) => s.activo !== false); const emps = db.all('empleados').filter((e) => e.activo !== false);
  if (!servs.length) { cerrarSheet(); toast('Primero agrega servicios en el catálogo', true); return ir('catalogo'); }
  abrirSheet(id ? 'Editar cita' : 'Agendar hora', `<div class="form">
    ${field('Cliente', `<div class="hstack" style="flex-wrap:nowrap"><select class="in" name="cliente_id" id="f-cliente_id" required>${opt('', 'Elige un cliente', c.cliente_id)}${clientes.map((x) => opt(x.id, x.nombre, c.cliente_id)).join('')}</select><button type="button" class="btn" data-act="cliente-nuevo-cita" aria-label="Nuevo cliente">${icon('plus')}</button></div>`)}
    ${field('Servicio', `<select class="in" name="servicio_id" id="f-servicio_id">${servs.map((s) => opt(s.id, `${s.nombre} · ${money(s.precio)}`, c.servicio_id)).join('')}</select>`)}
    ${emps.length ? field('Atiende', `<select class="in" name="empleado_id" id="f-empleado_id">${opt('', 'Sin asignar', c.empleado_id)}${emps.map((e) => opt(e.id, e.nombre, c.empleado_id)).join('')}</select>`) : ''}
    <div class="form-row">${field('Fecha', input('fecha', c.fecha, 'type="date" required'))}${field('Hora', input('hora', hhmm(c.hora), 'type="time" step="900" required'))}</div>
    ${id ? field('Estado', `<select class="in" name="estado" id="f-estado">${Object.entries(ESTADOS_CITA).map(([k, [l]]) => opt(k, l, c.estado)).join('')}</select>`) : ''}
    ${field('Nota', input('nota', c.nota || '', 'placeholder="Opcional"'))}</div>`, {
    pie: `<div class="sheet-foot" style="justify-content:space-between">${id ? `<button type="button" class="btn danger" data-act="del-cita" data-id="${id}">Eliminar</button>` : '<span></span>'}<div class="hstack"><button type="button" class="btn" data-close>Cancelar</button><button class="btn pri">Guardar</button></div></div>`,
    submit: (d) => {
      if (!d.cliente_id) return toast('Elige un cliente', true);
      const dur = Number(db.get('servicios', d.servicio_id)?.duracion_min || 60); const m = (h) => { const [a, b] = hhmm(h).split(':').map(Number); return a * 60 + b; };
      const choque = d.empleado_id && db.all('citas').find((x) => x.id !== id && x.empleado_id === d.empleado_id && x.fecha === d.fecha && !INACTIVOS.includes(x.estado)
        && m(x.hora) < m(d.hora) + dur && m(d.hora) < m(x.hora) + Number(db.get('servicios', x.servicio_id)?.duracion_min || 60));
      if (choque) return toast(`Esa persona ya tiene una hora a las ${hhmm(choque.hora)} que se cruza`, true);
      const row = { cliente_id: d.cliente_id, servicio_id: d.servicio_id, empleado_id: d.empleado_id || null, fecha: d.fecha, hora: d.hora, nota: d.nota.trim(), ...(d.estado ? { estado: d.estado } : {}) };
      id ? db.update('citas', id, row) : db.insert('citas', { ...row, estado: 'agendada', venta_id: null });
      S.ui.agenda.fecha = d.fecha; cerrarSheet(); toast('Hora guardada'); render();
    },
  });
}

// Ajusta las comisiones que aún no se pagan al nuevo porcentaje
function recalcularComisiones(empId, antes, ahora) {
  const pend = db.all('comisiones').filter((c) => c.empleado_id === empId && !c.pagada);
  for (const c of pend) {
    const it = db.get('venta_items', c.venta_item_id);
    const base = it ? Number(it.cantidad) * Number(it.precio_unitario) : (antes ? Number(c.monto) * 100 / antes : 0);
    db.update('comisiones', c.id, { monto: Math.round(base * ahora / 100) });
  }
  return pend.length;
}

  const historial = db.all('comisiones').some((c) => c.empleado_id === id) || db.all('venta_items').some((i) => i.empleado_id === id);
  const futuras = db.all('citas').filter((c) => c.empleado_id === id && c.fecha >= hoy() && !INACTIVOS.includes(c.estado) && c.estado !== 'completada');
  const texto = `Se quitará a <b>${esc(e.nombre)}</b> del equipo.${pend ? ` Aún tiene <b>${money(pend)}</b> en comisiones por pagar; seguirán apareciendo hasta que las marques pagadas.` : ''}${futuras.length ? ` Sus ${futuras.length} horas agendadas quedarán sin asignar.` : ''}${historial ? ' Su historial de ventas se mantiene.' : ''}`;
  confirmar(texto, () => {
