Object.assign(ACC_COBRO, { 'marcar-asistencia': () => hojaAsistencia() });

/* =========================================================
   Calendario por horas + horarios bloqueados
   - La vista "Semana" muestra cada día como una columna con sus horas:
     citas, reservas por confirmar, entregas y bloqueos en su lugar.
   - Tocar un espacio vacío permite agendar ahí o bloquear ese horario.
   - Fuera del horario de atención se ve sombreado, pero igual se puede
     agendar (el dueño manda; solo la página pública respeta el horario).
   ========================================================= */

const MIN_PX = 1.1; // alto de un minuto en el calendario
const bloqueosDel = (f) => db.all('eventos').filter((e) => e.tipo === 'bloqueo' && e.fecha === f && e.estado !== 'cancelada');
// [inicio, fin] en minutos; sin hora = todo el día
const rangoBloqueo = (b) => (b.hora ? [aMin(b.hora), b.hasta ? aMin(b.hasta) : aMin(b.hora) + 60] : [0, 24 * 60]);
const textoBloqueo = (b) => (b.hora ? `${hhmm(b.hora)}–${b.hasta ? hhmm(b.hasta) : ''}` : 'Todo el día');
const diaCerrado = (f) => !horarioDia(horarioDe(S.negocio), new Date(f + 'T12:00:00').getDay());
const bloqueoTotal = (f) => bloqueosDel(f).some((b) => !b.hora);

function duracionItem(i) {
  if (i.kind === 'cita') return Number(i.s?.duracion_min || 60);
  return 30;
}
// reparte en carriles los que se cruzan, para que no queden uno encima del otro
function carriles(items) {
  const orden = [...items].sort((a, b) => a.ini - b.ini || b.fin - a.fin); let grupo = []; let finGrupo = -1;
  const cerrar = () => { const n = Math.max(...grupo.map((x) => x.carril)) + 1; grupo.forEach((x) => { x.de = n; }); grupo = []; };
  for (const it of orden) {
    if (grupo.length && it.ini >= finGrupo) cerrar();
    const usados = grupo.filter((x) => x.fin > it.ini).map((x) => x.carril);
    let c = 0; while (usados.includes(c)) c++;
    it.carril = c; grupo.push(it); finGrupo = Math.max(finGrupo, it.fin);
  }
  if (grupo.length) cerrar();
  return orden;
}

function diasCalendario() {
  const ui = S.ui.agenda;
  const l = lunesDe(ui.fecha); return Array.from({ length: 7 }, (_, k) => addDays(l, k));
}
function tituloCalendario() {
  const d = diasCalendario(); return `${fechaCorta(d[0])} al ${fechaCorta(d.at(-1))}`;
}

function agendaCalendario() {
  const h = horarioDe(S.negocio); const dias = diasCalendario();
  // rango visible: el horario de atención más amplio y cualquier cosa agendada fuera de él
  let ini = 24 * 60, fin = 0;
  for (const f of dias) {
    const hd = horarioDia(h, new Date(f + 'T12:00:00').getDay()); if (hd) { ini = Math.min(ini, aMin(hd.desde)); fin = Math.max(fin, aMin(hd.hasta)); }
    for (const i of itemsDelDia(f).filter(enAgenda)) if (i.hora) { const m = aMin(i.hora); ini = Math.min(ini, m); fin = Math.max(fin, m + duracionItem(i)); }
    for (const b of bloqueosDel(f)) if (b.hora) { const [a, z] = rangoBloqueo(b); ini = Math.min(ini, a); fin = Math.max(fin, z); }
  }
  if (fin <= ini) { ini = 9 * 60; fin = 20 * 60; }
  ini = Math.max(0, Math.floor(ini / 60) * 60 - 60); fin = Math.min(24 * 60, Math.ceil(fin / 60) * 60 + 60);
  const alto = (fin - ini) * MIN_PX; const y = (m) => (m - ini) * MIN_PX;
  const horas = []; for (let m = ini; m < fin; m += 60) horas.push(m);
  const ahora = new Date(); const minAhora = ahora.getHours() * 60 + ahora.getMinutes();

  const col = (f) => {
    const dow = new Date(f + 'T12:00:00').getDay(); const hd = horarioDia(h, dow);
    const items = itemsDelDia(f).filter(enAgenda);
    const sinHora = items.filter((i) => !i.hora);
    const conHora = carriles(items.filter((i) => i.hora).map((i) => { const a = aMin(i.hora); return { i, ini: a, fin: a + duracionItem(i) }; }));
    const bloq = bloqueosDel(f);
    // zonas sombreadas fuera del horario
    const sombras = hd ? [[ini, aMin(hd.desde)], [aMin(hd.hasta), fin]].filter(([a, z]) => z > a) : [[ini, fin]];
    return `<div class="cal-col ${f === hoy() ? 'hoy' : ''} ${hd ? '' : 'cerrado'}" data-f="${f}" data-ini="${ini}" style="height:${alto}px">
      ${sombras.map(([a, z]) => `<div class="cal-fuera" style="top:${y(a)}px;height:${(z - a) * MIN_PX}px"></div>`).join('')}
      ${bloq.map((b) => { const [a, z] = rangoBloqueo(b); const ta = Math.max(a, ini), tz = Math.min(z, fin); return tz > ta ? `<button class="cal-bloq" data-act="bloqueo" data-id="${b.id}" style="top:${y(ta)}px;height:${(tz - ta) * MIN_PX}px"><b>Bloqueado</b><small>${esc(b.titulo && b.titulo !== 'Bloqueado' ? b.titulo : textoBloqueo(b))}</small></button>` : ''; }).join('')}
      ${conHora.map(({ i, ini: a, fin: z, carril, de }) => {
        const [est] = (i.kind === 'cita' ? ESTADOS_CITA : ESTADOS_EV)[i.estado] || [''];
        const corto = (z - a) * MIN_PX < 52; const col = i.kind === 'cita' ? colorEmpleado(i.ref.empleado_id) : '';
        const mov = esMovil(); const nom = de >= 3 || (mov && de >= 2) ? iniciales(i.titulo) : mov || de === 2 ? primerNombre(i.titulo) : i.titulo;
        return `<button class="cal-ev ${KIND[i.kind].cls} ${i.kind === 'cita' ? 'e-' + i.estado : ''} ${i.estado === 'solicitada' ? 'req' : ''} ${['completada', 'entregada', 'hecha'].includes(i.estado) ? 'hecho' : ''} ${corto ? 'corto' : ''} ${de >= 2 || mov ? 'estrecho' : ''} ${de >= 3 || (mov && de >= 2) ? 'muy-estrecho' : ''}" data-act="ag-detalle" data-id="${i.id}" data-kind="${i.kind}"
          style="${col ? `--ev:${col};` : ''}top:${y(a)}px;height:${Math.max(22, (z - a) * MIN_PX - 2)}px;left:calc(${(carril / de) * 100}% + 2px);width:calc(${100 / de}% - 4px)" title="${esc(`${i.hora} ${i.titulo} · ${i.sub} · ${est}`)}">
          ${i.kind === 'cita' && i.estado !== 'solicitada' ? `<i class="cal-est e-${i.estado}" aria-hidden="true"></i>` : ''}<span class="cal-h num">${i.hora}${i.kind === 'cita' && i.estado !== 'solicitada' && !corto ? ` · <span class="cal-est-t">${est}</span>` : ''}</span><b>${esc(nom)}</b>${corto ? '' : `<small>${esc(i.kind === 'cita' ? i.s?.nombre || '' : i.sub)}</small>`}${i.estado === 'solicitada' ? '<em>Por confirmar</em>' : ''}</button>`;
      }).join('')}
      ${f === hoy() && minAhora >= ini && minAhora <= fin ? `<div class="cal-ahora" style="top:${y(minAhora)}px"></div>` : ''}
    </div>`;
  };

  const cab = dias.map((f) => {
    const d = new Date(f + 'T12:00:00'); const sinHora = itemsDelDia(f).filter(enAgenda).filter((i) => !i.hora);
    return `<div class="cal-cab ${f === hoy() ? 'hoy' : ''}"><button class="cal-dia" data-act="ag-ir-dia" data-f="${f}"><span>${d.toLocaleDateString('es-CL', { weekday: 'short' })}</span><b>${d.getDate()}</b></button>
      ${diaCerrado(f) ? '<small class="cal-nota">Cerrado</small>' : bloqueoTotal(f) ? '<small class="cal-nota">Bloqueado</small>' : ''}
      ${sinHora.map((i) => `<button class="cal-todo ${KIND[i.kind].cls}" data-act="ag-detalle" data-id="${i.id}" data-kind="${i.kind}">${esc(i.titulo)}</button>`).join('')}</div>`;
  }).join('');

  return `<div class="card cal-card"><div class="cal" style="--dias:${dias.length}">
    <div class="cal-esq"></div>${cab}
    <div class="cal-horas" style="height:${alto}px">${horas.map((m) => `<span style="top:${y(m)}px">${deMin(m)}</span>`).join('')}</div>
    ${dias.map(col).join('')}
  </div>
  <div class="legend cal-ley"><span><i class="cal-est e-agendada"></i>Agendada</span><span><i class="cal-est e-confirmada"></i>Confirmada</span><span><i class="cal-est e-asistio"></i>Asistió</span><span><i class="cal-est e-completada"></i>Pagada</span><span><i class="ley-req"></i>Por confirmar</span><span><i class="ley-bloq"></i>Bloqueado</span><span><i class="ley-fuera"></i>Fuera de tu horario</span><span class="muted">Toca un espacio libre para agendar o bloquear</span></div></div>`;
}

// tocar un espacio libre del calendario
document.addEventListener('click', (e) => {
  const c = e.target.closest?.('.cal-col'); if (!c || e.target.closest('button')) return;
  const r = c.getBoundingClientRect(); const paso = 10;
  const m = Math.floor(((e.clientY - r.top) / MIN_PX + Number(c.dataset.ini)) / paso) * paso;
  elegirEnHueco(c.dataset.f, deMin(Math.max(0, Math.min(m, 23 * 60 + 50))));
});
function elegirEnHueco(f, hora) {
  const h = horarioDe(S.negocio); const hd = horarioDia(h, new Date(f + 'T12:00:00').getDay());
  const fuera = !hd || aMin(hora) < aMin(hd.desde) || aMin(hora) >= aMin(hd.hasta);
  const bq = bloqueosDel(f).find((b) => { const [a, z] = rangoBloqueo(b); return aMin(hora) >= a && aMin(hora) < z; });
  const ops = [
    tiene('servicios') && ['cita', 'cal', 'Agendar una hora aquí', fuera ? 'Para una clienta, aunque sea fuera de tu horario' : 'Para una clienta, con servicio y quién atiende'],
    ['bloqueo-aqui', 'lock', 'Bloquear este horario', 'Nadie podrá reservar en tu página a esta hora'],
    ['tarea', 'edit', 'Recordatorio', 'Algo que tienes que hacer a esta hora'],
  ].filter(Boolean);
  abrirSheet(`${fechaLarga(f)}, ${hora}`, `${fuera ? `<div class="banner warn-soft">${icon('clock')}<span>${hd ? `Atiendes de ${hd.desde} a ${hd.hasta}.` : 'Este día no atiendes según tu horario de reservas.'} Tú puedes agendar igual; tu página pública no lo ofrece.</span></div>` : ''}
    ${bq ? `<div class="banner">${icon('lock')}<span>Este horario está bloqueado (${esc(textoBloqueo(bq))}). Puedes agendar igual o <a href="#" data-act="bloqueo" data-id="${bq.id}">editar el bloqueo</a>.</span></div>` : ''}
    <div class="stack">${ops.map(([k, ic, t, d]) => `<button type="button" class="alert-row hueco-op" data-act="hueco" data-k="${k}" data-f="${f}" data-h="${hora}">${icon(ic)}<div class="grow"><b>${t}</b><small>${d}</small></div>${icon('right')}</button>`).join('')}</div>`);
}

/* ---------- bloquear horarios ---------- */
function formBloqueo(id, pre = {}) {
  const b = id ? db.get('eventos', id) : { fecha: pre.fecha || S.ui.agenda.fecha || hoy(), hora: pre.hora || '13:00', hasta: pre.hasta || '', titulo: '', ...pre };
  const todo = id ? !b.hora : !!pre.todo;
  const hasta = b.hasta ? hhmm(b.hasta) : deMin(Math.min(aMin(hhmm(b.hora) || '13:00') + 60, 23 * 60 + 50));
  abrirSheet(id ? 'Editar bloqueo' : 'Bloquear horario', `<p class="small muted" style="margin-top:-6px">En ese horario tu página de reservas no ofrece horas. Tú igual puedes agendar si lo necesitas.</p>
    ${field('Motivo', `<input class="in" name="titulo" id="f-bq-titulo" value="${esc(b.titulo && b.titulo !== 'Bloqueado' ? b.titulo : '')}" placeholder="Almuerzo, trámite, vacaciones… (opcional)">`)}
    <div class="form-row">${field('Fecha', `<input class="in" type="date" name="fecha" id="f-bq-fecha" value="${b.fecha}" required>`)}${id ? '<span></span>' : field('Repetir hasta', `<input class="in" type="date" name="repetir" id="f-bq-rep" min="${b.fecha}">`, 'Opcional. Para vacaciones o varios días seguidos.')}</div>
    <label class="hstack" style="gap:10px"><span class="toggle"><input type="checkbox" name="todo" id="f-bq-todo" ${todo ? 'checked' : ''} data-change="bq-todo"><span></span></span><span>Todo el día</span></label>
    <div class="form-row bq-horas" ${todo ? 'hidden' : ''}>${field('Desde', selHora('hora', hhmm(b.hora) || '13:00', { id: 'f-bq-desde', desde: '05:00', hasta: '23:40' }))}${field('Hasta', selHora('hasta', hasta, { id: 'f-bq-hasta', desde: '05:10', hasta: '23:50' }))}</div>
    ${id ? `<button type="button" class="btn ghost danger" data-act="del-bloqueo" data-id="${id}" style="align-self:flex-start">${icon('trash')}Quitar bloqueo</button>` : ''}`, {
    submit: (d) => {
      const todoDia = !!d.todo; const desde = todoDia ? null : d.hora; const hastaH = todoDia ? null : d.hasta;
      if (!todoDia && aMin(hastaH) <= aMin(desde)) return errorCampo('#f-bq-hasta', 'Tiene que terminar después de que empieza');
      const row = { tipo: 'bloqueo', titulo: d.titulo.trim() || 'Bloqueado', fecha: d.fecha, hora: desde, hasta: hastaH, cliente_id: null, direccion: '', monto: 0, pagado: false, nota: '' };
      if (id) { db.update('eventos', id, row); toast('Bloqueo actualizado'); }
      else {
        const fin = d.repetir && d.repetir > d.fecha ? d.repetir : d.fecha; let f = d.fecha; let n = 0;
        while (f <= fin && n < 62) { db.insert('eventos', { ...row, fecha: f, estado: 'pendiente', venta_id: null }); f = addDays(f, 1); n++; }
        toast(n > 1 ? `${n} días bloqueados` : 'Horario bloqueado');
      }
      cerrarSheet(); S.ui.agenda.fecha = d.fecha; render();
    },
  });
}

const COLORES_EQUIPO = ['#0E7C86', '#C2477A', '#5B6CC2', '#B5732E', '#3F8F5A', '#8A5BB5', '#C24B3A', '#2F7FA8'];
function colorEmpleado(id) { if (!id) return ''; const i = db.all('empleados').findIndex((e) => e.id === id); return i < 0 ? '' : COLORES_EQUIPO[i % COLORES_EQUIPO.length]; }

/* =========================================================
   Agenda en el calendario personal (Google, iPhone, Outlook)
   - Suscripción: enlace secreto que se actualiza solo (requiere la nube)
   - Archivo .ics: una copia de las próximas horas para importar
   ========================================================= */

const icsTxt = (t) => String(t ?? '').replace(/\\/g, '\\\\').replace(/;/g, '\;').replace(/,/g, '\\,').replace(/\r?\n/g, '\\n');
const icsFecha = (f, h) => f.replace(/-/g, '') + (h ? 'T' + h.replace(':', '') + '00' : '');
// las líneas de más de 75 caracteres se doblan, como pide el formato
const icsLinea = (l) => { const out = []; let s = l; while (s.length > 74) { out.push(s.slice(0, 74)); s = ' ' + s.slice(74); } out.push(s); return out.join('\r\n'); };

function generarICS(desde = addDays(hoy(), -30), hasta = addDays(hoy(), 180)) {
  const ahora = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d+/, '');
  const ev = [];
  for (const c of db.all('citas')) {
    if (c.fecha < desde || c.fecha > hasta || INACTIVOS.includes(c.estado)) continue;
    const s = db.get('servicios', c.servicio_id); const cl = db.get('clientes', c.cliente_id); const e = db.get('empleados', c.empleado_id);
    const ini = hhmm(c.hora); const fin = ini ? deMin(Math.min(aMin(ini) + Number(s?.duracion_min || 60), 23 * 60 + 59)) : null;
    ev.push({ uid: 'cita-' + c.id, f: c.fecha, ini, fin, t: (cl?.nombre || 'Cliente') + (s ? ' · ' + s.nombre : ''),
      d: [ESTADOS_CITA[c.estado]?.[0], e && 'Atiende: ' + e.nombre, cl?.telefono && 'Teléfono: ' + cl.telefono, c.nota].filter(Boolean).join('\n') });
  }
  for (const x of db.all('eventos')) {
    if (x.fecha < desde || x.fecha > hasta || x.estado === 'cancelada') continue;
    const ini = hhmm(x.hora) || null;
    const fin = ini ? (x.tipo === 'bloqueo' && x.hasta ? hhmm(x.hasta) : deMin(Math.min(aMin(ini) + 30, 23 * 60 + 59))) : null;
    const t = x.tipo === 'bloqueo' ? 'Bloqueado' + (x.titulo && x.titulo !== 'Bloqueado' ? ': ' + x.titulo : '') : x.tipo === 'entrega' ? 'Entrega: ' + x.titulo : x.titulo;
    ev.push({ uid: 'ev-' + x.id, f: x.fecha, ini, fin, t, d: x.direccion || '' });
  }
  const L = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//MiDerno//Agenda//ES', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH', 'X-WR-CALNAME:' + icsTxt(S.negocio.nombre + ' · Agenda'), 'X-WR-TIMEZONE:America/Santiago'];
  for (const e of ev.sort((a, b) => (a.f + (a.ini || '')).localeCompare(b.f + (b.ini || '')))) {
    L.push('BEGIN:VEVENT', `UID:${e.uid}@miderno`, `DTSTAMP:${ahora}`,
      e.ini ? `DTSTART;TZID=America/Santiago:${icsFecha(e.f, e.ini)}` : `DTSTART;VALUE=DATE:${icsFecha(e.f)}`,
      e.ini ? `DTEND;TZID=America/Santiago:${icsFecha(e.f, e.fin)}` : `DTEND;VALUE=DATE:${icsFecha(addDays(e.f, 1))}`,
      'SUMMARY:' + icsTxt(e.t), ...(e.d ? ['DESCRIPTION:' + icsTxt(e.d)] : []), 'END:VEVENT');
  }
  L.push('END:VCALENDAR');
  return L.map(icsLinea).join('\r\n') + '\r\n';
}
function descargarICS() {
  const blob = new Blob([generarICS()], { type: 'text/calendar;charset=utf-8' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `agenda-${slugDe(S.negocio.nombre)}.ics`;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  toast('Archivo descargado. Ábrelo para agregarlo a tu calendario.');
}
const nuevoTokenICS = () => [...crypto.getRandomValues(new Uint8Array(20))].map((b) => b.toString(16).padStart(2, '0')).join('');
const urlICS = (token) => `${CONFIG.supabaseUrl}/rest/v1/rpc/agenda_ics?token=${token}&apikey=${encodeURIComponent(CONFIG.supabaseAnonKey)}`;

  abrirSheet('Exportar o importar tu agenda', `<p class="small muted" style="margin-top:-6px">Ve tus citas, entregas y bloqueos junto a tus compromisos personales en Google Calendar, iPhone u Outlook.</p>

/* =========================================================
   Redes sociales: ideas de publicaciones hechas con los datos
   reales del negocio (horas libres, servicios más pedidos,
   fechas especiales) + enlace para la bio con seguimiento.
   ========================================================= */

const ORIGENES = { ig: 'Instagram', fb: 'Facebook', tt: 'TikTok', wa: 'WhatsApp', gm: 'Google Maps' };
const reOrigen = (k) => new RegExp('desde ' + ORIGENES[k], 'i');

// ciudad: lo que va después de la última coma de la dirección ("Membrillar 50, oficina 24, Rancagua")
const ciudadNegocio = () => { const d = String(cfg().direccion || '').split(',').map((x) => x.trim()).filter(Boolean); return d.length > 1 ? d.at(-1) : ''; };
const hashtag = (t) => '#' + norm(t).replace(/[^a-z0-9]+/g, '');

function hashtagsNegocio(extra = []) {
  const r = norm([S.negocio.rubro, S.negocio.nombre, ...db.all('servicios').map((x) => x.nombre), ...db.all('productos').slice(0, 20).map((x) => x.nombre)].join(' ')); const c = ciudadNegocio(); const base = [];
  if (/\buna|nail|manicur|esmalt|kapping|acrilic/.test(r)) base.push('uñas', 'nails', 'manicure');
  else if (/pelu|barber|cabello|corte/.test(r)) base.push('peluqueria', 'barberia', 'cortedepelo');
  else if (/estetic|spa|facial|depil/.test(r)) base.push('estetica', 'skincare', 'belleza');
  else if (/vela|aroma/.test(r)) base.push('velas', 'velasaromaticas', 'hechoamano');
  else if (/tienda|ropa|moda/.test(r)) base.push('tiendaonline', 'moda', 'emprendimiento');
  else base.push('emprendimiento', 'pyme');
  if (c) base.push(c, ...base.slice(0, 2).map((b) => b + c));
  return [...new Set([...extra, ...base])].slice(0, 8).map(hashtag).join(' ');
}

// horas libres de los próximos días, vistas desde el negocio (citas y bloqueos)
function horasLibresProximas(dias = 6) {
  const h = horarioDe(S.negocio); const emps = db.all('empleados').filter((e) => e.activo !== false).map((e) => ({ id: e.id }));
  const durs = db.all('servicios').filter((s) => s.activo !== false).map((s) => Number(s.duracion_min || 60)); const dur = durs.length ? Math.min(...durs, 60) : 60;
  const out = [];
  for (let k = 0; k < dias; k++) {
    const f = addDays(hoy(), k);
    const ocupadas = [...db.all('citas').filter((c) => c.fecha === f && !INACTIVOS.includes(c.estado)).map((c) => ({ hora: hhmm(c.hora), dur: Number(db.get('servicios', c.servicio_id)?.duracion_min || 60), empleado_id: c.empleado_id })),
      ...bloqueosDel(f).map((b) => { const [a, z] = rangoBloqueo(b); return { hora: deMin(a), dur: z - a, empleado_id: null, todos: true }; })];
    const libres = horasLibres({ horario: h, fecha: f, dur, ocupadas, empleados: emps, empleadoId: null }).map((x) => x.hora);
    // horas "redondas" (en punto o y media) para que el mensaje se lea limpio
    const lindas = libres.filter((x) => /:(00|30)$/.test(x));
    if (lindas.length) out.push({ f, horas: lindas });
  }
  return out;
}

function serviciosRanking(diasAtras = 45) {
  const desde = addDays(hoy(), -diasAtras); const ventas = new Set(db.all('ventas').filter((v) => v.fecha >= desde).map((v) => v.id)); const m = new Map();
  for (const i of db.all('venta_items')) if (ventas.has(i.venta_id) && i.item_id) { const k = i.tipo_item + ':' + i.item_id; const x = m.get(k) || { tipo: i.tipo_item, id: i.item_id, nombre: i.nombre, n: 0 }; x.n += Number(i.cantidad || 1); m.set(k, x); }
  return [...m.values()].sort((a, b) => b.n - a.n);
}

// días de la semana con más ventas (para sugerir cuándo publicar)
function diasFuertes() {
  const desde = addDays(hoy(), -90); const c = [0, 0, 0, 0, 0, 0, 0];
  for (const v of db.all('ventas')) if (v.fecha >= desde) c[new Date(v.fecha + 'T12:00:00').getDay()]++;
  const tot = c.reduce((a, b) => a + b, 0); if (tot < 10) return null;
  return c.map((n, d) => ({ d, n })).sort((a, b) => b.n - a.n).slice(0, 2).map((x) => x.d);
}
const NOMBRE_DIA = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];

function fechasEspeciales(ventana = 40) {
  const y = Number(hoy().slice(0, 4)); const nDom = (yy, mes, n) => { const d = new Date(yy, mes - 1, 1); const off = (7 - d.getDay()) % 7; return isoDate(new Date(yy, mes - 1, 1 + off + 7 * (n - 1))); };
  const blackFriday = (yy) => { const d = new Date(yy, 10, 1); const off = (5 - d.getDay() + 7) % 7; return isoDate(new Date(yy, 10, 1 + off + 21)); };
  const lista = [];
  for (const yy of [y, y + 1]) lista.push(
    { f: `${yy}-02-14`, t: 'San Valentín', idea: 'Regalo para San Valentín: una gift card o un servicio para compartir.' },
    { f: `${yy}-03-08`, t: 'Día de la Mujer', idea: 'Un saludo a tus clientas y una atención especial esa semana.' },

    { f: nDom(yy, 5, 2), t: 'Día de la Madre', idea: 'Gift cards y servicios para regalar a mamá.' },
    { f: nDom(yy, 6, 3), t: 'Día del Padre', idea: 'Una opción de regalo para papá.' },
    { f: `${yy}-09-18`, t: 'Fiestas Patrias', idea: 'Horario especial de Fiestas Patrias y horas para llegar impecable a las celebraciones.' },
    { f: `${yy}-10-31`, t: 'Halloween', idea: 'Un diseño o producto temático de Halloween.' },
    { f: blackFriday(yy), t: 'Black Friday', idea: 'Un beneficio por tiempo limitado para clientas nuevas y frecuentes.' },
    { f: `${yy}-12-24`, t: 'Navidad', idea: 'Gift cards de Navidad y horas para las fiestas de fin de año.' },
    { f: `${yy}-12-31`, t: 'Año Nuevo', idea: 'Horas para Año Nuevo y agradecimiento a tus clientas por el año.' },
  );
  const H = hoy(), lim = addDays(H, ventana);
  return lista.filter((x) => x.f >= H && x.f <= lim).sort((a, b) => a.f.localeCompare(b.f));

/* =========================================================
   Crecer: el ayudante comercial del negocio.
   Cada día arma una lista corta de acciones concretas con los
   datos del negocio (a quién escribir hoy y por qué), deja el
   mensaje listo y mide qué resultó.
   ========================================================= */

/* ---------- registro de contactos (en este dispositivo) ---------- */
const claveAcc = () => 'miderno:acciones:' + (S.negocio?.id || '');
const logAcc = () => { try { return JSON.parse(localStorage.getItem(claveAcc()) || '[]'); } catch { return []; } };
function registrarAcc(tipo, clienteId) {
  try { const l = logAcc(); l.push({ t: tipo, c: clienteId, f: hoy() }); localStorage.setItem(claveAcc(), JSON.stringify(l.slice(-600))); } catch {}
}
// ¿se le escribió a este cliente por este motivo en los últimos N días?
const contactado = (tipo, clienteId, dias) => { const lim = addDays(hoy(), -dias); return logAcc().some((x) => x.c === clienteId && x.t === tipo && x.f >= lim); };

/* ---------- ciclo de cada servicio (cada cuántos días conviene volver) ---------- */
function cicloSugerido(nombre) {
  const n = norm(nombre);
  if (/retiro/.test(n)) return 0;
  if (/permanente|semipermanente|esmalt|kapping|gel|acrilic|softgel|polygel|manicur|nail/.test(n)) return 21;
  if (/pedicur/.test(n)) return 30;
  if (/corte|barba|fade/.test(n)) return 35;
  if (/tint|color|mecha|balayage|decolor/.test(n)) return 49;
  if (/depil|cera|laser/.test(n)) return 28;
  if (/facial|limpieza|peeling/.test(n)) return 30;
  if (/pestan|ceja|lifting|lash/.test(n)) return 28;
  if (/masaje/.test(n)) return 21;
  return 30;
}
const cicloDe = (s) => { if (!s) return 0; const c = cfg().ciclos?.[s.id]; return c != null && c !== '' ? Number(c) : cicloSugerido(s.nombre); };

/* ---------- lectura de los datos para las acciones ---------- */
function historialClientes() {
  // por cliente: fechas de compra (sin repetir), total, último servicio
  const m = new Map();
  const ventas = [...db.all('ventas')].filter((v) => v.cliente_id).sort((a, b) => a.fecha.localeCompare(b.fecha));
  for (const v of ventas) {
    const x = m.get(v.cliente_id) || { fechas: [], total: 0, ultServ: null, ultServFecha: null };
    if (x.fechas.at(-1) !== v.fecha) x.fechas.push(v.fecha);
    x.total += Number(v.total);
    for (const i of itemsDeVenta(v.id)) if (i.tipo_item === 'servicio' && i.item_id && cicloDe(db.get('servicios', i.item_id)) > 0) { x.ultServ = i.item_id; x.ultServFecha = v.fecha; }
    m.set(v.cliente_id, x);
  }
  return m;
}
// cada cuántos días vuelve normalmente (mediana de sus intervalos)
function frecuenciaDe(fechas) {
  if (fechas.length < 3) return null;
  const d = []; for (let i = 1; i < fechas.length; i++) d.push(diasEntre(fechas[i - 1], fechas[i]));
  d.sort((a, b) => a - b); return d[Math.floor(d.length / 2)];
}
function ticketReciente() {
  const desde = addDays(hoy(), -90); const vs = db.all('ventas').filter((v) => v.fecha >= desde);
  return vs.length ? sum(vs, (v) => Number(v.total)) / vs.length : 0;
}

function accionesDeHoy() {
  const H = hoy(); const man = addDays(H, 1); const ticket = ticketReciente(); const acc = [];
  const cli = (id) => db.get('clientes', id); const hist = historialClientes(); const usados = new Set();
  const fila = (c, detalle, texto, tipo, extra = {}) => ({ c, detalle, texto, tipo, ...extra });

  // 1. recordar las horas de mañana (menos inasistencias)
  if (tiene('servicios')) {
    const yaAv = avisadas();
    const citas = db.all('citas').filter((c) => c.fecha === man && ['agendada', 'confirmada', 'solicitada'].includes(c.estado) && !yaAv.has(c.id))
      .sort((a, b) => hhmm(a.hora).localeCompare(hhmm(b.hora)));
    const filas = citas.map((c) => { const cl = cli(c.cliente_id); const s = db.get('servicios', c.servicio_id); return cl ? fila(cl, `${hhmm(c.hora)} · ${s?.nombre || 'Cita'}`, msg('recordatorio', { nombre: primerNombre(cl.nombre), servicio: s?.nombre || 'atención', fecha: fechaLarga(c.fecha), hora: hhmm(c.hora) }), 'recordatorio', { citaId: c.id }) : null; }).filter(Boolean);
    if (filas.length) acc.push({ k: 'recordar', t: 'Confirma las horas de mañana', por: 'Un recordatorio el día anterior reduce las inasistencias y te deja tiempo para llenar la hora si alguien cancela.', filas, valor: sum(citas, (c) => Number(db.get('servicios', c.servicio_id)?.precio || 0)), etiqueta: 'en citas de mañana' });
  }

  // 2. mantención: se cumplió el ciclo del último servicio
  if (tiene('servicios')) {
    const filas = [];
    for (const [id, x] of hist) {
      const c = cli(id); if (!c || !x.ultServ || proximaCita(id)) continue;
      const s = db.get('servicios', x.ultServ); const ciclo = cicloDe(s); const dias = diasEntre(x.ultServFecha, H);
      if (dias < ciclo - 2 || dias > ciclo + 10 || contactado('mantencion', id, ciclo)) continue;
      filas.push(fila(c, `${s.nombre} hace ${dias} días`, msg('mantencion', { nombre: primerNombre(c.nombre), servicio: s.nombre, semanas: Math.max(1, Math.round(dias / 7)) }), 'mantencion', { orden: -x.total }));
      usados.add(id);
    }
    if (filas.length) acc.push({ k: 'mantencion', t: 'A estas clientas les toca su mantención', por: 'Se cumplió el ciclo de su último servicio y no tienen hora. Es el mejor momento para escribirles.', filas: filas.sort((a, b) => a.orden - b.orden), valor: filas.length * ticket, etiqueta: 'si vuelven' });
  }

  // 3. reactivar según la frecuencia propia de cada cliente
  {
    const filas = [];
    for (const [id, x] of hist) {
      if (usados.has(id) || proximaCita(id)) continue; const c = cli(id); if (!c) continue;
      const dias = diasEntre(x.fechas.at(-1), H); const fr = frecuenciaDe(x.fechas) || DIAS_REACTIVAR;
      const limite = Math.max(14, Math.round(fr * 1.4));
      if (dias < limite || dias > 240 || contactado('reactivar', id, 30)) continue;
      filas.push(fila(c, `Cada ${fr} días · última hace ${dias}`, msg('reactivar', { nombre: primerNombre(c.nombre), dias }), 'reactivar', { orden: -x.total }));
    }
    if (filas.length) acc.push({ k: 'reactivar', t: 'Clientes que se están demorando más de lo normal', por: 'Cada cliente tiene su propio ritmo. Estos ya pasaron bastante de su frecuencia habitual; primero los que más te compran.', filas: filas.sort((a, b) => a.orden - b.orden), valor: filas.length * ticket, etiqueta: 'si vuelven' });
  }

  // 4. seguimiento a quienes vinieron por primera vez
  {
    const prim = primerasCompras(); const filas = [];
    for (const [id, f] of prim) {
      const d = diasEntre(f, H); if (d < 3 || d > 7 || contactado('posventa', id, 60)) continue; const c = cli(id); if (!c) continue;
      const v = db.all('ventas').find((x) => x.cliente_id === id && x.fecha === f); const it = v ? itemsDeVenta(v.id)[0] : null;
      filas.push(fila(c, `Primera visita hace ${d} días`, msg('posventa', { nombre: primerNombre(c.nombre), servicio: it?.nombre || 'compra' }), 'posventa'));
    }
    if (filas.length) acc.push({ k: 'posventa', t: 'Pregunta cómo les fue a las clientas nuevas', por: 'Un mensaje unos días después de la primera visita aumenta la probabilidad de que vuelvan y detecta problemas antes de una mala reseña.', filas });
  }

  // 5. pedir reseña a quienes compraron estos días
  if (urlSegura(cfg().resenas_url)) {
    const desde = addDays(H, -3); const vistos = new Set(); const filas = [];
    for (const v of db.all('ventas')) {
      if (v.fecha < desde || !v.cliente_id || vistos.has(v.cliente_id) || contactado('resena', v.cliente_id, 120)) continue;
      const c = cli(v.cliente_id); if (!c) continue; vistos.add(c.id);
      filas.push(fila(c, `Compró el ${fechaCorta(v.fecha)}`, msg('resena', { nombre: primerNombre(c.nombre), link_resena: cfg().resenas_url }), 'resena'));
    }
    if (filas.length) acc.push({ k: 'resena', t: 'Pide una reseña en Google', por: 'Las reseñas recientes son lo que más pesa cuando alguien te encuentra en Google Maps. Pídela mientras la experiencia está fresca.', filas });
  }

  // 6. cumpleaños de los próximos 7 días
  {
    const proximos = Array.from({ length: 8 }, (_, i) => addDays(H, i).slice(5)); const filas = [];
    for (const c of db.all('clientes')) {
      if (!c.cumpleanos) continue; const k = proximos.indexOf(c.cumpleanos.slice(5)); if (k < 0 || contactado('cumple', c.id, 300)) continue;
      filas.push(fila(c, k === 0 ? 'Cumple hoy' : `Cumple el ${fechaCorta(addDays(H, k))}`, msg('cumple', { nombre: primerNombre(c.nombre) }), 'cumple', { orden: k }));
    }
    if (filas.length) acc.push({ k: 'cumple', t: 'Cumpleaños de esta semana', por: 'Un saludo con un beneficio para usar este mes es una razón natural para volver.', filas: filas.sort((a, b) => a.orden - b.orden) });
  }

  // 7. productos sin ventas en 60 días (capital detenido)
  if (tiene('inventario')) {
    const desde = addDays(H, -60); const vendidos = new Set();
    const vIds = new Set(db.all('ventas').filter((v) => v.fecha >= desde).map((v) => v.id));
    for (const i of db.all('venta_items')) if (vIds.has(i.venta_id) && i.tipo_item === 'producto') vendidos.add(i.item_id);
    const quietos = db.all('productos').filter((p) => p.activo !== false && !vendidos.has(p.id) && stockDe('producto', p.id) > 0);
    if (quietos.length) acc.push({ k: 'stock', t: `${quietos.length} ${quietos.length === 1 ? 'producto no se ha vendido' : 'productos no se han vendido'} en 60 días`, por: 'Es capital detenido. Arma un pack, ponlos junto a la caja o publícalos esta semana.', productos: quietos.slice(0, 8),
      valor: sum(quietos, (p) => stockDe('producto', p.id) * Number(costoProducto(p) || 0)), etiqueta: 'invertidos en ese stock' });
  }
  return acc;
}

/* ---------- resultados: quién volvió después de un mensaje ---------- */
function resultadosAcc(dias = 30) {
  const desde = addDays(hoy(), -dias); const log = logAcc().filter((x) => x.f >= desde && x.t !== 'recordatorio' && x.t !== 'resena');
  const porCliente = new Map(); for (const x of log) if (!porCliente.has(x.c) || x.f < porCliente.get(x.c)) porCliente.set(x.c, x.f);
  let volvieron = 0, monto = 0;
  for (const [id, f] of porCliente) {
    const vs = db.all('ventas').filter((v) => v.cliente_id === id && v.fecha >= f); const cs = db.all('citas').filter((c) => c.cliente_id === id && c.fecha >= f && !INACTIVOS.includes(c.estado));
    if (vs.length || cs.length) { volvieron++; monto += sum(vs, (v) => Number(v.total)); }
  }
  return { enviados: logAcc().filter((x) => x.f >= desde).length, contactados: porCliente.size, volvieron, monto };
}

function parseHora(v) {

  if (typeof v === 'number') { const f = v % 1; if (v >= 0 && v < 1) return deMin(v * 1440); if (f > 0.0001) return deMin(f * 1440); if (v >= 6 && v <= 23 && Number.isInteger(v)) return `${pad(v)}:00`; return null; }

  if (!m[2] && !suf && !/^\d{1,2}$/.test(s.trim())) return null;

  if (h > 23 || mi > 59) return null;

/* ---------- cruce de filas sin fecha ----------

   entre lo que ya está en MiDerno y lo que trae el archivo con fecha. */
function cruzarSinFecha(o, { clientePorTel, clientePorNombre, ventas, citas, itemsDe }) {
  const tel = telLimpio(o.telefono || ''); const cli = (tel && clientePorTel.get(tel)) || (o.cliente ? clientePorNombre.get(norm(o.cliente)) : null);
  const det = o.detalle || o.descripcion || ''; const item = buscarEnCatalogo(det); const nombre = norm(item?.x.nombre || det);
  const monto = Math.abs(o.total ?? o.ingreso ?? o.monto ?? 0);
  const mismoMonto = (v) => monto > 0 && Math.abs(Number(v.total) - monto) <= 1;
  const mismoNombre = (v) => !!nombre && itemsDe(v).some((n) => norm(n) === nombre);
  if (cli) {
    const vs = ventas.filter((v) => v.cliente_id === cli.id && !esVentaSinFecha(v) && (mismoMonto(v) || mismoNombre(v)));
    const cs = citas.filter((c) => c.cliente_id === cli.id && (!item || c.servicio_id === item.x.id));

    if (todos.length) return { ...todos[0], cli };

const campoEnUso = () => { const a = document.activeElement; return !!a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && !!a.closest('#app'); };

/* =========================================================
   v35: aviso de reservas nuevas
   - Con MiDerno abierto (en cualquier dispositivo) la reserva aparece
     al instante, con un aviso para confirmarla.
   - Si diste permiso, también llega como notificación del sistema
     (en iPhone, solo con MiDerno instalado en la pantalla de inicio).

   ========================================================= */

let _canalReservas = null, _canalNegocio = null;
const avisosPermitidos = () => 'Notification' in window && Notification.permission === 'granted';

async function escucharReservas() {
  if (S.modo !== 'nube' || !S.negocio || S.eq || S.pub || !tiene('servicios')) return;
  if (_canalNegocio === S.negocio.id && _canalReservas) return;
  try {
    const sb = await cargarSupabase();
    if (_canalReservas) { sb.removeChannel(_canalReservas); _canalReservas = null; }
    const nid = S.negocio.id; _canalNegocio = nid;
    _canalReservas = sb.channel('reservas-' + nid)
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'citas', filter: `negocio_id=eq.${nid}` }, (p) => llegoReserva(p.new))
      .subscribe();
  } catch (e) { console.warn('avisos', e); }
}
const dePagina = (c) => String(c?.nota || '').startsWith('Reservó desde la página');
async function llegoReserva(fila) {
  if (!fila || !S.negocio || fila.negocio_id !== S.negocio.id) return;
  if (!(fila.estado === 'solicitada' || (fila.estado === 'confirmada' && dePagina(fila)))) return;
  const { negocio_id, ...c } = fila;
  if (!db.get('citas', c.id)) { S.t.citas.push(c); _ver++; }
  // el cliente nuevo llega junto con la reserva: se trae para mostrar su nombre
  let nombre = db.get('clientes', c.cliente_id)?.nombre;
  if (!nombre && c.cliente_id) {
    try { const sb = await cargarSupabase(); const { data } = await sb.from('clientes').select('*').eq('id', c.cliente_id).maybeSingle();
      if (data) { const { negocio_id: _, ...cl } = data; if (!db.get('clientes', cl.id)) { S.t.clientes.push(cl); _ver++; } nombre = cl.nombre; } } catch {}
  }
  const serv = db.get('servicios', c.servicio_id)?.nombre || 'una hora';
  const cuando = `${fechaCorta(c.fecha)}, ${hhmm(c.hora)}`;
  guardarCacheNube();
  if (!ocupado()) render();
  avisoReserva(c, nombre || 'Una clienta', serv, cuando, c.estado === 'confirmada');
  marcarPendientes();
  if (document.hidden && avisosPermitidos()) {
    try {
      const reg = await navigator.serviceWorker?.getRegistration?.();
      const titulo = c.estado === 'confirmada' ? 'Nueva reserva' : 'Nueva reserva por confirmar'; const cuerpo = `${nombre || 'Una clienta'} · ${serv} · ${cuando}`;
      if (reg?.showNotification) reg.showNotification(titulo, { body: cuerpo, icon: 'logo-192.png', badge: 'logo-192.png', tag: 'reserva-' + c.id, data: { url: appUrl() + '#agenda' } });

  el.innerHTML = `<span class="ar-ico" aria-hidden="true">${icon('cal')}</span><span class="ar-txt"><b>${lista ? 'Nueva reserva (ya confirmada)' : 'Nueva reserva'}</b><small>${esc(nombre)} · ${esc(serv)} · ${esc(cuando)}</small></span>

/* ---------- v39: avisos push (llegan aunque MiDerno esté cerrado) ---------- */
const pushPosible = () => 'serviceWorker' in navigator && 'PushManager' in window && /^https:/.test(location.protocol);
const ub64 = (s) => Uint8Array.from(atob(s.replace(/-/g, '+').replace(/_/g, '/') + '==='.slice((s.length + 3) % 4)), (c) => c.charCodeAt(0));
async function suscribirPush(forzar = false) {
  if (!pushPosible() || !avisosPermitidos() || S.modo !== 'nube' || S.eq || !S.negocio) return false;
  try {
    const reg = await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if (!sub) {
      const r = await fetch(CONFIG.supabaseUrl + '/functions/v1/avisar-push', { headers: { apikey: CONFIG.supabaseAnonKey } });
      const { publica } = await r.json(); if (!publica) return false;
      sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: ub64(publica) });
    }
    const marca = S.negocio.id + '|' + sub.endpoint;
    if (!forzar && LS.get('miderno:push') === marca) return true;
    const j = sub.toJSON(); const sb = await cargarSupabase();
    const { error } = await sb.from('push_suscripciones').upsert({ endpoint: j.endpoint, negocio_id: S.negocio.id, p256dh: j.keys.p256dh, auth: j.keys.auth }, { onConflict: 'endpoint' });
    if (error) { console.warn('push', error); return false; }
    LS.set('miderno:push', marca); return true;
  } catch (e) { console.warn('push', e); return false; }
}

/* =========================================================
   v30: cuenta segura
   - Al crear la cuenta: repetir contraseña, aviso de fuerza y
     de correos mal escritos (gmial.com)
   - Verificar el correo: pantalla de espera con "Reenviar",
     "Cambiar correo" y "Ya lo confirmé"
   - Recuperar contraseña desde cualquier pantalla
   ========================================================= */

const CLAVE_MIN = 8;
// correos con el dominio mal escrito: "gmial.com" → "gmail.com"
const DOMINIOS = { 'gmial.com': 'gmail.com', 'gmal.com': 'gmail.com', 'gmai.com': 'gmail.com', 'gmail.co': 'gmail.com', 'gmail.cl': 'gmail.com', 'gamil.com': 'gmail.com', 'hotmal.com': 'hotmail.com', 'hotmial.com': 'hotmail.com', 'hotmail.co': 'hotmail.com', 'hotmai.com': 'hotmail.com', 'outlok.com': 'outlook.com', 'yahoo.co': 'yahoo.com', 'yaho.com': 'yahoo.com', 'icloud.co': 'icloud.com' };
function correoSugerido(c) { const m = String(c || '').trim().toLowerCase().match(/^([^@\s]+)@([^@\s]+)$/); return m && DOMINIOS[m[2]] ? `${m[1]}@${DOMINIOS[m[2]]}` : ''; }
const correoValido = (c) => /^[^@\s]+@[^@\s]+\.[a-z]{2,}$/i.test(String(c || '').trim());

// fuerza de la contraseña en palabras simples
function fuerzaClave(c) {
  c = String(c || ''); if (!c) return { n: 0, txt: '' };
  let p = 0; if (c.length >= CLAVE_MIN) p++; if (c.length >= 12) p++; if (/[a-záéíóúñ]/i.test(c) && /\d/.test(c)) p++; if (/[^a-z0-9áéíóúñ]/i.test(c) || (/[a-z]/.test(c) && /[A-Z]/.test(c))) p++;
  if (/^(1234|password|contrase|qwerty|miderno)/i.test(c) || /^(.)\1+$/.test(c)) p = 0;
  if (c.length < CLAVE_MIN) return { n: 1, txt: `Muy corta: usa al menos ${CLAVE_MIN} caracteres` };
  return [{ n: 1, txt: 'Débil: es fácil de adivinar' }, { n: 1, txt: 'Débil: mezcla letras y números' }, { n: 2, txt: 'Aceptable' }, { n: 3, txt: 'Buena' }, { n: 4, txt: 'Muy buena' }][p];
}
// campos de contraseña + repetirla, con indicador en vivo
const camposClave = (nombre = 'password', etiqueta = 'Contraseña') => `
  ${field(etiqueta, input(nombre, '', `type="password" minlength="${CLAVE_MIN}" autocomplete="new-password" required aria-describedby="clave-fuerza"`))}
  <div class="clave-fuerza" id="clave-fuerza" aria-live="polite"><span class="cf-barra"><i></i><i></i><i></i><i></i></span><small></small></div>
  ${field('Repite la contraseña', input(nombre + '2', '', 'type="password" autocomplete="new-password" required'))}`;
function vigilarClave(nombre = 'password') {
  const a = $(`#f-${nombre}`), b = $(`#f-${nombre}2`), box = $('#clave-fuerza'); if (!a || !b || !box) return;
  const pintar = () => {
    const f = fuerzaClave(a.value); box.dataset.n = a.value ? f.n : 0; box.querySelector('small').textContent = f.txt;
    const f2 = b.closest('.field'); const ok = b.value && b.value === a.value;
    f2.classList.toggle('coincide', !!ok); f2.classList.toggle('no-coincide', !!b.value && !ok && b.value.length >= a.value.length);
  };

// revisa los dos campos antes de enviar; devuelve false si hay un error (ya marcado en pantalla)
function claveOk(d, nombre = 'password') {
  const c = d[nombre] || '', c2 = d[nombre + '2'] || '';
  if (c.length < CLAVE_MIN) { errorCampo(`#f-${nombre}`, `Usa al menos ${CLAVE_MIN} caracteres.`); return false; }

/* ---------- verificar el correo ---------- */
let _reenvioHasta = 0;

}
function esperarReenvio(btn, seg) {
  _reenvioHasta = Date.now() + seg * 1000; if (!btn) return;
  const tick = () => { const r = Math.ceil((_reenvioHasta - Date.now()) / 1000); if (!btn.isConnected) return; if (r <= 0) { btn.disabled = false; btn.textContent = 'Reenviar correo'; return; } btn.disabled = true; btn.textContent = `Reenviar en ${r} s`; setTimeout(tick, 1000); };

/* =========================================================
   v29: servicios repetidos y nombres sueltos del historial
   Al editar un servicio en Catálogo, todo lo que se llama igual
   (otros servicios repetidos y ventas sueltas del historial)
   se puede unir en ese servicio.
   ========================================================= */

// "Soft gel", "soft  gel " y "Softgel" son el mismo nombre
const claveNombre = (n) => norm(n).replace(/ /g, '');

function parecidosServicio(id, nombre) {
  const k = claveNombre(nombre); if (!k) return { dup: [], libres: [], usos: 0 };
  const dup = db.all('servicios').filter((s) => s.id !== id && claveNombre(s.nombre) === k);
  const dupIds = new Set(dup.map((s) => s.id));
  const libres = db.all('venta_items').filter((i) => !i.item_id && i.tipo_item === 'libre' && claveNombre(i.nombre) === k);
  const deDup = db.all('venta_items').filter((i) => dupIds.has(i.item_id)).length;
  const citas = db.all('citas').filter((c) => dupIds.has(c.servicio_id)).length;
  return { dup, libres, usos: libres.length + deDup, citas };
}

// mueve ventas, citas y ciclo de los repetidos al servicio que queda, y borra los repetidos
function unificarServicio(keepId) {
  const keep = db.get('servicios', keepId); if (!keep) return null;
  const { dup, libres } = parecidosServicio(keepId, keep.nombre); const dupIds = new Set(dup.map((s) => s.id));
  const items = db.all('venta_items').filter((i) => (dupIds.has(i.item_id) || i.item_id === keepId) && i.nombre !== keep.nombre).map((i) => i.id);
  const todos = [...new Set([...items, ...libres.map((i) => i.id)])];
  if (todos.length) db.updateMany('venta_items', todos, { tipo_item: 'servicio', item_id: keepId, nombre: keep.nombre });
  const citas = db.all('citas').filter((c) => dupIds.has(c.servicio_id)).map((c) => c.id);
  if (citas.length) db.updateMany('citas', citas, { servicio_id: keepId });
  // si el que queda no tenía ciclo propio, hereda el de un repetido
  const ciclos = cfg().ciclos || {}; const heredado = dup.map((s) => ciclos[s.id]).find((c) => c != null && c !== '');
  if (dupIds.size && ciclos[keepId] == null && heredado != null) guardarConfig({ ciclos: { ...ciclos, [keepId]: heredado } });
  if (dupIds.size) db.removeMany('servicios', [...dupIds]);
  return { servicios: dupIds.size, ventas: todos.length, libres: libres.length, citas: citas.length };
}
// al renombrar un servicio, su historial pasa a llamarse igual (es el mismo servicio)
function unificarNombreHistorial(id) {
  const s = db.get('servicios', id); const ids = db.all('venta_items').filter((i) => i.item_id === id && i.nombre !== s.nombre).map((i) => i.id);
  if (ids.length) db.updateMany('venta_items', ids, { nombre: s.nombre });
  return null;
}
const textoUnion = (r) => [r.servicios ? `${r.servicios} servicio${r.servicios > 1 ? 's' : ''} repetido${r.servicios > 1 ? 's' : ''} unido${r.servicios > 1 ? 's' : ''}` : '', r.libres ? `${r.libres} venta${r.libres > 1 ? 's' : ''} del historial ${r.libres > 1 ? 'quedaron' : 'quedó'} con este servicio` : '', r.citas ? `${r.citas} cita${r.citas > 1 ? 's' : ''} actualizada${r.citas > 1 ? 's' : ''}` : ''].filter(Boolean).join(' · ');

// aviso dentro del formulario: se actualiza mientras escribes el nombre
function pintarUnirServicio(id) {
  const box = $('#serv-unir'); const inp = $('#sheet-form [name=nombre]'); if (!box || !inp) return;
  const p = parecidosServicio(id, inp.value);
  if (!p.dup.length && !p.libres.length) { box.innerHTML = ''; box.hidden = true; return; }
  const partes = [p.dup.length ? `<b>${p.dup.length} servicio${p.dup.length > 1 ? 's' : ''} más</b> con este nombre${p.dup.some((s) => s.nombre !== inp.value.trim()) ? ` (${[...new Set(p.dup.map((s) => '“' + esc(s.nombre.trim()) + '”'))].join(', ')})` : ''}` : '', p.libres.length ? `<b>${p.libres.length} venta${p.libres.length > 1 ? 's' : ''}</b> en tu historial anotada${p.libres.length > 1 ? 's' : ''} con este nombre sin estar unida${p.libres.length > 1 ? 's' : ''} al catálogo` : ''].filter(Boolean);
  box.hidden = false;
  box.innerHTML = `<label class="unir-serv"><input type="checkbox" name="unificar" checked><span><b>Unificar todo en este servicio</b><small>Encontramos ${partes.join(' y ')}. Al guardar, ${p.dup.length ? 'los repetidos se juntan en uno solo con todas sus ventas y citas' : 'esas ventas quedan unidas a este servicio'}, así tus reportes lo cuentan como uno.</small></span></label>`;
}
function servRepetidos() {
  const g = new Map(); for (const s of db.all('servicios')) { const k = claveNombre(s.nombre); if (k) (g.get(k) || g.set(k, []).get(k)).push(s); }
  return [...g.values()].filter((x) => x.length > 1);
}
// une todos los grupos de repetidos: queda el que más se usa (y si empatan, el activo)
function unificarTodosServicios() {
  const usos = (s) => db.all('venta_items').filter((i) => i.item_id === s.id).length + db.all('citas').filter((c) => c.servicio_id === s.id).length;
  let n = 0;
  for (const g of servRepetidos()) { const keep = [...g].sort((a, b) => usos(b) - usos(a) || (b.activo !== false) - (a.activo !== false))[0]; const r = unificarServicio(keep.id); n += r?.servicios || 0; }
  render(); toast(n ? `Listo: ${n} servicio${n > 1 ? 's' : ''} repetido${n > 1 ? 's' : ''} unido${n > 1 ? 's' : ''}, con todo su historial` : 'No hay servicios repetidos');
}
Object.assign(ACC_COBRO, {
  'serv-unificar-todo': () => { const g = servRepetidos(); confirmar(`Se juntarán ${g.length} grupo${g.length > 1 ? 's' : ''} de servicios con el mismo nombre (${g.map((x) => esc(x[0].nombre)).join(', ')}). Sus ventas y citas pasan al que queda.`, unificarTodosServicios, 'Unificar'); },
});

/* =========================================================
   v29: versiones nuevas llegan solas
   Cada vez que publicas MiDerno, build.py deja un version.json
   con un código único. La app lo revisa cada pocos minutos y al
   volver a la pestaña: si cambió, avisa (o se recarga sola si
   nadie está escribiendo nada).
   ========================================================= */

const BUILD = 'aeb84339536b'; // build.py lo reemplaza por el código de cada publicación
const VERSION_CADA = 5 * 60 * 1000;
let versionNueva = null, ocultaDesde = 0;

async function revisarVersion() {
  if (BUILD === 'dev' || versionNueva || !/^https?:$/.test(location.protocol)) return;
  try {
    const r = await fetch(appUrl() + 'version.json?t=' + Date.now(), { cache: 'no-store' }); if (!r.ok) return;
    const v = await r.json(); if (v?.build && v.build !== BUILD) { versionNueva = v; avisarVersion(); }
  } catch { /* sin conexión o sin version.json: se intenta más tarde */ }
}
// nadie está a mitad de algo: sin formulario abierto, sin importación ni reserva en curso
const sePuedeRecargar = () => !document.querySelector('#scrim, dialog[open]') && !S.imp && !(S.pub && S.pub.servicio) && !S.cart?.lineas?.length;
async function recargarVersion() {
  const b = document.querySelector('.version-nueva .btn'); if (b) { b.disabled = true; b.textContent = 'Actualizando…'; }
  // primero termina de guardar en la nube lo que esté pendiente
  if (S.modo === 'nube') await Promise.race([NubeAdapter.cola, new Promise((ok) => setTimeout(ok, 8000))]);
  try { guardarCacheNube?.(); } catch {}
  // la dirección cambia un poco (?v=...) para que el navegador no use la copia vieja guardada
  const u = new URL(location.href); u.searchParams.set('v', versionNueva?.build || Date.now()); location.replace(u.toString());
}
function avisarVersion() {
  if (document.querySelector('.version-nueva')) return;
  const el = document.createElement('div'); el.className = 'version-nueva'; el.setAttribute('role', 'status');
  el.innerHTML = `<span>Hay una versión nueva de MiDerno${versionNueva.version ? ' (v' + esc(versionNueva.version) + ')' : ''}</span><button type="button" class="btn sm">Actualizar</button><button type="button" class="vn-x" aria-label="Más tarde">×</button>`;
  el.querySelector('.btn').onclick = recargarVersion;
  el.querySelector('.vn-x').onclick = () => el.remove();
  document.body.appendChild(el);
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { ocultaDesde = Date.now(); return; }
  // al volver después de un rato, si hay versión nueva y no estabas haciendo nada, se actualiza sola
  if (versionNueva && ocultaDesde && Date.now() - ocultaDesde > 60 * 1000 && sePuedeRecargar()) return recargarVersion();
  revisarVersion();
});
setTimeout(revisarVersion, 20 * 1000);
// después de actualizar, se limpia el ?v= de la dirección
try { const u = new URL(location.href); if (u.searchParams.has('v')) { u.searchParams.delete('v'); history.replaceState(history.state, '', u.pathname + u.search + u.hash); } } catch {}
setInterval(() => { if (!document.hidden) revisarVersion(); }, VERSION_CADA);

/* =========================================================
   v33: vitrina de servicios e información del negocio
   - Cada servicio puede tener descripción y hasta 4 fotos.
     En la nube las fotos van a Supabase Storage (carpeta del negocio);
     sin cuenta se guardan achicadas en el dispositivo (máx. 2).
   - La página de reservas muestra fotos, descripción y una hoja
     "Información" con dirección, mapa, horario y contacto.
   ========================================================= */

const FOTOS_MAX = () => (S.modo === 'nube' ? 4 : 2);
let _vitrina = null; // fotos del servicio mientras se edita: [{ url, mini }]

/* ---------- achicar y subir ---------- */
function achicarBlob(file, max, calidad) {
  return new Promise((ok, fail) => {
    const img = new Image(); const url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height)); const cv = document.createElement('canvas');
      cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
      const g = cv.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, cv.width, cv.height); g.drawImage(img, 0, 0, cv.width, cv.height);
      URL.revokeObjectURL(url); cv.toBlob((b) => (b ? ok(b) : fail(new Error('No pudimos procesar esa imagen'))), 'image/jpeg', calidad);
    };
    img.onerror = () => fail(new Error('No pudimos leer esa imagen')); img.src = url;
  });
}
const blobADataUrl = (b) => new Promise((ok) => { const r = new FileReader(); r.onload = () => ok(r.result); r.readAsDataURL(b); });
// la miniatura de una foto de la nube vive al lado, con "-m" antes de la extensión
const miniDe = (url) => (FOTO_NUBE.test(url) ? url.replace(/\.jpg$/, '-m.jpg') : url);

async function subirFotoServicio(file) {
  if (S.modo === 'nube' && NubeAdapter.sb) {
    const [grande, mini] = await Promise.all([achicarBlob(file, 1200, 0.8), achicarBlob(file, 360, 0.72)]);
    const base = `${S.negocio.id}/servicios/${uid()}`; const st = NubeAdapter.sb.storage.from('fotos');
    const sube = async (ruta, blob) => { const { error } = await st.upload(ruta, blob, { contentType: 'image/jpeg', cacheControl: '31536000', upsert: false }); if (error) throw error; return st.getPublicUrl(ruta).data.publicUrl; };
    const [url, urlMini] = await Promise.all([sube(base + '.jpg', grande), sube(base + '-m.jpg', mini)]);
    return { url, mini: urlMini };
  }
  const [g, m] = await Promise.all([achicarBlob(file, 640, 0.7), achicarBlob(file, 240, 0.7)]);
  return { url: await blobADataUrl(g), mini: await blobADataUrl(m) };
}
function borrarFotoNube(url) {
  if (!FOTO_NUBE.test(url) || S.modo !== 'nube' || !NubeAdapter.sb) return;
  const ruta = url.split('/object/public/fotos/')[1]; if (!ruta) return;
  NubeAdapter.sb.storage.from('fotos').remove([ruta, ruta.replace(/\.jpg$/, '-m.jpg')]).catch(() => {});
}

/* ---------- en el formulario del servicio ---------- */
function camposVitrina(s) {
  _vitrina = { fotos: (s.fotos || []).filter(imgSegura).map((url) => ({ url, mini: miniDe(url) })), subiendo: 0, quitadas: [] };
  return `<div class="vitrina-edit">
    ${field('Descripción', `<textarea class="in" name="descripcion" id="f-serv-desc" rows="3" maxlength="500" placeholder="Ej: Esmaltado que dura hasta 3 semanas. Incluye limado, cutícula y diseño simple.">${esc(s.descripcion || '')}</textarea>`, 'Opcional. Tus clientas la ven al reservar.')}
    <div class="field"><label>Fotos del servicio</label><div class="vitrina-fotos" id="vitrina-fotos"></div>
      <span class="hint">Hasta ${FOTOS_MAX()}. La primera es la que se ve en la lista.${S.modo === 'nube' ? '' : ' Con tu cuenta en la nube puedes subir más.'}</span></div></div>`;
}
function pintarVitrina() {
  const box = $('#vitrina-fotos'); if (!box || !_vitrina) return;
  const v = _vitrina; const quedan = FOTOS_MAX() - v.fotos.length - v.subiendo;
  box.innerHTML = v.fotos.map((f, i) => `<div class="vf"><img src="${esc(imgSegura(f.mini) || imgSegura(f.url))}" alt="Foto ${i + 1} del servicio">
      ${i ? `<button type="button" class="vf-btn vf-izq" data-vf="primera" data-i="${i}" aria-label="Usar como primera foto">${icon('left')}</button>` : ''}
      <button type="button" class="vf-btn vf-x" data-vf="quitar" data-i="${i}" aria-label="Quitar foto">${icon('x')}</button></div>`).join('')
    + '<div class="vf vf-cargando" aria-label="Subiendo foto"><i class="sk"></i></div>'.repeat(v.subiendo)
    + (quedan > 0 ? `<label class="vf vf-add" for="f-serv-fotos">${icon('foto')}<span>Agregar</span><input type="file" id="f-serv-fotos" accept="image/*" multiple hidden></label>` : '');
  box.querySelector('#f-serv-fotos')?.addEventListener('change', (e) => agregarFotosServicio(e.target.files));
  box.querySelectorAll('[data-vf]').forEach((b) => b.addEventListener('click', () => {
    const i = +b.dataset.i;
    if (b.dataset.vf === 'quitar') v.quitadas.push(...v.fotos.splice(i, 1).map((f) => f.url));
    else v.fotos.unshift(...v.fotos.splice(i, 1));
    pintarVitrina();
  }));
}
async function agregarFotosServicio(files) {
  const v = _vitrina; if (!v) return;
  const lista = [...files].slice(0, FOTOS_MAX() - v.fotos.length - v.subiendo); if (!lista.length) return;
  v.subiendo += lista.length; pintarVitrina();
  await Promise.all(lista.map(async (f) => {
    try { const r = await subirFotoServicio(f); if (_vitrina === v) v.fotos.push(r); }
    catch (e) { toast(/bucket|not found|policy|row-level/i.test(e.message || '') ? 'Falta activar las fotos en la nube (actualización 11).' : 'No pudimos subir la foto: ' + (e.message || e), true); }
    finally { v.subiendo--; if (_vitrina === v) pintarVitrina(); }
  }));
}
// lo que se guarda en la fila del servicio
function datosVitrina(d, antes) {
  if (!tiene('servicios') || !_vitrina) return {};
  const v = _vitrina; v.quitadas.forEach(borrarFotoNube); v.quitadas = [];
  const fotos = v.fotos.map((f) => f.url);
  const out = { descripcion: String(d.descripcion || '').trim().slice(0, 500), fotos, miniatura: v.fotos[0]?.mini || '' };
  // sin cambios: no se envía nada nuevo (sirve también si la nube aún no tiene estas columnas)
  if (out.descripcion === (antes.descripcion || '') && JSON.stringify(fotos) === JSON.stringify(antes.fotos || [])) return {};
  return out;
}

function estadoHorario(h, ahora = new Date()) {
  const dow = ahora.getDay(); const m = ahora.getHours() * 60 + ahora.getMinutes(); const hd = horarioDia(h, dow);
  if (hd && m < aMin(hd.hasta)) return m >= aMin(hd.desde) ? { abierto: true, txt: `Abierto hoy hasta las ${hhmm(hd.hasta)}` } : { abierto: false, txt: `Hoy abre a las ${hhmm(hd.desde)}` };
  for (let i = 1; i <= 7; i++) { const d = (dow + i) % 7; const x = horarioDia(h, d); if (x) return { abierto: false, txt: `Cerrado ahora. Abre ${i === 1 ? 'mañana' : 'el ' + NOMBRE_DIA[d]} a las ${hhmm(x.desde)}` }; }
  return { abierto: false, txt: 'Sin horario publicado' };
}
const lineaDireccion = (pf) => (pf.direccion || '').split(',').slice(0, 2).join(',').trim();
function datosNegocioPub(pf) {

    <button type="button" class="btn sm pub-info-btn" data-act="pub-info">${icon('info')}Información${pf?.direccion ? ' y cómo llegar' : ''}</button></div>`;
}

/* v41: varios servicios en una reserva (se hacen seguidos) */
const MAX_SERVICIOS_PUB = 3;
// junta los servicios elegidos en uno solo para el resto de la página: tiempo y precio sumados
function servicioCombinado(info, ids) {
  const ss = ids.map((id) => info.servicios.find((s) => s.id === id)).filter(Boolean);
  if (!ss.length) return null;
  if (ss.length === 1) return { ...ss[0], ids: [ss[0].id] };
  return { id: ss[0].id, ids: ss.map((s) => s.id), nombre: ss.map((s) => s.nombre).join(' + '),
    duracion_min: ss.reduce((n, s) => n + Number(s.duracion_min || 60), 0), precio: ss.reduce((n, s) => n + Number(s.precio || 0), 0) };
}

const RENDER = { crecer: vistaCrecer, proveedores: vistaProveedores, importar: vistaImportar, inicio: vistaInicio, vender: vistaVender, caja: vistaCaja, clientes: vistaClientes, agenda: vistaAgenda, equipo: vistaEquipo, inventario: vistaInventario, produccion: vistaProduccion, catalogo: vistaCatalogo, ajustes: vistaAjustes };
let _ultimaVista = null; let _vistaDetalle = null;
function render() {
  const app = $('#app');
  if (S.eq) { app.innerHTML = vistaEquipoApp(); document.title = 'Mi agenda · MiDerno'; return; }
  if (S.pub) { app.innerHTML = vistaReserva(); document.title = S.pub.info?.negocio?.nombre ? `Reserva en ${S.pub.info.negocio.nombre}` : 'Reservar hora'; return; }
  if (!S.negocio) { app.innerHTML = vistaBienvenida(); _ultimaVista = null; document.title = 'MiDerno: ventas, agenda y clientes para tu negocio'; portadaViva(); return; }
  const v = vistaActual(); const bloq = document.body.dataset.lock; const y = bloq ? +bloq : window.scrollY;
  // misma vista: se mantiene el alto mientras se repinta, así la página no salta (iPhone)
  const misma = v === _ultimaVista; if (misma) app.style.minHeight = app.offsetHeight + 'px';
  app.innerHTML = shell(tipVista(v) + RENDER[v]());
  if (v !== _ultimaVista) { $('.main .wrap')?.classList.add('entra'); animarCifras($('.main')); }
  document.title = `${VISTAS.find((x) => x.id === v).label} · ${S.negocio.nombre} · MiDerno`;
  if (!bloq) window.scrollTo(0, misma ? y : 0); else if (!misma) document.body.dataset.lock = '0';
  _ultimaVista = v; if (misma) requestAnimationFrame(() => { app.style.minHeight = ''; });
  // Registrar en el celular: la barra se esconde cuando el detalle ya está a la vista
  _vistaDetalle?.disconnect(); const det = $('#detalle-venta [data-act=cobrar]'), barra = $('.cobro-barra');
  if (det && barra && 'IntersectionObserver' in window) { _vistaDetalle = new IntersectionObserver(([e]) => barra.classList.toggle('oculta', e.isIntersecting), { threshold: 0.5 }); _vistaDetalle.observe(det); }
  if (S._post) { const f = S._post; S._post = null; requestAnimationFrame(() => { try { f(); } catch (e) { console.error(e); } }); }
  if (S._recien) setTimeout(() => { S._recien = null; }, 50);
}

function guardarMeta(monto) {
  const v = num(monto); const ym = mesActual(); const m = metaDelMes(ym);
  if (v <= 0) { if (m) db.remove('metas', m.id); return toast('Meta eliminada'); }
  m ? db.update('metas', m.id, { monto_objetivo: v }) : db.insert('metas', { periodo: ym, monto_objetivo: v });
  toast('Meta guardada');
}
function eliminarSeguro(tabla, id, usado, nombre) {
  if (usado) { db.update(tabla, id, { activo: false }); cerrarSheet(); toast(`${nombre} tiene historial, así que lo pausamos en vez de borrarlo`); return render(); }
  confirmar(`Se eliminará <b>${esc(db.get(tabla, id)?.nombre)}</b>.`, () => {
    if (tabla === 'productos') { db.removeWhere('movimientos_stock', (m) => m.item_id === id); db.removeWhere('formulas', (f) => f.producto_id === id); }
    db.remove(tabla, id); toast('Eliminado'); render();
  });
}

document.addEventListener('click', (e) => {
  if (e.target.closest('[data-stop]')) return; // enlaces (WhatsApp) dentro de filas clicables
  const cerrar = e.target.closest('[data-close]');
  if (cerrar) { if (cerrar.tagName !== 'A') e.preventDefault(); cerrarSheet(); if (cerrar.tagName === 'A') return; }
  const el = e.target.closest('[data-act]'); if (!el) return;
  const fn = ACCIONES[el.dataset.act]; if (!fn) return;
  // los enlaces externos (WhatsApp, mapas) se abren igual; la acción solo anota lo que pasó
  const externo = el.tagName === 'A' && /^(https?:|mailto:|tel:)/.test(el.getAttribute('href') || '');
  if (!externo && (el.tagName !== 'A' || !el.getAttribute('href')?.startsWith('#') || el.getAttribute('href') === '#')) e.preventDefault();
  try { fn(el); } catch (err) { console.error(err); toast('Algo falló: ' + err.message, true); }
});

document.addEventListener('submit', (e) => {
  e.preventDefault();
  const f = e.target; const d = formData(f);
  if (f.id === 'sheet-form' && _onSubmit) {
    const r = _onSubmit(d);
    // si guardar toma tiempo (nube, inicio de sesión), el botón muestra que está trabajando
    if (r && typeof r.then === 'function') {
      const b = f.querySelector('[type=submit]'); if (b) { b.disabled = true; b.classList.add('cargando'); }
      cargando(true);
      r.finally(() => { cargando(false); if (b && b.isConnected) { b.disabled = false; b.classList.remove('cargando'); } });
    }
    return;
  }
  if (f.id === 'form-reservas') return guardarReservas(f);
  if (f.id === 'form-reserva') return pubEnviar(d);
  if (f.id === 'form-meta') { guardarMeta(d.monto); return render(); }
  if (f.id === 'form-negocio') { if (!d.nombre.trim()) return toast('Escribe el nombre', true); db.negocio({ nombre: d.nombre.trim(), rubro: d.rubro, moneda: d.moneda }); toast('Datos guardados'); render(); }
});

// trae los datos guardados con el nombre anterior de la app
function migrarClaves() {
  try {
    // los ejemplos ya no se guardan: limpia copias antiguas
    for (const k of Object.keys(localStorage)) if (/^(miderno|cuadra):data:demo-/.test(k)) localStorage.removeItem(k);
    if (/^demo-/.test(LS.get('miderno:ultimo') || '')) LS.del('miderno:ultimo');
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.startsWith('cuadra:')) { const n = 'miderno:' + k.slice(7); if (localStorage.getItem(n) == null) localStorage.setItem(n, localStorage.getItem(k)); }
    }
  } catch (e) {}
}

(async function arrancar() {
  migrarClaves();
  // página pública: ?reservar=nombre-del-negocio
  const slug = new URLSearchParams(location.search).get('reservar') || (location.pathname.match(/\/agenda\/([a-z0-9-]+)\/?$/) || [])[1];
  S.refOrigen = new URLSearchParams(location.search).get('ref') || '';
  if (slug && CONFIG.supabaseUrl && CONFIG.supabaseAnonKey) return abrirReservas(ReservaNube(slug), false);
  // si el enlace del correo venció o falló, Supabase lo indica en la dirección
  const err = new URLSearchParams(location.hash.slice(1)).get('error_description') || new URLSearchParams(location.search).get('error_description');
  if (err) {
    // si hace poco se pidió recuperar la contraseña, el enlace vencido era ese
    const recup = /type=recovery/.test(location.hash + location.search) || Date.now() - (LS.get('miderno:pidio-clave') || 0) < 7 * 864e5;
    setTimeout(() => (/expired|invalid/i.test(err) ? enlaceVencido(recup ? 'recovery' : 'signup') : toast('Problema con el enlace: ' + err, true)), 300);
  }
  if (/type=recovery/.test(location.hash + location.search)) S.recuperar = true;
  if (CONFIG.supabaseUrl && CONFIG.supabaseAnonKey) {
    // apertura instantánea: se muestra lo último guardado y la nube se pone al día por detrás
    const vieneDeCorreo = S.recuperar || /access_token|refresh_token|[?&]code=/.test(location.href);
    if (!vieneDeCorreo && await abrirDesdeCache()) {
      abrirNube({ fondo: true }).then((ok) => {
        if (ok) return revisarRecuperacion();
        LS.del('miderno:nube-uid'); CacheNube.borrar(); S.negocio = null; S.modo = null; S.sincronizando = false; adapter = LocalAdapter; render();
        toast('Tu sesión se cerró. Vuelve a entrar para ver tus datos.', true);
      }).catch((e) => { console.error(e); S.sincronizando = false; render(); toast('Sin conexión: estás viendo lo último guardado en este dispositivo. Los cambios se enviarán al volver la conexión.', true); });
      return;
    }
    try { if (await abrirNube()) { revisarRecuperacion(); return; } } catch (e) { console.error(e); pantallaCarga(false); toast('No pudimos conectar con la nube: ' + (e.message || e), true); }
  }
  const ultimo = LS.get('miderno:ultimo');
  if (ultimo) abrirLocal(ultimo); else render();
})();

// elegir uno de los negocios de ejemplo (no aparecen en la portada)
function elegirEjemplo() {
  const mods = (id) => DEMOS[id].crear === demoSalon ? ['servicios'] : DEMOS[id].crear === demoTienda ? ['inventario'] : ['inventario', 'produccion'];
  abrirSheet('Elige un ejemplo', `<p class="muted" style="margin:-6px 0 0">Datos ficticios. Toca todo: nada se guarda.</p>
    <div class="ej-lista">${Object.entries(DEMOS).map(([id, d], k) => `<button type="button" class="ej" data-act="demo" data-id="${id}" style="--i:${k}">
      <span class="ej-ini">${esc(iniciales(d.nombre))}</span>
      <span class="grow"><b>${esc(d.nombre)}</b><small>${esc(d.desc)}</small>
      <span class="mods">${mods(id).map((m) => `<span class="pill">${MODULOS[m].nombre}</span>`).join('')}</span></span>${icon('right')}</button>`).join('')}</div>`);
}
