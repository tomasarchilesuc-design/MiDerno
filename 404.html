  <div class="grid g3">
    <div class="card kpi"><span class="lbl">Servicios del equipo</span><span class="val">${money(totV)}</span><span class="sub">${qtyFmt(sum(filas, (f) => f.n))} atenciones</span></div>
    <div class="card kpi"><span class="lbl">Comisiones del mes</span><span class="val">${money(totC)}</span><span class="sub">${money(sum(filas, (f) => f.pend))} por pagar</span></div>
    <div class="card kpi"><span class="lbl">Queda para el local</span><span class="val">${money(totV - totC)}</span><span class="sub">${totV ? Math.round(((totV - totC) / totV) * 100) : 0}% de lo atendido</span></div>
  </div>
  ${tarjetaAccesos(todos)}
  <div class="card"><div class="tbl-wrap">${visibles.length ? `<table><thead><tr><th>Persona</th><th class="n">Comisión</th><th class="n">Atenciones</th><th class="n">Vendido</th><th class="n">Le corresponde</th><th class="n">Por pagar</th><th></th></tr></thead><tbody>${visibles.map((f) => `<tr>
      <td><div class="hstack" style="flex-wrap:nowrap"><div class="avatar">${esc(iniciales(f.e.nombre))}</div><div><b>${esc(f.e.nombre)}</b>${f.e.activo === false ? '<div class="small muted">Ya no está en el equipo</div>' : ''}</div></div></td>
      <td class="n">${qtyFmt(f.e.pct_comision)}%</td><td class="n">${qtyFmt(f.n)}</td><td class="n">${money(f.vendido)}</td><td class="n"><b>${money(f.com)}</b></td>
      <td class="n">${f.pend ? `<span class="pill warn">${money(f.pend)}</span>` : '<span class="pill ok">Al día</span>'}</td>
      <td class="n" style="white-space:nowrap">${f.pend ? `<button class="btn sm" data-act="pagar-com" data-id="${f.e.id}">Marcar pagado</button>` : ''}<button class="btn sm ghost" data-act="empleado" data-id="${f.e.id}" aria-label="Editar o eliminar">${icon('edit')}</button></td></tr>`).join('')}</tbody></table>` : '<div class="empty">Agrega a las personas que atienden para calcular sus comisiones automáticamente.</div>'}</div>
    <p class="small muted" style="margin-top:10px">Arriba, en <b>Accesos del equipo</b>, creas el usuario de cada persona para que vea sus horas y lo que lleva en el mes. La comisión se calcula sobre cada servicio cobrado. Si cambias el porcentaje de alguien, se recalcula lo que aún no le pagas; lo ya pagado no cambia.</p></div>`;

// Ajusta las comisiones que aún no se pagan al nuevo porcentaje
function recalcularComisiones(empId, antes, ahora) {
  const pend = db.all('comisiones').filter((c) => c.empleado_id === empId && !c.pagada);
  for (const c of pend) {
    const it = db.get('venta_items', c.venta_item_id);
    const base = it ? Number(it.cantidad) * Number(it.precio_unitario) : (antes ? Number(c.monto) * 100 / antes : 0);
    db.update('comisiones', c.id, { monto: Math.round(base * ahora / 100) });
  }
  return pend.length;
}
function eliminarEmpleado(id) {
  const e = db.get('empleados', id);
  const pend = sum(db.all('comisiones').filter((c) => c.empleado_id === id && !c.pagada), (c) => Number(c.monto));
  const historial = db.all('comisiones').some((c) => c.empleado_id === id) || db.all('venta_items').some((i) => i.empleado_id === id);
  const futuras = db.all('citas').filter((c) => c.empleado_id === id && c.fecha >= hoy() && !INACTIVOS.includes(c.estado) && c.estado !== 'completada');
  const texto = `Se quitará a <b>${esc(e.nombre)}</b> del equipo.${pend ? ` Aún tiene <b>${money(pend)}</b> en comisiones por pagar; seguirán apareciendo hasta que las marques pagadas.` : ''}${futuras.length ? ` Sus ${futuras.length} horas agendadas quedarán sin asignar.` : ''}${historial ? ' Su historial de ventas se mantiene.' : ''}`;
  confirmar(texto, () => {

/* ---------- lectura de archivos ---------- */
function cargarScript(src, global) {
  if (window[global]) return Promise.resolve(window[global]);
  return new Promise((ok, fail) => { const s = document.createElement('script'); s.src = src; s.onload = () => ok(window[global]); s.onerror = () => fail(new Error('No se pudo cargar el lector de Excel. Revisa tu conexión.')); document.head.appendChild(s); });
}
function leerCSV(texto) {
  texto = texto.replace(/^﻿/, '');
  const primera = texto.split(/\r?\n/)[0] || '';
  const sep = [';', ',', '\t'].sort((a, b) => primera.split(b).length - primera.split(a).length)[0];
  const filas = []; let fila = []; let celda = ''; let comillas = false;
  for (let i = 0; i < texto.length; i++) {
    const c = texto[i];
    if (comillas) { if (c === '"') { if (texto[i + 1] === '"') { celda += '"'; i++; } else comillas = false; } else celda += c; continue; }
    if (c === '"') comillas = true;
    else if (c === sep) { fila.push(celda); celda = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && texto[i + 1] === '\n') i++; fila.push(celda); filas.push(fila); fila = []; celda = ''; }
    else celda += c;
  }
  if (celda || fila.length) { fila.push(celda); filas.push(fila); }
  return filas;
}
// Lector de .xlsx propio: un .xlsx es un zip con XML adentro
async function leerXLSX(buffer) {
  const JSZip = await cargarScript('https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js', 'JSZip');
  const zip = await JSZip.loadAsync(buffer);
  const xml = async (ruta) => { const f = zip.file(ruta); return f ? new DOMParser().parseFromString(await f.async('string'), 'application/xml') : null; };
  const tags = (doc, n) => (doc ? [...doc.getElementsByTagNameNS('*', n)] : []);

  const destino = Object.fromEntries(tags(rels, 'Relationship').map((r) => [r.getAttribute('Id'), r.getAttribute('Target')]));
  const hojas = [];
  for (const sh of tags(wb, 'sheet')) {
    const rid = sh.getAttribute('r:id') || sh.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships', 'id');
    let ruta = destino[rid] || ''; ruta = ruta.startsWith('/') ? ruta.slice(1) : 'xl/' + ruta.replace(/^\.\//, '');
    const doc = await xml(ruta); if (!doc) continue;
    const filas = [];
    for (const row of tags(doc, 'row')) {
      const r = Number(row.getAttribute('r')) - 1; const arr = [];
      for (const c of tags(row, 'c')) {
        const ref = c.getAttribute('r') || ''; const letras = ref.replace(/\d+/g, '');
        const col = letras ? [...letras].reduce((a, ch) => a * 26 + ch.charCodeAt(0) - 64, 0) - 1 : arr.length;
        const t = c.getAttribute('t'); const v = tags(c, 'v')[0]?.textContent;
        let val = '';
        if (t === 's') val = compartidos[Number(v)] ?? '';
        else if (t === 'inlineStr') val = tags(c, 't').map((x) => x.textContent).join('');
        else if (t === 'b') val = v === '1';
        else if (t === 'str' || t === 'e') val = v ?? '';
        else if (v != null && v !== '') val = Number(v);
        arr[col] = val;
      }
      filas[r >= 0 ? r : filas.length] = Array.from(arr, (x) => x ?? '');
    }
    hojas.push({ nombre: sh.getAttribute('name'), filas: Array.from(filas, (x) => x || []) });
  }
  return hojas;
}

function parseNumero(v) {
  if (typeof v === 'number') return v;
  let s = String(v ?? '').trim(); if (!s) return null;
  const neg = /^\(.*\)$/.test(s) || /^-/.test(s) || /^\$\s*-/.test(s);
  s = s.replace(/[^\d.,]/g, ''); if (!s) return null;
  const ultPunto = s.lastIndexOf('.'), ultComa = s.lastIndexOf(',');
  if (ultPunto >= 0 && ultComa >= 0) s = ultComa > ultPunto ? s.replace(/\./g, '').replace(',', '.') : s.replace(/,/g, '');
  else if (ultComa >= 0) s = /^\d{1,3}(,\d{3})+$/.test(s) ? s.replace(/,/g, '') : s.replace(',', '.');
  else if (ultPunto >= 0 && /^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, '');

const MESES = { ene: 1, feb: 2, mar: 3, abr: 4, may: 5, jun: 6, jul: 7, ago: 8, sep: 9, set: 9, oct: 10, nov: 11, dic: 12 };
function parseFecha(v) {

}

async function abrirArchivo(file) {
  if (!file) return;
  try {
    const nombre = file.name; const ext = nombre.split('.').pop().toLowerCase();
    if (ext === 'xls') return toast('Ese es el formato antiguo de Excel. Ábrelo y guárdalo como .xlsx (Libro de Excel) o CSV.', true);
    toast('Leyendo ' + nombre + '…'); cargando(true);
    let hojas;
    if (ext === 'csv' || ext === 'txt') hojas = [{ nombre: nombre.replace(/\.[^.]+$/, ''), filas: leerCSV(await file.text()) }];
    else hojas = await leerXLSX(await file.arrayBuffer());
    hojas = hojas.filter((h) => h.filas.some((f) => f.some((c) => String(c ?? '').trim())));
    if (!hojas.length) return toast('El archivo está vacío', true);
    // el año de los meses sin año ("Enero") se toma de las fechas que trae el archivo
    const anios = hojas.flatMap((h) => h.filas.flat()).map((c) => (typeof c === 'number' && c > 30000 && c < 60000 ? parseFecha(c) : typeof c === 'string' && /\d{4}/.test(c) ? parseFecha(c) : null)).filter(Boolean).map((f) => f.slice(0, 4));
    // si no hay fechas, se mira el nombre de la hoja o del archivo ("Resumen 2025", "ventas_2024.xlsx")
    if (!anios.length) [nombre, ...hojas.map((h) => h.nombre)].forEach((x) => { const y = String(x).match(/(?:^|\D)(20\d{2})(?:\D|$)/); if (y) anios.push(y[1]); });
    ANIO_IMPORT = anios.length ? Number(Object.entries(anios.reduce((a, y) => ((a[y] = (a[y] || 0) + 1), a), {})).sort((a, b) => b[1] - a[1])[0][0]) : Number(hoy().slice(0, 4));
    S.imp = { archivo: nombre, hojas: hojas.map((h) => analizarHoja(h.nombre, h.filas)) };
    const reconocidas = S.imp.hojas.filter((h) => h.tipo !== 'ninguno').length;
    render(); toast(reconocidas ? `Reconocimos ${reconocidas} de ${hojas.length} hoja${hojas.length > 1 ? 's' : ''}. Revisa y confirma.` : 'No reconocimos las hojas. Elige qué contiene cada una.');
  } catch (e) { console.error(e); toast('No pudimos leer el archivo: ' + (e.message || e), true); }
  finally { cargando(false); }
}

function importarTodo() {
  const cont = { clientes: 0, productos: 0, servicios: 0, insumos: 0, ventas: 0, gastos: 0, actualizados: 0, repetidos: 0, movidos: 0, citas: 0, entregas: 0, recordatorios: 0, historial: 0, fechadas: 0, calzadas: 0, sinFechaNuevas: 0, sinFechaSaltadas: 0, anuladas: 0 };
  const avisos = []; const H = hoy();
  const clientePorNombre = new Map(db.all('clientes').map((c) => [norm(c.nombre), c]));
  const clientePorTel = new Map(db.all('clientes').filter((c) => c.telefono).map((c) => [telLimpio(c.telefono), c]));
  const porNombre = (t) => new Map(db.all(t).map((x) => [norm(x.nombre), x]));
  const lotes = { ventas: [], venta_items: [], movimientos_stock: [], gastos: [], clientes: [], citas: [], eventos: [] };

  const buscarCliente = (nombre, telefono, correo) => {
    nombre = String(nombre || '').trim(); const tel = telLimpio(telefono || '');

    if (!c && nombre && norm(nombre).includes(' ')) { const cands = [...new Set(clientePorNombre.values())].filter((x) => norm(x.nombre).includes(' ') && mismaPersona(x.nombre, nombre) && (!tel || !x.telefono || telLimpio(x.telefono) === tel)); if (cands.length === 1) c = cands[0]; }
    if (!c && !nombre && !tel) return null;
    if (!c) { c = { id: uid(), nombre: nombre || String(telefono).trim(), telefono: telefono || '', cumpleanos: null, notas: correo ? 'Correo: ' + String(correo).trim() : '', creado_en: H }; lotes.clientes.push(c); clientePorNombre.set(norm(c.nombre), c); if (tel) clientePorTel.set(tel, c); cont.clientes++; }
    else if (tel && !c.telefono) { if (db.get('clientes', c.id)) db.update('clientes', c.id, { telefono: String(telefono).trim() }); else c.telefono = String(telefono).trim(); clientePorTel.set(tel, c); }
    return c;
  };
  const ajustarStock = (tipo, item, deseado) => {
    if (deseado == null) return; const dif = deseado - stockDe(tipo, item.id) - sum(lotes.movimientos_stock.filter((m) => m.item_id === item.id), (m) => m.cantidad);
    if (dif) lotes.movimientos_stock.push({ id: uid(), tipo_item: tipo, item_id: item.id, cantidad: dif, motivo: 'ajuste', ref_id: null, fecha: H, nota: 'Importado desde Excel' });
  };
  const firmaV = (fecha, total, nombre, cli) => [fecha, Math.round(total), norm(nombre), cli || ''].join('|');
  // repetidos: se cuentan las veces que ya existe cada fila, así dos atenciones iguales el mismo día no se pierden,
  // pero si subes el mismo archivo dos veces no se duplica nada
  const contar = (arr) => arr.reduce((m, k) => m.set(k, (m.get(k) || 0) + 1), new Map());
  const vEx = contar(db.all('ventas').map((v) => firmaV(v.fecha, v.total, nombreVenta(v), v.cliente_id)));
  // ventas por firma (para unir una cita pasada con su venta en vez de duplicarla)
  const ligadas = new Set(db.all('citas').map((c) => c.venta_id).filter(Boolean));
  const porFirma = new Map(); const anotarFirma = (f, v) => { if (!porFirma.has(f)) porFirma.set(f, []); porFirma.get(f).push(v); };
  for (const v of db.all('ventas')) if (!ligadas.has(v.id)) anotarFirma(firmaV(v.fecha, v.total, nombreVenta(v), v.cliente_id), v);
  // ventas anotadas "sin fecha" en MiDerno: si el Excel trae la misma (misma clienta o mismo detalle, y mismo monto), toman su fecha
  const sinFechaPool = db.all('ventas').filter(esVentaSinFecha).map((v) => ({ v, nombre: norm(nombreVenta(v)), usada: false }));
  const fecharExistente = (fecha, nombre, monto, cli) => {
    const n = norm(nombre); const libres = sinFechaPool.filter((p) => !p.usada);
    const montoOk = (p) => Math.abs(Number(p.v.total) - monto) <= 1;
    const p = (cli && (libres.find((x) => x.v.cliente_id === cli.id && montoOk(x) && x.nombre === n) || libres.find((x) => x.v.cliente_id === cli.id && (montoOk(x) || x.nombre === n))))
      || libres.find((x) => !x.v.cliente_id && montoOk(x) && x.nombre === n);
    if (!p) return false;
    p.usada = true;
    db.update('ventas', p.v.id, { fecha, cliente_id: p.v.cliente_id || cli?.id || null, nota: 'Fecha tomada de tu Excel' });
    const coms = db.all('comisiones').filter((c) => c.venta_id === p.v.id).map((c) => c.id); if (coms.length) db.updateMany('comisiones', coms, { fecha });
    cont.fechadas++; return true;
  };
  // citas y entregas que ya existen (para no duplicarlas si subes el mismo archivo otra vez)

  const citasEx = new Set(db.all('citas').flatMap((c) => [kCita(c.fecha, c.hora, c.cliente_id, c.servicio_id), kCita(c.fecha, null, c.cliente_id, c.servicio_id)]));
  const evEx = new Set(db.all('eventos').map((e) => `${e.fecha}|${norm(e.titulo)}|${e.cliente_id || ''}`));
  const empleadoDe = (nombre) => { const n = norm(nombre); if (!n) return null; const es = db.all('empleados'); return (es.find((e) => norm(e.nombre) === n) || es.find((e) => norm(e.nombre).split(' ')[0] === n.split(' ')[0]))?.id || null; };
  const gEx = contar(db.all('gastos').map((g) => [g.fecha, Math.round(g.monto), norm(g.descripcion)].join('|')));
  const vVistos = new Map(), gVistos = new Map();
  const repetida = (ex, vistos, k) => { const n = vistos.get(k) || 0; vistos.set(k, n + 1); return n < (ex.get(k) || 0); };
  IMP_NUEVOS.cats.clear(); IMP_NUEVOS.metodos.clear();
  const registrarIngreso = (o, det, monto, cant, extra = {}) => {
    // "Manicure + Pedicure" (así exporta MiDerno las ventas con varias cosas) se guarda tal cual
    const varias = / \+ /.test(det); const item = varias ? null : buscarEnCatalogo(det);

    const nombreCli = o.cliente || (o.telefono ? '' : clienteEnDetalle(det, item));
    const cli = buscarCliente(nombreCli, o.telefono); const nombre = item?.x.nombre || det || 'Venta';
    const f = firmaV(o.fecha, monto, nombre, cli?.id); if (repetida(vEx, vVistos, f)) { cont.repetidos++; return null; }

    if (extra.sinFecha && sinFechaPool.some((p) => !p.usada && (p.v.cliente_id || null) === (cli?.id || null) && Math.abs(Number(p.v.total) - monto) <= 1 && p.nombre === norm(nombre))) { cont.repetidos++; return null; }
    const v = { id: uid(), fecha: o.fecha, cliente_id: cli?.id || null, total: monto, metodo_pago: parseMetodo(o.metodo_pago), canal: 'local', nota: extra.sinFecha ? NOTA_SIN_FECHA : monto ? 'Importado desde Excel' : 'Importado desde Excel (sin cobro: ' + (o.metodo_pago || 'giftcard') + ')' };
    lotes.ventas.push(v);
    lotes.venta_items.push({ id: uid(), venta_id: v.id, tipo_item: item ? item.tipo : 'libre', item_id: item?.x.id || null, nombre, cantidad: cant, precio_unitario: Math.round((monto / cant) * 100) / 100, empleado_id: extra.empleado_id || null });
    if (!extra.sinFecha) anotarFirma(f, v);

  };
  // en una agenda, un servicio que no está en tu catálogo se crea (con el precio de la reserva)
  const servicioPara = (det, precio) => {
    const item = buscarEnCatalogo(det); if (item) return item.tipo === 'servicio' ? item.x : null;

    const s = db.insert('servicios', { nombre, precio: precio > 0 ? precio : 0, duracion_min: 60, activo: true }); cont.servicios++; return s;
  };
  // venta del mismo día y de la misma clienta (aunque el detalle o el nombre estén escritos distinto): es la misma atención
  const yaUnidas = new Set(ligadas);
  const ventaDelDia = (fecha, cli, monto) => {
    const delDia = [...db.all('ventas'), ...lotes.ventas].filter((v) => v.fecha === fecha && !yaUnidas.has(v.id));
    const nom = (v) => db.get('clientes', v.cliente_id)?.nombre || lotes.clientes.find((c) => c.id === v.cliente_id)?.nombre || '';

  // filas con fecha futura: citas, entregas o recordatorios de pago (no son ventas todavía)
  const agendarFutura = (tipoHoja, o, det, clase, monto) => {

/* =========================================================
   Planillas "a mano": recetas en bloques y listas sin fecha
   Ej: un bloque con el nombre del producto arriba (home spray), debajo cada insumo con su costo
   (frasco 450 · 120 ml), después el costo total y el precio de venta.
   ========================================================= */
const ENVASE_RE = /frasco|caja|bolsa|etiqueta|sticker|envase|tapa|varilla|palito|pabilo|mecha|tarro|botella|cinta|tag/;
const esTexto = (v) => typeof v === 'string' && /[a-záéíóúñü]/i.test(v);
const esNum = (v) => typeof v === 'number' || (typeof v === 'string' && v.trim() !== '' && parseNumero(v) != null && /^[\s$\d.,-]+$/.test(v));
const valNum = (v) => typeof v === 'number' ? v : parseNumero(v);
const titulo = (s) => { let t = String(s).trim().replace(/\s+/g, ' '); if (t === t.toUpperCase()) t = t.toLowerCase(); return t.replace(/^./, (c) => c.toUpperCase()); };
function parseCantidad(v) {
  const m = String(v ?? '').trim().toLowerCase().match(/^(\d+(?:[.,]\d+)?)\s*(ml|cc|lt|l|gr|g|grs|kg|un|unid|unidades?)?\.?$/);
  if (!m) return null;
  const u = { cc: 'ml', l: 'lt', g: 'gr', grs: 'gr', un: 'unidad', unid: 'unidad', unidades: 'unidad' }[m[2]] || m[2] || 'unidad';
  return { n: Number(m[1].replace(',', '.')), u };
}
function leerBloques(filas) {
  const F = filas.map((f) => f || []); const ancho = Math.max(0, ...F.map((f) => f.length));
  const cel = (r, c) => (F[r] || [])[c];
  const usadas = new Set(); const recetas = []; const listas = [];
  // recetas: encabezado de texto y debajo filas "insumo | costo | cantidad?", cerradas por el total (y el precio)
  for (let c = 0; c < ancho - 1; c++) for (let r = 0; r < F.length - 2; r++) {
    if (usadas.has(r + ',' + c) || !esTexto(cel(r, c))) continue;
    const lineas = []; let k = r + 1;
    while (k < F.length && esTexto(cel(k, c)) && esNum(cel(k, c + 1))) { lineas.push({ insumo: cel(k, c), costo: valNum(cel(k, c + 1)), cant: parseCantidad(cel(k, c + 2)) }); k++; }
    if (lineas.length < 3 || /venta|gasto|compra|total/.test(norm(cel(r, c)))) continue;
    const suma = sum(lineas, (l) => l.costo);
    const t1 = !esTexto(cel(k, c)) && esNum(cel(k, c + 1)) ? valNum(cel(k, c + 1)) : null;
    if (t1 == null || Math.abs(t1 - suma) > Math.max(2, suma * 0.03)) continue;
    const t2 = !esTexto(cel(k + 1, c)) && esNum(cel(k + 1, c + 1)) ? valNum(cel(k + 1, c + 1)) : null;
    const tam = parseCantidad(cel(r, c + 1));
    recetas.push({ nombre: titulo(cel(r, c)) + (tam ? ` ${qtyFmt(tam.n)} ${tam.u}` : ''), base: titulo(cel(r, c)), costo: t1, precio: t2 && t2 > t1 ? t2 : null, lineas });
    for (let x = r; x <= k + 1; x++) for (let y = c; y <= c + 2; y++) usadas.add(x + ',' + y);
  }
  // si dos recetas se llaman igual, se distinguen por el tamaño del frasco ("Mikado 50 ml")
  for (const rc of recetas) if (rc.nombre === rc.base && recetas.filter((x) => norm(x.base) === norm(rc.base)).length > 1) { const env = rc.lineas.find((l) => ENVASE_RE.test(norm(l.insumo)) && l.cant && l.cant.u !== 'unidad'); if (env) rc.nombre = `${rc.base} ${qtyFmt(env.cant.n)} ${env.cant.u}`; }
  // listas sin fecha: "monto | nombre" hacia abajo, con el total al final. Si arriba dice ventas, son ingresos
  for (let c = 0; c < ancho - 1; c++) for (let r = 0; r < F.length; r++) {
    if (usadas.has(r + ',' + c) || !esNum(cel(r, c)) || !esTexto(cel(r, c + 1))) continue;
    if (r > 0 && esNum(cel(r - 1, c)) && esTexto(cel(r - 1, c + 1))) continue; // no es el comienzo
    const items = []; let k = r;
    while (k < F.length && esNum(cel(k, c)) && esTexto(cel(k, c + 1))) { items.push({ monto: valNum(cel(k, c)), nombre: titulo(cel(k, c + 1)), nota: esTexto(cel(k, c + 2)) ? String(cel(k, c + 2)).trim() : '' }); k++; }
    if (items.length < 3) continue;
    const total = esNum(cel(k, c)) && !esTexto(cel(k, c + 1)) ? valNum(cel(k, c)) : null;
    const encabezado = norm([cel(r - 1, c), cel(r - 1, c + 1), cel(r, c - 1), cel(Math.max(0, r - 1), c - 1)].filter(esTexto).join(' ')) || norm(String(cel(0, c) ?? ''));
    const tipo = /venta|ingreso|vendido/.test(encabezado) ? 'ingreso' : 'egreso';
    listas.push({ tipo, items, total: total != null && Math.abs(total - sum(items, (i) => i.monto)) <= 2 ? total : sum(items, (i) => i.monto) });
    for (let x = r; x <= k; x++) for (let y = c; y <= c + 2; y++) usadas.add(x + ',' + y);
  }
  return { recetas, listas };
}

// guarda productos, insumos y recetas; los insumos con el mismo nombre se comparten si cuestan lo mismo por unidad
function importarBloques(h, cont, avisos) {
  const insPorNombre = new Map(db.all('insumos').map((i) => [norm(i.nombre), i]));
  const prodPorNombre = new Map(db.all('productos').map((p) => [norm(p.nombre), p]));
  for (const rc of h.recetas) {
    let p = prodPorNombre.get(norm(rc.nombre));
    if (!p) { p = db.insert('productos', { nombre: rc.nombre, sku: '', precio_venta: rc.precio || 0, costo: rc.costo, stock_minimo: 3, activo: true }); prodPorNombre.set(norm(p.nombre), p); cont.productos++; }
    else if (rc.precio && !Number(p.precio_venta)) db.update('productos', p.id, { precio_venta: rc.precio });
    db.removeMany('formulas', db.all('formulas').filter((f) => f.producto_id === p.id).map((f) => f.id)); // la receta del archivo reemplaza a la anterior
    for (const l of rc.lineas) {
      const envase = ENVASE_RE.test(norm(l.insumo));
      const usaCant = l.cant && !envase && l.cant.n > 0;
      const unidad = usaCant ? l.cant.u : 'unidad'; const cantidad = usaCant ? l.cant.n : 1;
      const cu = l.costo / cantidad;
      let nombre = titulo(l.insumo) + (envase && l.cant && l.cant.u !== 'unidad' ? ` ${qtyFmt(l.cant.n)} ${l.cant.u}` : '');
      // se comparte el insumo solo si tiene la misma unidad y el mismo costo; si no, se crea uno con el nombre del producto
      const calza = (i) => i && i.unidad === unidad && Math.abs(Number(i.costo_unitario) - cu) <= Math.max(0.5, cu * 0.005);
      const base = nombre; let ins = insPorNombre.get(norm(nombre));
      for (let n = 0; ins && !calza(ins); n++) { nombre = `${base} (${rc.nombre}${n ? ' ' + (n + 1) : ''})`; ins = insPorNombre.get(norm(nombre)); }
      if (!ins) { ins = db.insert('insumos', { nombre, unidad, costo_unitario: Math.round(cu * 10000) / 10000, stock_minimo: 0 }); insPorNombre.set(norm(nombre), ins); cont.insumos++; }
      db.insert('formulas', { producto_id: p.id, insumo_id: ins.id, cantidad });
    }
    cont.recetas = (cont.recetas || 0) + 1;
  }
  if (h.recetas.length) { if (!tiene('inventario')) db.modulo('inventario', true); if (!tiene('produccion')) db.modulo('produccion', true); }
  if (h.listasSi && h.listas.length) {
    const fecha = h.listasFecha || hoy();
    const ventas = [], items = [], gastos = [];
    for (const li of h.listas) for (const it of li.items) {
      if (li.tipo === 'ingreso') { const v = { id: uid(), fecha, cliente_id: null, total: it.monto, metodo_pago: Object.keys(metodos())[0], canal: 'local', nota: 'Importado desde Excel (sin fecha)' }; ventas.push(v); items.push({ id: uid(), venta_id: v.id, tipo_item: 'libre', item_id: null, nombre: it.nombre, cantidad: 1, precio_unitario: it.monto, empleado_id: null }); }
      else gastos.push({ id: uid(), fecha, categoria: parseCategoria('', it.nombre), monto: it.monto, descripcion: it.nombre + (it.nota ? ` (${it.nota})` : '') });
    }
    if (ventas.length) { db.insertMany('ventas', ventas); db.insertMany('venta_items', items); cont.ventas += ventas.length; }
    if (gastos.length) { db.insertMany('gastos', gastos); cont.gastos += gastos.length; }
  }
}

/* =========================================================
   Página pública de reservas
   Los clientes del negocio eligen servicio, persona, día y hora
   libre; la hora llega a la agenda como "Por confirmar".
   ========================================================= */

const HORARIO_DEF = { dias: [1, 2, 3, 4, 5, 6], desde: '10:00', hasta: '19:00', intervalo: 30 };
const DIAS_SEMANA = [[1, 'Lun'], [2, 'Mar'], [3, 'Mié'], [4, 'Jue'], [5, 'Vie'], [6, 'Sáb'], [0, 'Dom']];
const horarioDe = (n) => { let h = n?.horario || {}; if (typeof h === 'string') { try { h = JSON.parse(h); } catch { h = {}; } } return { ...HORARIO_DEF, ...h }; };
// horario de un día de la semana (0 = domingo): null si está cerrado
const horarioDia = (h, dow) => (h.dias.includes(dow) ? { desde: h.porDia?.[dow]?.desde || h.desde, hasta: h.porDia?.[dow]?.hasta || h.hasta } : null);
const slugDe = (nombre) => norm(nombre).replace(/ /g, '-').slice(0, 40) || 'mi-negocio';
const aMin = (h) => { const [a, b] = hhmm(h).split(':').map(Number); return a * 60 + (b || 0); };
const deMin = (m) => `${pad(Math.floor(m / 60))}:${pad(m % 60)}`;

// Horas libres de un día: recorre el horario de atención y deja las que no chocan
function horasLibres({ horario, fecha, dur, ocupadas, empleados, empleadoId }) {
  const dow = new Date(fecha + 'T12:00:00').getDay(); const hd = horarioDia(horario, dow); if (!hd) return [];
  const ini = aMin(hd.desde), fin = aMin(hd.hasta), paso = Number(horario.intervalo) || 30;
  const n = new Date(); const minimo = fecha === hoy() ? n.getHours() * 60 + n.getMinutes() + 60 : fecha < hoy() ? 99999 : 0;
  const ids = empleados.map((e) => e.id); const out = [];
  for (let m = ini; m + dur <= fin; m += paso) {
    if (m < minimo) continue;
    const cruzan = ocupadas.filter((o) => m < aMin(o.hora) + Number(o.dur) && aMin(o.hora) < m + dur);
    if (cruzan.some((o) => o.todos)) continue; // horario bloqueado por el negocio
    if (!ids.length) { if (!cruzan.length) out.push({ hora: deMin(m), empleado_id: null }); continue; }
    // cada hora sin persona asignada ocupa a alguien del equipo
    const sinAsignar = cruzan.filter((o) => o.empleado_id == null).length;
    const libres = ids.filter((id) => !cruzan.some((o) => o.empleado_id === id));
    if (libres.length <= sinAsignar) continue;
    if (empleadoId) { if (libres.includes(empleadoId)) out.push({ hora: deMin(m), empleado_id: empleadoId }); }
    else out.push({ hora: deMin(m), empleado_id: libres[0] });
  }
  return out;
}

    const vence = estado === 'solicitada' ? venceReserva(r.fecha, r.hora) : null; const grupo = ids.length > 1 ? uid() : null; let h = aMin(r.hora);
    for (const sid of ids) {

      h += Number(db.get('servicios', sid)?.duracion_min || 60);

};

}

function guardarReservas(form) {
  const fd = new FormData(form); const dias = fd.getAll('dia').map(Number);

  const porDia = {};
  for (const d of dias) {
    const desde = fd.get('desde_' + d) || '10:00', hasta = fd.get('hasta_' + d) || '19:00';
    if (aMin(hasta) <= aMin(desde)) return toast(`${DIAS_SEMANA.find((x) => x[0] === d)[1]}: la hora de cierre debe ser después de la de apertura`, true);
    porDia[d] = { desde, hasta };
  }
  // el horario general queda como el más amplio (sirve de respaldo para versiones anteriores)
  const desde = deMin(Math.min(...dias.map((d) => aMin(porDia[d].desde)))), hasta = deMin(Math.max(...dias.map((d) => aMin(porDia[d].hasta))));
  const slug = slugDe(fd.get('slug') || S.negocio.nombre);
  db.negocio({ horario: { dias, desde, hasta, porDia, intervalo: Math.max(5, Math.min(480, Math.round(Number(fd.get('intervalo')) || 30))) }, telefono: String(fd.get('telefono') || '').trim(), slug });
  toast('Horario guardado'); render();
}

/* v41: plazo para confirmar: una reserva pendiente guarda la hora solo un tiempo */
const PLAZOS = [0, 1, 2, 3, 6, 12, 24];
const plazoHoras = () => { const v = Number(cfg().plazo_horas); return Number.isFinite(v) && cfg().plazo_horas != null ? v : 2; };
// igual que en la base: si la cita es pronto el plazo se acorta (hasta 1 hora antes), y nunca menos de 20 minutos
function venceReserva(fecha, hora) {
  const h = plazoHoras(); if (!h) return null;
  const ahora = Date.now(); const inicio = new Date(`${fecha}T${hhmm(hora)}:00`).getTime();
  return new Date(Math.max(ahora + 20 * 60e3, Math.min(ahora + h * 3600e3, inicio - 3600e3))).toISOString();
}
const vencida = (c) => c.estado === 'solicitada' && c.vence_en && new Date(c.vence_en).getTime() < Date.now();
const citaOcupa = (c) => !INACTIVOS.includes(c.estado) && !vencida(c);
function cuandoVence(iso) {

  const hora = `${pad(d.getHours())}:${pad(d.getMinutes())}`;
  return (local === hoy() ? 'hoy' : local === addDays(hoy(), 1) ? 'mañana' : fechaCorta(local)) + ' a las ' + hora;
}
function filaPlazo() {
  const v = plazoHoras(); const aplica = cfg().confirmacion !== 'auto' || cfg().abono?.activo;

/* =========================================================
   Proveedores y contactos
   Cada producto o insumo puede tener su proveedor. Cuando algo
   queda bajo el mínimo, MiDerno arma el pedido y lo deja listo
   para mandar por WhatsApp.
   ========================================================= */

const TIPOS_CONTACTO = { proveedor: 'Proveedor', web: 'Página web', contacto: 'Contacto' };
const esProveedor = (c) => c && c.tipo !== 'contacto';

// Productos e insumos que surte un proveedor, con su stock
function itemsDeProveedor(provId) {
  const out = [];
  for (const p of db.all('productos')) if (p.proveedor_id === provId && p.activo !== false) out.push({ tipo: 'producto', item: p, st: stockDe('producto', p.id), min: Number(p.stock_minimo || 0), unidad: 'un.' });
  for (const i of db.all('insumos')) if (i.proveedor_id === provId) out.push({ tipo: 'insumo', item: i, st: stockDe('insumo', i.id), min: Number(i.stock_minimo || 0), unidad: i.unidad });
  return out;
}
const bajoMinimo = (x) => x.st <= x.min;
const sugerido = (x) => Math.max(1, Math.ceil(x.min * 2 - x.st));
function porReponer() {
  // proveedores con algo bajo el mínimo, y lo que no tiene proveedor asignado
  const control = tiene('inventario');
  const provs = db.all('proveedores').map((p) => ({ p, bajos: itemsDeProveedor(p.id).filter(bajoMinimo) })).filter((x) => x.bajos.length && control);
  const sinProv = control ? [...db.all('productos').filter((p) => p.activo !== false && !p.proveedor_id && stockDe('producto', p.id) <= Number(p.stock_minimo || 0)),
    ...(tiene('produccion') ? db.all('insumos').filter((i) => !i.proveedor_id && stockDe('insumo', i.id) <= Number(i.stock_minimo || 0)) : [])] : [];
  return { provs, sinProv };
}

/* =========================================================
   Clientes repetidos: si dos fichas tienen el mismo nombre o el
   mismo teléfono, se pueden unir en una sola con todo su historial.
   ========================================================= */

const tel8 = (t) => telLimpio(t).slice(-8);
function buscarGemelo(id, nombre, telefono) {
  const n = norm(nombre); const t = tel8(telefono);
  return db.all('clientes').find((c) => c.id !== id && ((n && norm(c.nombre) === n) || (t.length === 8 && tel8(c.telefono) === t)));
}
// Agrupa por nombre normalizado y por teléfono (8 dígitos) en una sola pasada; se memoriza hasta que cambien los clientes
function gruposDuplicados() {
  return indice('duplicados', 'clientes', (arr) => {
    const porN = new Map(), porT = new Map();
    for (const c of arr) {
      const n = norm(c.nombre); if (n) (porN.get(n) || porN.set(n, []).get(n)).push(c);
      const t = tel8(c.telefono); if (t.length === 8) (porT.get(t) || porT.set(t, []).get(t)).push(c);
    }
    // une los grupos que comparten alguna ficha (mismo nombre o mismo teléfono)
    const padre = new Map(arr.map((c) => [c.id, c.id]));
    const raiz = (x) => { while (padre.get(x) !== x) { padre.set(x, padre.get(padre.get(x))); x = padre.get(x); } return x; };
    for (const g of [...porN.values(), ...porT.values()]) for (let i = 1; i < g.length; i++) padre.set(raiz(g[i].id), raiz(g[0].id));
    const grupos = new Map(); for (const c of arr) { const r = raiz(c.id); (grupos.get(r) || grupos.set(r, []).get(r)).push(c); }
    return [...grupos.values()].filter((g) => g.length > 1);
  });
}
const comprasDe = (id) => db.all('ventas').filter((v) => v.cliente_id === id).length;

// Mueve todo el historial de "sobra" a "queda" y borra la ficha repetida
function unificarClientes(quedaId, sobraId) {
  const queda = db.get('clientes', quedaId); const sobra = db.get('clientes', sobraId); if (!queda || !sobra || quedaId === sobraId) return;
  for (const t of ['ventas', 'citas', 'eventos']) db.updateMany(t, db.all(t).filter((r) => r.cliente_id === sobraId).map((r) => r.id), { cliente_id: quedaId });
  const patch = {};
  if (!queda.telefono && sobra.telefono) patch.telefono = sobra.telefono;
  if (!queda.cumpleanos && sobra.cumpleanos) patch.cumpleanos = sobra.cumpleanos;
  if (sobra.notas && !String(queda.notas || '').includes(sobra.notas)) patch.notas = [queda.notas, sobra.notas].filter(Boolean).join(' · ');
  if (sobra.creado_en && (!queda.creado_en || sobra.creado_en < queda.creado_en)) patch.creado_en = sobra.creado_en;
  if (Object.keys(patch).length) db.update('clientes', quedaId, patch);
  db.remove('clientes', sobraId);
}

    pie: `<div class="sheet-foot"><button type="button" class="btn" id="dup-no">Son personas distintas</button><button type="button" class="btn pri" id="dup-si">Unificar fichas</button></div>`,
  });

function revisarDuplicados() {
  const grupos = gruposDuplicados();
  if (!grupos.length) { cerrarSheet(); return toast('No hay fichas repetidas'); }
  abrirSheet('Fichas repetidas', `<p class="small muted">Tienen el mismo nombre o el mismo teléfono. Al unificar, la ficha con más compras se queda con todo el historial.</p>
    <div class="list">${grupos.map((g, i) => `<div class="row" style="flex-wrap:wrap"><div class="grow">${g.map((c) => `<div class="t" style="font-weight:500">${esc(c.nombre)} <span class="small muted">${esc(c.telefono || 'sin teléfono')} · ${comprasDe(c.id)} compras</span></div>`).join('')}</div>
      <button type="button" class="btn sm pri" data-act="unificar-grupo" data-i="${i}">Unificar</button></div>`).join('')}</div>`, { pie: '<div class="sheet-foot"><button type="button" class="btn" data-close>Cerrar</button></div>' });
}
function unificarGrupo(i) {
  const g = gruposDuplicados()[i]; if (!g) return;
  const [queda, ...resto] = [...g].sort((a, b) => comprasDe(b.id) - comprasDe(a.id) || String(a.creado_en || '').localeCompare(String(b.creado_en || '')));
  resto.forEach((c) => unificarClientes(queda.id, c.id));
  toast(`Unificamos ${g.length} fichas de ${queda.nombre}`); render(); revisarDuplicados();
}

// Achica la foto antes de guardarla para que la página cargue rápido
function achicarFoto(file, max = 900) {
  return new Promise((ok, fail) => {
    const img = new Image(); const url = URL.createObjectURL(file);
    img.onload = () => { const k = Math.min(1, max / Math.max(img.width, img.height)); const cv = document.createElement('canvas'); cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k); cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height); URL.revokeObjectURL(url); ok(cv.toDataURL('image/jpeg', 0.72)); };
    img.onerror = () => fail(new Error('No pudimos leer esa imagen')); img.src = url;
  });
}
// logo: cuadrado, PNG para respetar fondos transparentes
function achicarLogo(file, lado = 320) {
  return new Promise((ok, fail) => {
    const img = new Image(); const url = URL.createObjectURL(file);
    img.onload = () => { const k = Math.min(1, lado / Math.max(img.width, img.height)); const cv = document.createElement('canvas'); cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k); cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height); URL.revokeObjectURL(url); const png = cv.toDataURL('image/png'); ok(png.length > 180000 ? cv.toDataURL('image/jpeg', 0.85) : png); };
    img.onerror = () => fail(new Error('No pudimos leer esa imagen')); img.src = url;
  });
}
async function subirLogo(files) {
  const f = files?.[0]; if (!f) return;
  try { guardarConfig({ logo: await achicarLogo(f) }); toast('Logo guardado'); render(); } catch (e) { toast(e.message, true); }
}

}

document.addEventListener('submit', (e) => {
  const f = e.target; if (!['form-mensajes', 'form-listas', 'form-abono', 'form-perfil'].includes(f.id)) return;
  e.preventDefault(); const fd = new FormData(f);
  if (f.id === 'form-mensajes') {
    const mensajes = { ...(cfg().mensajes || {}) };
    for (const k of Object.keys(MENSAJES_DEF)) if (fd.has(k)) { const v = String(fd.get(k)).trim(); if (!v || v === MENSAJES_DEF[k]) delete mensajes[k]; else mensajes[k] = v; }
    guardarConfig({ mensajes }); toast('Mensajes guardados');
  }
  if (f.id === 'form-listas') {
    const lineas = (n) => [...new Set(String(fd.get(n) || '').split('\n').map((x) => x.trim()).filter(Boolean))];
    const cats = lineas('categorias_gasto'); const mets = lineas('metodos'); const unis = lineas('unidades');
    if (!cats.length || !mets.length || !unis.length) return toast('Cada lista necesita al menos un elemento', true);
    // los medios de pago que ya existían conservan su código para no perder el historial
    const porNombre = Object.fromEntries(Object.entries({ ...METODOS, ...metodos() }).map(([k, l]) => [norm(l), k]));
    guardarConfig({ categorias_gasto: cats, metodos: mets.map((l) => ({ k: porNombre[norm(l)] || norm(l).replace(/ /g, '_'), l })), unidades: unis });
    toast('Listas guardadas');
  }
  if (f.id === 'form-perfil') {
    const limpio = (k) => String(fd.get(k) || '').trim();
    const url = (k) => { const v = limpio(k); return v && !/^https?:\/\//i.test(v) ? 'https://' + v : v; };
    guardarConfig({ direccion: limpio('direccion'), maps_url: url('maps_url'), resenas_url: url('resenas_url'), indicaciones: limpio('indicaciones'), descripcion: limpio('descripcion').slice(0, 400), instagram: limpio('instagram').replace(/^https?:\/\/(www\.)?instagram\.com\//i, '').replace(/^@/, '').replace(/\/.*$/, '') }); toast('Perfil guardado');
  }
  if (f.id === 'form-abono') {
    const valor = fd.get('tipo') === 'pct' ? Math.min(100, dec(fd.get('valor'))) : num(fd.get('valor'));
    if (fd.get('activo') && !(valor > 0)) return toast('Escribe el monto o porcentaje del abono', true);
    if (fd.get('activo') && !String(fd.get('datos') || '').trim()) return toast('Escribe los datos para transferir', true);
    guardarConfig({ abono: { activo: !!fd.get('activo'), tipo: fd.get('tipo'), valor, datos: String(fd.get('datos') || '').trim() } });
    toast('Abono guardado');
  }
  render();
});

function tablaMeses(hasta, sel = hasta) {
  const meses = Array.from({ length: 12 }, (_, i) => addMonths(hasta, i - 11));
  const filas = meses.map((m) => { const ing = sum(ventasDelMes(m), (v) => Number(v.total)); const gas = sum(gastosDelMes(m), (g) => Number(g.monto)) + sum(db.all('comisiones').filter((c) => mesDe(c.fecha) === m), (c) => Number(c.monto)); return { m, ing, gas, res: ing - gas }; }).filter((f, i, a) => f.ing || f.gas || f.m === mesActual() || f.m === sel || (a.slice(0, i).some((x) => x.ing || x.gas) && a.slice(i + 1).some((x) => x.ing || x.gas)));
  if (!filas.length) return '';
  const max = Math.max(1, ...filas.flatMap((f) => [f.ing, f.gas]));
  const tot = filas.reduce((a, f) => ({ ing: a.ing + f.ing, gas: a.gas + f.gas, res: a.res + f.res }), { ing: 0, gas: 0, res: 0 });
  return `<div class="card"><div class="card-head"><h2>Mes a mes</h2></div><div class="tbl-wrap"><table class="mes-a-mes"><thead><tr><th>Mes</th><th class="n">Ingresos</th><th class="n">Egresos</th><th class="n">Resultado</th><th class="barra-col"><span class="mm-ley"><i class="ley-in"></i>Ingresos <i class="ley-eg"></i>Egresos</span></th></tr></thead><tbody>
    ${filas.slice().reverse().map((f) => `<tr class="click-mes ${f.m === sel ? 'on' : ''}" data-act="caja-ir-mes" data-m="${f.m}"><td style="white-space:nowrap">${esc(nombreMes(f.m))}</td><td class="n">${money(f.ing)}</td><td class="n">${money(f.gas)}</td><td class="n"><b class="${f.res < 0 ? 'down' : ''}">${money(f.res)}</b></td>
      <td class="barra-col"><span class="mm-barras" aria-hidden="true"><span class="mm-in" style="width:${Math.round((f.ing / max) * 100)}%"></span><span class="mm-eg" style="width:${Math.round((f.gas / max) * 100)}%"></span></span></td></tr>`).join('')}
    </tbody><tfoot><tr><td><b>Total</b></td><td class="n"><b>${money(tot.ing)}</b></td><td class="n"><b>${money(tot.gas)}</b></td><td class="n"><b class="${tot.res < 0 ? 'down' : ''}">${money(tot.res)}</b></td><td class="barra-col"></td></tr></tfoot></table></div></div>`;
}

/* =========================================================
   App para el equipo: cada colaborador ve SU agenda (hora,
   cliente y servicio) y SU mes (atenciones, vendido, comisión).
   No ve los movimientos, los clientes ni los datos de los demás.
   ========================================================= */

const EquipoLocal = (empId) => ({
  async datos(desde, hasta) {
    const e = db.get('empleados', empId);
    const citas = db.all('citas').filter((c) => c.empleado_id === empId && c.fecha >= desde && c.fecha <= hasta).map((c) => {
      const s = db.get('servicios', c.servicio_id); return { id: c.id, fecha: c.fecha, hora: hhmm(c.hora), cliente: db.get('clientes', c.cliente_id)?.nombre || 'Cliente', servicio: s?.nombre || '', duracion: s?.duracion_min || 60, precio: s?.precio || 0, estado: c.estado, nota: c.nota || '' };
    });
    const ventas = new Map(db.all('ventas').filter((v) => v.fecha >= desde && v.fecha <= hasta).map((v) => [v.id, v]));
    const atenciones = db.all('venta_items').filter((i) => i.empleado_id === empId && ventas.has(i.venta_id)).map((i) => {
      const v = ventas.get(i.venta_id); const co = db.all('comisiones').find((c) => c.venta_item_id === i.id);
      return { fecha: v.fecha, servicio: i.nombre, monto: i.cantidad * i.precio_unitario, comision: co ? Number(co.monto) : 0, pagada: !!co?.pagada, cliente: db.get('clientes', v.cliente_id)?.nombre || '' };
    });
    return { negocio: { nombre: S.negocio.nombre }, empleado: { id: e.id, nombre: e.nombre, pct_comision: e.pct_comision }, citas, atenciones };
  },
});
const EquipoNube = () => ({
  async datos(desde, hasta) { const sb = await cargarSupabase(); const { data, error } = await sb.rpc('equipo_datos', { p_desde: desde, p_hasta: hasta }); if (error) throw error; return data; },
});

async function abrirEquipo(api, preview) {
  S.eq = { api, preview, tab: 'agenda', fecha: hoy(), mes: mesActual(), data: null };
  await cargarEquipo();
}
async function cargarEquipo() {
  const q = S.eq; const desde = [addDays(hoy(), -1), q.mes + '-01', q.fecha].sort()[0];
  const hasta = [addDays(hoy(), 45), `${q.mes}-${pad(diasDelMes(q.mes))}`, q.fecha].sort().pop();
  try { q.data = await conCarga(q.api.datos(desde, hasta)); q.error = null; } catch (e) { q.error = e.message || String(e); }
  window.scrollTo(0, 0); render();
}

    const hoyList = delDia(q.fecha);

      <div class="list">${hoyList.length ? hoyList.map((c) => { const [est, cls] = ESTADOS_CITA[c.estado] || ['', '']; const fin = deMin(aMin(c.hora) + Number(c.duracion)); return `<div class="row ag-row k-cita"><div class="ag-hora num"><b>${esc(c.hora)}</b><div class="small muted">a ${fin}</div></div>

    const proximas = d.citas.filter((c) => c.fecha >= hoy() && mesDe(c.fecha) === q.mes && !INACTIVOS.includes(c.estado) && c.estado !== 'completada');
    cuerpo = `<div class="between">${monthNav('eq-mes-app', q.mes)}<span class="small muted">Comisión: ${qtyFmt(d.empleado.pct_comision)}%</span></div>
      <div class="grid g2" style="grid-template-columns:repeat(2,minmax(0,1fr))">
        <div class="card kpi"><span class="lbl">Atenciones</span><span class="val">${at.length}</span><span class="sub">${proximas.length} horas más agendadas</span></div>
        <div class="card kpi"><span class="lbl">Vendido</span><span class="val">${money(vendido)}</span><span class="sub">en servicios</span></div>
        <div class="card kpi"><span class="lbl">Mi comisión</span><span class="val">${money(com)}</span><span class="sub">del mes</span></div>
        <div class="card kpi"><span class="lbl">Por cobrar</span><span class="val ${pend ? '' : 'up'}">${money(pend)}</span><span class="sub">${pend ? 'pendiente de pago' : 'al día'}</span></div>
      </div>
      <div class="card"><div class="card-head"><h2>Lo que atendí</h2></div><div class="list">${at.length ? at.map((a) => `<div class="row"><div class="grow"><div class="t" style="font-weight:500">${esc(a.servicio)}</div><div class="s">${fechaCorta(a.fecha)}${a.cliente ? ' · ' + esc(a.cliente) : ''}</div></div><div class="r"><div class="num"><b>${money(a.comision)}</b></div><span class="pill ${a.pagada ? 'ok' : 'warn'}">${a.pagada ? 'Pagada' : 'Pendiente'}</span></div></div>`).join('') : '<div class="empty">Aún no hay atenciones este mes.</div>'}</div></div>`;
  }
  return `<div class="pub">${banner}${top}<div><div class="eyebrow-hand">Hola, ${esc(primerNombre(d.empleado.nombre))}</div></div>${tabs}${cuerpo}</div>`;
}

// quién del equipo ya tiene cuenta: lo responde la base (función equipo_cuentas, actualizacion-7.sql)
async function cargarCuentasEq(forzar = false) {
  if (S.modo !== 'nube' || (S.cuentasEq !== undefined && !forzar)) return;
  S.cuentasEq = S.cuentasEq || null;
  try { const { data, error } = await conCarga(NubeAdapter.sb.rpc('equipo_cuentas')); if (error) throw error; S.cuentasEq = data || []; }
  catch (e) { S.cuentasEq = { error: /function|does not exist|PGRST202|schema cache/i.test(e.message || '') ? 'sql' : e.message || String(e) }; }
  if (S.negocio && vistaActual() === 'equipo') render();
}
const cuentaDe = (empId) => (Array.isArray(S.cuentasEq) ? S.cuentasEq.find((c) => c.empleado_id === empId) : null);
function tarjetaAccesos(todos) {
  const activos = todos.filter((e) => e.activo !== false); if (!activos.length) return '';
  const nube = S.modo === 'nube'; if (nube) cargarCuentasEq();
  const faltaSql = S.cuentasEq?.error === 'sql';
  return `<div class="card stack" id="accesos"><div><h2>Accesos del equipo</h2><p class="small muted">Crea el usuario y la contraseña de cada persona. En su celular verá solo sus horas y sus comisiones; no ve los movimientos del negocio ni a los demás.</p></div>
    ${!nube ? '<div class="banner">Para crear accesos, MiDerno debe estar conectado a la nube. Mientras tanto puedes ver cómo se ve su app.</div>' : ''}
    ${faltaSql ? '<div class="banner">Para ver quién ya tiene acceso y poder quitarlo, corre <b>supabase/actualizacion-7.sql</b> en Supabase. Crear accesos funciona igual.</div>' : ''}
    <div class="list">${activos.map((e) => {
      const c = cuentaDe(e.id);
      const estado = c ? `<span class="pill ok">Con acceso</span> <span class="muted">${esc(c.email || '')}</span>` : e.codigo_acceso ? `Código pendiente: <b class="num">${esc(e.codigo_acceso)}</b>` : nube ? (S.cuentasEq === null ? 'Revisando…' : 'Sin acceso') : 'Sin acceso';
      const botones = !nube ? `<button class="btn sm" data-act="eq-preview" data-id="${e.id}">Ver su app</button>`
        : c ? `<button class="btn sm" data-act="acceso-enviar" data-id="${e.id}">${icon('chat')}Enviar enlace</button><button class="btn sm ghost" data-act="acceso-quitar" data-id="${e.id}">Quitar</button>`
        : `<button class="btn sm pri" data-act="acceso" data-id="${e.id}">${icon('plus')}Crear acceso</button>`;
      return `<div class="row acceso-row"><div class="avatar">${esc(iniciales(e.nombre))}</div><div class="grow"><div class="t">${esc(e.nombre)}</div><div class="s">${estado}</div></div><div class="hstack acceso-btns">${botones}</div></div>`;
    }).join('')}</div></div>`;
}
const claveSugerida = () => { const abc = 'abcdefghjkmnpqrstuvwxyz23456789'; let c = ''; for (const x of crypto.getRandomValues(new Uint32Array(8))) c += abc[x % abc.length]; return c; };
const codigoNuevo = () => { const abc = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let c = ''; for (const x of crypto.getRandomValues(new Uint32Array(6))) c += abc[x % abc.length]; return c; };
function formAcceso(empId) {
  const e = db.get('empleados', empId); if (!e) return;
  if (S.modo !== 'nube') return abrirEquipoPreview(empId);
  abrirSheet(`Acceso para ${esc(primerNombre(e.nombre))}`, `<div class="form">
    <p class="small muted" style="margin:0">Con estos datos ${esc(primerNombre(e.nombre))} entra desde su celular tocando <b>Soy del equipo</b>.</p>
    ${field('Su correo', input('email', e.email || '', 'type="email" autocomplete="off" required placeholder="nombre@gmail.com"'))}
    ${field('Contraseña', `<div class="hstack" style="flex-wrap:nowrap"><input class="in" id="f-clave" name="clave" value="${claveSugerida()}" autocomplete="off" minlength="6" required style="font-variant-numeric:tabular-nums;letter-spacing:.04em"><button type="button" class="btn" id="otra-clave" aria-label="Otra contraseña">${icon('refresh')}</button></div>`, 'Te sugerimos una. Ella la puede cambiar después.')}</div>`, {
    pie: '<div class="sheet-foot"><button type="button" class="btn" data-close>Cancelar</button><button class="btn pri" type="submit">Crear acceso</button></div>',
    submit: (d) => crearAcceso(empId, d.email.trim(), d.clave.trim()),
  });
  $('#otra-clave').onclick = () => { $('#f-clave').value = claveSugerida(); };
}
async function crearAcceso(empId, email, clave) {
  const e = db.get('empleados', empId);
  if (!/^\S+@\S+\.\S+$/.test(email)) return toast('Escribe un correo válido', true);
  if (clave.length < 6) return toast('La contraseña debe tener al menos 6 caracteres', true);
  const codigo = codigoNuevo(); db.update('empleados', empId, { codigo_acceso: codigo }); await NubeAdapter.cola;
  // cliente aparte, sin guardar sesión: así el dueño no pierde la suya
  const tmp = window.supabase.createClient(CONFIG.supabaseUrl, CONFIG.supabaseAnonKey, { auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false, storageKey: 'miderno-alta-equipo' } });
  let sesion = null;
  const r = await tmp.auth.signUp({ email, password: clave, options: { emailRedirectTo: appUrl() || undefined, data: { equipo: true } } });
  if (r.error && !/already|registered|exists/i.test(r.error.message)) { toast(r.error.message, true); return; }
  sesion = r.data?.session || null;
  if (!sesion) { const s2 = await tmp.auth.signInWithPassword({ email, password: clave }); sesion = s2.data?.session || null; }
  if (!sesion) {
    // el correo ya tenía cuenta con otra contraseña, o Supabase pide confirmar el correo: queda el código para su primer ingreso
    cerrarSheet(); render();
    return abrirSheet('Falta un paso', `<p>${/already|registered|exists/i.test(r.error?.message || '') ? `<b>${esc(email)}</b> ya tiene una cuenta.` : 'Supabase pidió confirmar el correo.'} Dile a ${esc(primerNombre(e.nombre))} que entre con su correo y contraseña en <b>Soy del equipo</b> y escriba este código:</p><div class="codigo-grande">${esc(codigo)}</div>`, { pie: `<div class="sheet-foot">${e.telefono ? `<a class="btn" target="_blank" rel="noopener" href="${waLink(e.telefono, `Hola ${primerNombre(e.nombre)}, entra a ${appUrl()}, toca "Soy del equipo", usa tu correo ${email} y el código ${codigo}`)}">${icon('chat')}Enviar por WhatsApp</a>` : ''}<button type="button" class="btn pri" data-close>Listo</button></div>` });
  }
  const { error } = await tmp.rpc('unirse_equipo', { p_codigo: codigo });
  await tmp.auth.signOut({ scope: 'local' }).catch(() => {});
  if (error && !/ya está vinculada/i.test(error.message)) { toast(error.message, true); return; }
  if (error) { toast('Ese correo ya está vinculado a un negocio. Usa otro correo.', true); return; }
  const loc = S.t.empleados.find((x) => x.id === empId); if (loc) loc.codigo_acceso = null;
  S.cuentasEq = Array.isArray(S.cuentasEq) ? [...S.cuentasEq, { empleado_id: empId, email }] : S.cuentasEq;
  cerrarSheet(); render(); cargarCuentasEq(true);
  const msj = `Hola ${primerNombre(e.nombre)}, ya tienes tu acceso a ${S.negocio.nombre} en MiDerno.\nEntra a ${appUrl()} y toca "Soy del equipo".\nCorreo: ${email}\nContraseña: ${clave}`;
  abrirSheet('Acceso creado', `<p>${esc(primerNombre(e.nombre))} ya puede entrar. Envíale sus datos:</p>
    <div class="credenciales"><div><span>Enlace</span><b>${esc(appUrl())}</b></div><div><span>Correo</span><b>${esc(email)}</b></div><div><span>Contraseña</span><b>${esc(clave)}</b></div></div>`, {
    pie: `<div class="sheet-foot"><button type="button" class="btn" data-act="pub-copiar" data-t="${esc(msj)}">Copiar</button>${e.telefono ? `<a class="btn pri" target="_blank" rel="noopener" href="${waLink(e.telefono, msj)}">${icon('chat')}Enviar por WhatsApp</a>` : '<button type="button" class="btn pri" data-close>Listo</button>'}</div>`,
  });
}
function enviarAcceso(empId) {
  const e = db.get('empleados', empId); const c = cuentaDe(empId);
  const msj = `Hola ${primerNombre(e.nombre)}, para ver tu agenda de ${S.negocio.nombre} entra a ${appUrl()}, toca "Soy del equipo" y usa tu correo ${c?.email || ''}.`;
  if (e.telefono) window.open(waLink(e.telefono, msj), '_blank', 'noopener'); else navigator.clipboard?.writeText(msj).then(() => toast('Mensaje copiado'), () => toast(msj));
}
function quitarAcceso(empId) {
  const e = db.get('empleados', empId);
  confirmar(`${esc(primerNombre(e.nombre))} ya no podrá entrar a su app. Puedes crearle un acceso nuevo cuando quieras.`, async () => {
    const { error } = await conCarga(NubeAdapter.sb.rpc('quitar_acceso', { p_empleado: empId }));
    if (error) return toast(/function|schema cache|PGRST202/i.test(error.message) ? 'Corre supabase/actualizacion-7.sql para poder quitar accesos' : error.message, true);
    S.cuentasEq = (S.cuentasEq || []).filter((c) => c.empleado_id !== empId); toast('Acceso quitado'); render();
  }, 'Quitar acceso');
}
function abrirEquipoPreview(empId) { ACCIONES['eq-preview']({ dataset: { id: empId } }); }

/* ---------- ingreso del colaborador ---------- */
function formEquipoLogin() {
  abrirSheet('Entrar como parte del equipo', `<div class="form">
    <div class="form-row">${field('Correo', input('email', '', 'type="email" autocomplete="email" required'))}${field('Contraseña', input('password', '', 'type="password" autocomplete="current-password" minlength="6" required'), 'Mínimo 6 caracteres')}</div>
    ${field('Código de acceso', input('codigo', '', 'autocomplete="off" placeholder="Solo la primera vez" style="text-transform:uppercase;letter-spacing:.1em"'), 'Te lo da el dueño del negocio. La primera vez se crea tu cuenta con este correo y contraseña.')}
    <a href="#" class="link-sm" data-act="olvide" style="align-self:flex-start">¿Olvidaste tu contraseña?</a></div>`, {
    pie: '<div class="sheet-foot"><button type="button" class="btn" data-close>Cancelar</button><button class="btn pri" type="submit">Entrar</button></div>',
    submit: async (d) => {
      const email = d.email.trim(); const codigo = d.codigo.trim().toUpperCase();
      if (!email || (d.password || '').length < 6) return toast('Escribe tu correo y una contraseña de al menos 6 caracteres', true);
      try {
        const sb = await cargarSupabase();
        let { error } = await sb.auth.signInWithPassword({ email, password: d.password });
        if (error && codigo) {
          const r = await sb.auth.signUp({ email, password: d.password, options: { emailRedirectTo: appUrl() || undefined } });
          if (r.error) throw r.error;
          if (!r.data.session) { const s2 = await sb.auth.signInWithPassword({ email, password: d.password }); if (s2.error) return toast('Supabase pide confirmar el correo: revisa tu bandeja y vuelve a entrar con el código.', true); }
        } else if (error) throw error;
        if (codigo) { const { error: e2 } = await sb.rpc('unirse_equipo', { p_codigo: codigo }); if (e2 && !/ya está vinculada/i.test(e2.message)) throw e2; }
        cerrarSheet(); if (!(await abrirNube())) toast('Tu cuenta no está vinculada a ningún equipo. Pide un código al dueño del negocio.', true);
      } catch (e) { const m = e.message || String(e); toast(/invalid login|credentials/i.test(m) ? 'Correo o contraseña incorrectos. Si es tu primera vez, escribe el código.' : m, true); }
    },
  });
}

const sis = () => ({ ...SIS_DEF, ...(LS.get('miderno:sistema') || {}), ...(aparienciaCuenta() || {}) });

// Montos: 1500000 → 1.500.000 mientras se escribe (los campos de dinero usan inputmode="numeric")
const conMiles = (v) => { const d = String(v ?? '').replace(/\D/g, '').replace(/^0+(?=\d)/, ''); return d.replace(/\B(?=(\d{3})+(?!\d))/g, '.'); };

function formatearMonto(el, mantenerCursor = true, inicial = false) {
  // un valor recién traído de los datos puede venir con decimales (1170.5): se redondea antes de poner puntos
  if (inicial && !el.dataset.fmt && /^-?\d+\.\d+$/.test(el.value)) el.value = String(Math.round(Number(el.value)));
  el.dataset.fmt = '1'; const antes = el.value;
  const pos = el.selectionStart ?? el.value.length; const digitosAntes = el.value.slice(0, pos).replace(/\D/g, '').length;
  const nuevo = conMiles(el.value); if (nuevo === antes) return;

    let i = 0, n = 0; while (i < nuevo.length && n < digitosAntes) { if (/\d/.test(nuevo[i])) n++; i++; }
    try { el.setSelectionRange(i, i); } catch {}
  }
}
function prepararMontos(raiz = document) { raiz.querySelectorAll?.('input[inputmode="numeric"]:not([data-nofmt])').forEach((el) => { if (el.value && !el.dataset.fmt) formatearMonto(el, false, true); }); }
document.addEventListener('input', (e) => { if (esMonto(e.target)) formatearMonto(e.target); }, true);
document.addEventListener('focusout', (e) => { if (esMonto(e.target)) formatearMonto(e.target, false); }, true);
// Contraseñas: botón de ojo para ver lo que se escribió
function prepararClaves(raiz = document) {
  raiz.querySelectorAll?.('input[type="password"]:not([data-ojo])').forEach((el) => {
    el.dataset.ojo = '1'; const w = document.createElement('div'); w.className = 'clave-wrap';
    el.parentNode.insertBefore(w, el); w.appendChild(el);
    w.insertAdjacentHTML('beforeend', `<button type="button" class="ver-clave" aria-label="Mostrar contraseña" aria-pressed="false" tabindex="0">${icon('ojo')}</button>`);
  });
}
document.addEventListener('click', (e) => {
  const b = e.target.closest('.ver-clave'); if (!b) return; e.preventDefault();
  const el = b.parentNode.querySelector('input'); const ver = el.type === 'password';
  el.type = ver ? 'text' : 'password'; b.setAttribute('aria-pressed', String(ver)); b.setAttribute('aria-label', ver ? 'Ocultar contraseña' : 'Mostrar contraseña');
  b.innerHTML = icon(ver ? 'ojo-no' : 'ojo'); el.focus({ preventScroll: true });

// cualquier campo nuevo en pantalla (vistas y ventanas) se muestra con puntos
let _montosPend = false;
new MutationObserver(() => { if (_montosPend) return; _montosPend = true; queueMicrotask(() => { _montosPend = false; prepararMontos(); prepararClaves(); }); }).observe(document.documentElement, { childList: true, subtree: true });

// Cifras grandes que suben desde cero al entrar a una vista
function animarCifras(raiz = document) {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  raiz.querySelectorAll('[data-cuenta]').forEach((el) => {
    const fin = Number(el.dataset.cuenta) || 0; if (!fin) return;
    const t0 = performance.now(), dur = 900; const ease = (x) => 1 - Math.pow(1 - x, 4);
    const paso = (t) => { if (!el.isConnected) return; const k = Math.min(1, (t - t0) / dur); el.textContent = money(Math.round(fin * ease(k))); if (k < 1) requestAnimationFrame(paso); };
    requestAnimationFrame(paso);

// Ventas importadas que todavía no están unidas a un servicio o producto del catálogo, agrupadas por nombre
function conceptosLibres() {
  const g = new Map();
  for (const i of db.all('venta_items')) {
    if (i.item_id || i.tipo_item !== 'libre' || /\(resumen\)$/.test(i.nombre || '')) continue;
    const k = norm(i.nombre); if (!k) continue;
    const e = g.get(k) || { nombres: new Map(), precios: new Map(), ids: [], n: 0 };
    e.nombres.set(i.nombre, (e.nombres.get(i.nombre) || 0) + 1);
    const pu = Math.round(Number(i.precio_unitario)); if (pu > 0) e.precios.set(pu, (e.precios.get(pu) || 0) + 1);
    e.ids.push(i.id); e.n += Number(i.cantidad) || 1; g.set(k, e);
  }
  const moda = (m) => [...m].sort((a, b) => b[1] - a[1])[0]?.[0];
  return [...g.values()].map((e) => ({ nombre: moda(e.nombres), precio: moda(e.precios) || 0, ids: e.ids, n: e.n })).sort((a, b) => b.n - a.n);
}
const PRODUCTO_RE = /aceite|crema|esmalte|lima|kit|vela|aromatiz|mikado|anillo|collar|bandeja|perfume|jabon|serum|^gel\b|\bgel$|botella|frasco|accesorio|cargador|funda|audifono/;
const OTRO_RE = /retiro|ajuste|devoluc|giftcard|gift card|vale|abono|deposito|traspaso/;
function tipoSugerido(nombre) {
  const n = norm(nombre);
  if (OTRO_RE.test(n)) return 'otro';
  if (/soft ?gel|semi|manicure|pedicure|nivelacion|rubber|esculpid|acrilic|corte|tinte|masaje|depil|sesion|clase/.test(n)) return 'servicio';
  if (PRODUCTO_RE.test(n)) return 'producto';
  return tiene('servicios') ? 'servicio' : 'producto';
}

function abrirOrdenar() {
  const lista = conceptosLibres().slice(0, 40);
  if (!lista.length) return toast('Todo lo que vendes ya está ordenado en tu catálogo');
  abrirSheet('¿Qué es cada cosa que vendiste?', `<p class="small muted" style="margin:-6px 0 0">Así tu historial queda unido a tu catálogo y los productos aparecen en el inventario. Lo marcado como “Dejar así” se mantiene como venta suelta.</p>
    <div class="ordenar">${lista.map((c, i) => { const t = tipoSugerido(c.nombre); return `<div class="ord-fila" data-i="${i}">
      <div class="ord-nom"><b>${esc(c.nombre)}</b><small>${qtyFmt(c.n)} ${c.n === 1 ? 'venta' : 'ventas'}${c.precio ? ' · ' + money(c.precio) : ''}</small></div>
      <div class="seg ord-seg">${[['servicio', 'Servicio'], ['producto', 'Producto'], ['otro', 'Dejar así']].map(([k, l]) => `<label class="${t === k ? 'on' : ''}"><input type="radio" name="tipo_${i}" value="${k}" ${t === k ? 'checked' : ''}>${l}</label>`).join('')}</div>
      <div class="ord-stock" ${t === 'producto' ? '' : 'hidden'}><input class="in" name="stock_${i}" inputmode="decimal" placeholder="¿Cuántos tienes hoy?" aria-label="Stock actual de ${esc(c.nombre)}"></div>
    </div>`; }).join('')}</div>`, {
    pie: '<div class="sheet-foot"><button type="button" class="btn" data-close>Ahora no</button><button class="btn pri" type="submit">Ordenar</button></div>',
    submit: (d) => aplicarOrden(lista, d),

  $('#sheet-form').addEventListener('change', (e) => {
    const f = e.target.closest('.ord-fila'); if (!f || e.target.type !== 'radio') return;
    f.querySelectorAll('.ord-seg label').forEach((l) => l.classList.toggle('on', l.querySelector('input').checked));

function aplicarOrden(lista, d) {
  let serv = 0, prod = 0, unidas = 0;
  const porNombre = (t) => new Map(db.all(t).map((x) => [norm(x.nombre), x]));
  const exS = porNombre('servicios'), exP = porNombre('productos');
  lista.forEach((c, i) => {
    const tipo = d['tipo_' + i]; if (tipo !== 'servicio' && tipo !== 'producto') return;
    let item;
    if (tipo === 'servicio') { item = exS.get(norm(c.nombre)) || db.insert('servicios', { nombre: c.nombre, precio: c.precio, duracion_min: 60, activo: true }); if (!exS.has(norm(c.nombre))) { serv++; exS.set(norm(c.nombre), item); } }
    else {
      item = exP.get(norm(c.nombre)) || db.insert('productos', { nombre: c.nombre, sku: '', precio_venta: c.precio, costo: 0, stock_minimo: 3, activo: true });
      if (!exP.has(norm(c.nombre))) { prod++; exP.set(norm(c.nombre), item); }
      const st = String(d['stock_' + i] ?? '').trim();
      if (st !== '') { const dif = Number(st.replace(',', '.')) - stockDe('producto', item.id); if (dif) db.insert('movimientos_stock', { tipo_item: 'producto', item_id: item.id, cantidad: dif, motivo: 'ajuste', ref_id: null, fecha: hoy(), nota: 'Stock inicial' }); }
    }
    db.updateMany('venta_items', c.ids, { tipo_item: tipo, item_id: item.id }); unidas += c.ids.length;
  });
  if (prod && !tiene('inventario')) db.modulo('inventario', true);
  cerrarSheet(); render();
  toast(unidas ? `Listo: ${unidas} ventas unidas${serv ? ` · ${serv} servicio${serv > 1 ? 's' : ''} nuevo${serv > 1 ? 's' : ''}` : ''}${prod ? ` · ${prod} producto${prod > 1 ? 's' : ''} en inventario` : ''}` : 'No marcaste nada para ordenar');
}

// borra el historial elegido; el catálogo, el equipo y los ajustes no se tocan
function borrarHistorial({ ventas, gastos, clientes, stock } = {}) {
  const ids = (t, fn = () => true) => db.all(t).filter(fn).map((r) => r.id);
  if (ventas || clientes) {
    const vs = ids('ventas'); const vset = new Set(vs);
    db.removeMany('comisiones', ids('comisiones', (c) => vset.has(c.venta_id)));
    db.removeMany('movimientos_stock', ids('movimientos_stock', (m) => m.motivo === 'venta' && vset.has(m.ref_id)));
    db.removeMany('venta_items', ids('venta_items', (i) => vset.has(i.venta_id)));
    db.removeMany('ventas', vs);
  }
  if (gastos) db.removeMany('gastos', ids('gastos'));
  if (stock) db.removeMany('movimientos_stock', ids('movimientos_stock'));
  // las clientas con horas en la agenda se mantienen (borrarlas borraría sus citas)
  if (clientes) { const conCita = new Set(db.all('citas').map((c) => c.cliente_id).filter(Boolean)); db.removeMany('clientes', ids('clientes', (c) => !conCita.has(c.id))); }
}
const hayHistorial = () => db.all('ventas').length + db.all('gastos').length + db.all('clientes').length > 0;

// el monto cobrado viaja desde el botón hasta el total del día
function volarMonto(desde, hacia, monto) {
  if (!desde || !hacia || quieto()) return;
  const h = hacia.getBoundingClientRect(); const f = document.createElement('div');
  f.className = 'vuela num'; f.textContent = '+' + money(monto); f.style.left = desde.left + desde.width / 2 - 40 + 'px'; f.style.top = desde.top + 'px';
  document.body.appendChild(f);
  requestAnimationFrame(() => { f.style.transform = `translate(${h.left - desde.left - desde.width / 2 + 40}px, ${h.top - desde.top}px) scale(.85)`; f.style.opacity = '.15'; });
  setTimeout(() => { f.remove(); hacia.classList.remove('late'); void hacia.offsetWidth; hacia.classList.add('late'); }, 720);
}

const avisadas = () => { try { return new Set(JSON.parse(localStorage.getItem('miderno:avisadas') || '[]')); } catch { return new Set(); } };
function marcarAvisada(id) { try { const s = avisadas(); s.add(id); localStorage.setItem('miderno:avisadas', JSON.stringify([...s].slice(-400))); } catch {} }
function yaPaso(i) { const ahora = new Date(); const h = `${pad(ahora.getHours())}:${pad(ahora.getMinutes())}`; return i.ref.fecha < hoy() || (i.ref.fecha === hoy() && (i.hora || '00:00') <= h); }
function accionPrincipal(i) {
  const r = i.ref; const tel = i.cl?.telefono;
  if (i.kind === 'cita') {
    if (i.estado === 'completada') return '<span class="ag-hecho">✓ Pagada</span>';
    if (!enAgenda(i)) return `<span class="pill ${(ESTADOS_CITA[i.estado] || [])[1] || ''}">${(ESTADOS_CITA[i.estado] || [''])[0]}</span>`;
    if (i.estado === 'solicitada') return `<button class="btn sm pri" data-act="confirmar-reserva" data-id="${r.id}">Confirmar</button>`;
    if (i.estado === 'asistio' || yaPaso(i)) return `<button class="btn sm pri" data-act="cita-cobrar" data-id="${r.id}">Cobrar</button>`;
    if (tel && !avisadas().has(r.id)) return `<a class="btn sm sol" data-act="ag-avisar" data-id="${r.id}" target="_blank" rel="noopener" href="${waLink(tel, msg('recordatorio', { nombre: primerNombre(i.cl.nombre), servicio: i.s?.nombre || 'atención', fecha: fechaLarga(r.fecha), hora: hhmm(r.hora) }))}">Recordar</a>`;
    return tel ? '<span class="ag-hecho">✓ Avisada</span>' : `<button class="btn sm" data-act="cita-cobrar" data-id="${r.id}">Cobrar</button>`;
  }
  if (['entregada', 'hecha'].includes(i.estado)) return `<span class="ag-hecho">✓ ${i.estado === 'entregada' ? 'Entregada' : 'Hecho'}</span>`;
  if (!enAgenda(i)) return '<span class="pill bad">Cancelada</span>';
  if (i.kind === 'entrega') return !r.pagado && Number(r.monto) ? `<button class="btn sm pri" data-act="ev-cobrar" data-id="${r.id}">Cobrar</button>` : `<button class="btn sm pri" data-act="ev-estado" data-id="${r.id}" data-e="entregada">Entregada</button>`;
  return `<button class="btn sm pri" data-act="ev-estado" data-id="${r.id}" data-e="hecha">Hecho</button>`;
}
function filaAgendaCorta(i) {
  const k = KIND[i.kind]; const monto = i.kind === 'cita' ? (i.s ? money(i.s.precio) : '') : i.kind === 'entrega' && Number(i.ref.monto) ? money(i.ref.monto) : '';
  const apagada = i.estado === 'completada' || ['entregada', 'hecha'].includes(i.estado) || !enAgenda(i);
  return `<div class="ag-fila ${k.cls} ${apagada ? 'apagada' : ''} ${i.estado === 'solicitada' ? 'req' : ''} ${S._recien === i.id ? 'recien' : ''}" data-act="ag-detalle" data-id="${i.id}" data-kind="${i.kind}" role="button" tabindex="0">

function primerasCompras() {

function indicadoresMes(ym, hasta = 31, primeras = primerasCompras()) {
  const lim = `${ym}-${pad(Math.min(hasta, diasDelMes(ym)))}`;
  const vs = db.all('ventas').filter((v) => mesDe(v.fecha) === ym && v.fecha <= lim); const ids = new Set(vs.map((v) => v.id));

  const atenciones = tiene('servicios') ? sum(items.filter((i) => i.tipo_item === 'servicio'), (i) => Number(i.cantidad || 1)) || vs.length : vs.length;
  const total = sum(vs, (v) => Number(v.total)); const ticket = vs.length ? total / vs.length : 0;
  const clientes = new Set(vs.map((v) => v.cliente_id).filter(Boolean));
  const nuevas = [...clientes].filter((id) => mesDe(primeras.get(id) || '') === ym);
  const ant = addMonths(ym, -1); const deAntes = new Set(db.all('ventas').filter((v) => mesDe(v.fecha) === ant && v.cliente_id).map((v) => v.cliente_id));
  const volvieron = [...deAntes].filter((id) => clientes.has(id));
  return { ym, ventas: vs.length, total, atenciones, ticket, clientes: clientes.size, nuevas: nuevas.length, volvieron: volvieron.length, base: deAntes.size, retencion: deAntes.size ? volvieron.length / deAntes.size : null,
    recurrentes: clientes.size ? (clientes.size - nuevas.length) / clientes.size : null, pendientes: [...deAntes].filter((id) => !clientes.has(id)) };

function panelHoy() {

  const vs = db.all('ventas').filter((v) => v.fecha === H); const gs = db.all('gastos').filter((g) => g.fecha === H);
  const ingHoy = sum(vs, (v) => Number(v.total)); const egrHoy = sum(gs, (g) => Number(g.monto));
  const conAgenda = tiene('servicios') || db.all('citas').length || db.all('eventos').length;

  const pendientes = agenda.filter((i) => !['completada', 'entregada', 'hecha'].includes(i.estado));
  const proximas = pendientes.filter((i) => (i.hora || '99') >= hm).slice(0, 4);
  const items = new Map(); for (const i of db.all('venta_items')) if (vs.some((v) => v.id === i.venta_id)) (items.get(i.venta_id) || items.set(i.venta_id, []).get(i.venta_id)).push(i);
  const movs = [

    ...gs.map((g) => ({ id: g.id, t: g.descripcion || g.categoria, s: g.categoria, m: -Number(g.monto) })),
  ].slice(-5).reverse();
  const accion = (act, ic, t, extra = '') => `<button class="hoy-acc" data-act="${act}" ${extra}>${icon(ic)}<span>${t}</span></button>`;
  const resumen = [ingHoy || vs.length ? `<b class="num">${money(ingHoy)}</b> vendido` : 'Sin ventas aún', egrHoy ? `<b class="num">${money(egrHoy)}</b> en egresos` : '', conAgenda ? `<b class="num">${pendientes.length}</b> ${pendientes.length === 1 ? 'hora por atender' : 'horas por atender'}` : ''].filter(Boolean).join('<span class="sep" aria-hidden="true"></span>');
  return `<section class="hoy" aria-label="Hoy">
    <div class="hoy-acciones">${accion('hoy-venta', 'plus', 'Registrar venta')}<div class="hoy-sec">${accion('hoy-egreso', 'minus', 'Egreso')}${tiene('servicios') ? accion('cita', 'cal', 'Agendar') : accion('agendar', 'cal', 'Agendar')}${accion('cliente', 'users', 'Cliente')}</div></div>
    ${panelAtender()}
    <div class="hoy-bloque">
      <div class="hoy-cab"><h2>Hoy</h2><a class="link-sm" href="#caja" data-act="caja-hoy">Movimientos</a></div>
      <p class="hoy-resumen">${resumen}</p>
      ${conAgenda ? `<h3 class="hoy-sub">Próximas horas <a class="link-sm" href="#agenda" data-act="ag-hoy-nav">Agenda</a></h3>
      ${proximas.length ? `<div class="hoy-lista">${proximas.map((i) => `<button class="hoy-fila" data-act="ag-detalle" data-id="${i.id}" data-kind="${i.kind}"><span class="num hoy-h">${i.hora || '—'}</span><span class="grow"><b>${esc(i.titulo)}</b><small>${esc(i.sub || KIND[i.kind].label)}</small></span>${i.estado === 'solicitada' ? '<span class="pill warn">Por confirmar</span>' : ''}</button>`).join('')}</div>`
        : `<p class="muted small hoy-vacio">${pendientes.length ? 'No quedan horas por atender más tarde.' : 'No hay horas agendadas para hoy.'}</p>`}` : ''}
      <h3 class="hoy-sub">Vendido y pagado hoy</h3>
      ${movs.length ? `<div class="hoy-lista">${movs.map((l) => `<div class="hoy-fila mov"><span class="grow"><b>${esc(l.t)}</b><small>${esc(l.s || '')}</small></span><b class="num ${l.m < 0 ? 'down' : ''}">${l.m < 0 ? '−' : ''}${money(Math.abs(l.m))}</b></div>`).join('')}</div>`
        : `<p class="muted small hoy-vacio">Aún no hay movimientos registrados hoy.</p>`}
    </div>
  </section>`;
}
// lo que necesita una acción tuya hoy (sin repetir la agenda, que ya está en "Hoy")
function panelAtender() {
  const H = hoy(); const al = [];
  const sol = db.all('citas').filter((c) => c.estado === 'solicitada' && c.fecha >= H).length;
  if (sol) al.push({ sev: 'warn', t: t_('reservas_confirmar', sol), href: 'agenda' });
  const sinMarcar = citasSinMarcar().length;
  if (sinMarcar) al.push({ sev: 'warn', t: `${sinMarcar} ${sinMarcar === 1 ? 'hora pasada' : 'horas pasadas'} sin marcar si vino`, s: 'De los últimos 7 días', href: 'inicio', act: 'marcar-asistencia' });
  for (const { p: pv, bajos } of porReponer().provs) al.push({ sev: 'warn', t: `${t_('pedir_a')} ${pv.nombre}`, s: bajos.slice(0, 3).map((x) => x.item.nombre).join(', '), href: 'proveedores', act: 'pedido-ir', id: pv.id });
  if (tiene('inventario')) { const sp = db.all('productos').filter((p) => p.activo !== false && !p.proveedor_id && stockDe('producto', p.id) <= Number(p.stock_minimo || 0)); if (sp.length) al.push({ sev: 'warn', t: t_('stock_bajo', sp.length), s: sp.slice(0, 3).map((p) => p.nombre).join(', '), href: 'inventario' }); }
  const re = resumenClientes().filter((r) => porReactivar(r) && r.dias < 120).length;

}
Object.assign(ACC_COBRO, {

function infoReservaJunta(c) {

/* v42: horas que ya pasaron (últimos 7 días) sin marcar si la clienta vino o no */
function citasSinMarcar() {
  const H = hoy(), desde = addDays(H, -7); const ahora = new Date(); const min = ahora.getHours() * 60 + ahora.getMinutes();
  return db.all('citas').filter((c) => ['agendada', 'confirmada'].includes(c.estado) && c.fecha >= desde && c.fecha <= H
    && (c.fecha < H || aMin(hhmm(c.hora)) + Number(db.get('servicios', c.servicio_id)?.duracion_min || 60) <= min))
    .sort((a, b) => (b.fecha + b.hora).localeCompare(a.fecha + a.hora));
}
function filaAsistencia(c) {
  const cl = db.get('clientes', c.cliente_id); const s = db.get('servicios', c.servicio_id);
  return `<div class="asis-fila" data-id="${c.id}"><div class="grow"><b>${esc(cl?.nombre || 'Sin nombre')}</b><small>${esc(s?.nombre || 'Hora')} · ${esc(fechaCorta(c.fecha))}, ${hhmm(c.hora)}</small></div>
    <button type="button" class="btn sm" data-asis="no_asistio" data-id="${c.id}">No vino</button><button type="button" class="btn sm pri" data-asis="asistio" data-id="${c.id}">Vino</button></div>`;
}
function hojaAsistencia() {

  abrirSheet('¿Vinieron?', `<p class="small muted" style="margin:0 0 6px">Horas de los últimos 7 días que siguen como agendadas. Marca si la clienta vino; las que vinieron quedan listas para cobrar.</p>
    <div class="asis-lista">${cs.map(filaAsistencia).join('')}</div>`, { pie: '<div class="sheet-foot"><button type="button" class="btn" data-close>Listo</button></div>' });
  $('.asis-lista')?.addEventListener('click', (e) => {

    db.update('citas', b.dataset.id, { estado: b.dataset.asis });
    const fila = b.closest('.asis-fila'); fila.classList.add('hecha'); fila.innerHTML = `<div class="grow"><b>${esc(fila.querySelector('b')?.textContent || '')}</b><small>${b.dataset.asis === 'asistio' ? 'Vino · queda para cobrar' : 'No vino'}</small></div>${icon('ok')}`;
