<style>
/* Layout: app shell — sidebar on desktop, bottom tab bar + "Más" sheet on phones. Brand idea: the entrepreneur's notebook — ink blue, highlighter yellow, margin red */
/* Minimal: white paper, one typeface, ink-black actions; the notebook blue only marks what is active or linked */
:root {
  --marca: #0B6870;
  --primary: var(--ink);
  --primary-ink: var(--bg);
  --bg: #FFFFFF;
  --surface: #FFFFFF;
  --surface-2: #F4F4F2;
  --line: #E8E8E5;
  --ink: #141414;
  --muted: #6E6E6E;
  --accent: #2346A3;
  --accent-ink: #FFFFFF;
  --accent-soft: #EEF1FA;
  --gold: #C99A10;
  --gold-soft: #FBF3DC;
  --hl: #FFE98A;
  --margin: #D8483B;
  --rule: #DCE3EE;
  --paper: #FFFFFF;
  --ok: #1F7A4A;
  --ok-soft: #E7F4EC;
  --warn: #8F5E0E;
  --warn-soft: #FBF1DE;
  --bad: #B23A2B;
  --bad-soft: #FBE8E4;
  --shadow: 0 1px 2px rgba(0, 0, 0, .04), 0 16px 40px rgba(0, 0, 0, .10);
  --f-display: "Geist", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-body: "Geist", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-serif: var(--f-display); /* v31: una sola familia */
  --ease-out: cubic-bezier(.16, 1, .3, 1);
  --ease-back: cubic-bezier(.34, 1.56, .64, 1);
  --f-hand: var(--f-display);
  --r: 16px;
  --r-sm: 12px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --marca: #5CC8C9;
    --bg: #0E0E0F; --surface: #0E0E0F; --surface-2: #1A1A1C; --line: #262629;
    --ink: #F1F1F1; --muted: #9B9BA0; --accent: #94ABF7; --accent-ink: #0B1430; --accent-soft: #1A2240;
    --gold: #E6C04F; --gold-soft: #2F2914; --hl: #6E5D12; --margin: #F07A6E; --rule: #2B3446; --paper: #151517;
    --ok: #62C48F; --ok-soft: #14271C; --warn: #E9B54E; --warn-soft: #2E2614; --bad: #EE7D6A; --bad-soft: #33201C;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 16px 40px rgba(0,0,0,.5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E0E0F; --surface: #0E0E0F; --surface-2: #1A1A1C; --line: #262629;
  --ink: #F1F1F1; --muted: #9B9BA0; --accent: #94ABF7; --accent-ink: #0B1430; --accent-soft: #1A2240;
  --gold: #E6C04F; --gold-soft: #2F2914; --hl: #6E5D12; --margin: #F07A6E; --rule: #2B3446; --paper: #151517;
  --ok: #62C48F; --ok-soft: #14271C; --warn: #E9B54E; --warn-soft: #2E2614; --bad: #EE7D6A; --bad-soft: #33201C;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 16px 40px rgba(0,0,0,.5);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--f-body); -webkit-font-smoothing: antialiased; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 650; line-height: 1.15; margin: 0; text-wrap: balance; letter-spacing: -.01em; }
h1 { font-size: 1.75rem; }
h2 { font-size: 1.125rem; }
h3 { font-size: .9375rem; }
p { margin: 0; }
a { color: var(--accent-txt); }
button, input, select, textarea { font: inherit; color: inherit; }
.num, td.n, .money { font-variant-numeric: tabular-nums; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
svg.i { width: 20px; height: 20px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- shell ---------- */
.shell { display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: 100vh; }
.side { position: sticky; top: 0; height: 100vh; padding: 20px 14px; border-right: 1px solid var(--line); background: var(--surface); display: flex; flex-direction: column; gap: 18px; overflow-y: auto; }
.brand { display: flex; align-items: center; gap: 10px; padding: 0 8px; }
.brand-mark { width: 30px; height: 30px; flex: none; display: block; overflow: visible; }
.brand b { font: 700 1.125rem var(--f-display); letter-spacing: -.02em; }
.biz { padding: 10px; border-radius: var(--r-sm); background: var(--surface-2); }
.biz small { display: block; color: var(--muted); font-size: .75rem; }
.biz strong { display: block; font-weight: 600; line-height: 1.25; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav-label { font-size: .75rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); padding: 12px 10px 4px; }
.nav a { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: var(--r-sm); color: var(--ink); text-decoration: none; font-weight: 500; }
.nav a:hover { background: var(--surface-2); }
.nav a.on { background: var(--accent-soft); color: var(--accent-txt); }
.side .grow { flex: 1; }
.mode-pill { font-size: .75rem; color: var(--muted); padding: 0 10px; display: flex; gap: 6px; align-items: center; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--gold); display: inline-block; }
.dot.cloud { background: var(--ok); }

.main { min-width: 0; padding-inline: 28px; padding-block: 26px 60px; }
.wrap { max-width: 1080px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.page-head .eyebrow { font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
.page-head .actions { display: flex; gap: 8px; flex-wrap: wrap; }

.tabbar { display: none; }

@media (max-width: 860px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .side { display: none; }
  .main { padding-inline: 16px; padding-block: 16px 110px; }
  h1 { font-size: 1.375rem; }
  .tabbar { display: grid; grid-template-columns: repeat(5, 1fr); position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line); padding: 6px 4px calc(6px + env(safe-area-inset-bottom, 0px)); }
  .tabbar a, .tabbar button { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: .75rem; font-weight: 500; color: var(--muted); text-decoration: none; background: none; border: 0; padding: 4px 0; cursor: pointer; }
  .tabbar .on { color: var(--accent-txt); }
  .tabbar .sell span.plus { width: 44px; height: 44px; margin-top: -18px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; box-shadow: var(--shadow); }
  .mobile-top { display: flex !important; }
}
.mobile-top { display: none; align-items: center; justify-content: space-between; gap: 10px; }
.mobile-top .brand b { font-size: 1.125rem; }

/* ---------- surfaces ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; min-width: 0; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
.card-head p { color: var(--muted); font-size: .875rem; }
.grid { display: grid; gap: 14px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.span2 { grid-column: span 2; }
@media (max-width: 1000px) { .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .g3 { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 720px) { .g2 { grid-template-columns: minmax(0, 1fr); } .span2 { grid-column: auto; } }

.kpi { display: flex; flex-direction: column; gap: 4px; }
.kpi .lbl { font-size: .75rem; color: var(--muted); }
.kpi .val { font: 650 1.375rem/1.1 var(--f-display); font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.kpi .sub { font-size: .75rem; color: var(--muted); }
.up { color: var(--ok); } .down { color: var(--bad); }

/* meta (goal) */
.goal { background: var(--ink); color: var(--bg); border: 0; }
.goal .lbl, .goal .sub { color: color-mix(in srgb, var(--bg) 70%, transparent); }
.goal-row { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
.goal-big { font: 650 2.5rem/1 var(--f-display); font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.bar { height: 12px; border-radius: 99px; background: color-mix(in srgb, var(--bg) 18%, transparent); overflow: hidden; margin: 14px 0 10px; }
.bar i { display: block; height: 100%; border-radius: 99px; background: var(--gold); }
.goal-facts { display: flex; gap: 22px; flex-wrap: wrap; font-size: .875rem; }
.goal-facts b { display: block; font: 600 1.125rem var(--f-display); font-variant-numeric: tabular-nums; }

/* lists & tables */
.list { display: flex; flex-direction: column; }
.row { display: flex; align-items: center; gap: 12px; padding: 11px 2px; border-top: 1px solid var(--line); min-width: 0; }
.row:first-child { border-top: 0; }
.row .grow { flex: 1; min-width: 0; }
.row .t { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .s { font-size: .8125rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .r { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.row.click { cursor: pointer; }
.row.click:hover { background: var(--surface-2); }
.avatar { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-weight: 600; font-size: .875rem; background: var(--accent-soft); color: var(--accent-txt); flex: none; }
.tbl-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: .875rem; }
th { text-align: left; font-weight: 500; font-size: .75rem; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
td.n, th.n { text-align: right; white-space: nowrap; }
tr:last-child td { border-bottom: 0; }

.pill { display: inline-flex; align-items: center; gap: 5px; font-size: .75rem; font-weight: 600; padding: 3px 9px; border-radius: 99px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.acc { background: var(--accent-soft); color: var(--accent-txt); }
.empty { padding: 26px 12px; text-align: center; color: var(--muted); font-size: .875rem; }

/* controls */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 9px 15px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-weight: 600; font-size: .875rem; cursor: pointer; text-decoration: none; white-space: nowrap; }
.btn:hover { background: var(--surface-2); }
.btn.pri { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.pri:hover { filter: brightness(1.06); }
.btn.danger { color: var(--bad); }
.btn.sm { padding: 6px 10px; font-size: .8125rem; border-radius: 8px; }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.block { width: 100%; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.icon-btn { width: 34px; height: 34px; padding: 0; border-radius: 9px; }

.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field label { font-size: .8125rem; font-weight: 600; color: var(--muted); }
.field .hint { font-size: .75rem; color: var(--muted); }
.in { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); min-height: 42px; }
.in:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
.form { display: flex; flex-direction: column; gap: 14px; }
.form-row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 480px) { .form-row { grid-template-columns: minmax(0, 1fr); } }

.seg { display: inline-flex; background: var(--surface-2); border-radius: 10px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: none; padding: 7px 12px; border-radius: 8px; font-size: .875rem; font-weight: 600; color: var(--muted); cursor: pointer; }
.seg button.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.08); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 6px 12px; font-size: .8125rem; font-weight: 600; cursor: pointer; color: var(--muted); }
.chips.scroll { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.chips.scroll .chip { flex: none; }
.chip.on { background: var(--primary); color: var(--primary-ink); border-color: var(--primary); }

.toggle { position: relative; width: 44px; height: 26px; flex: none; }
.toggle input { opacity: 0; width: 100%; height: 100%; position: absolute; inset: 0; margin: 0; cursor: pointer; z-index: 1; }
.toggle span { position: absolute; inset: 0; border-radius: 99px; background: var(--line); transition: background .15s; }
.toggle span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--surface); box-shadow: 0 1px 2px rgba(0,0,0,.2); transition: transform .15s; }
.toggle input:checked + span { background: var(--accent); }
.toggle input:checked + span::after { transform: translateX(18px); }
.toggle input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }

.monthnav { display: inline-flex; align-items: center; gap: 4px; }
.monthnav strong { min-width: 130px; text-align: center; font-weight: 600; display: inline-block; }
.monthnav strong::first-letter { text-transform: uppercase; }

/* chart */
.chart svg { width: 100%; height: auto; display: block; }
.chart text { fill: var(--muted); font: 11px var(--f-body); }
.legend { display: flex; gap: 14px; font-size: .8125rem; color: var(--muted); flex-wrap: wrap; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }

/* caja de hoy */
.caja-dia { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; }
.caja-dia div { background: var(--surface-2); border-radius: var(--r-sm); padding: 10px 12px; }
.caja-dia small { display: block; color: var(--muted); font-size: .75rem; }
.caja-dia b { font-variant-numeric: tabular-nums; font-weight: 650; }

/* sell */
.sell { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 900px) { .sell { grid-template-columns: minmax(0, 1fr); } }
.catalog { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.item-btn { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 11px 12px; cursor: pointer; display: flex; flex-direction: column; gap: 3px; min-height: 76px; }
.item-btn:hover { border-color: var(--accent); }
.item-btn b { font-weight: 600; font-size: .875rem; line-height: 1.25; }
.item-btn small { color: var(--muted); font-size: .75rem; font-variant-numeric: tabular-nums; }
.item-btn:disabled { opacity: .45; cursor: not-allowed; }
.cart { position: sticky; top: 16px; }
.cart-line { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 10px; padding: 10px 0; border-top: 1px solid var(--line); }
.cart-line:first-child { border-top: 0; }
.qty { display: inline-flex; align-items: center; gap: 4px; }
.qty button { width: 28px; height: 28px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 700; }
.total-row { display: flex; justify-content: space-between; align-items: baseline; padding: 14px 0 6px; border-top: 2px solid var(--ink); margin-top: 8px; }
.total-row b { font: 650 1.75rem var(--f-display); font-variant-numeric: tabular-nums; }

/* sheet (modal) */
.scrim { position: fixed; inset: 0; background: rgba(8, 14, 12, .45); z-index: 40; display: flex; align-items: center; justify-content: center; padding: 16px; }
.sheet { background: var(--surface); border-radius: 18px; width: min(560px, 100%); max-height: calc(100vh - 32px); overflow-y: auto; padding: 20px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 16px; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.sheet-foot { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
@media (max-width: 600px) {
  .scrim { align-items: flex-end; padding: 0; }
  .sheet { border-radius: 18px 18px 0 0; max-height: 92vh; padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px)); }
}

.toast { position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-weight: 600; font-size: .875rem; z-index: 60; box-shadow: var(--shadow); max-width: calc(100% - 32px); }
.toast.err { background: var(--bad); color: #fff; }

.alert-row { display: flex; gap: 10px; align-items: center; padding: 10px 12px; border-radius: var(--r-sm); background: var(--surface-2); text-decoration: none; color: var(--ink); }
.alert-row .grow { flex: 1; min-width: 0; }
.alert-row small { display: block; color: var(--muted); font-size: .8125rem; }
.sev { width: 8px; align-self: stretch; border-radius: 4px; flex: none; background: var(--muted); }
.sev.warn { background: var(--warn); } .sev.bad { background: var(--bad); } .sev.ok { background: var(--ok); } .sev.acc { background: var(--accent); }

.rec-row { display: grid; grid-template-columns: minmax(0, 1fr) 96px 92px 34px; gap: 6px; align-items: center; }
.rec-nuevo { grid-column: 1 / -1; display: grid; grid-template-columns: minmax(0, 1fr) 150px; gap: 6px; padding: 8px; border-radius: 10px; background: var(--surface-2); }
@media (max-width: 480px) { .rec-row { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) 34px; } .rec-row .rec-ins { grid-column: 1 / -1; } .rec-nuevo { grid-template-columns: minmax(0, 1fr); } }
.drop { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; text-align: center; padding: 34px 20px; min-height: 240px; border: 2px dashed var(--rule); border-radius: var(--r); cursor: pointer;
  background-color: var(--paper); background-image: repeating-linear-gradient(to bottom, transparent 0 31px, color-mix(in srgb, var(--rule) 45%, transparent) 31px 32px); }
.drop:hover, .drop.over { border-color: var(--accent); }
.drop svg.i { width: 34px; height: 34px; color: var(--accent-txt); }
.drop b { font: 650 1.125rem var(--f-display); }
.map-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; }
.que-vende { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 520px) { .que-vende { grid-template-columns: minmax(0, 1fr); } }
.qv { display: flex; gap: 10px; align-items: flex-start; padding: 12px; border: 1px solid var(--line); border-radius: 12px; cursor: pointer; background: var(--surface); }
.qv:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.qv input { width: 18px; height: 18px; accent-color: var(--accent); margin-top: 2px; flex: none; }
.qv b { display: block; } .qv small { color: var(--muted); font-size: .8125rem; }
.entendido { padding: 12px; border-radius: 12px; background: var(--gold-soft); font-size: .875rem; display: flex; flex-direction: column; gap: 4px; }
.entendido .pill { margin: 2px 2px 0 0; }
.entendido label { flex-wrap: wrap; }
.prov-items { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 6px 12px; max-height: 220px; overflow-y: auto; padding: 10px; border: 1px solid var(--line); border-radius: 10px; }
.ped-row { display: grid; grid-template-columns: 24px minmax(0, 1fr) 84px; gap: 10px; align-items: center; }
.prov h3 { overflow-wrap: anywhere; }
.balance { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
@media (max-width: 640px) { .balance { grid-template-columns: minmax(0, 1fr); } }
.bal-head { display: flex; justify-content: space-between; align-items: baseline; padding-bottom: 6px; margin-bottom: 4px; border-bottom: 1px solid var(--line); }
.bal-head span { font-size: .75rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.bal-head b { font: 650 1.125rem var(--f-display); }
.bal-row { display: flex; justify-content: space-between; gap: 10px; font-size: .875rem; padding: 4px 0; }
.bal-row span:first-child { color: var(--muted); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bal-total { display: flex; justify-content: space-between; align-items: baseline; margin-top: 12px; padding-top: 10px; border-top: 2px solid var(--ink); }
.bal-total b { font: 650 1.375rem var(--f-display); }
.tel-group { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 6px; }
.tel-group .tel-pref { padding-inline: 8px; }
.msg-edit { padding-top: 14px; border-top: 1px solid var(--line); }
.msg-edit:first-of-type { border-top: 0; padding-top: 0; }
.var-chip { display: inline-flex; gap: 5px; align-items: baseline; color: var(--accent-txt); }
.var-chip b { font-weight: 700; } .var-chip b::before { content: "{"; } .var-chip b::after { content: "}"; }
.var-chip span { color: var(--muted); font-weight: 500; font-size: .75rem; }
.msg-preview { background: var(--surface-2); border-radius: 10px; padding: 10px 12px; }
.msg-preview p { white-space: pre-line; font-size: .875rem; margin-top: 2px; }
.ejemplo-var { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.ejemplo-var > div { background: var(--surface-2); border-radius: 10px; padding: 10px 12px; }
.ejemplo-var mark { background: var(--hl); color: inherit; padding: 0 2px; border-radius: 3px; }
@media (max-width: 600px) { .ejemplo-var { grid-template-columns: minmax(0, 1fr); } }
.prov-nuevo { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 6px; margin-top: 8px; }
@media (max-width: 520px) { .prov-nuevo { grid-template-columns: minmax(0, 1fr) auto; } .prov-nuevo select { grid-column: 1 / -1; grid-row: 2; } }
.pub-fotos { display: flex; gap: 8px; overflow-x: auto; scroll-snap-type: x mandatory; border-radius: 14px; scrollbar-width: none; }
.pub-fotos img { height: 190px; width: auto; max-width: 85%; object-fit: cover; border-radius: 14px; scroll-snap-align: start; flex: none; }
.pub-lugar { display: flex; flex-direction: column; gap: 8px; }
.pub-mapa { width: 100%; height: 180px; border: 0; border-radius: 14px; background: var(--surface-2); }
.fotos { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.foto { position: relative; aspect-ratio: 1; border-radius: 12px; overflow: hidden; background: var(--surface-2); max-width: 100%; }
.foto img { width: 100%; height: 100%; object-fit: cover; }
.foto .btn { position: absolute; top: 6px; right: 6px; width: 28px; height: 28px; }
.foto-add { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; border: 1.5px dashed var(--line); cursor: pointer; color: var(--muted); }
.solo-movil { display: none; }
@media (max-width: 860px) { .solo-movil { display: block; } .solo-escritorio { display: none; } .g3 > .span2 { grid-column: auto; } }
.muted { color: var(--muted); }
.small { font-size: .875rem; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.hstack { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.between { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.banner { background: var(--gold-soft); color: var(--ink); border-radius: var(--r-sm); padding: 10px 14px; font-size: .875rem; display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }

/* ---------- landing ---------- */
.landing { max-width: 1040px; margin: 0 auto; padding-inline: 20px; padding-block: 36px 70px; display: flex; flex-direction: column; gap: 36px; }
.land-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.hero { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 36px; align-items: center; }
.hero h1 { font-size: clamp(2.2rem, 5.5vw, 3.6rem); letter-spacing: -.035em; line-height: 1.02; }
.hero h1 em { font-style: normal; color: var(--accent-txt); }
.hero p { font-size: 1.125rem; color: var(--muted); max-width: 46ch; margin-top: 16px; }
.eyebrow-hand { font: 600 .875rem/1.2 var(--f-display); color: var(--muted); margin-bottom: 8px; display: inline-block; }
.hero mark { background: linear-gradient(transparent 58%, var(--hl) 58%, var(--hl) 92%, transparent 92%); color: inherit; padding: 0 .06em; }
.notebook { position: relative; background-color: var(--paper); border: 1px solid var(--line); border-radius: 6px 16px 16px 6px; box-shadow: var(--shadow);
  padding: 22px 16px 26px 58px; min-width: 0;
  background-image: linear-gradient(to right, transparent 43px, var(--margin) 43px, var(--margin) 45px, transparent 45px),
    repeating-linear-gradient(to bottom, transparent 0 39px, var(--rule) 39px 40px);
  background-position: 0 0, 0 50px; }
.notebook::before { content: ""; position: absolute; left: 12px; top: 18px; bottom: 18px; width: 14px;
  background: radial-gradient(circle at 7px 7px, var(--bg) 0 4.5px, var(--line) 4.5px 5.5px, transparent 6px) 0 0 / 14px 30px repeat-y; }
.nb-date { font: 600 1.125rem/30px var(--f-hand); color: var(--muted); height: 30px; text-align: right; margin-bottom: -2px; }
.nb-line { display: grid; grid-template-columns: minmax(0, 1fr) auto 84px; gap: 10px; align-items: end; height: 40px; padding-bottom: 3px; }
.nb-line .hand { font: 500 1.375rem/1 var(--f-hand); color: var(--accent-txt); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nb-line .tag { justify-self: start; font: 600 .75rem/1 var(--f-body); letter-spacing: .02em; padding: 5px 8px; border-radius: 6px; background: var(--surface-2); color: var(--ink); white-space: nowrap;
  animation: tag-in .45s cubic-bezier(.2, .8, .2, 1) backwards; }
.nb-line .tag.acc { background: var(--accent); color: var(--accent-ink); }
.nb-line .tag.warn { background: var(--hl); color: #3B2E00; }
.nb-line:nth-child(3) .tag { animation-delay: .5s; } .nb-line:nth-child(4) .tag { animation-delay: .75s; }
.nb-line:nth-child(5) .tag { animation-delay: 1s; } .nb-line:nth-child(6) .tag { animation-delay: 1.25s; } .nb-line:nth-child(7) .tag { animation-delay: 1.5s; }
@keyframes tag-in { from { transform: translateX(-8px) scale(.94); } }
@media (max-width: 480px) { .notebook { padding-left: 50px; } .nb-line { grid-template-columns: minmax(0, 1fr) 72px; } .nb-line .amt { display: none; } .nb-line .hand { font-size: 1.125rem; } }
@media (max-width: 800px) { .hero { grid-template-columns: minmax(0, 1fr); } }
.demos { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
@media (max-width: 800px) { .demos { grid-template-columns: minmax(0, 1fr); } }
.demo { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; cursor: pointer; display: flex; flex-direction: column; gap: 10px; }
.demo:hover { border-color: var(--accent); }
.demo .tag { font-size: .75rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.demo h3 { font-size: 1.125rem; }
.demo p { color: var(--muted); font-size: .875rem; }
.mods { display: flex; gap: 6px; flex-wrap: wrap; }
.section-title { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
.section-title p { color: var(--muted); font-size: .875rem; }
.rubros { display: grid; gap: 8px; }
.rubro { display: flex; gap: 12px; align-items: center; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; cursor: pointer; background: var(--surface); }
.rubro:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.rubro input { accent-color: var(--accent); width: 18px; height: 18px; }
.mod-row { display: flex; gap: 12px; align-items: center; justify-content: space-between; padding: 12px 0; border-top: 1px solid var(--line); }
.mod-row:first-child { border-top: 0; }
.mod-row .grow { flex: 1; min-width: 0; }
.mod-row small { display: block; color: var(--muted); font-size: .8125rem; }


/* ---------- agenda ---------- */
.ag-row { border-left: 3px solid transparent; padding-left: 10px; }
.ag-row.k-cita { border-left-color: var(--accent); } .ag-row.k-entrega { border-left-color: var(--gold); } .ag-row.k-tarea { border-left-color: var(--muted); }
.ag-hora { width: 62px; flex: none; }
.legend i.k-cita, .month-dots i.k-cita { background: var(--accent); } .legend i.k-entrega, .month-dots i.k-entrega { background: var(--gold); } .legend i.k-tarea, .month-dots i.k-tarea { background: var(--muted); }
.week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; }
.week-day { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 8px; min-width: 0; display: flex; flex-direction: column; gap: 8px; min-height: 160px; }
.week-day.today { border-color: var(--accent); }
.week-head { display: flex; align-items: baseline; gap: 6px; border: 0; background: none; padding: 2px 4px; cursor: pointer; color: var(--muted); font-size: .75rem; text-transform: uppercase; letter-spacing: .05em; }
.week-head b { font: 650 1.125rem var(--f-display); color: var(--ink); letter-spacing: 0; }
.week-day.today .week-head b { color: var(--accent-txt); }
.ag-chip { display: block; width: 100%; text-align: left; border: 0; border-left: 3px solid var(--accent); background: var(--accent-soft); color: var(--ink); border-radius: 6px; padding: 5px 7px; font-size: .75rem; line-height: 1.25; cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ag-chip.k-entrega { border-left-color: var(--gold); background: var(--gold-soft); } .ag-chip.k-tarea { border-left-color: var(--muted); background: var(--surface-2); }
.ag-chip.req { outline: 1.5px dashed var(--warn); } .ag-chip.off { opacity: .45; text-decoration: line-through; }
@media (max-width: 860px) { .week { grid-template-columns: minmax(0, 1fr); } .week-day { min-height: 0; flex-direction: row; align-items: flex-start; } .week-head { flex-direction: column; align-items: center; width: 44px; flex: none; gap: 0; } .week-day > .stack { flex: 1; min-width: 0; } }
.month-wrap { padding: 12px; }
.month { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.month-dow { font-size: .75rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); text-align: center; padding: 4px 0; }
.month-cell { min-height: 96px; min-width: 0; display: flex; flex-direction: column; align-items: stretch; gap: 3px; padding: 6px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); text-align: left; cursor: pointer; color: var(--ink); overflow: hidden; }
.month-cell:hover { border-color: var(--accent); }
.month-cell.out { opacity: .45; }
.month-cell.today { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.month-num { font: 650 .875rem var(--f-display); }
.month-cell.today .month-num { color: var(--accent-txt); }
.month-items { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.m-item { font-size: .75rem; line-height: 1.2; padding: 2px 4px; border-radius: 4px; background: var(--accent-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.m-item.k-entrega { background: var(--gold-soft); } .m-item.k-tarea { background: var(--surface-2); }
.m-more { font-size: .75rem; color: var(--muted); }
.month-dots { display: none; align-items: center; gap: 3px; margin-top: auto; }
.month-dots i { width: 6px; height: 6px; border-radius: 50%; display: inline-block; }
.month-dots small { font-size: .75rem; color: var(--muted); margin-left: 2px; }
@media (max-width: 700px) { .month-cell { min-height: 58px; padding: 5px; align-items: center; } .month-items { display: none; } .month-dots { display: flex; } }
.legend i.k-cita, .legend i.k-entrega, .legend i.k-tarea { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }

/* ---------- página pública de reservas ---------- */
.pub { max-width: 640px; margin: 0 auto; padding-inline: 16px; padding-block: 24px 48px; display: flex; flex-direction: column; gap: 14px; }
.pub > .brand b { font-size: 1.375rem; }
.pub h2 { display: flex; align-items: center; gap: 10px; }
.pub-n { width: 26px; height: 26px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: inline-grid; place-items: center; font: 700 .875rem var(--f-body); flex: none; }
.pub-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 8px; }
.pub-opt { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 12px; cursor: pointer; display: flex; flex-direction: column; gap: 3px; color: var(--ink); }
.pub-opt small { color: var(--muted); font-variant-numeric: tabular-nums; }
.pub-opt.on, .pub-opt:hover { border-color: var(--accent); } .pub-opt.on { background: var(--accent-soft); }
.pub-day { flex: none; width: 58px; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 6px 0; display: flex; flex-direction: column; align-items: center; cursor: pointer; color: var(--ink); }
.pub-day small { font-size: .75rem; color: var(--muted); text-transform: capitalize; }
.pub-day b { font: 650 1.125rem var(--f-display); }
.pub-day.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); } .pub-day.on small { color: var(--accent-ink); }
.pub-day:disabled { opacity: .35; cursor: not-allowed; }
.pub-horas { display: grid; grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); gap: 6px; }
.pub-hora { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 9px 0; font-weight: 600; font-variant-numeric: tabular-nums; cursor: pointer; color: var(--ink); }
.pub-hora.on, .pub-hora:hover { border-color: var(--accent); } .pub-hora.on { background: var(--accent); color: var(--accent-ink); }
.pub-resumen { display: flex; justify-content: space-between; gap: 10px; padding: 12px; border-radius: 10px; background: var(--surface-2); font-size: .875rem; flex-wrap: wrap; }
.pub-ok { align-items: flex-start; }
.abono-box { border: 1.5px dashed var(--accent); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 8px; background: var(--accent-soft); }
.stamp-ok { border: 2px solid var(--ok); color: var(--ok); border-radius: 6px; padding: 2px 10px; font: 700 .75rem var(--f-display); letter-spacing: .12em; text-transform: uppercase; transform: rotate(-2deg); }


/* ---------- capa minimalista ---------- */
h1, h2, h3 { font-weight: 700; letter-spacing: -.02em; }
h1 { font-size: 1.75rem; }
h2 { font-size: 1.125rem; letter-spacing: -.01em; }
.side { background: var(--bg); border-right: 1px solid var(--line); gap: 22px; }
.brand b { font-weight: 800; letter-spacing: -.03em; }
.biz { background: transparent; padding: 0 10px; }
.biz small { font-size: .75rem; }
.nav a { color: var(--muted); font-weight: 500; border-radius: 10px; }
.nav a:hover { background: transparent; color: var(--ink); }
.nav a.on { background: var(--surface-2); color: var(--ink); font-weight: 650; }
.nav-label { font-size: .75rem; letter-spacing: .1em; opacity: .75; }
.main { padding-block: 30px 70px; }
.wrap { gap: 22px; }
.page-head .eyebrow { text-transform: none; letter-spacing: 0; font-size: .875rem; }
.card { border: 1px solid var(--line); border-radius: var(--r); padding: 20px; box-shadow: none; }
.card.kpi { border: 0; background: var(--surface-2); }
.kpi .val { font-weight: 700; }
.goal { border: 0; }
.btn { border-radius: 12px; border-color: var(--line); min-height: 40px; font-weight: 600; background: var(--bg); }
.btn:hover { background: var(--surface-2); }
.btn.pri { background: var(--primary); border-color: var(--primary); color: var(--primary-ink); }
.btn.pri:hover { filter: none; opacity: .88; background: var(--primary); }
.btn.sm { min-height: 32px; border-radius: 10px; }
.btn.ghost { background: transparent; }
.icon-btn { min-height: 0; }
.in { border-radius: 12px; border-color: var(--line); background: var(--bg); }
.in:focus { outline: 2px solid var(--ink); }
.chip { border-color: var(--line); background: var(--bg); color: var(--muted); }
.chip.on { background: var(--primary); color: var(--primary-ink); border-color: var(--primary); }
.seg { background: var(--surface-2); border-radius: 12px; }
.seg button.on { background: var(--bg); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.pill { background: var(--surface-2); }
.pill.acc { background: var(--accent-soft); }
.avatar { background: var(--surface-2); color: var(--ink); }
.alert-row { background: var(--surface-2); border-radius: 12px; }
.banner { background: var(--surface-2); border-radius: 12px; }
.row.click:hover { background: var(--surface-2); border-radius: 10px; }
.item-btn { border-radius: 14px; border-color: var(--line); }
.item-btn:hover { border-color: var(--ink); }
.demo { border-color: var(--line); border-radius: var(--r); }
.demo:hover { border-color: var(--ink); }
.qv:has(input:checked), .rubro:has(input:checked) { border-color: var(--ink); background: var(--surface-2); }
.scrim { background: rgba(10, 10, 10, .35); backdrop-filter: blur(3px); }
.sheet { border-radius: 22px; }
.tabbar { background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(10px); }
.tabbar .on { color: var(--ink); }
.tabbar .sell span.plus { background: var(--primary); color: var(--primary-ink); }
.toast { border-radius: 12px; }
th { letter-spacing: .04em; }
.pub-opt.on, .pub-opt:hover, .pub-hora.on, .pub-hora:hover { border-color: var(--ink); }
.pub-opt.on { background: var(--surface-2); }
.pub-day.on, .pub-hora.on { background: var(--primary); border-color: var(--primary); color: var(--primary-ink); }
.pub-day.on small { color: var(--primary-ink); }
.pub-n { background: var(--primary); color: var(--primary-ink); }
.ag-chip { background: var(--surface-2); }
.mode-pill { opacity: .8; }


/* ---------- Inicio simple y Registrar ---------- */
.hola { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
.resumen { display: flex; flex-direction: column; gap: 14px; padding: 4px 0 6px; }
.res-main { display: flex; flex-direction: column; gap: 2px; }
.res-num { font-size: clamp(2.4rem, 7vw, 3.4rem); font-weight: 750; letter-spacing: -.04em; line-height: 1; font-variant-numeric: tabular-nums; }
.res-sub { display: flex; gap: 28px; }
.res-sub > div { display: flex; flex-direction: column; }
.res-sub b { font-size: 1.125rem; }
.res-meta { display: flex; flex-direction: column; gap: 6px; max-width: 420px; }
.bar-fina { height: 6px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.bar-fina i { display: block; height: 100%; background: var(--primary); border-radius: 99px; }
.acciones { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.accion { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 16px 8px; border-radius: 16px; background: var(--surface-2); color: var(--ink); text-decoration: none; font-weight: 600; font-size: .9375rem; }
.accion:hover { opacity: .85; }
.ac-ico { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--bg); }
.ac-ico.ing { background: var(--primary); color: var(--primary-ink); }
.ac-ico svg.i { display: block; margin: 0; }
.mov-ico { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); flex: none; }
.mov-ico svg.i { width: 16px; height: 16px; }
.mov-ico.t-in { color: var(--ok); } .mov-ico.t-out { color: var(--muted); }
.mov-ico svg.i { display: block; }
.seg-grande button { padding: 9px 18px; font-size: .9375rem; }
.gasto-rapido { max-width: 560px; gap: 14px; }
.monto-grande { display: flex; align-items: baseline; gap: 6px; border-bottom: 2px solid var(--line); padding: 6px 0 10px; font-size: 2.5rem; font-weight: 700; }
.monto-grande:focus-within { border-color: var(--primary); }
.monto-grande input { border: 0; outline: 0; background: transparent; font: inherit; width: 100%; min-width: 0; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.btn.grande { min-height: 50px; font-size: .9375rem; border-radius: 14px; }
.sis-fila { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding: 10px 0; border-top: 1px solid var(--line); }
.sis-fila:first-child { border-top: 0; }
.sis-fila > span { font-weight: 600; }
.swatches { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.swatch { width: 32px; height: 32px; border-radius: 50%; border: 2px solid var(--bg); background: var(--sw); box-shadow: 0 0 0 1px var(--line); cursor: pointer; padding: 0; position: relative; display: grid; place-items: center; color: var(--muted); font-weight: 700; }
.swatch.on { box-shadow: 0 0 0 2px var(--ink); }
.swatch-custom input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
.nav a.on { color: var(--ink); }

.mes-a-mes tr.click-mes { cursor: pointer; } .mes-a-mes tr.click-mes:hover td { background: var(--surface-2); } .mes-a-mes tr.on td { background: var(--surface-2); }
.mes-a-mes tfoot td { border-top: 2px solid var(--ink); border-bottom: 0; }
.barra-col { width: 22%; min-width: 80px; }
.mini-barra { display: block; height: 8px; border-radius: 99px; background: var(--ok); opacity: .8; }
.mini-barra.neg { background: var(--bad); }
@media (max-width: 600px) { .barra-col { display: none; } }
.margen-vivo { font-size: .875rem; padding: 10px 12px; border-radius: 12px; background: var(--surface-2); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.margen-vivo:empty { display: none; }
.link-precio { border: 0; background: none; padding: 2px 4px; margin: -2px -4px; border-radius: 6px; font: inherit; font-variant-numeric: tabular-nums; cursor: pointer; color: var(--ink); text-decoration: underline dotted var(--muted); text-underline-offset: 3px; }
.link-precio:hover { background: var(--surface-2); }
.link-precio.falta { color: var(--warn); font-weight: 600; text-decoration: none; }
.tipo-cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.tipo-card { display: flex; flex-direction: column; gap: 4px; padding: 12px; border: 1px solid var(--line); border-radius: 14px; cursor: pointer; transition: border-color .15s, background .15s; }
.tipo-card input { position: absolute; opacity: 0; pointer-events: none; }
.tipo-card b { font-size: .9375rem; } .tipo-card small { color: var(--muted); font-size: .75rem; line-height: 1.3; }
.tipo-card:has(input:checked) { border-color: var(--primary); background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--primary); }
.tipo-card:has(input:focus-visible) { outline: 2px solid var(--primary); outline-offset: 2px; }
@media (max-width: 480px) { .tipo-cards { grid-template-columns: minmax(0, 1fr); } .tipo-card { flex-direction: row; align-items: center; flex-wrap: wrap; } .tipo-card small { width: 100%; padding-left: 28px; } }

/* ---------- identidad: logo, letras y movimiento ---------- */
.wordmark { display: inline-flex; align-items: baseline; font: 700 1.375rem/1 var(--f-body); letter-spacing: -.045em; color: var(--ink); }
.wordmark i { font: 500 1.375rem/1 var(--f-display); font-style: normal; letter-spacing: -.045em; display: inline-flex; color: var(--marca); }
.wordmark span { display: inline-block; }
.logo-anim .lm-bg { transform-box: fill-box; transform-origin: 50% 60%; animation: lm-pop .7s var(--ease-back) both; }
.logo-anim .lm-hoja { transform-box: fill-box; transform-origin: 50% 100%; animation: lm-hoja .6s .2s var(--ease-out) both; }
.logo-anim .lm-cinta { transform-box: fill-box; transform-origin: 50% 0; animation: lm-cinta .6s .55s var(--ease-back) both; }
.logo-anim .lm-m { animation: lm-escribe .8s .7s cubic-bezier(.65, 0, .35, 1) both; }
.wm-anim span { animation: wm-up .7s calc(.35s + var(--i) * 45ms) var(--ease-out) both; }
@keyframes lm-pop { 0% { transform: scale(.3) rotate(-10deg); opacity: 0; } 60% { opacity: 1; } 100% { transform: none; } }
@keyframes lm-hoja { from { transform: translateY(40%) scale(.85); opacity: 0; } }
@keyframes lm-cinta { from { transform: scaleY(0); } }
@keyframes lm-escribe { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
@keyframes wm-up { from { transform: translateY(70%); opacity: 0; filter: blur(5px); } to { transform: none; opacity: 1; filter: none; } }

.hero h1 { font: 650 clamp(2.6rem, 6.4vw, 4.4rem)/1 var(--f-display); letter-spacing: -.035em; }
.hero h1 mark { font-style: italic; }
.res-num { font-family: var(--f-body); font-weight: 650; letter-spacing: -.045em; font-size: clamp(2.5rem, 7.5vw, 3.5rem); font-variant-numeric: tabular-nums; font-feature-settings: 'tnum' 1, 'ss01' 1; }
.monto-grande { font-family: var(--f-body); font-weight: 650; font-size: 2.5rem; letter-spacing: -.04em; }
.hola h1 { letter-spacing: -.03em; }
.land-top .brand { padding: 0; }

/* portada: entra por partes */
.hero.entra > div:first-child > * { animation: sube .8s var(--ease-out) both; }
.hero.entra > div:first-child > :nth-child(2) { animation-delay: .08s; }
.hero.entra > div:first-child > :nth-child(3) { animation-delay: .16s; }
.hero.entra > div:first-child > :nth-child(4) { animation-delay: .24s; }
.hero.entra .notebook { animation: sube-gira 1s .2s var(--ease-out) both; }
@keyframes sube { from { opacity: 0; transform: translateY(18px); filter: blur(6px); } to { opacity: 1; transform: none; filter: none; } }
@keyframes sube-gira { from { opacity: 0; transform: translateY(30px) rotate(2.5deg) scale(.97); } to { opacity: 1; transform: rotate(-.6deg); } }

/* cambio de pantalla, ventanas y avisos */
.wrap.entra { animation: entra .35s var(--ease-out) both; }
@keyframes entra { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.scrim { animation: aparece .2s ease both; }
.sheet { animation: sheet-in .38s var(--ease-out) both; }
@keyframes aparece { from { opacity: 0; } }
@keyframes sheet-in { from { opacity: 0; transform: translateY(14px) scale(.97); } }
@media (max-width: 600px) { .sheet { animation-name: sheet-sube; } @keyframes sheet-sube { from { transform: translateY(100%); } } }
.toast { animation: toast-in .4s var(--ease-back) both; }
@keyframes toast-in { from { opacity: 0; transform: translate(-50%, 16px) scale(.9); } }
.btn, .accion, .item-btn, .tipo-card, .ej, .swatch { transition: transform .12s ease, background .15s, border-color .15s, opacity .15s; }
.btn:active, .accion:active, .item-btn:active, .ej:active { transform: scale(.97); }

/* cargando: barra arriba, botón con ruedita y pantalla con logo */
#carga-barra { position: fixed; top: 0; left: 0; right: 0; height: 3px; z-index: 200; overflow: hidden; pointer-events: none; transition: opacity .3s; }
#carga-barra::before { content: ""; position: absolute; top: 0; bottom: 0; width: 40%; border-radius: 0 3px 3px 0; background: var(--primary); animation: barra 1.1s cubic-bezier(.65, 0, .35, 1) infinite; }
#carga-barra.fin { opacity: 0; }
@keyframes barra { from { left: -40%; } to { left: 100%; } }
.btn.cargando { position: relative; color: transparent !important; pointer-events: none; }
.btn.cargando > * { visibility: hidden; }
.btn.cargando::after { content: ""; position: absolute; inset: 0; margin: auto; width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--ink); border-right-color: transparent; animation: gira .7s linear infinite; }
.btn.pri.cargando::after { border-color: var(--primary-ink); border-right-color: transparent; }
@keyframes gira { to { transform: rotate(360deg); } }
.splash { position: fixed; inset: 0; z-index: 150; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; }
#splash-over { animation: aparece .25s ease both; }
.splash .brand { transform: scale(1.7); gap: 8px; }
.splash-txt { color: var(--muted); font-size: .875rem; margin: 18px 0 0; animation: sube .6s .9s var(--ease-out) both; }
.splash-bar { width: 120px; height: 3px; border-radius: 99px; background: var(--surface-2); position: relative; overflow: hidden; margin-top: 14px; animation: aparece .4s 1s both; }
.splash-bar::before { content: ""; position: absolute; top: 0; bottom: 0; width: 40%; border-radius: 99px; background: var(--primary); animation: barra 1.1s cubic-bezier(.65, 0, .35, 1) infinite; }

.version { color: var(--muted); font-size: .75rem; text-align: center; margin: 0; opacity: .7; }
/* recetas leídas de una planilla */
.recetas-imp { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
.receta-imp { border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
.receta-imp table { width: 100%; } .receta-imp td { padding: 3px 0; border: 0; }
/* observaciones del cliente */
.obs { display: flex; flex-direction: column; gap: 8px; padding: 14px; border-radius: 14px; background: var(--surface-2); }
.obs h3 { font-size: .9375rem; margin: 0; }
.obs-general { margin: 0; white-space: pre-line; font-size: .9375rem; }
.obs-lista { display: flex; flex-direction: column; gap: 8px; border-left: 2px solid var(--line); padding-left: 12px; }
.obs-item p { margin: 2px 0 0; font-size: .9375rem; white-space: pre-line; }
.obs-nueva { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; } .obs-nueva .in { background: var(--bg); width: 100%; box-sizing: border-box; }
/* movimientos */
.rangos { margin-top: -6px; }
.fechas-caja { gap: 12px; flex-wrap: wrap; } .fechas-caja label { display: flex; flex-direction: column; gap: 4px; } .fechas-caja .in { min-width: 160px; }
.resumen-caja { display: flex; flex-direction: column; gap: 14px; }
.rc-titulo { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.rc-nums { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.rc-nums > div { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.rc-nums b { font-size: clamp(1.15rem, 3.4vw, 1.7rem); letter-spacing: -.03em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rc-detalle p { margin: 2px 0; line-height: 1.6; }
@media (max-width: 520px) { .rc-nums { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } .rc-nums > div:last-child { grid-column: 1 / -1; } }
.dia-mov + .dia-mov { margin-top: 14px; }
.dia-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; padding: 4px 2px 8px; border-bottom: 1px solid var(--line); margin-bottom: 4px; }
.mov-fila .icon-btn { opacity: .55; } .mov-fila:hover .icon-btn { opacity: 1; }
.num.up { color: var(--ok); }
/* ordenar lo importado */
.ordenar { display: flex; flex-direction: column; gap: 8px; }
.ord-fila { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 12px; align-items: center; padding: 10px 12px; border: 1px solid var(--line); border-radius: 14px; }
.ord-nom { display: flex; flex-direction: column; min-width: 0; } .ord-nom small { color: var(--muted); font-size: .8125rem; }
.ord-seg label { padding: 6px 10px; border-radius: 9px; font-size: .8125rem; font-weight: 600; cursor: pointer; color: var(--muted); }
.ord-seg label.on { background: var(--bg); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.ord-seg input { position: absolute; opacity: 0; pointer-events: none; }
.ord-stock { grid-column: 1 / -1; }
@media (max-width: 520px) { .ord-fila { grid-template-columns: minmax(0, 1fr); } }
/* elegir un ejemplo */
.ej-lista { display: flex; flex-direction: column; gap: 10px; }
.ej { display: flex; align-items: center; gap: 14px; text-align: left; padding: 14px; border: 1px solid var(--line); border-radius: 16px; background: var(--bg); color: var(--ink); cursor: pointer; font: inherit; animation: sube .5s calc(.08s + var(--i) * 70ms) var(--ease-out) both; }
.ej:hover { border-color: var(--ink); }
.ej .grow { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.ej b { font-size: .9375rem; } .ej small { color: var(--muted); font-size: .8125rem; line-height: 1.35; }
.ej .mods { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
.ej-ini { width: 44px; height: 44px; border-radius: 13px; display: grid; place-items: center; background: var(--surface-2); font: 650 1.125rem var(--f-display); flex: none; }

::view-transition-old(root), ::view-transition-new(root) { animation-duration: .22s; }
/* números que no se salen de las tarjetas */
.card.kpi { container-type: inline-size; min-width: 0; }
.kpi .val { font-size: clamp(1rem, 12.5cqi, 1.45rem); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: -.03em; }
.kpi .sub, .kpi .lbl { overflow-wrap: anywhere; }
td.n, th.n { white-space: nowrap; }
@media (max-width: 1240px) and (min-width: 821px) { .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

/* fluidez: todo responde al toque */
:root { --ease-suave: cubic-bezier(.22, 1, .36, 1); }
.btn, .accion, .item-btn, .tipo-card, .ej, .swatch, .chip, .row.click, .seg button, .nav a, .tabbar a, .card.click, .link-precio { transition: transform .18s var(--ease-suave), background-color .2s ease, border-color .2s ease, color .2s ease, opacity .2s ease, box-shadow .25s ease; -webkit-tap-highlight-color: transparent; }
.btn:active, .accion:active, .item-btn:active, .ej:active, .chip:active, .tabbar a:active, .seg button:active, .swatch:active { transform: scale(.955); transition-duration: .08s; }
@media (hover: hover) { .accion:hover, .item-btn:hover, .ej:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,.07); } }
.wrap.entra > * { animation: entra .5s var(--ease-suave) both; }
.wrap.entra > :nth-child(2) { animation-delay: .04s; } .wrap.entra > :nth-child(3) { animation-delay: .08s; } .wrap.entra > :nth-child(4) { animation-delay: .12s; } .wrap.entra > :nth-child(n+5) { animation-delay: .16s; }
.wrap.entra { animation: none; }
@keyframes entra { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.sheet { animation: sheet-in .45s var(--ease-suave) both; }
@keyframes sheet-in { from { opacity: 0; transform: translateY(18px) scale(.97); } }
.scrim.cerrando { animation: desaparece .22s ease forwards; pointer-events: none; }
.scrim.cerrando .sheet { animation: sheet-out .22s ease forwards; }
@keyframes desaparece { to { opacity: 0; } }
@keyframes sheet-out { to { opacity: 0; transform: translateY(14px) scale(.98); } }
@media (max-width: 600px) { .scrim.cerrando .sheet { animation-name: sheet-baja; } @keyframes sheet-baja { to { transform: translateY(100%); } } }
.toast.sale { animation: toast-out .25s ease forwards; }
@keyframes toast-out { to { opacity: 0; transform: translate(-50%, 10px) scale(.96); } }
.wrap.entra .bar-fina i, .wrap.entra .mini-barra { transform-origin: left; animation: crece .9s .15s var(--ease-suave) both; }
@keyframes crece { from { transform: scaleX(0); } }
.res-num { display: inline-block; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation-duration: .01ms !important; animation-delay: 0s !important; animation-iteration-count: 1 !important; } }

/* ---------- v19: enlaces-botón, contraseña, ayuda ---------- */
.link-btn{background:none;border:0;padding:0;font:inherit;color:inherit;cursor:pointer;text-align:left}
.link-btn:hover b{text-decoration:underline;text-underline-offset:3px}
.clave-wrap{position:relative;display:block}

.ver-clave:hover{color:var(--ink);background:var(--surface-2)}

.link-sm{font-size:.875rem}
.ayuda-side{display:flex;align-items:center;gap:8px;margin:0 8px 8px;padding:9px 12px;border:1px dashed var(--line);border-radius:12px;background:none;color:var(--muted);font:inherit;font-size:.875rem;cursor:pointer;text-align:left}

.tip{display:flex;align-items:center;gap:10px;padding:10px 12px;margin-bottom:14px;border-radius:14px;background:color-mix(in srgb,var(--marca) 10%,var(--surface));animation:tipIn .35s var(--ease-out,ease) both}

.guia h2{margin:0}
.guia-lista{display:flex;flex-direction:column;gap:2px;margin-top:6px}

.guia-paso:hover{background:var(--surface-2)}

.guia-head{display:flex;align-items:flex-start;gap:10px}.guia-head>div{flex:1}.guia-head .btn{flex:none}

/* ---------- v20: portada "Anota. MiDerno suma." ---------- */
.portada { --pt: #0B6870; --sol: #FFB547; min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; color: #fff;
  background: radial-gradient(1100px 560px at 82% 38%, #14919C 0%, #0B6870 58%, #095961 100%); padding: 22px clamp(16px, 5vw, 56px) 22px; overflow-x: hidden; }
.por-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; max-width: 1120px; width: 100%; margin: 0 auto; }
.portada .brand { padding: 0; }
.portada .wordmark, .portada .wordmark i { color: #fff; }

/* =========================================================
   v22 · la hoja del día, anotar, hoja de cobrar, agenda corta y movimiento
   ========================================================= */
:root { --papel: #FFFDF8; --renglon: #E3ECEA; --sol: #FFB547; --lapiz: #B5473A; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --papel: #141516; --renglon: #24302F; --lapiz: #EE7D6A; } }
:root[data-theme="dark"] { --papel: #141516; --renglon: #24302F; --lapiz: #EE7D6A; }

/* Inicio */
.inicio { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, .9fr); gap: 28px; align-items: start; }
.ini-col { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
@media (max-width: 980px) { .inicio { grid-template-columns: minmax(0, 1fr); gap: 18px; } }
.ini-dia h1 { font: 650 clamp(2.3rem, 6vw, 3rem)/1 var(--f-display); letter-spacing: -.035em; margin: 0; }
.ini-dia p { margin: 4px 0 0; font-size: .9375rem; }
  background-image: repeating-linear-gradient(transparent 0 43px, var(--renglon) 43px 44px); background-position: 0 6px; }
@keyframes hd-escribe { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
@keyframes hd-resalta { 0%, 35% { background: color-mix(in srgb, var(--sol) 70%, transparent); } 100% { background: transparent; } }
  background: linear-gradient(transparent 58%, var(--sol) 58%, var(--sol) 90%, transparent 90%) no-repeat 0 0 / 100% 100%; }
@keyframes hd-subraya { from { background-size: 0 100%; } }
/* anotar escribiendo */
@media (max-width: 860px) { .anota { bottom: calc(78px + env(safe-area-inset-bottom, 0px)); } }
.an-tipo { font-size: .75rem; font-weight: 600; border-radius: 6px; padding: 1px 6px; margin-right: 4px; }
.an-tipo.in { background: var(--ok-soft); color: var(--ok); } .an-tipo.out { background: var(--bad-soft); color: var(--lapiz); }
/* mes en tres datos */
.ini-mes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.ini-mes a { display: flex; flex-direction: column; gap: 1px; padding: 12px; border-radius: 14px; background: var(--surface); border: 1px solid var(--renglon); color: var(--ink); text-decoration: none; min-width: 0; }
.ini-mes small { color: var(--muted); font-size: .75rem; }
.ini-mes b { font-size: 1.125rem; letter-spacing: -.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ini-mes b.down { color: var(--lapiz); }
.ini-mes span { font-size: .75rem; color: var(--muted); line-height: 1.25; }
.ini-mes .bar-fina { margin-top: 6px; }
.ini-todo { display: inline-flex; align-items: center; gap: 4px; font-size: .875rem; align-self: flex-start; }
.ini-todo .i { width: 16px; height: 16px; }

/* hoja de cobrar */
.cobro { display: flex; flex-direction: column; gap: 14px; }
.cobro-lineas { display: flex; flex-direction: column; gap: 8px; }
.cobro-ln { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; padding: 10px 12px; border-radius: 14px; background: var(--surface-2); }

.cobro-sel { width: auto; min-height: 34px; padding: 4px 8px; font-size: .875rem; max-width: 150px; }
.cobro-fecha { display: flex; align-items: center; gap: 8px; }

.cobro-barra { display: none; }
@media (max-width: 860px) {
  .cobro-barra { display: flex; position: fixed; left: 12px; right: 12px; bottom: calc(76px + env(safe-area-inset-bottom, 0px)); z-index: 15; justify-content: space-between; align-items: center; gap: 10px; border: 0; border-radius: 16px; padding: 13px 16px; background: var(--primary); color: var(--primary-ink, #fff); font: 500 .9375rem var(--f-body); box-shadow: 0 12px 30px rgba(14,124,134,.3); animation: sube .3s var(--ease-out, ease); cursor: pointer; }

}
.vuela { position: fixed; z-index: 200; font-weight: 700; color: var(--ok); pointer-events: none; background: var(--surface); border-radius: 8px; padding: 2px 8px; box-shadow: var(--shadow); transition: transform .7s cubic-bezier(.5, 0, .3, 1), opacity .7s; }

@keyframes late { 40% { transform: scale(1.18); color: var(--ok); } }

/* agenda corta */
.ag-pend-box { border: 1px solid color-mix(in srgb, var(--sol) 70%, transparent); background: color-mix(in srgb, var(--sol) 12%, var(--surface)); border-radius: 14px; overflow: hidden; }
.ag-pend { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 10px; border: 0; background: none; padding: 11px 14px; font: 500 .9375rem var(--f-body); color: var(--ink); cursor: pointer; text-align: left; }
.ag-pend-ver { background: var(--sol); color: #10282A; border-radius: 8px; padding: 2px 9px; font-size: .8125rem; font-weight: 600; }
.ag-pend-box .list { padding: 0 14px 6px; animation: sube .3s var(--ease-out, ease); }
.ag-cuentas { display: flex; gap: 6px; flex-wrap: wrap; }
.ag-lista { display: flex; flex-direction: column; }
.ag-fila { display: grid; grid-template-columns: 50px minmax(0, 1fr) auto; gap: 10px; align-items: center; min-height: 58px; padding: 6px 4px 6px 10px; border-bottom: 1px solid var(--line); cursor: pointer; position: relative; border-radius: 10px; }
.ag-fila::before { content: ""; position: absolute; left: 0; top: 12px; bottom: 12px; width: 3px; border-radius: 3px; background: var(--primary); }
.ag-fila.k-entrega::before { background: var(--sol); } .ag-fila.k-tarea::before { background: var(--muted); }
.ag-fila.req::before { background: repeating-linear-gradient(var(--sol) 0 4px, transparent 4px 7px); }
.ag-fila:hover { background: var(--surface-2); }
.ag-fila:focus-visible { outline: 2px solid var(--primary); outline-offset: 1px; }
.ag-h { font-weight: 600; font-size: .9375rem; }
.ag-q { min-width: 0; display: flex; flex-direction: column; }
.ag-q b { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ag-q small { color: var(--muted); font-size: .8125rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ag-a .btn { min-width: 84px; justify-content: center; }
.btn.sol { background: var(--sol); border-color: var(--sol); color: #10282A; }
.ag-hecho { display: inline-block; font-size: .8125rem; font-weight: 600; color: var(--ok); background: var(--ok-soft); border-radius: 9px; padding: 6px 10px; min-width: 84px; text-align: center; }
.ag-hecho.pop { animation: pop .35s var(--ease-out, ease); }
@keyframes pop { from { transform: scale(.7); opacity: 0; } }
.ag-fila.apagada .ag-h, .ag-fila.apagada .ag-q { opacity: .55; }
.ag-fila.recien { animation: aterriza .6s var(--ease-out, ease) both; background: color-mix(in srgb, var(--sol) 14%, transparent); }
@keyframes aterriza { from { transform: translateY(-28px) scale(.96); opacity: 0; } }
.ag-fila.pagada-ahora .ag-hecho { animation: pop .4s .55s var(--ease-out, ease) both; }
.ag-ahora { position: relative; height: 0; border-top: 2px solid var(--lapiz); margin: 3px 0 3px 4px; }
.ag-ahora::before { content: ""; position: absolute; left: -5px; top: -6px; width: 10px; height: 10px; border-radius: 50%; background: var(--lapiz); }
.ag-ahora span { position: absolute; right: 0; top: -10px; font-size: .75rem; font-weight: 600; color: var(--lapiz); background: var(--surface); padding: 0 4px; }
.ag-dia-card.entra-der { animation: desliza-der .32s var(--ease-out, ease); } .ag-dia-card.entra-izq { animation: desliza-izq .32s var(--ease-out, ease); }
@keyframes desliza-der { from { transform: translateX(40px); opacity: 0; } } @keyframes desliza-izq { from { transform: translateX(-40px); opacity: 0; } }
.ag-det-acc .hstack, .ag-det-acc { display: flex; flex-wrap: wrap; gap: 8px; }
@media (max-width: 860px) { .ag-fila { grid-template-columns: 44px minmax(0, 1fr) auto; } .ag-a .btn, .ag-hecho { min-width: 76px; } }

/* portada viva y entrar */
.pp-feed { display: flex; flex-direction: column; }
.pp-mov.nueva { animation: pp-nueva .55s var(--ease-out, ease); }

@keyframes vaiven { 20% { transform: translateX(-7px); } 45% { transform: translateX(6px); } 70% { transform: translateX(-3px); } }
.err-msg { display: block; color: var(--bad); font-size: .875rem; margin-top: 4px; }

/* reservas */
.pub-horas.aparecen .pub-hora { animation: sube .35s calc(var(--i) * 35ms) var(--ease-out, ease) both; }
.pub-opt.on { border-color: var(--primary); background: color-mix(in srgb, var(--primary) 7%, var(--surface)); box-shadow: inset 0 0 0 1px var(--primary); }
.pub-opt { transition: border-color .2s, background .2s, box-shadow .2s; }

}

}

/* v23 · buscar clienta, precio editable, hora en lista, formularios más livianos */
.busca-cli { position: relative; flex: 1; min-width: 0; }
.busca-cli .bc-in { width: 100%; }

.bc-x { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); width: 34px; height: 34px; border: 0; background: none; color: var(--muted); border-radius: 9px; cursor: pointer; display: grid; place-items: center; }
.bc-x .i { width: 16px; height: 16px; }
.bc-lista { position: absolute; left: 0; right: 0; top: calc(100% + 4px); z-index: 30; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 16px 40px rgba(16,40,42,.16); padding: 4px; max-height: 280px; overflow: auto; animation: sube .18s var(--ease-out, ease); }

.precio-wrap { display: inline-flex; align-items: center; gap: 2px; border-bottom: 1px dashed color-mix(in srgb, var(--muted) 60%, transparent); }
.precio-ln { border: 0 !important; background: transparent !important; padding: 2px 0 !important; min-height: 0 !important; width: 8ch; font: inherit; color: inherit; box-shadow: none !important; }
.precio-ln:focus { outline: none; }
.precio-wrap:focus-within { border-bottom: 2px solid var(--primary); }
.cobro-precio { display: inline-flex; align-items: center; gap: 4px; color: var(--muted); font-size: .9375rem; }
.cart-precio { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
.sel-hora { font-variant-numeric: tabular-nums; }
.mas-datos { border-top: 1px solid var(--line); padding-top: 10px; }
.mas-datos summary { cursor: pointer; color: var(--muted); font-size: .875rem; font-weight: 500; list-style: none; display: flex; align-items: center; gap: 6px; }

/* indicadores */

.ind-head { display: flex; justify-content: space-between; align-items: center; border: 0; background: none; padding: 0; cursor: pointer; color: var(--ink); font: inherit; text-align: left; }
.ind-head h2 { margin: 0; font-size: 1.125rem; }
.ind-head span { display: inline-flex; align-items: center; gap: 2px; font-size: .875rem; color: var(--accent-txt); font-weight: 600; }
.ind-head .i { width: 15px; height: 15px; }
.ind-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.ind-k { display: flex; flex-direction: column; gap: 1px; padding: 10px 12px; border-radius: 12px; background: var(--surface-2); min-width: 0; }
.ind-k small { color: var(--muted); font-size: .75rem; }
.ind-k b { font-size: 1.375rem; letter-spacing: -.03em; font-weight: 650; line-height: 1.15; }
.ind-d { font-size: .75rem; color: var(--muted); line-height: 1.3; }
.ind-d.up { color: var(--ok); } .ind-d.down { color: var(--lapiz); }
.ind-barra { display: block; height: 5px; border-radius: 5px; background: color-mix(in srgb, var(--primary) 14%, transparent); margin-top: 6px; overflow: hidden; }

.ind-pista { font-size: .875rem; background: color-mix(in srgb, var(--sol) 16%, var(--surface)); border-radius: 10px; padding: 8px 10px; color: var(--ink); text-decoration: none; }

.ind-mini { display: inline-block; width: 40px; height: 6px; border-radius: 3px; background: linear-gradient(90deg, var(--primary) var(--w), color-mix(in srgb, var(--primary) 12%, transparent) var(--w)); margin-right: 8px; vertical-align: middle; }

/* ---------- v23: pulido general (menos tosco) ---------- */
:root { --fondo: #F7F7F5; --line-suave: rgba(20,20,20,.06); --sombra-card: 0 1px 2px rgba(20,20,20,.04), 0 4px 14px rgba(20,20,20,.04); }

body { background: var(--fondo); }
.main, main { background: transparent; }

.in, select.in, textarea.in { background: var(--surface-2); border-color: transparent; transition: border-color .15s, background-color .15s, box-shadow .15s; }
.in:hover { border-color: var(--line); }
.in:focus { outline: none; background: var(--surface); border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
label > span:first-child, .lbl { font-size: .8125rem; font-weight: 600; color: var(--muted); letter-spacing: .01em; }
.btn { border-color: var(--line); box-shadow: 0 1px 1px rgba(20,20,20,.03); }

.btn.ghost { box-shadow: none; }
.sheet { border-radius: 24px; padding: 22px; gap: 14px; }

.side { background: var(--fondo); border-right-color: var(--line-suave); }
.seg { background: var(--surface-2); }
.chip { border-color: var(--line-suave); }

@media (max-width: 600px) { .sheet { border-radius: 22px 22px 0 0; padding: 18px 16px calc(18px + env(safe-area-inset-bottom)); } }
@media (max-width: 860px) {
  .card { border-radius: 16px; padding: 16px; }
  .tabbar { background: color-mix(in srgb, var(--surface) 88%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-top-color: var(--line-suave); }
}
.ind-tabla { width: 100%; }

  .ind-tabla { font-size: .8125rem; }

}

.bc-op small { white-space: nowrap; flex: none; } .bc-op b { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ---------- v24: calendario por horas y bloqueos ---------- */
:root { --sol: #FFB547; --rayas: repeating-linear-gradient(-45deg, color-mix(in srgb, var(--muted) 16%, transparent) 0 6px, transparent 6px 12px); }
.solo-desk { display: inline; }
@media (max-width: 860px) { .solo-desk { display: none; } }
.cal-card { padding: 0; overflow: hidden; }
.cal { display: grid; grid-template-columns: 52px repeat(var(--dias), minmax(0, 1fr)); max-height: min(72vh, 760px); overflow-y: auto; overscroll-behavior: contain; position: relative; }
.cal-esq, .cal-cab { position: sticky; top: 0; z-index: 4; background: var(--surface); border-bottom: 1px solid var(--line-suave); }
.cal-cab { padding: 8px 4px 8px; display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 0; border-left: 1px solid var(--line-suave); }
.cal-dia { border: 0; background: none; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 0; color: var(--muted); padding: 2px 8px; border-radius: 12px; }
.cal-dia span { font-size: .75rem; text-transform: capitalize; }
.cal-dia b { font-size: 1.125rem; font-weight: 600; color: var(--ink); line-height: 1.15; }
.cal-dia:hover { background: var(--surface-2); }
.cal-cab.hoy .cal-dia b { background: var(--accent); color: var(--accent-ink, #fff); border-radius: 99px; min-width: 32px; padding: 0 6px; }
.cal-nota { font-size: .75rem; color: var(--muted); }
.cal-todo { width: 100%; border: 0; border-radius: 6px; padding: 2px 6px; font-size: .75rem; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; background: var(--gold-soft); }
.cal-horas { position: relative; }
.cal-horas span { position: absolute; right: 8px; transform: translateY(-50%); font-size: .75rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.cal-horas span:first-child { display: none; }
.cal-col { position: relative; border-left: 1px solid var(--line-suave); cursor: copy;
  background-image: linear-gradient(to bottom, var(--line-suave) 1px, transparent 1px); background-size: 100% calc(60px * 1.1); }
.cal-col:hover { background-color: color-mix(in srgb, var(--accent) 3%, transparent); }
.cal-fuera { position: absolute; left: 0; right: 0; background: var(--surface-2); opacity: .75; pointer-events: none; }
.cal-col.cerrado .cal-fuera { background: var(--rayas), var(--surface-2); }
.cal-bloq { position: absolute; left: 2px; right: 2px; z-index: 1; border: 1px dashed color-mix(in srgb, var(--muted) 50%, transparent); border-radius: 8px; background: var(--rayas), var(--surface); color: var(--muted); text-align: left; padding: 4px 6px; font-size: .75rem; cursor: pointer; display: flex; flex-direction: column; overflow: hidden; }
.cal-bloq b { font-weight: 600; color: var(--ink); }
.cal-ev { position: absolute; z-index: 2; border: 0; border-radius: 8px; padding: 4px 6px 4px 8px; text-align: left; cursor: pointer; overflow: hidden; display: flex; flex-direction: column; gap: 0; font-size: .75rem; line-height: 1.25;
  background: color-mix(in srgb, var(--accent) 14%, var(--surface)); color: var(--ink); box-shadow: inset 3px 0 0 var(--accent);
  transition: transform .15s var(--ease-out), box-shadow .2s; }
.cal-ev:hover { transform: translateY(-1px); box-shadow: inset 3px 0 0 var(--accent), 0 4px 12px rgba(0,0,0,.08); z-index: 3; }
.cal-ev b { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cal-ev small { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cal-ev .cal-h { font-size: .75rem; color: var(--muted); }
.cal-ev.corto { flex-direction: row; gap: 4px; align-items: center; padding-top: 2px; padding-bottom: 2px; }
.cal-ev em { font-style: normal; font-size: .75rem; font-weight: 600; color: var(--warn); }
.cal-ev.req { background: var(--warn-soft); box-shadow: inset 3px 0 0 var(--sol); outline: 1px dashed color-mix(in srgb, var(--warn) 55%, transparent); outline-offset: -1px; }
.cal-ev.hecho { background: var(--surface-2); box-shadow: inset 3px 0 0 var(--ok); opacity: .75; }
.cal-ev.k-entrega { background: var(--gold-soft); box-shadow: inset 3px 0 0 var(--gold); }
.cal-ev.k-tarea { background: var(--surface-2); box-shadow: inset 3px 0 0 var(--muted); }
.cal-ahora { position: absolute; left: -1px; right: 0; height: 2px; background: var(--margin); z-index: 3; pointer-events: none; }
.cal-ahora::before { content: ""; position: absolute; left: -4px; top: -3px; width: 8px; height: 8px; border-radius: 50%; background: var(--margin); }
.cal-ley { padding: 10px 16px 14px; border-top: 1px solid var(--line-suave); flex-wrap: wrap; gap: 6px 16px; display: flex; font-size: .75rem; }
.cal-ley i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 6px; vertical-align: -2px; }
.ley-conf { background: color-mix(in srgb, var(--accent) 30%, var(--surface)); }
.ley-req { background: var(--warn-soft); outline: 1px dashed var(--warn); outline-offset: -1px; }
.ley-bloq { background: var(--rayas), var(--surface); border: 1px dashed var(--muted); }
.ley-fuera { background: var(--surface-2); }
.ag-bloq { display: flex; align-items: center; gap: 10px; width: 100%; border: 1px dashed var(--line); border-radius: 12px; background: var(--rayas); padding: 10px 12px; margin-bottom: 8px; text-align: left; cursor: pointer; color: var(--ink); }
.ag-bloq span { flex: 1; min-width: 0; } .ag-bloq small { color: var(--muted); }
.ag-cerrado { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; } .ag-cerrado .i { width: 16px; height: 16px; }
.month-cell.cerrado { background: var(--surface-2); }
.month-cell.bloq { background: var(--rayas), var(--surface); }
.hueco-op { border: 0; width: 100%; text-align: left; cursor: pointer; }
.banner.warn-soft { background: var(--warn-soft); justify-content: flex-start; gap: 10px; flex-wrap: nowrap; align-items: flex-start; }
.banner.warn-soft .i { flex: none; color: var(--warn); margin-top: 2px; }
.cita-aviso { font-size: .875rem; }
@media (max-width: 600px) {
  .cal { grid-template-columns: 40px repeat(var(--dias), minmax(0, 1fr)); max-height: 66vh; }
  .cal-horas span { right: 4px; font-size: .75rem; }
  .cal-ev { font-size: .75rem; padding: 3px 4px 3px 6px; }
  .cal-ley span.muted { flex-basis: 100%; }
}

/* ---------- v24: página pública con identidad del negocio ---------- */

.pub-preview .btn { background: transparent; color: var(--bg); border-color: color-mix(in srgb, var(--bg) 35%, transparent); }
.pub-cab { display: flex; flex-direction: column; gap: 0; margin-bottom: 4px; }
.pub-portada { aspect-ratio: 16 / 7; border-radius: 22px; overflow: hidden; background: var(--surface-2); }
.pub-portada img { width: 100%; height: 100%; object-fit: cover; display: block; }

.pub-ini { display: grid; place-items: center; font: 600 1.375rem var(--f-display); color: var(--accent-ink, #fff); background: var(--accent); letter-spacing: -.02em; }
