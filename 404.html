<style>
/* Layout: app shell — sidebar on desktop, bottom tab bar + "Más" sheet on phones. Brand idea: the entrepreneur's notebook — ink blue, highlighter yellow, margin red */
/* Minimal: white paper, one typeface, ink-black actions; the notebook blue only marks what is active or linked */
:root {
  --marca: #0B6870;
  --primary: var(--ink);
  --primary-ink: var(--bg);
  --bg: #FFFFFF;
  --surface: #FFFFFF;
  --surface-2: #F4F4F2;
  --line: #E8E8E5;
  --ink: #141414;
  --muted: #6E6E6E;
  --accent: #2346A3;
  --accent-ink: #FFFFFF;
  --accent-soft: #EEF1FA;
  --gold: #C99A10;
  --gold-soft: #FBF3DC;
  --hl: #FFE98A;
  --margin: #D8483B;
  --rule: #DCE3EE;
  --paper: #FFFFFF;
  --ok: #1F7A4A;
  --ok-soft: #E7F4EC;
  --warn: #8F5E0E;
  --warn-soft: #FBF1DE;
  --bad: #B23A2B;
  --bad-soft: #FBE8E4;
  --shadow: 0 1px 2px rgba(0, 0, 0, .04), 0 16px 40px rgba(0, 0, 0, .10);
  --f-display: "Geist", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-body: "Geist", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-serif: "Instrument Serif", "Iowan Old Style", Georgia, serif;
  --ease-out: cubic-bezier(.16, 1, .3, 1);
  --ease-back: cubic-bezier(.34, 1.56, .64, 1);
  --f-hand: "Caveat", "Segoe Print", "Bradley Hand", cursive;
  --r: 16px;
  --r-sm: 12px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --marca: #5CC8C9;
    --bg: #0E0E0F; --surface: #0E0E0F; --surface-2: #1A1A1C; --line: #262629;
    --ink: #F1F1F1; --muted: #9B9BA0; --accent: #94ABF7; --accent-ink: #0B1430; --accent-soft: #1A2240;
    --gold: #E6C04F; --gold-soft: #2F2914; --hl: #6E5D12; --margin: #F07A6E; --rule: #2B3446; --paper: #151517;
    --ok: #62C48F; --ok-soft: #14271C; --warn: #E9B54E; --warn-soft: #2E2614; --bad: #EE7D6A; --bad-soft: #33201C;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 16px 40px rgba(0,0,0,.5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E0E0F; --surface: #0E0E0F; --surface-2: #1A1A1C; --line: #262629;
  --ink: #F1F1F1; --muted: #9B9BA0; --accent: #94ABF7; --accent-ink: #0B1430; --accent-soft: #1A2240;
  --gold: #E6C04F; --gold-soft: #2F2914; --hl: #6E5D12; --margin: #F07A6E; --rule: #2B3446; --paper: #151517;
  --ok: #62C48F; --ok-soft: #14271C; --warn: #E9B54E; --warn-soft: #2E2614; --bad: #EE7D6A; --bad-soft: #33201C;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 16px 40px rgba(0,0,0,.5);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--f-body); -webkit-font-smoothing: antialiased; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 650; line-height: 1.15; margin: 0; text-wrap: balance; letter-spacing: -.01em; }
h1 { font-size: 1.7rem; }
h2 { font-size: 1.15rem; }
h3 { font-size: 1rem; }
p { margin: 0; }
a { color: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }
.num, td.n, .money { font-variant-numeric: tabular-nums; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
svg.i { width: 20px; height: 20px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- shell ---------- */
.shell { display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: 100vh; }
.side { position: sticky; top: 0; height: 100vh; padding: 20px 14px; border-right: 1px solid var(--line); background: var(--surface); display: flex; flex-direction: column; gap: 18px; overflow-y: auto; }
.brand { display: flex; align-items: center; gap: 10px; padding: 0 8px; }
.brand-mark { width: 30px; height: 30px; flex: none; display: block; overflow: visible; }
.brand b { font: 700 1.25rem var(--f-display); letter-spacing: -.02em; }
.biz { padding: 10px; border-radius: var(--r-sm); background: var(--surface-2); }
.biz small { display: block; color: var(--muted); font-size: .75rem; }
.biz strong { display: block; font-weight: 600; line-height: 1.25; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav-label { font-size: .7rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); padding: 12px 10px 4px; }
.nav a { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: var(--r-sm); color: var(--ink); text-decoration: none; font-weight: 500; }
.nav a:hover { background: var(--surface-2); }
.nav a.on { background: var(--accent-soft); color: var(--accent); }
.side .grow { flex: 1; }
.mode-pill { font-size: .75rem; color: var(--muted); padding: 0 10px; display: flex; gap: 6px; align-items: center; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--gold); display: inline-block; }
.dot.cloud { background: var(--ok); }

.main { min-width: 0; padding-inline: 28px; padding-block: 26px 60px; }
.wrap { max-width: 1080px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.page-head .eyebrow { font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
.page-head .actions { display: flex; gap: 8px; flex-wrap: wrap; }

.tabbar { display: none; }

@media (max-width: 860px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .side { display: none; }
  .main { padding-inline: 16px; padding-block: 16px 110px; }
  h1 { font-size: 1.45rem; }
  .tabbar { display: grid; grid-template-columns: repeat(5, 1fr); position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line); padding: 6px 4px calc(6px + env(safe-area-inset-bottom, 0px)); }
  .tabbar a, .tabbar button { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: .68rem; font-weight: 500; color: var(--muted); text-decoration: none; background: none; border: 0; padding: 4px 0; cursor: pointer; }
  .tabbar .on { color: var(--accent); }
  .tabbar .sell span.plus { width: 44px; height: 44px; margin-top: -18px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; box-shadow: var(--shadow); }
  .mobile-top { display: flex !important; }
}
.mobile-top { display: none; align-items: center; justify-content: space-between; gap: 10px; }
.mobile-top .brand b { font-size: 1.1rem; }

/* ---------- surfaces ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; min-width: 0; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
.card-head p { color: var(--muted); font-size: .85rem; }
.grid { display: grid; gap: 14px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.span2 { grid-column: span 2; }
@media (max-width: 1000px) { .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .g3 { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 720px) { .g2 { grid-template-columns: minmax(0, 1fr); } .span2 { grid-column: auto; } }

.kpi { display: flex; flex-direction: column; gap: 4px; }
.kpi .lbl { font-size: .78rem; color: var(--muted); }
.kpi .val { font: 650 1.45rem/1.1 var(--f-display); font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.kpi .sub { font-size: .78rem; color: var(--muted); }
.up { color: var(--ok); } .down { color: var(--bad); }

/* meta (goal) */
.goal { background: var(--ink); color: var(--bg); border: 0; }
.goal .lbl, .goal .sub { color: color-mix(in srgb, var(--bg) 70%, transparent); }
.goal-row { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
.goal-big { font: 650 2.2rem/1 var(--f-display); font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.bar { height: 12px; border-radius: 99px; background: color-mix(in srgb, var(--bg) 18%, transparent); overflow: hidden; margin: 14px 0 10px; }
.bar i { display: block; height: 100%; border-radius: 99px; background: var(--gold); }
.goal-facts { display: flex; gap: 22px; flex-wrap: wrap; font-size: .85rem; }
.goal-facts b { display: block; font: 600 1.05rem var(--f-display); font-variant-numeric: tabular-nums; }

/* lists & tables */
.list { display: flex; flex-direction: column; }
.row { display: flex; align-items: center; gap: 12px; padding: 11px 2px; border-top: 1px solid var(--line); min-width: 0; }
.row:first-child { border-top: 0; }
.row .grow { flex: 1; min-width: 0; }
.row .t { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .s { font-size: .82rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .r { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.row.click { cursor: pointer; }
.row.click:hover { background: var(--surface-2); }
.avatar { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-weight: 600; font-size: .85rem; background: var(--accent-soft); color: var(--accent); flex: none; }
.tbl-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: .9rem; }
th { text-align: left; font-weight: 500; font-size: .75rem; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
td.n, th.n { text-align: right; white-space: nowrap; }
tr:last-child td { border-bottom: 0; }

.pill { display: inline-flex; align-items: center; gap: 5px; font-size: .74rem; font-weight: 600; padding: 3px 9px; border-radius: 99px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.acc { background: var(--accent-soft); color: var(--accent); }
.empty { padding: 26px 12px; text-align: center; color: var(--muted); font-size: .9rem; }

/* controls */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 9px 15px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-weight: 600; font-size: .9rem; cursor: pointer; text-decoration: none; white-space: nowrap; }
.btn:hover { background: var(--surface-2); }
.btn.pri { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.pri:hover { filter: brightness(1.06); }
.btn.danger { color: var(--bad); }
.btn.sm { padding: 6px 10px; font-size: .8rem; border-radius: 8px; }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.block { width: 100%; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.icon-btn { width: 34px; height: 34px; padding: 0; border-radius: 9px; }

.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field label { font-size: .8rem; font-weight: 600; color: var(--muted); }
.field .hint { font-size: .76rem; color: var(--muted); }
.in { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); min-height: 42px; }
.in:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
.form { display: flex; flex-direction: column; gap: 14px; }
.form-row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 480px) { .form-row { grid-template-columns: minmax(0, 1fr); } }

.seg { display: inline-flex; background: var(--surface-2); border-radius: 10px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: none; padding: 7px 12px; border-radius: 8px; font-size: .85rem; font-weight: 600; color: var(--muted); cursor: pointer; }
.seg button.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.08); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 6px 12px; font-size: .82rem; font-weight: 600; cursor: pointer; color: var(--muted); }
.chips.scroll { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.chips.scroll .chip { flex: none; }
.chip.on { background: var(--primary); color: var(--primary-ink); border-color: var(--primary); }

.toggle { position: relative; width: 44px; height: 26px; flex: none; }
.toggle input { opacity: 0; width: 100%; height: 100%; position: absolute; inset: 0; margin: 0; cursor: pointer; z-index: 1; }
.toggle span { position: absolute; inset: 0; border-radius: 99px; background: var(--line); transition: background .15s; }
.toggle span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--surface); box-shadow: 0 1px 2px rgba(0,0,0,.2); transition: transform .15s; }
.toggle input:checked + span { background: var(--accent); }
.toggle input:checked + span::after { transform: translateX(18px); }
.toggle input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }

.monthnav { display: inline-flex; align-items: center; gap: 4px; }
.monthnav strong { min-width: 130px; text-align: center; font-weight: 600; display: inline-block; }
.monthnav strong::first-letter { text-transform: uppercase; }

/* chart */
.chart svg { width: 100%; height: auto; display: block; }
.chart text { fill: var(--muted); font: 11px var(--f-body); }
.legend { display: flex; gap: 14px; font-size: .8rem; color: var(--muted); flex-wrap: wrap; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }

/* caja de hoy */
.caja-dia { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; }
.caja-dia div { background: var(--surface-2); border-radius: var(--r-sm); padding: 10px 12px; }
.caja-dia small { display: block; color: var(--muted); font-size: .75rem; }
.caja-dia b { font-variant-numeric: tabular-nums; font-weight: 650; }

/* sell */
.sell { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 900px) { .sell { grid-template-columns: minmax(0, 1fr); } }
.catalog { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.item-btn { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 11px 12px; cursor: pointer; display: flex; flex-direction: column; gap: 3px; min-height: 76px; }
.item-btn:hover { border-color: var(--accent); }
.item-btn b { font-weight: 600; font-size: .9rem; line-height: 1.25; }
.item-btn small { color: var(--muted); font-size: .78rem; font-variant-numeric: tabular-nums; }
.item-btn:disabled { opacity: .45; cursor: not-allowed; }
.cart { position: sticky; top: 16px; }
.cart-line { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 10px; padding: 10px 0; border-top: 1px solid var(--line); }
.cart-line:first-child { border-top: 0; }
.qty { display: inline-flex; align-items: center; gap: 4px; }
.qty button { width: 28px; height: 28px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 700; }
.total-row { display: flex; justify-content: space-between; align-items: baseline; padding: 14px 0 6px; border-top: 2px solid var(--ink); margin-top: 8px; }
.total-row b { font: 650 1.6rem var(--f-display); font-variant-numeric: tabular-nums; }

/* sheet (modal) */
.scrim { position: fixed; inset: 0; background: rgba(8, 14, 12, .45); z-index: 40; display: flex; align-items: center; justify-content: center; padding: 16px; }
.sheet { background: var(--surface); border-radius: 18px; width: min(560px, 100%); max-height: calc(100vh - 32px); overflow-y: auto; padding: 20px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 16px; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.sheet-foot { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
@media (max-width: 600px) {
  .scrim { align-items: flex-end; padding: 0; }
  .sheet { border-radius: 18px 18px 0 0; max-height: 92vh; padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px)); }
}

.toast { position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-weight: 600; font-size: .9rem; z-index: 60; box-shadow: var(--shadow); max-width: calc(100% - 32px); }
.toast.err { background: var(--bad); color: #fff; }

.alert-row { display: flex; gap: 10px; align-items: center; padding: 10px 12px; border-radius: var(--r-sm); background: var(--surface-2); text-decoration: none; color: var(--ink); }
.alert-row .grow { flex: 1; min-width: 0; }
.alert-row small { display: block; color: var(--muted); font-size: .8rem; }
.sev { width: 8px; align-self: stretch; border-radius: 4px; flex: none; background: var(--muted); }
.sev.warn { background: var(--warn); } .sev.bad { background: var(--bad); } .sev.ok { background: var(--ok); } .sev.acc { background: var(--accent); }

.rec-row { display: grid; grid-template-columns: minmax(0, 1fr) 96px 92px 34px; gap: 6px; align-items: center; }
.rec-nuevo { grid-column: 1 / -1; display: grid; grid-template-columns: minmax(0, 1fr) 150px; gap: 6px; padding: 8px; border-radius: 10px; background: var(--surface-2); }
@media (max-width: 480px) { .rec-row { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) 34px; } .rec-row .rec-ins { grid-column: 1 / -1; } .rec-nuevo { grid-template-columns: minmax(0, 1fr); } }

/* ---------- landing ---------- */

.notebook { position: relative; background-color: var(--paper); border: 1px solid var(--line); border-radius: 6px 16px 16px 6px; box-shadow: var(--shadow);
  padding: 22px 16px 26px 58px; min-width: 0;
  background-image: linear-gradient(to right, transparent 43px, var(--margin) 43px, var(--margin) 45px, transparent 45px),
    repeating-linear-gradient(to bottom, transparent 0 39px, var(--rule) 39px 40px);
  background-position: 0 0, 0 50px; }

  background: radial-gradient(circle at 7px 7px, var(--bg) 0 4.5px, var(--line) 4.5px 5.5px, transparent 6px) 0 0 / 14px 30px repeat-y; }

.nb-line .tag { justify-self: start; font: 600 .7rem/1 var(--f-body); letter-spacing: .02em; padding: 5px 8px; border-radius: 6px; background: var(--surface-2); color: var(--ink); white-space: nowrap;
  animation: tag-in .45s cubic-bezier(.2, .8, .2, 1) backwards; }

/* ---------- Inicio simple y Registrar ---------- */

/* ---------- adaptadores de datos ---------- */
const LocalAdapter = {
  modo: 'local',
  _pend: false,
  // agrupa varias escrituras seguidas (una venta crea varias filas) en un solo guardado
  persistir() {
    if (this._pend || !S.negocio || S.negocio.id.startsWith('demo-')) return; // los ejemplos nunca se guardan
    this._pend = true;
    const id = S.negocio.id;
    queueMicrotask(() => { this._pend = false; if (S.negocio?.id === id) LS.set('miderno:data:' + id, { negocio: S.negocio, modulos: S.modulos, t: S.t, ...(id.startsWith('demo-') ? { version: DEMO_VERSION } : {}) }); });
  },
  insert() { this.persistir(); },
  insertMany() { this.persistir(); },
  update() { this.persistir(); },
  remove() { this.persistir(); },
  updateMany() { this.persistir(); },
  removeMany() { this.persistir(); },
  guardarNegocio() { this.persistir(); if (S.negocio.id.startsWith('demo-')) return; const idx = (LS.get('miderno:negocios') || []).map((n) => n.id === S.negocio.id ? { ...n, nombre: S.negocio.nombre, rubro: S.negocio.rubro } : n); LS.set('miderno:negocios', idx); },
  guardarModulo() { this.persistir(); },
};

const NubeAdapter = {
  modo: 'nube',
  sb: null,
  // las escrituras van en fila, en orden, para que una venta exista antes que sus ítems
  cola: Promise.resolve(),
  enviar(fn) {
    this.cola = this.cola.then(fn).then(({ error } = {}) => {
      if (error) { console.error(error); const dup = /duplicate|unique/i.test(error.message || '') && /slug/i.test(error.message || ''); toast(dup ? 'Esa dirección de página ya la usa otro negocio. Elige otra en Ajustes.' : 'No se pudo guardar en la nube: ' + (error.message || error), true); }
    }).catch((e) => toast('Sin conexión: el último cambio no se guardó (' + (e.message || e) + ')', true));
  },
  insert(t, row) { const nid = S.negocio.id; this.enviar(() => this.sb.from(t).insert({ ...row, negocio_id: nid })); },
  insertMany(t, rows) { const nid = S.negocio.id; for (let i = 0; i < rows.length; i += 500) { const parte = rows.slice(i, i + 500).map((r) => ({ ...r, negocio_id: nid })); this.enviar(() => this.sb.from(t).insert(parte)); } },
  update(t, id, patch) { this.enviar(() => this.sb.from(t).update(patch).eq('id', id)); },
  remove(t, id) { this.enviar(() => this.sb.from(t).delete().eq('id', id)); },
  // cambios en bloque: 200 filas por envío en vez de una por una
  updateMany(t, ids, patch) { for (let i = 0; i < ids.length; i += 200) { const parte = ids.slice(i, i + 200); this.enviar(() => this.sb.from(t).update(patch).in('id', parte)); } },
  removeMany(t, ids) { for (let i = 0; i < ids.length; i += 200) { const parte = ids.slice(i, i + 200); this.enviar(() => this.sb.from(t).delete().in('id', parte)); } },
  guardarNegocio(patch) { const nid = S.negocio.id; this.enviar(() => this.sb.from('negocios').update(patch).eq('id', nid)); },
  guardarModulo(modulo, activo) { const nid = S.negocio.id; this.enviar(() => this.sb.from('negocio_modulos').upsert({ negocio_id: nid, modulo, activo })); },
  async traerTodo(t) {
    const filas = []; const paso = 1000;
    for (let desde = 0; ; desde += paso) {
      const { data, error } = await this.sb.from(t).select('*').order('id').range(desde, desde + paso - 1);
      // si falta una tabla nueva (no se corrió la actualización), la app sigue funcionando sin ella
      if (error && (error.code === '42P01' || error.code === 'PGRST205' || /does not exist|could not find the table/i.test(error.message || ''))) { console.warn('Falta la tabla', t); this.faltan = [...new Set([...(this.faltan || []), t])]; return []; }
      if (error) throw error;
      filas.push(...data.map(({ negocio_id, ...r }) => r));
      if (data.length < paso) break;
    }
    return filas;
  },
};

let adapter = LocalAdapter;

const db = {
  all: (t) => S.t[t] || (S.t[t] = []),
  get: (t, id) => db.all(t).find((r) => r.id === id),
  insert(t, row) { row.id = row.id || uid(); db.all(t).push(row); adapter.insert(t, row); return row; },
  insertMany(t, rows) { rows.forEach((r) => { r.id = r.id || uid(); db.all(t).push(r); }); adapter.insertMany(t, rows); },
  update(t, id, patch) { const r = db.get(t, id); if (r) Object.assign(r, patch); adapter.update(t, id, patch); return r; },
  remove(t, id) { S.t[t] = db.all(t).filter((r) => r.id !== id); adapter.remove(t, id); },
  removeWhere(t, fn) { db.all(t).filter(fn).forEach((r) => db.remove(t, r.id)); },
  updateMany(t, ids, patch) { if (!ids.length) return; const set = new Set(ids); db.all(t).forEach((r) => { if (set.has(r.id)) Object.assign(r, patch); }); adapter.updateMany(t, ids, patch); },
  removeMany(t, ids) { if (!ids.length) return; const set = new Set(ids); S.t[t] = db.all(t).filter((r) => !set.has(r.id)); adapter.removeMany(t, ids); },
  negocio(patch) { Object.assign(S.negocio, patch); _fmt = null; adapter.guardarNegocio(patch); },
  modulo(m, activo) {
    S.modulos = activo ? [...new Set([...S.modulos, m])] : S.modulos.filter((x) => x !== m);
    adapter.guardarModulo(m, activo);
  },
};

/* ---------- cálculos de negocio ---------- */
function stockDe(tipo, id) { return sum(db.all('movimientos_stock').filter((m) => m.tipo_item === tipo && m.item_id === id), (m) => Number(m.cantidad)); }
function costoReceta(productoId) {
  return sum(db.all('formulas').filter((f) => f.producto_id === productoId), (f) => Number(f.cantidad) * Number(db.get('insumos', f.insumo_id)?.costo_unitario || 0));
}
function costoProducto(p) { return tiene('produccion') && db.all('formulas').some((f) => f.producto_id === p.id) ? costoReceta(p.id) : Number(p.costo || 0); }
function ventasDelMes(ym) { return db.all('ventas').filter((v) => mesDe(v.fecha) === ym); }
function gastosDelMes(ym) { return db.all('gastos').filter((g) => mesDe(g.fecha) === ym); }
function itemsDeVenta(ventaId) { return db.all('venta_items').filter((i) => i.venta_id === ventaId); }
function metaDelMes(ym) { return db.all('metas').find((m) => m.periodo === ym); }
function resumenClientes() {
  const map = new Map(db.all('clientes').map((c) => [c.id, { c, total: 0, visitas: 0, ultima: null }]));
  for (const v of db.all('ventas')) {
    const r = map.get(v.cliente_id); if (!r) continue;
    r.total += Number(v.total); r.visitas += 1;
    if (!r.ultima || v.fecha > r.ultima) r.ultima = v.fecha;
  }
  return [...map.values()].map((r) => ({ ...r, dias: r.ultima ? diasEntre(r.ultima, hoy()) : null }));
}
function eliminarVenta(id) {
  db.removeWhere('venta_items', (i) => i.venta_id === id);
  db.removeWhere('movimientos_stock', (m) => m.ref_id === id && m.motivo === 'venta');
  db.removeWhere('comisiones', (c) => c.venta_id === id);
  db.all('citas').filter((c) => c.venta_id === id).forEach((c) => db.update('citas', c.id, { venta_id: null, estado: 'confirmada' }));
  db.remove('ventas', id);
}

function rng(seed) {
  let a = seed >>> 0;
  const r = () => { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  r.int = (min, max) => Math.floor(r() * (max - min + 1)) + min;
  r.pick = (arr) => arr[Math.floor(r() * arr.length)];
  r.wpick = (pairs) => { const tot = sum(pairs, (p) => p[1]); let x = r() * tot; for (const [v, w] of pairs) { if ((x -= w) <= 0) return v; } return pairs[0][0]; };
  return r;
}

function cargando(on) {
  _cargas = Math.max(0, _cargas + (on ? 1 : -1));
  let b = document.getElementById('carga-barra');
  if (_cargas && !b) { b = document.createElement('div'); b.id = 'carga-barra'; b.setAttribute('role', 'progressbar'); b.setAttribute('aria-label', 'Cargando'); document.body.appendChild(b); }
  if (!_cargas && b) { b.classList.add('fin'); setTimeout(() => { if (!_cargas) b.remove(); }, 350); }
  else if (b) b.classList.remove('fin');
}

function partirTel(v) {
  const s = String(v || '').trim(); if (!s) return ['+56', ''];
  const d = '+' + s.replace(/\D/g, '');
  if (s.startsWith('+')) { const p = [...PREFIJOS].sort((a, b) => b[0].length - a[0].length).find(([c]) => d.startsWith(c)); if (p) return [p[0], d.slice(p[0].length)]; }
  if (/^56\d{9}$/.test(d.slice(1))) return ['+56', d.slice(3)];

}

// Palabras que reconocemos y lo que significan para el negocio
const PERFILES = [
  { re: /u[ñn]as|manicur|pedicur|nail|esmaltad/, nombre: 'salón de uñas', mods: ['servicios'], servicios: [['Manicure permanente', 60, 15000], ['Esmaltado tradicional', 40, 9000], ['Pedicure spa', 75, 20000], ['Uñas acrílicas', 120, 28000]] },

  { re: /pesta[ñn]|ceja|lifting|depila|estetic|facial|masaje|cosmetolog|\bspa\b/, nombre: 'estética', mods: ['servicios'], servicios: [['Lifting de pestañas', 60, 18000], ['Diseño de cejas', 30, 8000], ['Limpieza facial', 60, 25000], ['Masaje relajante', 60, 25000]] },

  { re: /clase|taller|curso|profesor|tutor|entrenad|yoga|pilates|personal trainer/, nombre: 'clases o talleres', mods: ['servicios'], servicios: [['Clase individual', 60, 15000], ['Clase grupal', 60, 8000]] },
  { re: /veterin|mascota|canin|grooming/, nombre: 'cuidado de mascotas', mods: ['servicios'], servicios: [['Baño y corte', 90, 20000], ['Consulta', 30, 15000]] },
  { re: /psicolog|nutricion|kinesio|terapia|consulta|podolog|dental|abogad|contador|asesor/, nombre: 'consulta profesional', mods: ['servicios'], servicios: [['Consulta', 60, 30000], ['Control', 30, 20000]] },
  { re: /\bvelas?\b|jab[oó]n|jabones|aromatic|cosm[eé]tica natural|difusor/, nombre: 'productos artesanales', mods: ['inventario', 'produccion'], productos: [['Vela aromática 200 g', 12990], ['Jabón artesanal', 4990]] },
  { re: /reposter|torta|pasteler|galleta|panader|cocina|comida|empanada|sushi|caf[eé]|helad|chocolat|cupcake|queque/, nombre: 'comida o repostería', mods: ['inventario', 'produccion'], productos: [['Torta mediana', 18000], ['Docena de galletas', 6000]] },
  { re: /ropa|polera|vestido|zapat|moda|bolso|cartera|accesorio|joya|bisuter/, nombre: 'tienda de ropa y accesorios', mods: ['inventario'], productos: [] },
  { re: /celular|tecnolog|electr[oó]nic|computador|notebook|audifono|telefon/, nombre: 'tienda de tecnología', mods: ['inventario'], productos: [] },
  { re: /almac[eé]n|minimarket|bazar|librer|juguet|botiller|ferreter|tienda/, nombre: 'tienda', mods: ['inventario'], productos: [] },
  { re: /vend[eo]|vendemos|venta de|productos?\b|stock|inventario|cat[aá]logo/, mods: ['inventario'] },
  { re: /fabric|hago|hacemos|elaboro|elaboramos|produzco|artesan|hecho a mano|a pedido/, mods: ['inventario', 'produccion'] },
  { re: /hora|agenda|cita|reserva|atiendo|atenci[oó]n|servicio/, mods: ['servicios'] },
];

function entenderNegocio(texto) {
  const t = norm(texto); if (!t) return { mods: [], nombres: [], servicios: [], productos: [] };
  const hits = PERFILES.filter((p) => p.re.test(t));
  const mods = [...new Set(hits.flatMap((h) => h.mods))];
  const servicios = hits.flatMap((h) => h.servicios || []).slice(0, 6);
  const productos = hits.flatMap((h) => h.productos || []).slice(0, 4);
  // si el texto menciona esmaltes, cremas, etc. junto a "vende", sugerimos ese producto
  const m = t.match(/vend[eo]\w* (?:tambien )?([a-z ]{3,30})/);
  if (m && mods.includes('inventario') && !productos.length) { const cosa = m[1].trim().split(' ').slice(0, 3).join(' '); if (cosa) productos.push([cosa.charAt(0).toUpperCase() + cosa.slice(1), 0]); }
  return { mods, nombres: hits.map((h) => h.nombre).filter(Boolean), servicios, productos };
}
const rubroTexto = (n) => { const r = RUBROS[n?.rubro]?.nombre || n?.rubro || ''; return r ? r.charAt(0).toUpperCase() + r.slice(1) : 'Mi negocio'; };

    <div class="field"><label>¿Qué vendes? <span class="muted" style="font-weight:400">Puedes marcar más de uno</span></label>
      <div class="que-vende">${QUE_VENDE.map((q) => `<label class="qv"><input type="checkbox" name="mod" value="${q.k}"><span><b>${q.label}</b><small>${q.desc}</small></span></label>`).join('')}</div></div>

    submit: (d) => enviarNegocio(modo, d),

  const form = $('#sheet-form'); const tocados = new Set();

    const box = $('#neg-entendido'); const sug = [...e.servicios.map((s) => s[0]), ...e.productos.map((p) => p[0])];
    box.hidden = !e.nombres.length && !sug.length;
    box.innerHTML = `${e.nombres.length ? `<p>Entendimos: <b>${esc(e.nombres.join(' + '))}</b>.</p>` : ''}${sug.length ? `<label class="hstack" style="margin-top:6px"><input type="checkbox" name="sugeridos" checked style="width:18px;height:18px;accent-color:var(--accent)"> Empezar con: ${sug.map((s) => `<span class="pill">${esc(s)}</span>`).join(' ')}</label><span class="small muted">Después cambias los precios en el catálogo.</span>` : ''}`;
  };

async function enviarNegocio(modo, d) {
  const form = $('#sheet-form');
  const modulos = [...form.querySelectorAll('input[name=mod]:checked')].map((c) => c.value);
  const e = entenderNegocio(d.rubro || '');
  const neg = { telefono: (d.telefono || '').trim(), nacimiento: d.nacimiento || '', nombre: d.nombre.trim(), rubro: (d.rubro || '').trim() || e.nombres.join(' + ') || 'Mi negocio', modulos, sugeridos: d.sugeridos ? { servicios: e.servicios, productos: e.productos } : null };
  if (!neg.nombre) return toast('Escribe el nombre del negocio', true);
  if (modo === 'cuenta') return registrarNube({ ...neg, email: d.email.trim(), password: d.password });
  if (modo === 'solo-nube') return crearNegocioNube(neg);

function datosExtra(d) {

function sembrarSugeridos(s) {

/* ---------- registro en la nube ---------- */
async function registrarNube(d) {
  try {
    if (!d.email || (d.password || '').length < 6) return toast('Escribe tu correo y una contraseña de al menos 6 caracteres', true);
    const sb = await cargarSupabase();
    const pendiente = { nombre: d.nombre, rubro: d.rubro, modulos: d.modulos, sugeridos: d.sugeridos, telefono: d.telefono, nacimiento: d.nacimiento };
    LS.set('miderno:pendiente', pendiente);
    const { data, error } = await sb.auth.signUp({ email: d.email, password: d.password, options: { emailRedirectTo: appUrl() || undefined, data: { negocio: pendiente } } });
    if (error) throw error;
    let session = data.session;
    if (!session) { const r = await sb.auth.signInWithPassword({ email: d.email, password: d.password }); session = r.data?.session; }
    if (session) return crearNegocioNube(pendiente);
    // Supabase pide confirmar el correo: el negocio queda guardado y se crea al volver
    abrirSheet('Revisa tu correo', `<p>Te enviamos un enlace a <b>${esc(d.email)}</b>. Al tocarlo vuelves a MiDerno y tu negocio <b>${esc(d.nombre)}</b> queda creado.</p><p class="small muted">Si no llega en unos minutos, revisa la carpeta de spam.</p>`, { pie: '<div class="sheet-foot"><button type="button" class="btn pri" data-close>Entendido</button></div>' });
  } catch (e) {
    const msg = /already registered|already exists/i.test(e.message || '') ? 'Ese correo ya tiene cuenta. Usa “Iniciar sesión”.' : 'No pudimos crear la cuenta: ' + (e.message || e);
    toast(msg, true);
  }
}
async function crearNegocioNube(d) {
  try {
    const sb = await cargarSupabase();
    const { error } = await sb.rpc('crear_negocio', { p_nombre: d.nombre, p_rubro: d.rubro, p_modulos: d.modulos || [] });
    if (error) throw error;
    LS.del('miderno:pendiente');
    cerrarSheet(); await abrirNube(); datosExtra(d); sembrarSugeridos(d.sugeridos); location.hash = 'catalogo';
    toast('¡Listo! Tu negocio quedó creado.');
  } catch (e) { toast('No pudimos crear el negocio: ' + (e.message || e), true); }
}

function head(titulo, eyebrow = '', acciones = '') {
  return `<div class="page-head"><div>${eyebrow ? `<div class="eyebrow">${eyebrow}</div>` : ''}<h1>${titulo}</h1></div>${acciones ? `<div class="actions">${acciones}</div>` : ''}</div>`;
}
function monthNav(act, ym) {
  return `<div class="monthnav"><button class="btn icon-btn" data-act="${act}" data-d="-1" aria-label="Mes anterior">${icon('left')}</button><strong>${nombreMes(ym)}</strong><button class="btn icon-btn" data-act="${act}" data-d="1" aria-label="Mes siguiente" ${ym >= mesActual() ? 'disabled' : ''}>${icon('right')}</button></div>`;
}

const pct = (a, b) => (b ? Math.round(((a - b) / b) * 100) : null);

function graficoMeses() {
  const meses = Array.from({ length: 6 }, (_, i) => addMonths(mesActual(), i - 5));
  const datos = meses.map((m) => ({ m, v: sum(ventasDelMes(m), (x) => Number(x.total)), g: sum(gastosDelMes(m), (x) => Number(x.monto)) }));
  const max = Math.max(1, ...datos.flatMap((d) => [d.v, d.g]));
  const paso = (() => { const raw = max / 4; const p = 10 ** Math.floor(Math.log10(raw)); return [1, 2, 2.5, 5, 10].map((k) => k * p).find((k) => k >= raw); })();
  const top = paso * Math.ceil(max / paso);
  const W = 640, Hh = 230, L = 58, B = 26, T = 10, R = 8; const ih = Hh - B - T; const cw = (W - L - R) / 6; const bw = Math.min(26, cw / 3.2);
  const y = (v) => T + ih - (v / top) * ih;
  const corto = (v) => (v >= 1e6 ? (v / 1e6).toLocaleString('es-CL', { maximumFractionDigits: 1 }) + ' M' : v >= 1e3 ? Math.round(v / 1e3) + ' mil' : String(v));
  let s = `<svg viewBox="0 0 ${W} ${Hh}" role="img" aria-label="Gráfico de ventas y egresos por mes">`;
  for (let v = 0; v <= top; v += paso) s += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end">$${corto(v)}</text>`;
  datos.forEach((d, i) => {
    const cx = L + cw * i + cw / 2; const actual = i === 5;
    s += `<rect x="${cx - bw - 2}" y="${y(d.v)}" width="${bw}" height="${Math.max(0, T + ih - y(d.v))}" rx="4" fill="var(--accent)" opacity="${actual ? 1 : .78}"><title>Ventas ${nombreMes(d.m)}: ${money(d.v)}</title></rect>`;
    s += `<rect x="${cx + 2}" y="${y(d.g)}" width="${bw}" height="${Math.max(0, T + ih - y(d.g))}" rx="4" fill="var(--gold)" opacity="${actual ? 1 : .78}"><title>Egresos ${nombreMes(d.m)}: ${money(d.g)}</title></rect>`;
    s += `<text x="${cx}" y="${Hh - 8}" text-anchor="middle" style="${actual ? 'font-weight:700;fill:var(--ink)' : ''}">${nombreMes(d.m, true).replace('.', '')}</text>`;
  });
  return s + '</svg>';
}

function cobrar() {

  if (c.evento_id) db.update('eventos', c.evento_id, { pagado: true, venta_id: v.id });
  if (c.entrega) db.insert('eventos', { tipo: 'entrega', titulo: c.lineas.map((l) => (l.cantidad > 1 ? qtyFmt(l.cantidad) + '× ' : '') + l.nombre).join(', '), cliente_id: c.cliente_id || null, fecha: c.entrega.fecha || hoy(), hora: c.entrega.hora || null, direccion: (c.entrega.direccion || '').trim(), monto: v.total, pagado: true, estado: 'pendiente', venta_id: v.id, nota: '' });

/* ---------- MOVIMIENTOS (caja) ---------- */
// Primero lo de hoy; con un toque se ve ayer, la semana, 15 días, el mes, otro mes o las fechas que quieras
const RANGOS = [['hoy', 'Hoy'], ['ayer', 'Ayer'], ['semana', 'Esta semana'], ['7d', '7 días'], ['15d', '15 días'], ['mes', 'Este mes'], ['mesant', 'Mes anterior'], ['mesSel', 'Por mes'], ['fechas', 'Elegir fechas']];
function rangoCaja(ui) {
  const H = hoy(); const dow = (new Date(H + 'T12:00:00').getDay() + 6) % 7; const finMes = (m) => `${m}-${pad(diasDelMes(m))}`;
  switch (ui.rango) {
    case 'ayer': { const a = addDays(H, -1); return [a, a, 'Ayer']; }
    case 'semana': return [addDays(H, -dow), H, 'Esta semana'];
    case '7d': return [addDays(H, -6), H, 'Últimos 7 días'];
    case '15d': return [addDays(H, -14), H, 'Últimos 15 días'];
    case 'mes': return [mesActual() + '-01', finMes(mesActual()), nombreMes(mesActual())];
    case 'mesant': { const m = addMonths(mesActual(), -1); return [m + '-01', finMes(m), nombreMes(m)]; }
    case 'mesSel': return [ui.mes + '-01', finMes(ui.mes), nombreMes(ui.mes)];
    case 'fechas': { const d = ui.desde || addDays(H, -6), h = ui.hasta || H; return d <= h ? [d, h, `${fechaCorta(d)} al ${fechaCorta(h)}`] : [h, d, `${fechaCorta(h)} al ${fechaCorta(d)}`]; }
    default: return [H, H, 'Hoy'];
  }
}
const nombreDia = (f) => f === hoy() ? 'Hoy' : f === addDays(hoy(), -1) ? 'Ayer' : fechaLarga(f).replace(/^./, (c) => c.toUpperCase());
function vistaCaja() {

  const cli = new Map(db.all('clientes').map((c) => [c.id, c.nombre]));
  const vs = db.all('ventas').filter((v) => enRango(v.fecha)); const gs = db.all('gastos').filter((g) => enRango(g.fecha));
  const coms = tiene('servicios') ? db.all('comisiones').filter((c) => enRango(c.fecha)) : [];
  const ing = sum(vs, (v) => Number(v.total)); const egr = sum(gs, (g) => Number(g.monto)); const com = sum(coms, (c) => Number(c.monto));
  const res = ing - egr - com;
  const movs = [
    ...(ui.filtro === 'egresos' ? [] : vs.map((v) => ({ f: v.fecha, tipo: 'in', id: v.id, monto: Number(v.total), t: itemsDeVenta(v.id).map((i) => (i.cantidad > 1 ? qtyFmt(i.cantidad) + '× ' : '') + i.nombre).join(', ') || 'Venta', s: [cli.get(v.cliente_id), metodoLabel(v.metodo_pago)].filter(Boolean).join(' · ') }))),
    ...(ui.filtro === 'ingresos' ? [] : gs.map((g) => ({ f: g.fecha, tipo: 'out', id: g.id, monto: Number(g.monto), t: g.descripcion || g.categoria, s: g.categoria }))),
  ].sort((a, b) => b.f.localeCompare(a.f));
  const dias = []; for (const m of movs) { const d = dias.at(-1); if (d && d.f === m.f) d.items.push(m); else dias.push({ f: m.f, items: [m] }); }
  const porMetodo = Object.keys(metodos()).map((k) => [metodoLabel(k), sum(vs.filter((v) => v.metodo_pago === k), (v) => Number(v.total))]).filter(([, v]) => v > 0);
  const porCat = [...new Set(gs.map((g) => g.categoria))].map((k) => [k, sum(gs.filter((g) => g.categoria === k), (g) => Number(g.monto))]).sort((a, b) => b[1] - a[1]);
  const esMes = ['mes', 'mesant', 'mesSel'].includes(ui.rango); const mesVista = ui.rango === 'mes' ? mesActual() : ui.rango === 'mesant' ? addMonths(mesActual(), -1) : ui.mes;
  const fila = (m) => `<div class="row mov-fila"><span class="mov-ico t-${m.tipo}">${icon(m.tipo === 'in' ? 'plus' : 'minus')}</span>
    <div class="grow"><div class="t" style="font-weight:500">${esc(m.t)}</div><div class="s">${esc(m.s || '')}</div></div>
    <b class="num ${m.tipo === 'in' ? 'up' : ''}" style="white-space:nowrap">${m.tipo === 'in' ? '+' : '−'}${money(m.monto)}</b>
    ${m.tipo === 'out' ? `<button class="btn sm ghost icon-btn" data-act="gasto" data-id="${m.id}" aria-label="Editar egreso">${icon('edit')}</button><button class="btn sm ghost icon-btn" data-act="del-gasto" data-id="${m.id}" aria-label="Eliminar egreso">${icon('trash')}</button>`

function partirNotas(n) {
  const general = [], fechadas = [];
  for (const l of String(n || '').split('\n')) { const m = l.match(/^\[(\d{4}-\d{2}-\d{2})\] (.*)$/); if (m) fechadas.push({ f: m[1], t: m[2] }); else general.push(l); }
  return { general: general.join('\n').trim(), fechadas: fechadas.sort((a, b) => b.f.localeCompare(a.f)) };
}
const unirNotas = (general, fechadas) => [general, ...fechadas.slice().sort((a, b) => a.f.localeCompare(b.f)).map((x) => `[${x.f}] ${x.t.replace(/\n/g, ' ')}`)].filter(Boolean).join('\n');

// muestra cuánto se gana por unidad mientras se escribe el precio
function lineaMargen(pv, costo) {
  if (!(pv > 0)) return '<span class="muted">Escribe el precio de venta para ver cuánto ganas.</span>';
  if (!(costo > 0)) return `<span class="muted">Agrega el costo para ver tu ganancia.</span>`;
  const g = pv - costo; const pct = Math.round((g / pv) * 100);
  return `Ganas <b class="num ${g < 0 ? 'down' : 'up'}">${money(g)}</b> por unidad <span class="pill ${pct >= 40 ? 'ok' : pct >= 20 ? 'warn' : 'bad'}">${pct}%</span>`;
}
function escucharMargen(selPv, selCosto, selOut, costoFijo) {
  const f = $('#sheet-form'); const out = $(selOut); if (!f || !out) return;
  const calc = () => { out.innerHTML = lineaMargen(num($(selPv)?.value), costoFijo ?? num($(selCosto)?.value)); };
  f.addEventListener('input', calc); calc();
}

// Compra: el usuario anota cuánto llegó y cuánto pagó en total; el costo por unidad sale solo
function camposCompra(unidad, costoActual) {
  return `<div class="form-row">${field(`Cantidad que llegó${unidad && unidad !== 'unidad' ? ' (' + esc(unidad) + ')' : ''}`, '<input class="in" id="f-cantidad" name="cantidad" inputmode="decimal" required placeholder="0">')}${field('Total pagado', '<input class="in" id="f-total" name="total" inputmode="numeric" placeholder="Opcional">')}</div>

}
function escucharCompra(unidad, costoActual) {
  const f = $('#sheet-form');
  const calc = () => {
    const cant = Number(String($('#f-cantidad').value).replace(',', '.')) || 0; const total = num($('#f-total').value);
    $('#compra-costo').innerHTML = cant > 0 && total > 0 ? `Costo por ${esc(unidad || 'unidad')}: <b class="num">${money(total / cant)}</b>${costoActual ? ` (antes ${money(costoActual)})` : ''}. Se usará en tus costos y recetas.` : `Costo actual: <b class="num">${money(costoActual || 0)}</b> por ${esc(unidad || 'unidad')}. Si anotas el total pagado, lo calculamos solo.`;

}
const leerCompra = (d) => { const cant = Number(String(d.cantidad).replace(',', '.')) || 0; const total = num(d.total); return { cant, total, unit: cant > 0 && total > 0 ? total / cant : 0 }; };

// Arma la receta de un producto (nuevo o existente) con varios insumos a la vez.
// Si falta un insumo se puede crear ahí mismo, sin salir del formulario.
function unidadesPara(base) {
  // unidades en que se puede escribir la cantidad de un insumo (la suya y las convertibles)
  const extra = Object.keys(CONVERSIONES).filter((k) => k.startsWith(norm(base) + '>')).map((k) => k.split('>')[1]).filter((u) => u !== 'g' && u !== norm(base));
  return [base, ...extra];
}
function filaReceta(ins) {
  return `<div class="rec-row">
    <select class="in rec-ins" aria-label="Insumo">${opt('', 'Elige un insumo…')}${ins.map((i) => opt(i.id, `${i.nombre} (${money(i.costo_unitario)} / ${i.unidad})`)).join('')}<option value="__nuevo">+ Insumo nuevo…</option></select>
    <input class="in rec-cant" inputmode="decimal" placeholder="Cantidad" aria-label="Cantidad por unidad">
    <select class="in rec-uni" aria-label="Unidad de medida">${unidades().map((u) => opt(u, u)).join('')}</select>
    <button type="button" class="btn icon-btn ghost rec-del" aria-label="Quitar fila">${icon('x')}</button>
    <div class="rec-nuevo" hidden>
      <input class="in rec-n-nombre" placeholder="Nombre del insumo" aria-label="Nombre del insumo nuevo">
      <input class="in rec-n-costo" inputmode="decimal" placeholder="Costo por unidad" aria-label="Costo por unidad de medida">
    </div>
  </div>`;
}
// precio sugerido según el margen que se quiere ganar, redondeado como precio de vitrina
const precioVitrina = (p) => (p >= 10000 ? Math.ceil(p / 1000) * 1000 - 10 : p >= 1000 ? Math.ceil(p / 100) * 100 - 10 : Math.ceil(p / 50) * 50);
function formReceta(prodId) {
  const sinReceta = db.all('productos').filter((p) => p.activo !== false && !db.all('formulas').some((f) => f.producto_id === p.id));
  const ins = [...db.all('insumos')].sort((a, b) => a.nombre.localeCompare(b.nombre));
  const sel = prodId || (sinReceta[0]?.id ?? '__nuevo');
  abrirSheet('Nueva receta', `<div class="form">
    ${field('¿Para qué producto?', `<select class="in" id="rec-prod">${sinReceta.map((p) => opt(p.id, p.nombre, sel)).join('')}<option value="__nuevo" ${sel === '__nuevo' ? 'selected' : ''}>+ Producto nuevo…</option></select>`)}
    <div id="rec-prod-nuevo" ${sel === '__nuevo' ? '' : 'hidden'}>${field('Nombre del producto', '<input class="in" id="rec-p-nombre" placeholder="Ej: Vela de coco 200 g">')}</div>
    <div class="field"><label>¿Qué lleva una unidad?</label><span class="hint" style="margin-top:-2px">Elige la medida que te acomode en cada fila: por ejemplo 180 gr aunque compres la cera por kilo.</span>
      <div class="stack" id="rec-filas">${filaReceta(ins)}${filaReceta(ins)}</div>
      <button type="button" class="btn sm" id="rec-mas" style="align-self:flex-start">${icon('plus')}Agregar otro insumo</button></div>
    <div class="banner" id="rec-resumen" style="background:var(--accent-soft)">Agrega los insumos para ver cuánto te cuesta hacer una unidad.</div>
    <div class="field" id="rec-precio-box"><label for="rec-p-precio">Precio de venta</label>
      <div class="chips" id="rec-sugerencias"></div>
      <input class="in" id="rec-p-precio" inputmode="numeric" placeholder="Escribe tu precio o elige una sugerencia" value="${sel !== '__nuevo' ? esc(db.get('productos', sel)?.precio_venta || '') : ''}">
      <span class="hint" id="rec-margen"></span></div>
  </div>`, {
    submit: () => guardarReceta(),
  });
  const form = $('#sheet-form');
  const ajustarUnidades = (r) => {
    const id = r.querySelector('.rec-ins').value; const selU = r.querySelector('.rec-uni');
    if (!id || id === '__nuevo') { if (selU.dataset.base) { selU.innerHTML = unidades().map((u) => opt(u, u)).join(''); delete selU.dataset.base; } return; }
    const i = db.get('insumos', id); if (selU.dataset.base === i.unidad) return;
    selU.innerHTML = unidadesPara(i.unidad).map((u) => opt(u, u, i.unidad)).join(''); selU.dataset.base = i.unidad;
  };
  const costoFila = (r) => {
    const id = r.querySelector('.rec-ins').value; const cant = Number(String(r.querySelector('.rec-cant').value).replace(',', '.')) || 0; const u = r.querySelector('.rec-uni').value;
    if (id === '__nuevo') return cant * (Number(String(r.querySelector('.rec-n-costo').value).replace(',', '.')) || 0);
    const i = db.get('insumos', id); if (!i) return 0;
    return cant * (u === i.unidad ? 1 : factorUnidad(u, i.unidad) || 1) * Number(i.costo_unitario || 0);
  };
  const recalcular = () => {
    let costo = 0;
    form.querySelectorAll('.rec-row').forEach((r) => { r.querySelector('.rec-nuevo').hidden = r.querySelector('.rec-ins').value !== '__nuevo'; ajustarUnidades(r); costo += costoFila(r); });
    const res = $('#rec-resumen'); const pv = num($('#rec-p-precio').value);
    res.innerHTML = costo ? `Hacer una unidad te cuesta <b class="num">${money(costo)}</b>` : 'Agrega los insumos para ver cuánto te cuesta hacer una unidad.';
    // solo se redibuja si cambió, para no perder el toque sobre un botón
    const sugHtml = costo ? [50, 60, 70].map((m) => { const p = precioVitrina(costo / (1 - m / 100)); return `<button type="button" class="chip rec-sug" data-p="${p}">Ganar ${m}% → <b class="num">${money(p)}</b></button>`; }).join('') : '';
    if ($('#rec-sugerencias').dataset.html !== sugHtml) { $('#rec-sugerencias').innerHTML = sugHtml; $('#rec-sugerencias').dataset.html = sugHtml; }
    $('#rec-sugerencias').querySelectorAll('.rec-sug').forEach((b) => b.classList.toggle('on', Number(b.dataset.p) === pv));
    $('#rec-margen').innerHTML = costo && pv ? `Con ${money(pv)} ganas <b class="num ${pv - costo < 0 ? 'down' : ''}">${money(pv - costo)}</b> por unidad (${Math.round(((pv - costo) / pv) * 100)}% del precio).` : costo ? 'Elige una sugerencia o escribe tu propio precio.' : '';
  };
  form.addEventListener('input', recalcular);
  form.addEventListener('change', (e) => {
    if (e.target.id === 'rec-prod') { $('#rec-prod-nuevo').hidden = e.target.value !== '__nuevo'; $('#rec-p-precio').value = e.target.value !== '__nuevo' ? db.get('productos', e.target.value)?.precio_venta || '' : ''; }
    recalcular();
  });
  form.addEventListener('click', (e) => {
    if (e.target.closest('#rec-mas')) { $('#rec-filas').insertAdjacentHTML('beforeend', filaReceta(ins)); }
    const del = e.target.closest('.rec-del'); if (del) { if (form.querySelectorAll('.rec-row').length > 1) del.closest('.rec-row').remove(); recalcular(); }
    const sug = e.target.closest('.rec-sug'); if (sug) { $('#rec-p-precio').value = sug.dataset.p; formatearMonto($('#rec-p-precio'), false); recalcular(); }
  });
  recalcular();
}
function guardarReceta() {
  const form = $('#sheet-form'); let prodId = $('#rec-prod').value; const precio = num($('#rec-p-precio').value);
  if (prodId === '__nuevo' && !$('#rec-p-nombre').value.trim()) return toast('Escribe el nombre del producto', true);
  const lineas = [];
  for (const r of form.querySelectorAll('.rec-row')) {
    const id = r.querySelector('.rec-ins').value; const cant = Number(String(r.querySelector('.rec-cant').value).replace(',', '.')) || 0; const u = r.querySelector('.rec-uni').value;
    if (!id && !cant) continue;
    if (!id) return toast('Elige el insumo de cada fila', true);
    if (cant <= 0) return toast('Escribe cuánto lleva de cada insumo', true);
    if (id === '__nuevo') {
      const nombre = r.querySelector('.rec-n-nombre').value.trim(); if (!nombre) return toast('Escribe el nombre del insumo nuevo', true);
      lineas.push({ nuevo: { nombre, unidad: u, costo_unitario: Number(String(r.querySelector('.rec-n-costo').value).replace(',', '.')) || 0, stock_minimo: 0 }, cant });
    } else {
      // la cantidad se guarda en la unidad del insumo (180 gr de una cera en kg = 0,18 kg)
      const i = db.get('insumos', id); const f = u === i.unidad ? 1 : factorUnidad(u, i.unidad) || 1;
      lineas.push({ id, cant: Math.round(cant * f * 10000) / 10000 });
    }
  }
  if (!lineas.length) return toast('Agrega al menos un insumo', true);
  const ids = lineas.map((l) => l.id).filter(Boolean); if (new Set(ids).size !== ids.length) return toast('Hay un insumo repetido en la receta', true);
  if (!(precio > 0)) return toast('Elige una sugerencia o escribe el precio de venta', true);
  if (prodId === '__nuevo') prodId = db.insert('productos', { nombre: $('#rec-p-nombre').value.trim(), sku: '', precio_venta: precio, costo: 0, stock_minimo: 0, activo: true }).id;
  else if (Number(db.get('productos', prodId).precio_venta) !== precio) db.update('productos', prodId, { precio_venta: precio });
  for (const l of lineas) {
    const insumoId = l.id || db.insert('insumos', l.nuevo).id;
    db.insert('formulas', { producto_id: prodId, insumo_id: insumoId, cantidad: l.cant });
  }
  const p = db.get('productos', prodId);
  cerrarSheet(); S.ui.prod.tab = 'recetas'; toast(`Receta guardada: ${p.nombre} cuesta ${money(costoReceta(prodId))} y se vende a ${money(p.precio_venta)}`); render();
}

/* ---------- cambio de unidad (kg ↔ gr, lt ↔ ml, mt ↔ cm) ---------- */
const CONVERSIONES = { 'kg>gr': 1000, 'gr>kg': 0.001, 'lt>ml': 1000, 'ml>lt': 0.001, 'mt>cm': 100, 'cm>mt': 0.01, 'kg>g': 1000, 'g>kg': 0.001, 'gr>g': 1, 'g>gr': 1 };
const factorUnidad = (de, a) => CONVERSIONES[`${norm(de)}>${norm(a)}`] || 0;
function convertirInsumo(id, f) {
  db.all('movimientos_stock').filter((m) => m.tipo_item === 'insumo' && m.item_id === id).forEach((m) => db.update('movimientos_stock', m.id, { cantidad: Math.round(Number(m.cantidad) * f * 1000) / 1000 }));
  db.all('formulas').filter((x) => x.insumo_id === id).forEach((x) => db.update('formulas', x.id, { cantidad: Math.round(Number(x.cantidad) * f * 10000) / 10000 }));
}

const fechaConAnio = (f) => fechaCorta(f) + (String(f).slice(0, 4) !== hoy().slice(0, 4) ? ' ' + String(f).slice(0, 4) : '');
const MOTIVOS_TXT = { venta: 'venta', compra: 'ingreso', produccion: 'producción', ajuste: 'ajuste', consumo: 'consumo' };
// dos columnas: cuándo y qué fue el último movimiento, y cuánto entró o salió
function celdasMov(tipo, id) {
  const ms = db.all('movimientos_stock').filter((m) => m.tipo_item === tipo && m.item_id === id);
  if (!ms.length) return '<td class="small muted">—</td><td class="n muted">—</td>';
  const un = tipo === 'insumo' ? ' ' + (db.get('insumos', id)?.unidad || '') : '';
  const u = ms.reduce((a, b) => (b.fecha > a.fecha ? b : a)); const c = qtyFmt(Math.abs(u.cantidad)) + un;
  const que = { venta: `se vendieron ${c}`, compra: `entraron ${c}`, produccion: `se fabricaron ${c}`, consumo: `se usaron ${c}`, ajuste: u.cantidad > 0 ? `ajuste: +${c}` : `ajuste: −${c}` }[u.motivo] || c;
  // última entrada: la cantidad que llegó (compra o producción), siempre en positivo
  const ent = ms.filter((m) => m.cantidad > 0 && (m.motivo === 'compra' || m.motivo === 'produccion')).reduce((a, b) => (!a || b.fecha > a.fecha ? b : a), null);
  return `<td class="small" style="white-space:nowrap">${fechaConAnio(u.fecha)}<div class="muted">${que}</div></td><td class="n small" style="white-space:nowrap">${ent ? `<b class="num">${qtyFmt(ent.cantidad)}${esc(un)}</b><div class="muted">${fechaConAnio(ent.fecha)}</div>` : '<span class="muted">—</span>'}</td>`;
}

const ESTADOS_CITA = { solicitada: ['Por confirmar', 'warn'], agendada: ['Agendada', ''], confirmada: ['Confirmada', 'acc'], completada: ['Pagada', 'ok'], no_asistio: ['No vino', 'bad'], cancelada: ['Cancelada', 'bad'], rechazada: ['Rechazada', 'bad'] };
const ESTADOS_EV = { pendiente: ['Pendiente', ''], entregada: ['Entregada', 'ok'], hecha: ['Hecha', 'ok'], cancelada: ['Cancelada', 'bad'] };
const INACTIVOS = ['cancelada', 'rechazada', 'no_asistio'];
const DIAS_CORTOS = ['lun', 'mar', 'mié', 'jue', 'vie', 'sáb', 'dom'];
const lunesDe = (iso) => { const d = new Date(iso + 'T12:00:00'); const dow = (d.getDay() + 6) % 7; return addDays(iso, -dow); };
const mapsLink = (dir) => `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(dir)}`;

function itemsDelDia(f, emp = S.ui.agenda.emp) {

const KIND = { cita: { label: 'Cita', cls: 'k-cita' }, entrega: { label: 'Entrega', cls: 'k-entrega' }, tarea: { label: 'Recordatorio', cls: 'k-tarea' } };

}

function agendaDia() {
  const ui = S.ui.agenda; const items = itemsDelDia(ui.fecha);
  const semana = Array.from({ length: 7 }, (_, i) => addDays(ui.fecha, i - 3));
  const esperado = sum(items.filter((i) => i.kind === 'cita' && enAgenda(i)), (i) => Number(i.s?.precio || 0)) + sum(items.filter((i) => i.kind === 'entrega' && enAgenda(i) && !i.ref.pagado), (i) => Number(i.ref.monto || 0));
  return `<div class="chips scroll" aria-label="Días cercanos">${semana.map((f) => `<button class="chip ${f === ui.fecha ? 'on' : ''}" data-act="ag-set" data-f="${f}">${new Date(f + 'T12:00:00').toLocaleDateString('es-CL', { weekday: 'short', day: 'numeric' })} · ${itemsDelDia(f).filter(enAgenda).length}</button>`).join('')}</div>
  <div class="card"><div class="card-head"><h2>${items.filter(enAgenda).length} en agenda</h2>${esperado ? `<p class="num">${money(esperado)} por cobrar</p>` : ''}</div>
    <div class="list">${items.length ? items.map(filaAgenda).join('') : `<div class="empty">Página en blanco. Toca <b>Agendar</b> para anotar una hora, una entrega o un recordatorio.</div>`}</div></div>`;
}

function filaAgenda(i) {
  const r = i.ref; const k = KIND[i.kind];
  const [est, cls] = (i.kind === 'cita' ? ESTADOS_CITA : ESTADOS_EV)[i.estado] || ['', ''];
  const abierta = enAgenda(i) && !['completada', 'entregada', 'hecha'].includes(i.estado);
  const acciones = [];
  const tel = i.cl?.telefono;
  if (i.kind === 'cita') {
    if (abierta && tel) acciones.push(`<a class="btn sm" target="_blank" rel="noopener" href="${waLink(tel, msg('recordatorio', { nombre: primerNombre(i.cl.nombre), servicio: i.s?.nombre || 'atención', fecha: fechaLarga(r.fecha), hora: hhmm(r.hora) }))}">${icon('chat')}Recordar</a>`);
    if (i.estado === 'solicitada' && tel && cfg().abono?.activo) acciones.push(`<a class="btn sm" target="_blank" rel="noopener" href="${waLink(tel, msgAbono(r, i.cl, i.s))}">Pedir abono</a>`);
    if (i.estado === 'solicitada') acciones.push(`<button class="btn sm" data-act="cita-estado" data-id="${r.id}" data-e="rechazada">Rechazar</button><button class="btn sm pri" data-act="confirmar-reserva" data-id="${r.id}">Confirmar</button>`);
    else if (abierta) acciones.push(`${i.estado === 'agendada' ? `<button class="btn sm" data-act="cita-estado" data-id="${r.id}" data-e="confirmada">Confirmar</button>` : ''}<button class="btn sm" data-act="cita-estado" data-id="${r.id}" data-e="no_asistio">No vino</button><button class="btn sm pri" data-act="cita-cobrar" data-id="${r.id}">Cobrar</button>`);
    acciones.push(`<button class="btn sm ghost" data-act="cita" data-id="${r.id}" aria-label="Editar">${icon('edit')}</button>`);
  } else if (i.kind === 'entrega') {
    if (abierta && tel) acciones.push(`<a class="btn sm" target="_blank" rel="noopener" href="${waLink(tel, msg('entrega', { nombre: primerNombre(i.cl.nombre), pedido: r.titulo || '', fecha: fechaLarga(r.fecha), hora: hhmm(r.hora), hora_txt: r.hora ? ' cerca de las ' + hhmm(r.hora) : '', direccion: r.direccion || '', monto: money(r.monto) }))}">${icon('chat')}Avisar</a>`);
    if (r.direccion) acciones.push(`<a class="btn sm" target="_blank" rel="noopener" href="${mapsLink(r.direccion)}">Mapa</a>`);
    if (abierta && !r.pagado && Number(r.monto)) acciones.push(`<button class="btn sm" data-act="ev-cobrar" data-id="${r.id}">Cobrar</button>`);
    if (abierta) acciones.push(`<button class="btn sm pri" data-act="ev-estado" data-id="${r.id}" data-e="entregada">Entregada</button>`);
    acciones.push(`<button class="btn sm ghost" data-act="evento" data-id="${r.id}" aria-label="Editar">${icon('edit')}</button>`);
  } else {
    if (abierta) acciones.push(`<button class="btn sm pri" data-act="ev-estado" data-id="${r.id}" data-e="hecha">Hecho</button>`);
    acciones.push(`<button class="btn sm ghost" data-act="evento" data-id="${r.id}" aria-label="Editar">${icon('edit')}</button>`);
  }
  const monto = i.kind === 'cita' ? (i.s ? money(i.s.precio) : '') : i.kind === 'entrega' && Number(r.monto) ? `${money(r.monto)}${r.pagado ? ' · pagado' : ''}` : '';
  return `<div class="row ag-row ${k.cls}" style="flex-wrap:wrap">
    <div class="ag-hora num"><b>${i.hora || '—'}</b><div class="small muted">${k.label}</div></div>
    <div class="grow"><div class="t">${esc(i.titulo)}</div><div class="s">${esc(i.sub)}${monto ? ` · ${monto}` : ''}</div></div>
    <span class="pill ${cls}">${est}</span>
    <div class="hstack">${acciones.join('')}</div></div>`;
}

function chipAgenda(i) {
  return `<button class="ag-chip ${KIND[i.kind].cls} ${enAgenda(i) ? '' : 'off'} ${i.estado === 'solicitada' ? 'req' : ''}" data-act="${i.kind === 'cita' ? 'cita' : 'evento'}" data-id="${i.id}" title="${esc(KIND[i.kind].label + ': ' + i.titulo)}"><span class="num">${i.hora || '•'}</span> ${esc(i.titulo)}</button>`;
}
function agendaSemana() {
  const ui = S.ui.agenda; const l = lunesDe(ui.fecha);
  return `<div class="week">${Array.from({ length: 7 }, (_, d) => {
    const f = addDays(l, d); const items = itemsDelDia(f);
    return `<div class="week-day ${f === hoy() ? 'today' : ''}"><button class="week-head" data-act="ag-ir-dia" data-f="${f}"><span>${DIAS_CORTOS[d]}</span><b>${Number(f.slice(8))}</b></button>
      <div class="stack" style="gap:4px">${items.length ? items.map(chipAgenda).join('') : '<span class="small muted" style="padding:2px 4px">—</span>'}</div></div>`;
  }).join('')}</div>`;
}
function agendaMes() {
  const ui = S.ui.agenda; const ym = mesDe(ui.fecha); const ini = lunesDe(ym + '-01');
  const ultimo = `${ym}-${pad(diasDelMes(ym))}`; const semanas = Math.ceil((diasEntre(ini, ultimo) + 1) / 7);
  return `<div class="card month-wrap"><div class="month">${DIAS_CORTOS.map((d) => `<div class="month-dow">${d}</div>`).join('')}
    ${Array.from({ length: semanas * 7 }, (_, k) => {
      const f = addDays(ini, k); const items = itemsDelDia(f).filter(enAgenda); const fuera = mesDe(f) !== ym;
      const kinds = ['cita', 'entrega', 'tarea'].filter((x) => items.some((i) => i.kind === x));
      return `<button class="month-cell ${fuera ? 'out' : ''} ${f === hoy() ? 'today' : ''}" data-act="ag-ir-dia" data-f="${f}" aria-label="${fechaLarga(f)}: ${items.length} en agenda">
        <span class="month-num">${Number(f.slice(8))}</span>
        <span class="month-items">${items.slice(0, 3).map((i) => `<span class="m-item ${KIND[i.kind].cls}">${i.hora ? i.hora + ' ' : ''}${esc(i.titulo)}</span>`).join('')}${items.length > 3 ? `<span class="m-more">+${items.length - 3} más</span>` : ''}</span>
        ${items.length ? `<span class="month-dots">${kinds.map((x) => `<i class="${KIND[x].cls}"></i>`).join('')}<small>${items.length}</small></span>` : ''}
      </button>`;
    }).join('')}</div>
    <div class="legend" style="margin-top:10px">${tiene('servicios') ? '<span><i class="k-cita"></i>Citas</span>' : ''}<span><i class="k-entrega"></i>Entregas</span><span><i class="k-tarea"></i>Recordatorios</span></div></div>`;
}

function elegirAgendar() {

    tiene('servicios') && ['cita', 'cal', 'Hora para un cliente', 'Un servicio con fecha, hora y quién atiende'],
    ['entrega', 'box', 'Entrega o pedido', 'Despacho o retiro con dirección y monto'],

function formCita(id, pre = {}) {

  const c = id ? db.get('citas', id) : { cliente_id: '', servicio_id: '', empleado_id: ui.emp !== 'todos' ? ui.emp : '', fecha: ui.fecha || hoy(), hora: '10:00', estado: 'agendada', nota: '', ...pre };

    ${field('Servicio', `<select class="in" name="servicio_id" id="f-servicio_id">${servs.map((s) => opt(s.id, `${s.nombre} · ${money(s.precio)}`, c.servicio_id)).join('')}</select>`)}
    ${emps.length ? field('Atiende', `<select class="in" name="empleado_id" id="f-empleado_id">${opt('', 'Sin asignar', c.empleado_id)}${emps.map((e) => opt(e.id, e.nombre, c.empleado_id)).join('')}</select>`) : ''}
    <div class="form-row">${field('Fecha', input('fecha', c.fecha, 'type="date" required'))}${field('Hora', input('hora', hhmm(c.hora), 'type="time" step="900" required'))}</div>
    ${id ? field('Estado', `<select class="in" name="estado" id="f-estado">${Object.entries(ESTADOS_CITA).map(([k, [l]]) => opt(k, l, c.estado)).join('')}</select>`) : ''}
    ${field('Nota', input('nota', c.nota || '', 'placeholder="Opcional"'))}</div>`, {

      const choque = d.empleado_id && db.all('citas').find((x) => x.id !== id && x.empleado_id === d.empleado_id && x.fecha === d.fecha && !INACTIVOS.includes(x.estado)
        && m(x.hora) < m(d.hora) + dur && m(d.hora) < m(x.hora) + Number(db.get('servicios', x.servicio_id)?.duracion_min || 60));
      if (choque) return toast(`Esa persona ya tiene una hora a las ${hhmm(choque.hora)} que se cruza`, true);
      const row = { cliente_id: d.cliente_id, servicio_id: d.servicio_id, empleado_id: d.empleado_id || null, fecha: d.fecha, hora: d.hora, nota: d.nota.trim(), ...(d.estado ? { estado: d.estado } : {}) };
      id ? db.update('citas', id, row) : db.insert('citas', { ...row, estado: 'agendada', venta_id: null });

    },

/* ---------- EQUIPO ---------- */
function vistaEquipo() {
  const ui = S.ui.equipo; ui.mes ||= mesActual();
  const todos = db.all('empleados');
  const items = db.all('venta_items').filter((i) => i.empleado_id); const ventaMes = new Map(ventasDelMes(ui.mes).map((v) => [v.id, v]));
  const filas = todos.map((e) => {
    const its = items.filter((i) => i.empleado_id === e.id && ventaMes.has(i.venta_id));
    const coms = db.all('comisiones').filter((c) => c.empleado_id === e.id && mesDe(c.fecha) === ui.mes);
    return { e, n: sum(its, (i) => Number(i.cantidad)), vendido: sum(its, (i) => i.cantidad * i.precio_unitario), com: sum(coms, (c) => Number(c.monto)), pend: sum(coms.filter((c) => !c.pagada), (c) => Number(c.monto)) };
  });
  // quienes ya no están solo aparecen si ese mes tuvieron movimiento
  const visibles = filas.filter((f) => f.e.activo !== false || f.n || f.com);
  const totV = sum(filas, (f) => f.vendido); const totC = sum(filas, (f) => f.com);
  return `${head('Equipo', 'Servicios', `${monthNav('eq-mes', ui.mes)}<button class="btn pri" data-act="empleado">${icon('plus')}Agregar persona</button>`)}
  <div class="grid g3">
    <div class="card kpi"><span class="lbl">Servicios del equipo</span><span class="val">${money(totV)}</span><span class="sub">${qtyFmt(sum(filas, (f) => f.n))} atenciones</span></div>
    <div class="card kpi"><span class="lbl">Comisiones del mes</span><span class="val">${money(totC)}</span><span class="sub">${money(sum(filas, (f) => f.pend))} por pagar</span></div>
    <div class="card kpi"><span class="lbl">Queda para el local</span><span class="val">${money(totV - totC)}</span><span class="sub">${totV ? Math.round(((totV - totC) / totV) * 100) : 0}% de lo atendido</span></div>
  </div>
  ${tarjetaAccesos(todos)}
  <div class="card"><div class="tbl-wrap">${visibles.length ? `<table><thead><tr><th>Persona</th><th class="n">Comisión</th><th class="n">Atenciones</th><th class="n">Vendido</th><th class="n">Le corresponde</th><th class="n">Por pagar</th><th></th></tr></thead><tbody>${visibles.map((f) => `<tr>
      <td><div class="hstack" style="flex-wrap:nowrap"><div class="avatar">${esc(iniciales(f.e.nombre))}</div><div><b>${esc(f.e.nombre)}</b>${f.e.activo === false ? '<div class="small muted">Ya no está en el equipo</div>' : ''}</div></div></td>
      <td class="n">${qtyFmt(f.e.pct_comision)}%</td><td class="n">${qtyFmt(f.n)}</td><td class="n">${money(f.vendido)}</td><td class="n"><b>${money(f.com)}</b></td>
      <td class="n">${f.pend ? `<span class="pill warn">${money(f.pend)}</span>` : '<span class="pill ok">Al día</span>'}</td>
      <td class="n" style="white-space:nowrap">${f.pend ? `<button class="btn sm" data-act="pagar-com" data-id="${f.e.id}">Marcar pagado</button>` : ''}<button class="btn sm ghost" data-act="empleado" data-id="${f.e.id}" aria-label="Editar o eliminar">${icon('edit')}</button></td></tr>`).join('')}</tbody></table>` : '<div class="empty">Agrega a las personas que atienden para calcular sus comisiones automáticamente.</div>'}</div>
    <p class="small muted" style="margin-top:10px">Arriba, en <b>Accesos del equipo</b>, creas el usuario de cada persona para que vea sus horas y lo que lleva en el mes. La comisión se calcula sobre cada servicio cobrado. Si cambias el porcentaje de alguien, se recalcula lo que aún no le pagas; lo ya pagado no cambia.</p></div>`;
}
function formEmpleado(id) {

// Ajusta las comisiones que aún no se pagan al nuevo porcentaje
function recalcularComisiones(empId, antes, ahora) {
  const pend = db.all('comisiones').filter((c) => c.empleado_id === empId && !c.pagada);
  for (const c of pend) {
    const it = db.get('venta_items', c.venta_item_id);
    const base = it ? Number(it.cantidad) * Number(it.precio_unitario) : (antes ? Number(c.monto) * 100 / antes : 0);
    db.update('comisiones', c.id, { monto: Math.round(base * ahora / 100) });
  }
  return pend.length;
}
function eliminarEmpleado(id) {
  const e = db.get('empleados', id);
  const pend = sum(db.all('comisiones').filter((c) => c.empleado_id === id && !c.pagada), (c) => Number(c.monto));
  const historial = db.all('comisiones').some((c) => c.empleado_id === id) || db.all('venta_items').some((i) => i.empleado_id === id);
  const futuras = db.all('citas').filter((c) => c.empleado_id === id && c.fecha >= hoy() && !INACTIVOS.includes(c.estado) && c.estado !== 'completada');
  const texto = `Se quitará a <b>${esc(e.nombre)}</b> del equipo.${pend ? ` Aún tiene <b>${money(pend)}</b> en comisiones por pagar; seguirán apareciendo hasta que las marques pagadas.` : ''}${futuras.length ? ` Sus ${futuras.length} horas agendadas quedarán sin asignar.` : ''}${historial ? ' Su historial de ventas se mantiene.' : ''}`;
  confirmar(texto, () => {
    futuras.forEach((c) => db.update('citas', c.id, { empleado_id: null }));
    if (historial) db.update('empleados', id, { activo: false }); else db.remove('empleados', id);

  });
}

function leerCSV(texto) {

    if (comillas) { if (c === '"') { if (texto[i + 1] === '"') { celda += '"'; i++; } else comillas = false; } else celda += c; continue; }

async function abrirArchivo(file) {
  if (!file) return;
  try {
    const nombre = file.name; const ext = nombre.split('.').pop().toLowerCase();
    if (ext === 'xls') return toast('Ese es el formato antiguo de Excel. Ábrelo y guárdalo como .xlsx (Libro de Excel) o CSV.', true);
    toast('Leyendo ' + nombre + '…'); cargando(true);
    let hojas;
    if (ext === 'csv' || ext === 'txt') hojas = [{ nombre: nombre.replace(/\.[^.]+$/, ''), filas: leerCSV(await file.text()) }];
    else hojas = await leerXLSX(await file.arrayBuffer());
    hojas = hojas.filter((h) => h.filas.some((f) => f.some((c) => String(c ?? '').trim())));
    if (!hojas.length) return toast('El archivo está vacío', true);
    // el año de los meses sin año ("Enero") se toma de las fechas que trae el archivo
    const anios = hojas.flatMap((h) => h.filas.flat()).map((c) => (typeof c === 'number' && c > 30000 && c < 60000 ? parseFecha(c) : typeof c === 'string' && /\d{4}/.test(c) ? parseFecha(c) : null)).filter(Boolean).map((f) => f.slice(0, 4));
    // si no hay fechas, se mira el nombre de la hoja o del archivo ("Resumen 2025", "ventas_2024.xlsx")
    if (!anios.length) [nombre, ...hojas.map((h) => h.nombre)].forEach((x) => { const y = String(x).match(/(?:^|\D)(20\d{2})(?:\D|$)/); if (y) anios.push(y[1]); });
    ANIO_IMPORT = anios.length ? Number(Object.entries(anios.reduce((a, y) => ((a[y] = (a[y] || 0) + 1), a), {})).sort((a, b) => b[1] - a[1])[0][0]) : Number(hoy().slice(0, 4));
    S.imp = { archivo: nombre, hojas: hojas.map((h) => analizarHoja(h.nombre, h.filas)) };
    const reconocidas = S.imp.hojas.filter((h) => h.tipo !== 'ninguno').length;
    render(); toast(reconocidas ? `Reconocimos ${reconocidas} de ${hojas.length} hoja${hojas.length > 1 ? 's' : ''}. Revisa y confirma.` : 'No reconocimos las hojas. Elige qué contiene cada una.');
  } catch (e) { console.error(e); toast('No pudimos leer el archivo: ' + (e.message || e), true); }
  finally { cargando(false); }
}

/* ---------- guardar ---------- */
function importarTodo() {
  const cont = { clientes: 0, productos: 0, servicios: 0, insumos: 0, ventas: 0, gastos: 0, actualizados: 0, repetidos: 0, movidos: 0 };
  const avisos = []; const H = hoy();
  const clientePorNombre = new Map(db.all('clientes').map((c) => [norm(c.nombre), c]));
  const clientePorTel = new Map(db.all('clientes').filter((c) => c.telefono).map((c) => [telLimpio(c.telefono), c]));
  const porNombre = (t) => new Map(db.all(t).map((x) => [norm(x.nombre), x]));
  const lotes = { ventas: [], venta_items: [], movimientos_stock: [], gastos: [], clientes: [] };
  const buscarCliente = (nombre) => {
    if (!nombre) return null; const k = norm(nombre); let c = clientePorNombre.get(k);
    if (!c) { c = { id: uid(), nombre: nombre.trim(), telefono: '', cumpleanos: null, notas: '', creado_en: H }; lotes.clientes.push(c); clientePorNombre.set(k, c); cont.clientes++; }
    return c;
  };
  const ajustarStock = (tipo, item, deseado) => {
    if (deseado == null) return; const dif = deseado - stockDe(tipo, item.id) - sum(lotes.movimientos_stock.filter((m) => m.item_id === item.id), (m) => m.cantidad);
    if (dif) lotes.movimientos_stock.push({ id: uid(), tipo_item: tipo, item_id: item.id, cantidad: dif, motivo: 'ajuste', ref_id: null, fecha: H, nota: 'Importado desde Excel' });
  };
  const firmaV = (fecha, total, nombre, cli) => [fecha, Math.round(total), norm(nombre), cli || ''].join('|');
  // repetidos: se cuentan las veces que ya existe cada fila, así dos atenciones iguales el mismo día no se pierden,
  // pero si subes el mismo archivo dos veces no se duplica nada
  const contar = (arr) => arr.reduce((m, k) => m.set(k, (m.get(k) || 0) + 1), new Map());
  const vEx = contar(db.all('ventas').map((v) => firmaV(v.fecha, v.total, itemsDeVenta(v.id)[0]?.nombre, v.cliente_id)));
  const gEx = contar(db.all('gastos').map((g) => [g.fecha, Math.round(g.monto), norm(g.descripcion)].join('|')));
  const vVistos = new Map(), gVistos = new Map();
  const repetida = (ex, vistos, k) => { const n = vistos.get(k) || 0; vistos.set(k, n + 1); return n < (ex.get(k) || 0); };
  IMP_NUEVOS.cats.clear(); IMP_NUEVOS.metodos.clear();
  const registrarIngreso = (o, det, monto, cant) => {
    const item = buscarEnCatalogo(det);
    // en servicios el ingreso va con su cliente: de la columna Cliente o, si no hay, del mismo detalle ("Manicure Paula Rojas")
    const nombreCli = o.cliente || clienteEnDetalle(det, item);
    const cli = buscarCliente(nombreCli); const nombre = item?.x.nombre || det || 'Venta';
    const f = firmaV(o.fecha, monto, nombre, cli?.id); if (repetida(vEx, vVistos, f)) { cont.repetidos++; return; }
    const v = { id: uid(), fecha: o.fecha, cliente_id: cli?.id || null, total: monto, metodo_pago: parseMetodo(o.metodo_pago), canal: 'local', nota: monto ? 'Importado desde Excel' : 'Importado desde Excel (sin cobro: ' + (o.metodo_pago || 'giftcard') + ')' };
    lotes.ventas.push(v);
    lotes.venta_items.push({ id: uid(), venta_id: v.id, tipo_item: item ? item.tipo : 'libre', item_id: item?.x.id || null, nombre, cantidad: cant, precio_unitario: Math.round((monto / cant) * 100) / 100, empleado_id: null });
    cont.ventas++;
  };
  const registrarGasto = (o, det, monto) => {
    const k = [o.fecha, Math.round(monto), norm(det)].join('|'); if (repetida(gEx, gVistos, k)) { cont.repetidos++; return; }
    lotes.gastos.push({ id: uid(), fecha: o.fecha, categoria: parseCategoria(o.categoria, det), monto, descripcion: det || o.categoria || '' });
    cont.gastos++;
  };
  // orden: catálogos y clientes primero, después ventas y egresos que los usan
  const orden = ['clientes', 'servicios', 'productos', 'insumos', 'ventas', 'gastos', 'caja', 'resumen'];
  const hojas = [...S.imp.hojas].filter((h) => h.tipo !== 'ninguno').sort((a, b) => orden.indexOf(a.tipo) - orden.indexOf(b.tipo));
  for (const h of hojas) {
    const filas = datosDe(h).map((f) => filaAObjeto(h, f)).filter((o) => filaValida(h.tipo, o));
    if (h.tipo === 'clientes') for (const o of filas) {
      const tel = telLimpio(o.telefono); const ex = (tel && clientePorTel.get(tel)) || clientePorNombre.get(norm(o.nombre));
      const fila = { nombre: o.nombre, telefono: o.telefono, cumpleanos: o.cumpleanos, notas: o.notas };
      if (ex) { const patch = {}; for (const k of ['telefono', 'cumpleanos', 'notas']) if (fila[k] && !ex[k]) patch[k] = fila[k]; if (Object.keys(patch).length) { if (db.get('clientes', ex.id)) db.update('clientes', ex.id, patch); else Object.assign(ex, patch); cont.actualizados++; } else cont.repetidos++; }
      else { const c = { id: uid(), ...fila, cumpleanos: fila.cumpleanos || null, creado_en: H }; lotes.clientes.push(c); clientePorNombre.set(norm(c.nombre), c); if (tel) clientePorTel.set(tel, c); cont.clientes++; }
    }
    if (h.tipo === 'servicios') { const ex = porNombre('servicios'); for (const o of filas) {
      const e = ex.get(norm(o.nombre)); const fila = { nombre: o.nombre, precio: o.precio, duracion_min: Math.round(o.duracion_min || 60), activo: true };

    if (h.tipo === 'productos') { const ex = porNombre('productos'); const exSku = new Map(db.all('productos').filter((p) => p.sku).map((p) => [norm(p.sku), p])); for (const o of filas) {

      const fila = { nombre: o.nombre, sku: o.sku || '', precio_venta: o.precio_venta, costo: o.costo || 0, stock_minimo: o.stock_minimo ?? 3, activo: true };
      let p; if (e) { const patch = { precio_venta: fila.precio_venta }; if (o.costo) patch.costo = o.costo; if (o.stock_minimo != null) patch.stock_minimo = o.stock_minimo; db.update('productos', e.id, patch); p = e; cont.actualizados++; }
      else { p = db.insert('productos', fila); ex.set(norm(p.nombre), p); cont.productos++; }
      ajustarStock('producto', p, o.stock);
    } if (filas.some((o) => o.stock != null) && !tiene('inventario')) { db.modulo('inventario', true); avisos.push('Activamos Productos e inventario porque tu archivo trae stock.'); } }
    if (h.tipo === 'insumos') { const ex = porNombre('insumos'); for (const o of filas) {
      const e = ex.get(norm(o.nombre)); const fila = { nombre: o.nombre, unidad: o.unidad || 'unidad', costo_unitario: o.costo_unitario || 0, stock_minimo: o.stock_minimo || 0 };
      let i; if (e) { if (o.costo_unitario) db.update('insumos', e.id, { costo_unitario: o.costo_unitario }); i = e; cont.actualizados++; } else { i = db.insert('insumos', fila); ex.set(norm(i.nombre), i); cont.insumos++; }
      ajustarStock('insumo', i, o.stock);
    } if (filas.length && !tiene('produccion')) { if (!tiene('inventario')) db.modulo('inventario', true); db.modulo('produccion', true); avisos.push('Activamos Producción porque tu archivo trae insumos.'); } }
    if (['ventas', 'caja', 'gastos'].includes(h.tipo)) {
      // cada fila se decide sola: lo que es egreso va a egresos y lo que es ingreso va a ventas, con su cliente
      for (const o of filas) {
        const det = o.detalle || o.descripcion || '';
        const partes = claseFila(h.tipo, o);
        for (const c of partes) {
          if (c.clase === 'venta') registrarIngreso(o, det, c.monto, h.tipo === 'ventas' && o.cantidad > 0 ? o.cantidad : 1);
          else registrarGasto(o, det, c.monto);
          if (h.tipo !== 'caja' && (c.clase === 'venta') !== (h.tipo === 'ventas')) cont.movidos++;
        }
      }
      if (filas.some((o) => o.fecha > H)) avisos.push('Algunas filas tienen fecha futura; revisa que el formato de fecha sea día/mes/año.');
    }
  }
  for (const h of hojas.filter((x) => x.tipo === 'bloques')) importarBloques(h, cont, avisos);
  // resumen mensual: si el archivo trae el detalle, solo sirve para comparar; si no, se cargan los totales del mes
