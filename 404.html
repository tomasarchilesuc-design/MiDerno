.pub-ident p { color: var(--muted); font-size: .875rem; margin-top: 2px; }
.pub-pie { text-align: center; margin-top: 28px; font-size: .75rem; color: var(--muted); opacity: .7; }
.btn-wa { background: #1FA855; border-color: #1FA855; color: #fff; min-height: 50px; font-size: .9375rem; }
.btn-wa:hover { background: #18914A; }
.pub-fin { display: flex; gap: 8px; flex-wrap: wrap; }
.pub-fotos img { height: 150px; }
/* esqueleto mientras carga (en vez de "Cargando…") */
.sk { display: block; border-radius: 14px; background: linear-gradient(90deg, var(--surface-2) 0%, color-mix(in srgb, var(--surface-2) 50%, var(--surface)) 50%, var(--surface-2) 100%); background-size: 200% 100%; animation: brillo 1.2s ease-in-out infinite; }
@keyframes brillo { from { background-position: 100% 0; } to { background-position: -100% 0; } }
.pub-esqueleto { display: flex; flex-direction: column; gap: 14px; }
.sk-portada { aspect-ratio: 16 / 7; border-radius: 22px; } .sk-titulo { height: 30px; width: 55%; } .sk-linea { height: 14px; width: 75%; }
.sk-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; } .sk-grid .sk { height: 64px; }
.logo-fila { display: flex; gap: 14px; align-items: center; }
.logo-prev { width: 64px; height: 64px; border-radius: 18px; object-fit: contain; background: var(--surface-2); flex: none; }
.logo-ini { display: grid; place-items: center; font-weight: 600; font-size: 1.375rem; background: var(--accent); color: var(--accent-ink, #fff); }
@media (prefers-reduced-motion: reduce) { .sk { animation: none; } }
@media (max-width: 600px) { .pub-logo { width: 60px; height: 60px; border-radius: 17px; } .pub-portada { border-radius: 18px; aspect-ratio: 16 / 9; } }
.btn-wa-sm { color: #138A45; border-color: color-mix(in srgb, #1FA855 35%, var(--line)); }
.btn-wa-sm:hover { background: color-mix(in srgb, #1FA855 10%, var(--surface)); }
.btn-wa .i, .btn-wa-sm .i { color: currentColor; }

/* ---------- v24: movimiento más ágil (responde al tiro, sin esperas) ---------- */
.wrap.entra > * { animation: entra .28s var(--ease-suave) both; }
.wrap.entra > :nth-child(2) { animation-delay: .03s; } .wrap.entra > :nth-child(3) { animation-delay: .06s; } .wrap.entra > :nth-child(n+4) { animation-delay: .09s; }
@keyframes entra { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.sheet { animation-duration: .3s; }
.scrim { animation-duration: .16s; }
@media (max-width: 600px) { .sheet { animation: sheet-sube .32s var(--ease-suave) both; } }
.ind-barra i { animation: none; }
.wrap.entra .ind-barra i { animation: crece .8s .15s var(--ease-out) both; }
.splash-txt { animation-delay: .35s; } .splash-bar { animation-delay: .3s; }
/* el contenido nuevo dentro de una tarjeta aparece suave en vez de saltar */
.pub-horas, .bc-lista:not([hidden]) { animation: aparece .18s ease both; }
.row.click:hover { background: color-mix(in srgb, var(--surface-2) 60%, transparent); }
.nav a { position: relative; }
.nav a.on::before { content: ""; position: absolute; left: -14px; top: 9px; bottom: 9px; width: 3px; border-radius: 0 3px 3px 0; background: var(--accent); }
@media (prefers-reduced-motion: reduce) { .wrap.entra > *, .sheet, .scrim, .pub-horas, .bc-lista { animation: none !important; } }
.sk-hora { height: 42px; border-radius: 12px; }

/* ---------- v25: Inicio, panel de hoy ---------- */

.hoy-cifras small { color: var(--muted); font-size: .75rem; } .hoy-cifras b { font-size: 1.125rem; letter-spacing: -.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .hoy-cifras span { color: var(--muted); font-size: .75rem; }
.hoy-bloque { background: var(--surface); border: 1px solid var(--line-suave); box-shadow: var(--sombra-card); border-radius: 18px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; }

@media (max-width: 600px) { .hoy-acciones { grid-template-columns: repeat(2, minmax(0, 1fr)); } .hoy-acc { flex-direction: row; align-items: center; padding: 12px; } .hoy-cifras b { font-size: 1.125rem; } }
.cal-op { display: flex; flex-direction: column; gap: 8px; padding: 14px; border-radius: 16px; background: var(--surface-2); }

/* ---------- v25: redes sociales ---------- */

.redes-cifra { display: flex; align-items: baseline; gap: 10px; } .redes-cifra b { font-size: 2.5rem; letter-spacing: -.03em; } .redes-cifra span { color: var(--muted); }

.hoy-fila .grow { flex: 1; } .hoy-fila > b.num { flex: none; }

/* ---------- v26: Crecer ---------- */
.crecer-tabs { margin-bottom: 4px; align-self: flex-start; }

.crecer-res small, .crecer-res span { color: var(--muted); font-size: .75rem; } .crecer-res b { font-size: 1.375rem; letter-spacing: -.02em; } .crecer-res em { font-style: normal; font-size: .875rem; color: var(--muted); font-weight: 500; }
.crecer-lead { margin: 4px 0; }
.acciones { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 14px; align-items: start; }
.accion-c { display: flex; flex-direction: column; gap: 10px; }
.accion-cab { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }

.accion-valor { text-align: right; flex: none; display: flex; flex-direction: column; } .accion-valor b { font-size: 1.125rem; color: var(--ok); } .accion-valor small { color: var(--muted); font-size: .75rem; }

.accion-fila .grow { min-width: 0; } .accion-fila b { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .accion-fila small { display: block; color: var(--muted); font-size: .75rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.accion-fila.hecha { opacity: .55; }
.avatar.sm { width: 32px; height: 32px; font-size: .75rem; flex: none; }
.ciclos-lista { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 6px 18px; margin-top: 10px; }
.ciclo-fila { display: flex; align-items: center; justify-content: space-between; gap: 10px; } .ciclo-fila .in { width: 80px; min-height: 36px; padding: 6px 10px; }

.google-paso:first-child { border-top: 0; }

.google-paso b { display: block; } .google-paso small { color: var(--muted); font-size: .8125rem; }

.crecer-ini { display: flex; align-items: center; gap: 12px; text-decoration: none; color: var(--ink); padding: 14px 16px; }
.crecer-ini small { display: block; color: var(--muted); font-size: .75rem; } .crecer-ini b { display: block; font-weight: 600; } .crecer-ini .small { display: block; }

.prox-op small { color: var(--muted); } .prox-op.on { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 8%, var(--surface)); }
@media (max-width: 600px) { .acciones { grid-template-columns: 1fr; } .crecer-res b { font-size: 1.125rem; } .crecer-res { gap: 6px; } .crecer-res > div { padding: 10px; } }
/* v26: ajustes Crecer */
.accion-fila .grow { flex: 1; min-width: 0; }
.accion-fila .grow small { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.crecer-tabs { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; max-width: 100%; }
.crecer-tabs button { white-space: nowrap; }
@media (max-width: 600px) {
  .crecer-tabs button { padding: 8px 12px; font-size: .875rem; }
  .crecer-res { grid-template-columns: 1fr 1fr; }
  .crecer-res > div:last-child { grid-column: 1 / -1; }
}

/* ---------- v27: portada con secciones (jerarquía: promesa → qué hace → para quién → acción) ---------- */
.portada { min-height: 0; }
.por-hero { min-height: calc(100vh - 140px); min-height: calc(100dvh - 140px); }
.por-sec { background: var(--fondo); color: var(--ink); margin: 56px calc(-1 * var(--por-pad, 24px)) 0; padding: clamp(56px, 8vw, 104px) var(--por-pad, 24px); }
.por-sec-in { max-width: 1120px; margin: 0 auto; }
.por-sec h2 { font: 650 clamp(2rem, 4.2vw, 3.1rem)/1.05 var(--f-display); letter-spacing: -.035em; max-width: 18ch; margin: 0 0 clamp(32px, 5vw, 56px); color: var(--ink); }
.por-filas { margin: 0; display: grid; }
.por-filas > div { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.6fr); gap: 8px 48px; padding: 26px 0; border-top: 1px solid var(--line); align-items: baseline; }
.por-filas > div:last-child { border-bottom: 1px solid var(--line); }
.por-filas dt { font: 650 clamp(1.8rem, 3.4vw, 2.6rem)/1 var(--f-display); letter-spacing: -.035em; color: var(--accent-txt, var(--ink)); }
.por-filas dd { margin: 0; }
.por-filas dd p { font-size: 1.125rem; line-height: 1.55; max-width: 52ch; color: var(--ink); }
.por-filas dd small { display: block; margin-top: 10px; color: var(--muted); font-size: .875rem; }
.por-para { margin: 40px 0 0; max-width: 60ch; color: var(--muted); font-size: .9375rem; }
.por-fin { text-align: center; padding: clamp(56px, 8vw, 96px) 0 8px; }
.por-fin h2 { font: 650 clamp(2rem, 4.6vw, 3.3rem)/1.05 var(--f-display); letter-spacing: -.035em; color: #fff; margin: 0 0 12px; }
.por-fin p { color: rgba(255,255,255,.86); margin: 0 auto 26px; max-width: 46ch; }
.por-fin .por-btns { justify-content: center; }
@media (max-width: 860px) {
  .por-hero { min-height: 0; }
  .por-vis { order: 0; max-width: 380px; }
  .por-filas > div { grid-template-columns: minmax(0, 1fr); padding: 22px 0; }
  .por-sec { margin-top: 48px; }
}

.portada { --por-pad: clamp(16px, 5vw, 56px); background: radial-gradient(1100px 560px at 82% 360px, #14919C 0%, #0B6870 58%, #095961 100%) #095961; }

/* ---------- v27: accesibilidad y contraste (auditoría WCAG AA) ---------- */
/* El color de la app se usa tal cual en fondos; para TEXTO se oscurece (claro) o aclara (oscuro) hasta pasar 4.5:1 */
:root { --accent-txt: color-mix(in srgb, var(--accent) 78%, #000); --accent-soft: color-mix(in srgb, var(--accent) 10%, var(--surface)); --muted: #5F5F5F; --wa-txt: #0E6F37; }
:root[data-theme="dark"] { --accent-txt: color-mix(in srgb, var(--accent) 50%, #fff); --accent-soft: color-mix(in srgb, var(--accent) 22%, var(--surface)); --muted: #A3A3A8; --wa-txt: #5BD08A; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --accent-txt: color-mix(in srgb, var(--accent) 50%, #fff); --accent-soft: color-mix(in srgb, var(--accent) 22%, var(--surface)); --muted: #A3A3A8; --wa-txt: #5BD08A; } }
.btn-wa-sm { color: var(--wa-txt); }
/* rellenos sólidos con el color de la app: texto según su luminosidad (--primary-ink) */
.hoy-acciones > .hoy-acc:first-child, .cal-cab.hoy .cal-dia b, .logo-ini, .pub-ini { background: var(--primary); color: var(--primary-ink); }
.hoy-acciones > .hoy-acc:first-child .i { color: inherit; }

/* objetivos táctiles de 44 px en pantallas táctiles (Apple HIG / WCAG 2.5.5) */
@media (pointer: coarse) {
  .btn, .btn.sm, .chip, .seg button, .icon-btn { min-height: 44px; }
  .btn.icon-btn, .btn.sm[aria-label] { min-width: 44px; }
  .swatch { width: 44px; height: 44px; }
  .link-sm, .ini-todo, .ind-head, .link-precio { padding-block: 10px; margin-block: -10px; }
  .qty button { position: relative; } .qty button::after { content: ""; position: absolute; inset: -8px; }
}
/* táctil: sin demora de doble toque; hojas sin arrastrar la página de fondo */
html { touch-action: manipulation; -webkit-tap-highlight-color: transparent; scroll-padding-bottom: 96px; }
.sheet, .bc-lista, .cal { overscroll-behavior: contain; }
/* foco visible y consistente en todo control */
:focus-visible { outline: 2px solid var(--accent-txt); outline-offset: 2px; border-radius: 6px; }
.in:focus-visible { outline: none; }
/* selección y caret con el color de la marca */
::selection { background: color-mix(in srgb, var(--accent) 24%, transparent); }
input, textarea { caret-color: var(--accent-txt); }
/* enlace para saltar al contenido */
.saltar { position: absolute; left: 12px; top: -60px; z-index: 300; background: var(--ink); color: var(--bg); padding: 10px 14px; border-radius: 10px; text-decoration: none; font-weight: 600; }
.saltar:focus { top: 12px; }
/* preferencias del sistema: menos transparencia y más contraste */
@media (prefers-reduced-transparency: reduce) { .tabbar, .pub-preview { backdrop-filter: none !important; -webkit-backdrop-filter: none !important; background: var(--surface) !important; } }
@media (prefers-contrast: more) { :root { --line: #8A8A8A; --line-suave: #8A8A8A; --muted: #3A3A3A; } .card, .hoy-bloque, .in { border: 1px solid var(--line); } }
/* tipografía: números tabulares en cifras; títulos equilibrados */
.num, .hoy-cifras b, .crecer-res b, .ind-k b, .kpi .val, .accion-valor b, .cal-h, .hoy-h { font-variant-numeric: tabular-nums; }
h1, h2, h3, .por-sec h2, .por-fin h2 { text-wrap: balance; }
p, dd, .small { text-wrap: pretty; }

/* v28: fecha desconocida y exportar a Excel */
.cobro-fecha { flex-wrap: wrap; gap: 8px 16px; }
.cobro-fecha label { display: inline-flex; align-items: center; gap: 8px; }
.imp-export { margin-top: 16px; gap: 12px; flex-wrap: wrap; }

/* v29: unificar servicios y aviso de versión nueva */
.unir-serv { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border-radius: 12px; background: var(--accent-soft); cursor: pointer; }
.unir-serv input { margin-top: 3px; width: 18px; height: 18px; flex: none; accent-color: var(--primary); }
.unir-serv span { display: flex; flex-direction: column; gap: 3px; }
.unir-serv small { color: var(--muted); line-height: 1.4; }
.version-nueva { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 90; display: flex; align-items: center; gap: 14px; padding: 10px 10px 10px 18px; border-radius: 999px; background: var(--primary); color: var(--primary-ink); box-shadow: 0 10px 30px rgb(0 0 0 / .22); font-size: .875rem; max-width: calc(100vw - 32px); animation: vn-in .3s ease-out; }
.version-nueva .btn { background: var(--primary-ink); color: var(--primary); border-color: transparent; min-height: 34px; padding: 4px 14px; border-radius: 999px; }
.version-nueva .vn-x { background: none; border: 0; color: inherit; opacity: .7; padding: 6px; cursor: pointer; font-size: 1.125rem; line-height: 1; }
@keyframes vn-in { from { opacity: 0; transform: translate(-50%, 12px); } }
@media (max-width: 860px) { .version-nueva { bottom: calc(84px + env(safe-area-inset-bottom)); } }
@media (prefers-reduced-motion: reduce) { .version-nueva { animation: none; } }

/* v30: cuenta segura */
.clave-fuerza { display: flex; align-items: center; gap: 10px; margin: -6px 0 2px; min-height: 18px; }
.clave-fuerza .cf-barra { display: grid; grid-template-columns: repeat(4, 28px); gap: 4px; }
.clave-fuerza i { height: 4px; border-radius: 4px; background: var(--line); transition: background .25s cubic-bezier(.16,1,.3,1); }
.clave-fuerza[data-n="1"] i:nth-child(-n+1) { background: var(--bad); }
.clave-fuerza[data-n="2"] i:nth-child(-n+2) { background: var(--warn, #C98A1B); }
.clave-fuerza[data-n="3"] i:nth-child(-n+3), .clave-fuerza[data-n="4"] i { background: var(--ok); }
.clave-fuerza small { color: var(--muted); }
.field.coincide .in { border-color: var(--ok); }
.field.no-coincide .in { border-color: var(--bad); }
.field.no-coincide::after { content: 'Todavía no coinciden'; font-size: .75rem; color: var(--bad); margin-top: 4px; }
.correo-sug { align-self: flex-start; background: none; border: 0; padding: 4px 0 0; color: var(--accent-txt); cursor: pointer; font: inherit; font-size: .8125rem; text-align: left; }
.verificar { display: flex; flex-direction: column; gap: 14px; }
.verificar .ver-ico { width: 52px; height: 52px; border-radius: 16px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent-txt); }
.verificar .ver-ico .i { width: 26px; height: 26px; }
.verificar p { margin: 0; line-height: 1.5; }
.ver-pasos { margin: 0; padding-left: 20px; display: grid; gap: 6px; color: var(--muted); }
.ver-acciones { display: flex; flex-wrap: wrap; gap: 8px; }

/* v31: menú corto con Registrar fijo y migas para secciones internas */
.side-registrar { margin: 4px 0 14px; justify-content: center; width: 100%; text-decoration: none; }
.migas { display: inline-flex; align-items: center; gap: 4px; margin: 0 0 6px -4px; padding: 6px 8px; border-radius: 10px; color: var(--muted); font-weight: 500; font-size: .875rem; text-decoration: none; }
.migas:hover { background: var(--surface-2); color: var(--ink); }
.migas .i { width: 16px; height: 16px; }
.seg a { text-decoration: none; display: inline-flex; align-items: center; padding: 7px 12px; border-radius: 8px; font-size: .875rem; font-weight: 600; color: var(--muted); }
.seg a:hover { color: var(--ink); }

/* v31: Inicio en tres zonas (Ahora, Hoy, El mes) */
.hoy-acciones { grid-template-columns: minmax(0, 1fr) minmax(0, 1.6fr); gap: 8px; }
.hoy-acciones > .hoy-acc { justify-content: center; }
.hoy-sec { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.hoy-sec .hoy-acc { flex-direction: column; align-items: flex-start; padding: 12px; gap: 8px; font-weight: 600; font-size: .875rem; background: var(--surface-2); border-color: transparent; box-shadow: none; }
.hoy-sec .hoy-acc .i { width: 28px; height: 28px; padding: 6px; background: var(--surface); }
.hoy-acciones > .hoy-acc:first-child { font-size: 1.125rem; font-weight: 650; letter-spacing: -.01em; }
.hoy-cab { display: flex; justify-content: space-between; align-items: baseline; }
.hoy-cab h2 { font-size: 1.375rem; letter-spacing: -.02em; }
.hoy-resumen { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 0; color: var(--muted); font-size: .9375rem; }
.hoy-resumen b { color: var(--ink); font-weight: 650; margin-right: 4px; }
.hoy-resumen .sep { width: 4px; height: 4px; border-radius: 50%; background: var(--line); margin: 0 10px; align-self: center; }
.hoy-sub { display: flex; justify-content: space-between; align-items: baseline; font-size: .8125rem; font-weight: 600; color: var(--muted); margin: 10px 0 0; }
.hoy-sub .link-sm { font-weight: 500; }
.atender { display: flex; flex-direction: column; gap: 8px; }
.atender h2, .ini-zona { font-size: .9375rem; font-weight: 600; color: var(--muted); letter-spacing: 0; }
.atender-lista { display: flex; flex-direction: column; gap: 6px; }
.ini-zona { margin-top: 6px; }
@media (max-width: 600px) {
  .hoy-acciones { grid-template-columns: minmax(0, 1fr); }
  .hoy-acciones > .hoy-acc:first-child { flex-direction: row; justify-content: flex-start; padding: 16px; }
  .hoy-sec .hoy-acc { flex-direction: column; align-items: center; text-align: center; padding: 10px 6px; }
}
.alert-row .sev { width: 8px; height: 8px; align-self: center; border-radius: 50%; background: var(--accent); }
.alert-row .sev.warn { background: #D08A16; }
.alert-row { background: var(--surface); border: 1px solid var(--line); }

/* v31: un solo color de acción (el de la app) + colores de estado; los antiguos tonos sueltos apuntan a ellos */
:root { --sol: #D08A16; --gold: #C98A1B; --gold-soft: var(--warn-soft); --hl: color-mix(in srgb, var(--accent) 22%, transparent); --margin: var(--bad); --lapiz: var(--bad); --renglon: var(--line); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --sol: #E9B54E; --gold: #E9B54E; } }
:root[data-theme="dark"] { --sol: #E9B54E; --gold: #E9B54E; }
.banner { background: var(--surface-2); }
.entendido { background: var(--accent-soft); }
.portada { --sol: #FFFFFF; }
.portada .btn.sol { color: #0B6870; }
.por-txt h1 em { color: #A6E3E1; font-style: normal; }

/* v31: períodos de Movimientos y barras mes a mes */
.rangos { flex-wrap: wrap; }
.rangos .chip .i { width: 14px; height: 14px; margin-left: 2px; vertical-align: -2px; }
.periodo-op { width: 100%; border: 0; background: none; text-align: left; }
.periodo-op.on .t { color: var(--accent-txt); font-weight: 600; }
.mm-barras { display: flex; flex-direction: column; gap: 3px; width: 100%; min-width: 90px; }
.mm-barras span { display: block; height: 5px; border-radius: 3px; }
.mm-in, .mm-ley .ley-in { background: var(--accent); }
.mm-eg, .mm-ley .ley-eg { background: var(--gold); }
.mm-ley { display: inline-flex; align-items: center; gap: 6px; font-weight: 500; text-transform: none; letter-spacing: 0; }
.mm-ley i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }
.mm-ley .ley-eg { margin-left: 6px; }

/* v31: registro en dos pasos */
.pasos-reg { list-style: none; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: -4px 0 4px; padding: 0; counter-reset: paso; }
.pasos-reg li { counter-increment: paso; font-size: .8125rem; font-weight: 600; color: var(--muted); padding-top: 8px; border-top: 3px solid var(--line); }
.pasos-reg li::before { content: counter(paso) ". "; }
.pasos-reg li.on { color: var(--ink); border-top-color: var(--primary); }
.pasos-reg li.hecho { border-top-color: color-mix(in srgb, var(--primary) 45%, var(--line)); }
.btn.block { width: 100%; justify-content: center; }

/* v31: regla de bordes (campos 10, botones 12, tarjetas 20, filtros píldora) y tarjetas sin sombra:
   la tarjeta se distingue por el fondo, no por la sombra */
:root { --r: 20px; --r-sm: 12px; --r-in: 10px; --sombra-card: none; }
.card, .hoy-bloque, .ind, .crecer-card { border-radius: var(--r); box-shadow: none; }
.in, select.in, textarea.in { border-radius: var(--r-in); }
.btn { border-radius: var(--r-sm); box-shadow: none; }
.chip, .pill { border-radius: 999px; }
.hoy-acc { border-radius: 16px; box-shadow: none; }
.alert-row { border-radius: var(--r-sm); }
@media (max-width: 640px) { .card { border-radius: 18px; } }
/* bloques secundarios: sin marco, solo fondo suave */
.card.kpi, .ind-k, .hoy-cifras a, .crecer-res > div { border: 0; box-shadow: none; background: var(--surface-2); }

/* v31: agenda semanal con color por profesional */
.cal-ev[style*="--ev"] { background: color-mix(in srgb, var(--ev) 13%, var(--surface)); box-shadow: inset 3px 0 0 var(--ev); }
.cal-ev[style*="--ev"]:hover { box-shadow: inset 3px 0 0 var(--ev), 0 4px 12px rgba(0,0,0,.08); }
.cal-ev[style*="--ev"].hecho { background: var(--surface-2); opacity: .75; }
.cal-ev[style*="--ev"].req { background: var(--warn-soft); box-shadow: inset 3px 0 0 var(--sol); }
.emp-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 6px; vertical-align: 1px; }
.cal-ev.estrecho .cal-h { display: none; }
.cal-ev.muy-estrecho { align-items: center; padding: 4px 2px 4px 5px; }
.cal-ev.muy-estrecho b { font-size: .8125rem; letter-spacing: .02em; }
.cal-ev.muy-estrecho small { display: none; }
.cal-ev.estrecho b { white-space: normal; overflow-wrap: anywhere; line-height: 1.15; }

/* v31: portada con capturas reales de la app */
.por-vis { position: relative; margin: 0; padding: 0 0 40px 0; }
.por-shot-d { display: block; width: 100%; height: auto; border-radius: 14px; border: 1px solid rgba(255,255,255,.18); box-shadow: 0 30px 70px rgba(4,40,44,.45); background: #fff; }
.por-shot-m { position: absolute; right: -18px; bottom: 0; width: 30%; max-width: 190px; height: auto; border-radius: 22px; border: 5px solid #0A2A2D; box-shadow: 0 24px 50px rgba(4,40,44,.5); background: #fff; }
@media (prefers-reduced-motion: no-preference) {
  .por-shot-d { animation: shot-entra .9s .1s var(--ease-out) both; }
  .por-shot-m { animation: shot-entra .9s .3s var(--ease-out) both; }
}
@keyframes shot-entra { from { opacity: 0; transform: translateY(18px); } }
@media (max-width: 760px) {
  .por-vis { max-width: 520px; padding-bottom: 28px; }
  .por-shot-m { right: -6px; width: 34%; border-width: 4px; border-radius: 18px; }
}

/* ===== v32: estado de la cita ===== */
:root { --e-agendada: #8A8F8E; --e-confirmada: var(--marca); --e-asistio: #6A4FC9; --e-pagada: var(--ok); }
:root[data-theme="dark"] { --e-agendada: #8E9493; --e-asistio: #B39DF6; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --e-agendada: #8E9493; --e-asistio: #B39DF6; } }
.cal-est { display: inline-block; width: 9px; height: 9px; border-radius: 50%; flex: none; vertical-align: middle; background: var(--c, var(--e-agendada)); }
.cal-est.e-agendada { --c: transparent; box-shadow: inset 0 0 0 1.75px var(--e-agendada); }
.cal-est.e-confirmada { --c: var(--e-confirmada); }
.cal-est.e-asistio { --c: var(--e-asistio); }
.cal-est.e-completada { --c: var(--e-pagada); }
.cal-est.e-no_asistio, .cal-est.e-cancelada, .cal-est.e-rechazada { --c: var(--bad); }
/* en la semana: punto arriba a la derecha y el estado junto a la hora */
.cal-ev > .cal-est { position: absolute; top: 5px; right: 5px; }
.cal-ev.corto > .cal-est { position: static; order: -1; }
.cal-ev:not(.corto) .cal-h { padding-right: 12px; }
.cal-est-t { font-weight: 600; }
.cal-ev:not(.corto) .cal-h { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cal-ev.e-confirmada .cal-est-t { color: var(--e-confirmada); }
.cal-ev.e-asistio .cal-est-t { color: var(--e-asistio); }
.cal-ev.e-completada .cal-est-t { color: var(--e-pagada); }
/* agendada sin confirmar: un poco más clara para que se note la diferencia */
.cal-ev.k-cita.e-agendada { background-image: repeating-linear-gradient(135deg, transparent 0 6px, color-mix(in srgb, var(--surface) 55%, transparent) 6px 9px); }
.cal-ley .cal-est { margin-right: 6px; }
/* en la lista del día */
.est-cita { display: inline-flex; align-items: center; gap: 5px; font-weight: 600; }
.est-cita .cal-est { width: 8px; height: 8px; }
.est-cita.e-agendada { color: var(--muted); }
.est-cita.e-confirmada { color: var(--e-confirmada); }
.est-cita.e-asistio { color: var(--e-asistio); }
.est-cita.e-completada { color: var(--e-pagada); }
.est-cita.e-no_asistio, .est-cita.e-cancelada, .est-cita.e-rechazada { color: var(--bad); }
.pill.asis { background: color-mix(in srgb, var(--e-asistio) 13%, var(--surface)); color: var(--e-asistio); }
/* pasos al abrir una cita */
.cita-pasos { display: flex; align-items: center; gap: 4px; padding: 4px; border-radius: 14px; background: var(--surface-2); }
.cita-pasos .paso { flex: 1 1 0; min-width: 0; display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 40px; padding: 6px 8px; border: 0; border-radius: 10px; background: transparent; color: var(--muted); font: 600 .875rem/1.1 var(--f-ui, inherit); cursor: pointer; white-space: nowrap; }
.cita-pasos .paso:hover:not(:disabled) { background: var(--surface); color: var(--ink); }
.cita-pasos .paso:focus-visible { outline: 2px solid var(--marca); outline-offset: 1px; }
.cita-pasos .paso.hecho { color: var(--ink); }
.cita-pasos .paso.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08), 0 0 0 1px var(--line); cursor: default; }
.cita-pasos .paso.on.e-confirmada { color: var(--e-confirmada); }
.cita-pasos .paso.on.e-asistio { color: var(--e-asistio); }
.cita-pasos .paso-sep { width: 8px; height: 1.5px; background: var(--line); flex: none; }
.cita-pasos-ayuda { margin: -2px 2px 0; }

const NubeAdapter = {
  modo: 'nube',

  cachear() { clearTimeout(this._tc); this._tc = setTimeout(() => guardarCacheNube(), 1200); },

      if (error) { console.error(error); const dup = /duplicate|unique/i.test(error.message || '') && /slug/i.test(error.message || ''); toast(dup ? 'Esa dirección de página ya la usa otro negocio. Elige otra en Ajustes.' : 'No se pudo guardar en la nube: ' + (error.message || error), true); }

  remove(t, id) { this.marcar(t, id, true); this.enviar(() => this.sb.from(t).delete().eq('id', id)); },
  // cambios en bloque: 200 filas por envío en vez de una por una

  removeMany(t, ids) { this.marcar(t, ids, true); for (let i = 0; i < ids.length; i += 200) { const parte = ids.slice(i, i + 200); this.enviar(() => this.sb.from(t).delete().in('id', parte)); } },
  guardarNegocio(patch) { const nid = S.negocio.id; this._negLocal = { ...(this._negLocal || {}), ...patch }; this.cachear(); this.enviar(() => this.sb.from('negocios').update(patch).eq('id', nid)); },

  async traerTodo(t) {
    const filas = []; const paso = 1000;

      // si falta una tabla nueva (no se corrió la actualización), la app sigue funcionando sin ella
      if (error && (error.code === '42P01' || error.code === 'PGRST205' || /does not exist|could not find the table/i.test(error.message || ''))) { console.warn('Falta la tabla', t); this.faltan = [...new Set([...(this.faltan || []), t])]; return []; }

const CacheNube = {
  _db: null,

  async get(k) { try { const d = await this.abrir(); return await new Promise((ok) => { const q = d.transaction('nube').objectStore('nube').get(k); q.onsuccess = () => ok(q.result || null); q.onerror = () => ok(null); }); } catch { return null; } },
  async set(k, v) { try { const d = await this.abrir(); d.transaction('nube', 'readwrite').objectStore('nube').put(v, k); } catch {} },
  async borrar() { try { const d = await this.abrir(); d.transaction('nube', 'readwrite').objectStore('nube').clear(); } catch {} },
};
function guardarCacheNube() {
  const uid = S.usuarioId; if (S.modo !== 'nube' || !uid || !S.negocio) return;

// Índices en memoria: se rehacen solo cuando la tabla cambia (cada escritura sube _ver)
let _ver = 0; const _indices = new Map();
function indice(clave, t, armar) {
  const arr = db.all(t); const x = _indices.get(clave);
  if (x && x.arr === arr && x.ver === _ver && x.n === arr.length) return x.m;
  const m = armar(arr); _indices.set(clave, { arr, ver: _ver, n: arr.length, m }); return m;
}
const agrupar = (arr, k) => { const m = new Map(); for (const r of arr) { const v = r[k]; const l = m.get(v); l ? l.push(r) : m.set(v, [r]); } return m; };

const db = {
  all: (t) => S.t[t] || (S.t[t] = []),
  get: (t, id) => (id == null ? undefined : indice('id:' + t, t, (arr) => new Map(arr.map((r) => [r.id, r]))).get(id)),
  insert(t, row) { row.id = row.id || uid(); db.all(t).push(row); _ver++; adapter.insert(t, row); return row; },
  insertMany(t, rows) { rows.forEach((r) => { r.id = r.id || uid(); db.all(t).push(r); }); _ver++; adapter.insertMany(t, rows); },
  update(t, id, patch) { const r = db.get(t, id); if (r) Object.assign(r, patch); _ver++; adapter.update(t, id, patch); return r; },
  remove(t, id) { S.t[t] = db.all(t).filter((r) => r.id !== id); _ver++; adapter.remove(t, id); },
  // borra en bloque (una sola llamada a la nube en vez de una por fila)
  removeWhere(t, fn) { db.removeMany(t, db.all(t).filter(fn).map((r) => r.id)); },
  updateMany(t, ids, patch) { if (!ids.length) return; const set = new Set(ids); db.all(t).forEach((r) => { if (set.has(r.id)) Object.assign(r, patch); }); _ver++; adapter.updateMany(t, ids, patch); },
  removeMany(t, ids) { if (!ids.length) return; const set = new Set(ids); S.t[t] = db.all(t).filter((r) => !set.has(r.id)); _ver++; adapter.removeMany(t, ids); },
  negocio(patch) { Object.assign(S.negocio, patch); _fmt = null; adapter.guardarNegocio(patch); },
  modulo(m, activo) {
    S.modulos = activo ? [...new Set([...S.modulos, m])] : S.modulos.filter((x) => x !== m);
    adapter.guardarModulo(m, activo);
  },
};

  return sum(db.all('formulas').filter((f) => f.producto_id === productoId), (f) => Number(f.cantidad) * Number(db.get('insumos', f.insumo_id)?.costo_unitario || 0));
}

function resumenClientes() {
  const map = new Map(db.all('clientes').map((c) => [c.id, { c, total: 0, visitas: 0, ultima: null }]));
  for (const v of db.all('ventas')) {
    const r = map.get(v.cliente_id); if (!r) continue;
    r.total += Number(v.total); r.visitas += 1;
    if (!r.ultima || v.fecha > r.ultima) r.ultima = v.fecha;
  }
  return [...map.values()].map((r) => ({ ...r, dias: r.ultima ? diasEntre(r.ultima, hoy()) : null }));
}
function eliminarVenta(id) {
  db.removeWhere('venta_items', (i) => i.venta_id === id);
  db.removeWhere('movimientos_stock', (m) => m.ref_id === id && m.motivo === 'venta');

}

function rng(seed) {
  let a = seed >>> 0;
  const r = () => { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  r.int = (min, max) => Math.floor(r() * (max - min + 1)) + min;
  r.pick = (arr) => arr[Math.floor(r() * arr.length)];
  r.wpick = (pairs) => { const tot = sum(pairs, (p) => p[1]); let x = r() * tot; for (const [v, w] of pairs) { if ((x -= w) <= 0) return v; } return pairs[0][0]; };
  return r;
}

const MARCA = `<svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true"><defs><mask id="mdn-cuaderno" maskUnits="userSpaceOnUse" x="0" y="0" width="24" height="24"><rect width="24" height="24" fill="#fff"/><g fill="#000"><circle cx="8.3" cy="6.65" r=".75"/><circle cx="8.3" cy="12" r=".75"/><circle cx="8.3" cy="17.35" r=".75"/></g><path class="lm-check" d="M10.6 12.2l2.1 2.1 4-4.3" fill="none" stroke="#000" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" pathLength="1"/></mask></defs><g mask="url(#mdn-cuaderno)" fill="currentColor"><rect class="lm-tapa" x="6.5" y="2.5" width="13.5" height="19" rx="3"/><g class="lm-anillos"><rect x="3.2" y="5.6" width="5.6" height="2.1" rx="1.05"/><rect x="3.2" y="10.95" width="5.6" height="2.1" rx="1.05"/><rect x="3.2" y="16.3" width="5.6" height="2.1" rx="1.05"/></g></g></svg>`;

const PALABRA = (anim = false) => `<span class="wordmark${anim ? ' wm-anim' : ''}"><i>${[...'mi'].map((c, k) => `<span style="--i:${k}">${c}</span>`).join('')}</i>${[...'derno'].map((c, k) => `<span style="--i:${k + 2}">${c}</span>`).join('')}</span>`;
// cada logo en la página necesita su propia máscara (si no, el que está oculto en el menú la anula)
let _mk = 0; const marca = () => MARCA.replaceAll('mdn-cuaderno', 'mdn-' + (++_mk));
const LOGO = (anim = false) => `<div class="brand${anim ? ' logo-anim' : ''}">${marca()}${PALABRA(anim)}</div>`;

/* ---------- indicadores de carga ---------- */
let _cargas = 0;
function cargando(on) {
  _cargas = Math.max(0, _cargas + (on ? 1 : -1));
  let b = document.getElementById('carga-barra');
  if (_cargas && !b) { b = document.createElement('div'); b.id = 'carga-barra'; b.setAttribute('role', 'progressbar'); b.setAttribute('aria-label', 'Cargando'); document.body.appendChild(b); }
  if (!_cargas && b) { b.classList.add('fin'); setTimeout(() => { if (!_cargas) b.remove(); }, 350); }
  else if (b) b.classList.remove('fin');
}
// envuelve una promesa con la barra de carga
async function conCarga(p) { cargando(true); try { return await p; } finally { cargando(false); } }
// pantalla completa con el logo animado mientras se abren los datos
function pantallaCarga(on, texto = 'Cargando tu negocio…') {
  document.getElementById('splash-over')?.remove();
  if (!on) return;
  const el = document.createElement('div'); el.id = 'splash-over'; el.className = 'splash';
  el.innerHTML = `${LOGO(true)}<p class="splash-txt">${esc(texto)}</p><span class="splash-bar"></span>`;
  document.body.appendChild(el);
}

/* ---------- navegación ---------- */
const VISTAS = [
  { id: 'inicio', label: 'Inicio', icon: 'home', modulo: null },
  { id: 'vender', label: 'Registrar', icon: 'plus', modulo: null, oculta: true },
  { id: 'agenda', label: 'Agenda', icon: 'cal', modulo: null },
  { id: 'caja', label: 'Movimientos', icon: 'cash', modulo: null },
  { id: 'clientes', label: 'Clientes', icon: 'users', modulo: null },
  { id: 'crecer', label: 'Crecer', icon: 'crece', modulo: null },
  { id: 'equipo', label: 'Equipo', icon: 'team', modulo: 'servicios', grupo: 'Negocio' },
  { id: 'inventario', label: 'Inventario', icon: 'box', modulo: 'inventario', grupo: 'Negocio' },
  { id: 'produccion', label: 'Producción', icon: 'flask', modulo: 'produccion', grupo: 'Negocio' },
  { id: 'catalogo', label: 'Catálogo', icon: 'tag', modulo: null, grupo: 'Negocio' },
  { id: 'ajustes', label: 'Ajustes', icon: 'gear', modulo: null, grupo: 'Negocio' },
  // v31: viven dentro de Catálogo y Ajustes (siguen teniendo su dirección)
  { id: 'proveedores', label: 'Proveedores', icon: 'truck', modulo: null, oculta: true, padre: 'catalogo' },
  { id: 'importar', label: 'Importar y exportar', icon: 'upload', modulo: null, oculta: true, padre: 'ajustes' },
];
const vistaPorId = (id) => VISTAS.find((x) => x.id === id);
const vistaActual = () => { const h = location.hash.replace('#', '') || 'inicio'; const v = VISTAS.find((x) => x.id === h); return v && tiene(v.modulo) ? v.id : 'inicio'; };
const ir = (id) => { if (location.hash === '#' + id) render(); else location.hash = id; };

function shell(contenido) {
  const cur = vistaActual();
  const visibles = VISTAS.filter((v) => tiene(v.modulo) && !v.oculta);
  const marcado = vistaPorId(cur)?.padre || cur;
  const link = (v) => `<a href="#${v.id}" class="${v.id === marcado ? 'on' : ''}"${v.id === marcado ? ' aria-current="page"' : ''}>${icon(v.icon)}<span>${lblVista(v)}</span></a>`;
  const core = visibles.filter((v) => !v.grupo);
  const grupos = [...new Set(visibles.filter((v) => v.grupo).map((v) => v.grupo))];
  const padre = vistaPorId(vistaPorId(cur)?.padre);
  // barra inferior del celular: Inicio, Caja, [+ Vender], módulo principal, Más
  const principal = visibles.find((v) => v.id === 'agenda');
  const tab = (v) => `<a href="#${v.id}" class="${v.id === cur ? 'on' : ''}">${icon(v.icon)}<span>${lblVista(v).split(' ')[0]}</span></a>`;
  return `
  <div class="shell">
    <aside class="side">
      ${LOGO()}
      <div class="biz"><small>${esc(rubroTexto(S.negocio))}</small><strong>${esc(S.negocio.nombre)}</strong></div>
      <a href="#vender" class="btn pri side-registrar${cur === 'vender' ? ' on' : ''}">${icon('plus')}${t_('nav_vender')}</a>
      <nav class="nav" aria-label="Secciones">
        ${core.map(link).join('')}
        ${grupos.map((g) => `<div class="nav-label">${g}</div>${visibles.filter((v) => v.grupo === g).map(link).join('')}`).join('')}
      </nav>
      <div class="grow"></div>
      ${botonInstalarSide()}
      <button class="ayuda-side" data-act="ayuda">${icon('help')}<span>¿Necesitas ayuda?</span></button>
      <div class="mode-pill" ${S.modo === 'nube' ? 'role="button" tabindex="0" data-act="al-dia" title="Traer lo último de la nube"' : ''}><span class="dot ${S.modo === 'nube' ? 'cloud' : ''}"></span>${S.modo === 'nube' ? (S.sincronizando ? 'Poniéndose al día…' : 'Sincronizado en la nube') : 'Guardado en este dispositivo'} · v${VERSION}</div>
    </aside>
    <button class="saltar" data-act="saltar">Saltar al contenido</button>
    <main class="main" id="contenido" tabindex="-1"><div class="wrap">
      <div class="mobile-top"><div class="brand">${marca()}<b>${esc(S.negocio.nombre)}</b></div><div class="hstack" style="gap:2px"><button class="btn sm ghost" data-act="ayuda" aria-label="Ayuda">${icon('help')}</button><a class="btn sm ghost" href="#ajustes" aria-label="Ajustes">${icon('gear')}</a></div></div>
      ${S.negocio.id.startsWith('demo-') ? `<div class="banner"><span>Ejemplo: pruébalo todo, nada se guarda.</span><button class="btn sm" data-act="ver-ejemplos">Ver otros ejemplos</button></div>` : ''}
      ${padre ? `<a class="migas" href="#${padre.id}">${icon('left')}${lblVista(padre)}</a>` : ''}
      ${contenido}
    </div></main>
    <nav class="tabbar">
      ${tab(vistaPorId('inicio'))}${tab(vistaPorId('caja'))}
      <a href="#vender" class="sell ${cur === 'vender' ? 'on' : ''}"><span class="plus">${icon('plus')}</span><span>${t_('nav_vender')}</span></a>
      ${principal ? tab(principal) : tab(vistaPorId('clientes'))}
      <button data-act="mas" class="${!['inicio', 'caja', 'vender', principal?.id].includes(cur) ? 'on' : ''}">${icon('more')}<span>${t_('nav_mas')}</span></button>
    </nav>
  </div>`;
}

function menuMas() {
  const items = VISTAS.filter((v) => tiene(v.modulo) && !v.oculta && !['inicio', 'caja', 'agenda'].includes(v.id));
  abrirSheet('Más opciones', `<div class="list">${items.map((v) => `<a class="row click" href="#${v.id}" data-close style="text-decoration:none;color:inherit">${icon(v.icon)}<div class="grow"><div class="t">${lblVista(v)}</div></div>${icon('right')}</a>`).join('')}
    <button class="row click" data-act="salir" style="border:0;border-top:1px solid var(--line);background:none;width:100%;text-align:left">${icon('out')}<div class="grow"><div class="t">Cambiar de negocio</div></div></button></div>`);
}

/* ---------- ventana emergente y avisos ---------- */
let _onSubmit = null;
// en el celular, el fondo queda quieto mientras hay una hoja abierta (en iPhone se movía detrás)
const tactil = () => matchMedia('(pointer: coarse)').matches;
function fondoQuieto(on) {
  const b = document.body;
  if (on) { if (b.dataset.lock || !tactil()) return; const y = window.scrollY; b.dataset.lock = String(y); Object.assign(b.style, { position: 'fixed', top: -y + 'px', left: '0', right: '0', width: '100%' }); }
  else { if (!b.dataset.lock) return; const y = +b.dataset.lock; delete b.dataset.lock; Object.assign(b.style, { position: '', top: '', left: '', right: '', width: '' }); window.scrollTo(0, y); }
}
function abrirSheet(titulo, cuerpo, { submit, pie } = {}) {
  cerrarSheet(false, true); fondoQuieto(true);
  _onSubmit = submit || null;
  const el = document.createElement('div');
  el.className = 'scrim'; el.id = 'scrim';
  el.innerHTML = `<form class="sheet" id="sheet-form" novalidate>
    <div class="sheet-head"><h2>${titulo}</h2><button type="button" class="btn icon-btn ghost" data-close aria-label="Cerrar">${icon('x')}</button></div>
    ${cuerpo}
    ${pie ?? (submit ? `<div class="sheet-foot"><button type="button" class="btn" data-close>Cancelar</button><button class="btn pri" type="submit">Guardar</button></div>` : '')}
  </form>`;
  document.body.appendChild(el);
  el.addEventListener('mousedown', (e) => { if (e.target === el) cerrarSheet(); });

function partirTel(v) {
  const s = String(v || '').trim(); if (!s) return ['+56', ''];
  const d = '+' + s.replace(/\D/g, '');
  if (s.startsWith('+')) { const p = [...PREFIJOS].sort((a, b) => b[0].length - a[0].length).find(([c]) => d.startsWith(c)); if (p) return [p[0], d.slice(p[0].length)]; }

// Teléfono con prefijo de país: guarda "+56 912345678" en un campo oculto con el nombre pedido
// hora con lista cada 10 minutos (más cómodo que el reloj del navegador)
function selHora(name, val = '', { id = 'f-' + name, desde = '06:00', hasta = '23:50', paso = 10, vacio = '', attrs = '' } = {}) {
  const aM = (h) => { const [a, b] = String(h).split(':').map(Number); return a * 60 + (b || 0); };
  const v = String(val || '').slice(0, 5); const ops = [];
  for (let m = aM(desde); m <= aM(hasta); m += paso) ops.push(`${String(Math.floor(m / 60)).padStart(2, '0')}:${String(m % 60).padStart(2, '0')}`);
  if (v && !ops.includes(v)) { ops.push(v); ops.sort(); }
  return `<select class="in sel-hora" name="${name}" id="${id}" ${attrs}>${vacio ? `<option value="">${vacio}</option>` : ''}${ops.map((h) => `<option value="${h}" ${h === v ? 'selected' : ''}>${h}</option>`).join('')}</select>`;
}

async function abrirNube({ fondo = false } = {}) {
  const sb = await cargarSupabase();
  // getSession espera a que Supabase termine de leer el enlace del correo (si venimos de ahí)
  const { data: { session } } = await sb.auth.getSession();
  const user = session?.user || (await sb.auth.getUser()).data?.user;
  limpiarUrlAuth();
  if (!user) return false;
  if (!fondo) pantallaCarga(true, 'Cargando tu negocio…');
  try { return await abrirNubeCon(sb, user, { fondo }); } finally { pantallaCarga(false); }
}

async function abrirNubeCon(sb, user, { fondo = false } = {}) {
  NubeAdapter._negLocal = {}; NubeAdapter._cfgLocal = {};
  S.usuarioNombre = user?.user_metadata?.full_name || user?.user_metadata?.name || '';
  let { data: u, error } = await sb.from('usuarios').select('*').eq('id', user.id).maybeSingle();
  if (error) throw error;
  if (!u) {
    // el negocio elegido al registrarse viaja guardado en la cuenta, así sirve aunque el correo se abra en otro navegador
    const pendiente = LS.get('miderno:pendiente') || user.user_metadata?.negocio;
    if (pendiente?.nombre) { await crearNegocioNube(pendiente); return true; }
    toast('Tu cuenta aún no tiene un negocio. Créalo para continuar.'); formNegocio('solo-nube'); return false;
  }
  if (u.rol === 'empleado') { await abrirEquipo(EquipoNube(), false); return true; }
  // la sesión es la misma de la copia guardada: los cambios hechos mientras tanto ya pueden enviarse
  if (fondo && S.modo === 'nube' && S.negocio?.id === u.negocio_id) { NubeAdapter._listo?.(); NubeAdapter.listo = Promise.resolve(); }
  const [{ data: neg }, { data: mods }] = await Promise.all([sb.from('negocios').select('*').eq('id', u.negocio_id).single(), sb.from('negocio_modulos').select('*').eq('negocio_id', u.negocio_id)]);
  // todas las tablas a la vez (antes iban una por una y la carga se sentía pegada)
  const mismo = fondo && S.modo === 'nube' && S.negocio?.id === neg.id;
  if (mismo) { NubeAdapter._listo?.(); NubeAdapter.listo = Promise.resolve(); }
  NubeAdapter.tocados = {};
  const t = {}; await Promise.all(TABLAS.map(async (x) => { t[x] = await NubeAdapter.traerTodo(x); }));
  if (mismo) {
    // lo que se cambió mientras cargaba manda sobre lo que llegó de la nube
    for (const [tb, m] of Object.entries(NubeAdapter.tocados)) {
      const porId = new Map((t[tb] || []).map((r) => [r.id, r]));
      for (const [id, e] of m) { if (e === 'del') porId.delete(id); else { const l = (S.t[tb] || []).find((r) => r.id === id); if (l) porId.set(id, l); } }
      t[tb] = [...porId.values()];
    }
    const { config: _c, ...otros } = NubeAdapter._negLocal || {};
    S.negocio = { ...neg, ...otros, config: { ...(neg.config || {}), ...(NubeAdapter._cfgLocal || {}) } };
  } else { S.negocio = neg; S.cart = null; resetUI(); }
  adapter = NubeAdapter; S.modo = 'nube'; S.usuarioId = user.id; LS.set('miderno:nube-uid', user.id);
  S.modulos = (mods || []).filter((m) => m.activo).map((m) => m.modulo); S.t = t; _fmt = null; S.sincronizando = false;
  // si hay una hoja abierta (formulario a medio llenar) no se repinta encima; se verá al cerrarla
  if (!mismo || !document.getElementById('scrim')) render(); else $('.mode-pill') && ($('.mode-pill').lastChild.textContent = 'Sincronizado en la nube · v' + VERSION);
  aparienciaDeCuenta(); guardarCacheNube(); return true;
}

function entenderNegocio(texto) {
  const t = norm(texto); if (!t) return { mods: [], nombres: [], servicios: [], productos: [] };
  const hits = PERFILES.filter((p) => p.re.test(t));
  const mods = [...new Set(hits.flatMap((h) => h.mods))];
  const servicios = hits.flatMap((h) => h.servicios || []).slice(0, 6);
  const productos = hits.flatMap((h) => h.productos || []).slice(0, 4);
  // si el texto menciona esmaltes, cremas, etc. junto a "vende", sugerimos ese producto
  const m = t.match(/vend[eo]\w* (?:tambien )?([a-z ]{3,30})/);
  if (m && mods.includes('inventario') && !productos.length) { const cosa = m[1].trim().split(' ').slice(0, 3).join(' '); if (cosa) productos.push([cosa.charAt(0).toUpperCase() + cosa.slice(1), 0]); }
  return { mods, nombres: hits.map((h) => h.nombre).filter(Boolean), servicios, productos };
}

/* ---------- registro en la nube ---------- */
async function registrarNube(d) {
  try {
    if (!d.email || (d.password || '').length < CLAVE_MIN) return toast(`Escribe tu correo y una contraseña de al menos ${CLAVE_MIN} caracteres`, true);
    const sb = await cargarSupabase();
    const pendiente = { nombre: d.nombre, rubro: d.rubro, modulos: d.modulos, sugeridos: d.sugeridos, telefono: d.telefono, nacimiento: d.nacimiento };
    LS.set('miderno:pendiente', pendiente);
    const { data, error } = await sb.auth.signUp({ email: d.email, password: d.password, options: { emailRedirectTo: appUrl() || undefined, data: { negocio: pendiente } } });
    if (error) throw error;
    // si el correo ya tenía cuenta, Supabase responde sin identidades (no avisa para no revelar cuentas)
    if (data.user && Array.isArray(data.user.identities) && data.user.identities.length === 0) throw new Error('already registered');
    let session = data.session;
    if (!session) { const r = await sb.auth.signInWithPassword({ email: d.email, password: d.password }).catch(() => ({})); session = r.data?.session; }
    if (session) return crearNegocioNube(pendiente);
    // Supabase pide confirmar el correo: el negocio queda guardado y se crea al volver
    hojaVerificar(d.email, { clave: d.password, negocio: d.nombre });
  } catch (e) {
    if (/already registered|already exists/i.test(e.message || '')) return errorCampo('#f-email', 'Ese correo ya tiene cuenta. Toca “Iniciar sesión” o recupera tu contraseña.');
    toast(/password/i.test(e.message || '') ? 'Esa contraseña no la acepta el sistema: usa una más larga, con letras y números.' : 'No pudimos crear la cuenta: ' + (e.message || e), true);
  }
}
async function crearNegocioNube(d) {
  try {
    const sb = await cargarSupabase();
    const { error } = await sb.rpc('crear_negocio', { p_nombre: d.nombre, p_rubro: d.rubro, p_modulos: d.modulos || [] });
    if (error) throw error;
    LS.del('miderno:pendiente'); _regNegocio = null;
    cerrarSheet(); await abrirNube(); datosExtra(d); sembrarSugeridos(d.sugeridos); location.hash = 'catalogo';
    toast('¡Listo! Tu negocio quedó creado.');
  } catch (e) { toast('No pudimos crear el negocio: ' + (e.message || e), true); }
}

const pct = (a, b) => (b ? Math.round(((a - b) / b) * 100) : null);

function graficoMeses() {
  const meses = Array.from({ length: 6 }, (_, i) => addMonths(mesActual(), i - 5));
  const datos = meses.map((m) => ({ m, v: sum(ventasDelMes(m), (x) => Number(x.total)), g: sum(gastosDelMes(m), (x) => Number(x.monto)) }));
  const max = Math.max(1, ...datos.flatMap((d) => [d.v, d.g]));
  const paso = (() => { const raw = max / 4; const p = 10 ** Math.floor(Math.log10(raw)); return [1, 2, 2.5, 5, 10].map((k) => k * p).find((k) => k >= raw); })();
  const top = paso * Math.ceil(max / paso);
  const W = 640, Hh = 230, L = 58, B = 26, T = 10, R = 8; const ih = Hh - B - T; const cw = (W - L - R) / 6; const bw = Math.min(26, cw / 3.2);
  const y = (v) => T + ih - (v / top) * ih;
  const corto = (v) => (v >= 1e6 ? (v / 1e6).toLocaleString('es-CL', { maximumFractionDigits: 1 }) + ' M' : v >= 1e3 ? Math.round(v / 1e3) + ' mil' : String(v));
  let s = `<svg viewBox="0 0 ${W} ${Hh}" role="img" aria-label="Gráfico de ventas y egresos por mes">`;
  for (let v = 0; v <= top; v += paso) s += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end">$${corto(v)}</text>`;
  datos.forEach((d, i) => {
    const cx = L + cw * i + cw / 2; const actual = i === 5;
    s += `<rect x="${cx - bw - 2}" y="${y(d.v)}" width="${bw}" height="${Math.max(0, T + ih - y(d.v))}" rx="4" fill="var(--accent)" opacity="${actual ? 1 : .78}"><title>Ventas ${nombreMes(d.m)}: ${money(d.v)}</title></rect>`;
    s += `<rect x="${cx + 2}" y="${y(d.g)}" width="${bw}" height="${Math.max(0, T + ih - y(d.g))}" rx="4" fill="var(--gold)" opacity="${actual ? 1 : .78}"><title>Egresos ${nombreMes(d.m)}: ${money(d.g)}</title></rect>`;
    s += `<text x="${cx}" y="${Hh - 8}" text-anchor="middle" style="${actual ? 'font-weight:700;fill:var(--ink)' : ''}">${nombreMes(d.m, true).replace('.', '')}</text>`;
  });
  return s + '</svg>';
}

// Próxima hora agendada del cliente: si la tiene, no hace falta reactivarlo.
// Se busca por cliente y también por teléfono, porque la misma persona puede quedar

    for (const c of arr) {
      if (!CITA_VIVA.includes(c.estado) || c.fecha < H) continue;
      poner(c.cliente_id, c); const t = telClave(db.get('clientes', c.cliente_id)?.telefono); if (t.length === 8) poner('tel:' + t, c);
    }

function partirNotas(n) {
  const general = [], fechadas = [];
  for (const l of String(n || '').split('\n')) { const m = l.match(/^\[(\d{4}-\d{2}-\d{2})\] (.*)$/); if (m) fechadas.push({ f: m[1], t: m[2] }); else general.push(l); }
  return { general: general.join('\n').trim(), fechadas: fechadas.sort((a, b) => b.f.localeCompare(a.f)) };
}
const unirNotas = (general, fechadas) => [general, ...fechadas.slice().sort((a, b) => a.f.localeCompare(b.f)).map((x) => `[${x.f}] ${x.t.replace(/\n/g, ' ')}`)].filter(Boolean).join('\n');

// muestra cuánto se gana por unidad mientras se escribe el precio
function lineaMargen(pv, costo) {
  if (!(pv > 0)) return '<span class="muted">Ingresa el precio de venta para calcular el margen.</span>';
  if (!(costo > 0)) return `<span class="muted">Ingresa el costo para calcular el margen.</span>`;
  const g = pv - costo; const pct = Math.round((g / pv) * 100);
  return `Margen <b class="num ${g < 0 ? 'down' : 'up'}">${money(g)}</b> por unidad <span class="pill ${pct >= 40 ? 'ok' : pct >= 20 ? 'warn' : 'bad'}">${pct}%</span>`;
}
function escucharMargen(selPv, selCosto, selOut, costoFijo) {
  const f = $('#sheet-form'); const out = $(selOut); if (!f || !out) return;
  const calc = () => { out.innerHTML = lineaMargen(num($(selPv)?.value), costoFijo ?? num($(selCosto)?.value)); };
  f.addEventListener('input', calc); calc();
}

function vistaInventario() {

  const estado = (f) => f.st <= 0 ? ['Agotado', 'bad'] : f.st <= Number(f.p.stock_minimo || 0) ? ['Stock bajo', 'warn'] : ['OK', 'ok'];
  filas.sort((a, b) => { const r = (f) => (f.st <= 0 ? 0 : f.st <= Number(f.p.stock_minimo || 0) ? 1 : 2); return r(a) - r(b) || a.p.nombre.localeCompare(b.p.nombre); });

// Compra: el usuario anota cuánto llegó y cuánto pagó en total; el costo por unidad sale solo
function camposCompra(unidad, costoActual) {
  return `<div class="form-row">${field(`Cantidad que llegó${unidad && unidad !== 'unidad' ? ' (' + esc(unidad) + ')' : ''}`, '<input class="in" id="f-cantidad" name="cantidad" inputmode="decimal" required placeholder="0">')}${field('Total pagado', '<input class="in" id="f-total" name="total" inputmode="numeric" placeholder="Opcional">')}</div>
    <div class="banner" id="compra-costo" style="background:var(--surface-2)">Costo actual: <b class="num">${money(costoActual || 0)}</b> por ${esc(unidad || 'unidad')}. Si anotas el total pagado, lo calculamos solo.</div>`;
}
function escucharCompra(unidad, costoActual) {
  const f = $('#sheet-form');
  const calc = () => {
    const cant = Number(String($('#f-cantidad').value).replace(',', '.')) || 0; const total = num($('#f-total').value);
    $('#compra-costo').innerHTML = cant > 0 && total > 0 ? `Costo por ${esc(unidad || 'unidad')}: <b class="num">${money(total / cant)}</b>${costoActual ? ` (antes ${money(costoActual)})` : ''}. Se usará en tus costos y recetas.` : `Costo actual: <b class="num">${money(costoActual || 0)}</b> por ${esc(unidad || 'unidad')}. Si anotas el total pagado, lo calculamos solo.`;
  };
  f.addEventListener('input', calc);
}
const leerCompra = (d) => { const cant = Number(String(d.cantidad).replace(',', '.')) || 0; const total = num(d.total); return { cant, total, unit: cant > 0 && total > 0 ? total / cant : 0 }; };
function formIngreso(prodId) {
  const prods = db.all('productos').filter((p) => p.activo !== false);
  if (!prods.length) { toast('Primero agrega productos en el catálogo', true); return ir('catalogo'); }
  const p0 = prodId ? db.get('productos', prodId) : prods[0];
  abrirSheet('Compra de mercadería', `<div class="form">
    ${field('Producto', `<select class="in" name="producto" id="f-producto">${prods.map((p) => opt(p.id, `${p.nombre} (hay ${qtyFmt(stockDe('producto', p.id))})`, p0.id)).join('')}</select>`)}
    ${camposCompra('unidad', p0.costo)}
    ${field('Precio de venta', `<input class="in" id="f-pv" name="pv" inputmode="numeric" value="${esc(p0.precio_venta || '')}" placeholder="¿A cuánto lo vendes?">`)}
    <div class="margen-vivo" id="ing-margen"></div>
    ${field('Fecha', input('fecha', hoy(), 'type="date"'))}
    <label class="hstack"><input type="checkbox" name="gasto" checked style="width:18px;height:18px;accent-color:var(--accent)"> Registrar el total pagado como egreso en Movimientos</label>
    ${field('Nota', input('nota', '', 'placeholder="Ej: Factura 1234, llegada desde bodega"'))}</div>`, {
    submit: (d) => {
      const { cant, total, unit } = leerCompra(d); if (cant <= 0) return toast('Escribe cuántas unidades llegaron', true);
      const p = db.get('productos', d.producto); const fecha = d.fecha || hoy();
      db.insert('movimientos_stock', { tipo_item: 'producto', item_id: p.id, cantidad: cant, motivo: 'compra', ref_id: null, fecha, nota: d.nota.trim() });
      if (unit > 0) db.update('productos', p.id, { costo: Math.round(unit * 100) / 100 });
      if (num(d.pv) > 0 && num(d.pv) !== Number(p.precio_venta)) db.update('productos', p.id, { precio_venta: num(d.pv) });
      if (d.gasto && total > 0) db.insert('gastos', { fecha, categoria: catGastos().includes('Mercadería') ? 'Mercadería' : catGastos()[0], monto: Math.round(total), descripcion: `Compra ${qtyFmt(cant)} × ${p.nombre}` });
      cerrarSheet(); toast(unit > 0 ? `Ingresaste ${qtyFmt(cant)} unidades a ${money(unit)} c/u` : `Ingresaste ${qtyFmt(cant)} unidades`); render();
    },
  });
  escucharCompra('unidad', p0.costo);
  const f = $('#sheet-form');
  const calc = () => { const p = db.get('productos', $('#f-producto').value); const cant = Number(String($('#f-cantidad').value).replace(',', '.')) || 0; const tot = num($('#f-total').value); const costo = cant > 0 && tot > 0 ? tot / cant : Number(p?.costo || 0); $('#ing-margen').innerHTML = lineaMargen(num($('#f-pv').value), costo); };
  f.addEventListener('input', calc);
  f.addEventListener('change', (e) => { if (e.target.id === 'f-producto') { const p = db.get('productos', e.target.value); $('#f-pv').value = p?.precio_venta || ''; formatearMonto($('#f-pv'), false, true); } calc(); });
  calc();
}function formAjuste() {
  const prods = db.all('productos').filter((p) => p.activo !== false); if (!prods.length) return toast('No hay productos', true);

      if (faltan.length) return toast('No alcanzan los insumos: ' + faltan.slice(0, 3).join(', ') + (faltan.length > 3 ? ` y ${faltan.length - 3} más` : ''), true);
      const fecha = d.fecha || hoy();
      const L = db.insert('lotes', { producto_id: d.producto, cantidad: cant, fecha, listo_desde: addDays(fecha, parseInt(d.dias) || 0), costo_total: Math.round(costoReceta(d.producto) * cant), nota: '' });
      fs.forEach((f) => db.insert('movimientos_stock', { tipo_item: 'insumo', item_id: f.insumo_id, cantidad: -(f.cantidad * cant), motivo: 'consumo', ref_id: L.id, fecha, nota: '' }));
      db.insert('movimientos_stock', { tipo_item: 'producto', item_id: d.producto, cantidad: cant, motivo: 'produccion', ref_id: L.id, fecha, nota: 'Lote' });
      S.ui.prod.tab = 'lotes'; cerrarSheet(); toast(`Lote de ${qtyFmt(cant)} unidades registrado`); render();
    },
  });
}

/* ---------- NUEVA RECETA ---------- */
// Arma la receta de un producto (nuevo o existente) con varios insumos a la vez.
// Si falta un insumo se puede crear ahí mismo, sin salir del formulario.
function unidadesPara(base) {
  // unidades en que se puede escribir la cantidad de un insumo (la suya y las convertibles)
  const extra = Object.keys(CONVERSIONES).filter((k) => k.startsWith(norm(base) + '>')).map((k) => k.split('>')[1]).filter((u) => u !== 'g' && u !== norm(base));
  return [base, ...extra];
}
function filaReceta(ins, f) {
  return `<div class="rec-row">
    <select class="in rec-ins" aria-label="Insumo">${opt('', 'Elige un insumo…')}${ins.map((i) => opt(i.id, `${i.nombre} (${money(i.costo_unitario)} / ${i.unidad})`, f?.insumo_id)).join('')}<option value="__nuevo">+ Insumo nuevo…</option></select>
    <input class="in rec-cant" inputmode="decimal" placeholder="Cantidad" aria-label="Cantidad por unidad" value="${f ? esc(String(Math.round(Number(f.cantidad) * 10000) / 10000).replace('.', ',')) : ''}">
    <select class="in rec-uni" aria-label="Unidad de medida">${unidades().map((u) => opt(u, u)).join('')}</select>
    <button type="button" class="btn icon-btn ghost rec-del" aria-label="Quitar fila">${icon('x')}</button>
    <div class="rec-nuevo" hidden>
      <input class="in rec-n-nombre" placeholder="Nombre del insumo" aria-label="Nombre del insumo nuevo">
      <input class="in rec-n-costo" inputmode="decimal" placeholder="Costo por unidad" aria-label="Costo por unidad de medida">
    </div>
  </div>`;
}
// precio sugerido según el margen que se quiere ganar, redondeado como precio de vitrina
const precioVitrina = (p) => (p >= 10000 ? Math.ceil(p / 1000) * 1000 - 10 : p >= 1000 ? Math.ceil(p / 100) * 100 - 10 : Math.ceil(p / 50) * 50);
function formReceta(prodId, editar = false) {
  const fsAct = prodId ? db.all('formulas').filter((f) => f.producto_id === prodId) : [];
  if (prodId && fsAct.length) editar = true;
  const sinReceta = db.all('productos').filter((p) => p.activo !== false && !db.all('formulas').some((f) => f.producto_id === p.id));
  const ins = [...db.all('insumos')].sort((a, b) => a.nombre.localeCompare(b.nombre));
  const sel = prodId || (sinReceta[0]?.id ?? '__nuevo'); const pAct = editar ? db.get('productos', prodId) : null;
  abrirSheet(editar ? 'Editar receta' : 'Nueva receta', `<div class="form">
    ${editar ? `<input type="hidden" id="rec-prod" value="${esc(prodId)}">${field('Producto', `<input class="in" id="rec-p-renombrar" value="${esc(pAct.nombre)}" aria-label="Nombre del producto">`, 'Puedes cambiarle el nombre aquí mismo.')}`
    : `${field('¿Para qué producto?', `<select class="in" id="rec-prod">${sinReceta.map((p) => opt(p.id, p.nombre, sel)).join('')}<option value="__nuevo" ${sel === '__nuevo' ? 'selected' : ''}>+ Producto nuevo…</option></select>`)}
    <div id="rec-prod-nuevo" ${sel === '__nuevo' ? '' : 'hidden'}>${field('Nombre del producto', '<input class="in" id="rec-p-nombre" placeholder="Ej: Vela de coco 200 g">')}</div>`}
    <div class="field"><label>¿Qué lleva una unidad?</label><span class="hint" style="margin-top:-2px">Elige la medida que te acomode en cada fila: por ejemplo 180 gr aunque compres la cera por kilo.${editar ? ' Usa la ✕ para quitar un insumo.' : ''}</span>
      <div class="stack" id="rec-filas">${editar ? fsAct.map((f) => filaReceta(ins, f)).join('') : filaReceta(ins) + filaReceta(ins)}</div>
      <button type="button" class="btn sm" id="rec-mas" style="align-self:flex-start">${icon('plus')}Agregar otro insumo</button></div>
    <div class="banner" id="rec-resumen" style="background:var(--accent-soft)">Agrega los insumos para ver cuánto te cuesta hacer una unidad.</div>
    <div class="field" id="rec-precio-box"><label for="rec-p-precio">Precio de venta</label>
      <div class="chips" id="rec-sugerencias"></div>
      <input class="in" id="rec-p-precio" inputmode="numeric" placeholder="Escribe tu precio o elige una sugerencia" value="${sel !== '__nuevo' ? esc(db.get('productos', sel)?.precio_venta || '') : ''}">
      <span class="hint" id="rec-margen"></span></div>
  </div>`, {
    submit: () => guardarReceta(),
    ...(editar ? { pie: `<div class="sheet-foot" style="justify-content:space-between"><button type="button" class="btn danger" data-act="del-receta" data-id="${esc(prodId)}">${icon('trash')}Borrar receta</button><div class="hstack"><button type="button" class="btn" data-close>Cancelar</button><button class="btn pri" type="submit">Guardar cambios</button></div></div>` } : {}),
  });
  const form = $('#sheet-form');
  const ajustarUnidades = (r) => {
    const id = r.querySelector('.rec-ins').value; const selU = r.querySelector('.rec-uni');
    if (!id || id === '__nuevo') { if (selU.dataset.base) { selU.innerHTML = unidades().map((u) => opt(u, u)).join(''); delete selU.dataset.base; } return; }
    const i = db.get('insumos', id); if (selU.dataset.base === i.unidad) return;
    selU.innerHTML = unidadesPara(i.unidad).map((u) => opt(u, u, i.unidad)).join(''); selU.dataset.base = i.unidad;
  };
  const costoFila = (r) => {
    const id = r.querySelector('.rec-ins').value; const cant = Number(String(r.querySelector('.rec-cant').value).replace(',', '.')) || 0; const u = r.querySelector('.rec-uni').value;
    if (id === '__nuevo') return cant * (Number(String(r.querySelector('.rec-n-costo').value).replace(',', '.')) || 0);
    const i = db.get('insumos', id); if (!i) return 0;
    return cant * (u === i.unidad ? 1 : factorUnidad(u, i.unidad) || 1) * Number(i.costo_unitario || 0);
  };
  const recalcular = () => {
    let costo = 0;
    form.querySelectorAll('.rec-row').forEach((r) => { r.querySelector('.rec-nuevo').hidden = r.querySelector('.rec-ins').value !== '__nuevo'; ajustarUnidades(r); costo += costoFila(r); });
    const res = $('#rec-resumen'); const pv = num($('#rec-p-precio').value);
    res.innerHTML = costo ? `Hacer una unidad te cuesta <b class="num">${money(costo)}</b>` : 'Agrega los insumos para ver cuánto te cuesta hacer una unidad.';
    // solo se redibuja si cambió, para no perder el toque sobre un botón
    const sugHtml = costo ? [50, 60, 70].map((m) => { const p = precioVitrina(costo / (1 - m / 100)); return `<button type="button" class="chip rec-sug" data-p="${p}">Ganar ${m}% → <b class="num">${money(p)}</b></button>`; }).join('') : '';
    if ($('#rec-sugerencias').dataset.html !== sugHtml) { $('#rec-sugerencias').innerHTML = sugHtml; $('#rec-sugerencias').dataset.html = sugHtml; }
    $('#rec-sugerencias').querySelectorAll('.rec-sug').forEach((b) => b.classList.toggle('on', Number(b.dataset.p) === pv));
    $('#rec-margen').innerHTML = costo && pv ? `Con un precio de ${money(pv)}, el margen es <b class="num ${pv - costo < 0 ? 'down' : ''}">${money(pv - costo)}</b> por unidad (${Math.round(((pv - costo) / pv) * 100)}% del precio).` : costo ? 'Elige una sugerencia o escribe tu propio precio.' : '';
  };
  form.addEventListener('input', recalcular);
  form.addEventListener('change', (e) => {
    if (e.target.id === 'rec-prod') { $('#rec-prod-nuevo').hidden = e.target.value !== '__nuevo'; $('#rec-p-precio').value = e.target.value !== '__nuevo' ? db.get('productos', e.target.value)?.precio_venta || '' : ''; }
    recalcular();
  });
  form.addEventListener('click', (e) => {
    if (e.target.closest('#rec-mas')) { $('#rec-filas').insertAdjacentHTML('beforeend', filaReceta(ins)); }
    const del = e.target.closest('.rec-del'); if (del) { if (form.querySelectorAll('.rec-row').length > 1) del.closest('.rec-row').remove(); recalcular(); }
    const sug = e.target.closest('.rec-sug'); if (sug) { $('#rec-p-precio').value = sug.dataset.p; formatearMonto($('#rec-p-precio'), false); recalcular(); }
  });
  recalcular();
}
function guardarReceta() {
  const form = $('#sheet-form'); let prodId = $('#rec-prod').value; const precio = num($('#rec-p-precio').value);
  const editando = !!$('#rec-p-renombrar'); const nuevoNombre = editando ? $('#rec-p-renombrar').value.trim() : '';
  if (editando && !nuevoNombre) return toast('Escribe el nombre del producto', true);
  if (prodId === '__nuevo' && !$('#rec-p-nombre').value.trim()) return toast('Escribe el nombre del producto', true);
  const lineas = [];
  for (const r of form.querySelectorAll('.rec-row')) {
    const id = r.querySelector('.rec-ins').value; const cant = Number(String(r.querySelector('.rec-cant').value).replace(',', '.')) || 0; const u = r.querySelector('.rec-uni').value;
    if (!id && !cant) continue;
    if (!id) return toast('Elige el insumo de cada fila', true);
    if (cant <= 0) return toast('Escribe cuánto lleva de cada insumo', true);
    if (id === '__nuevo') {
      const nombre = r.querySelector('.rec-n-nombre').value.trim(); if (!nombre) return toast('Escribe el nombre del insumo nuevo', true);
      lineas.push({ nuevo: { nombre, unidad: u, costo_unitario: Number(String(r.querySelector('.rec-n-costo').value).replace(',', '.')) || 0, stock_minimo: 0 }, cant });
    } else {
      // la cantidad se guarda en la unidad del insumo (180 gr de una cera en kg = 0,18 kg)
      const i = db.get('insumos', id); const f = u === i.unidad ? 1 : factorUnidad(u, i.unidad) || 1;
      lineas.push({ id, cant: Math.round(cant * f * 10000) / 10000 });
    }
  }
  if (!lineas.length) return toast('Agrega al menos un insumo', true);
  const ids = lineas.map((l) => l.id).filter(Boolean); if (new Set(ids).size !== ids.length) return toast('Hay un insumo repetido en la receta', true);
  if (!(precio > 0)) return toast('Elige una sugerencia o escribe el precio de venta', true);
  if (prodId === '__nuevo') prodId = db.insert('productos', { nombre: $('#rec-p-nombre').value.trim(), sku: '', precio_venta: precio, costo: 0, stock_minimo: 0, activo: true }).id;
  else if (Number(db.get('productos', prodId).precio_venta) !== precio) db.update('productos', prodId, { precio_venta: precio });
  if (editando) {
    if (nuevoNombre !== db.get('productos', prodId).nombre) db.update('productos', prodId, { nombre: nuevoNombre });
    db.removeMany('formulas', db.all('formulas').filter((f) => f.producto_id === prodId).map((f) => f.id));
  }
  for (const l of lineas) {
    const insumoId = l.id || db.insert('insumos', l.nuevo).id;
    db.insert('formulas', { producto_id: prodId, insumo_id: insumoId, cantidad: l.cant });
  }
  const p = db.get('productos', prodId);
  cerrarSheet(); S.ui.prod.tab = 'recetas'; toast(`${editando ? 'Receta actualizada' : 'Receta guardada'}: ${p.nombre} cuesta ${money(costoReceta(prodId))} y se vende a ${money(p.precio_venta)}`); render();
}

/* ---------- cambio de unidad (kg ↔ gr, lt ↔ ml, mt ↔ cm) ---------- */
const CONVERSIONES = { 'kg>gr': 1000, 'gr>kg': 0.001, 'lt>ml': 1000, 'ml>lt': 0.001, 'mt>cm': 100, 'cm>mt': 0.01, 'kg>g': 1000, 'g>kg': 0.001, 'gr>g': 1, 'g>gr': 1 };
const factorUnidad = (de, a) => CONVERSIONES[`${norm(de)}>${norm(a)}`] || 0;
function convertirInsumo(id, f) {
  db.all('movimientos_stock').filter((m) => m.tipo_item === 'insumo' && m.item_id === id).forEach((m) => db.update('movimientos_stock', m.id, { cantidad: Math.round(Number(m.cantidad) * f * 1000) / 1000 }));
  db.all('formulas').filter((x) => x.insumo_id === id).forEach((x) => db.update('formulas', x.id, { cantidad: Math.round(Number(x.cantidad) * f * 10000) / 10000 }));
}

const fechaConAnio = (f) => fechaCorta(f) + (String(f).slice(0, 4) !== hoy().slice(0, 4) ? ' ' + String(f).slice(0, 4) : '');
// dos columnas: cuándo y qué fue el último movimiento, y cuánto entró o salió
function celdasMov(tipo, id) {
  const ms = db.all('movimientos_stock').filter((m) => m.tipo_item === tipo && m.item_id === id);
  if (!ms.length) return '<td class="small muted">—</td><td class="n muted">—</td>';
  const un = tipo === 'insumo' ? ' ' + (db.get('insumos', id)?.unidad || '') : '';
  const u = ms.reduce((a, b) => (b.fecha > a.fecha ? b : a)); const c = qtyFmt(Math.abs(u.cantidad)) + un;
  const que = { venta: `se vendieron ${c}`, compra: `entraron ${c}`, produccion: `se fabricaron ${c}`, consumo: `se usaron ${c}`, ajuste: u.cantidad > 0 ? `ajuste: +${c}` : `ajuste: −${c}` }[u.motivo] || c;
  // última entrada: la cantidad que llegó (compra o producción), siempre en positivo
  const ent = ms.filter((m) => m.cantidad > 0 && (m.motivo === 'compra' || m.motivo === 'produccion')).reduce((a, b) => (!a || b.fecha > a.fecha ? b : a), null);
  return `<td class="small" style="white-space:nowrap">${fechaConAnio(u.fecha)}<div class="muted">${que}</div></td><td class="n small" style="white-space:nowrap">${ent ? `<b class="num">${qtyFmt(ent.cantidad)}${esc(un)}</b><div class="muted">${fechaConAnio(ent.fecha)}</div>` : '<span class="muted">—</span>'}</td>`;
}

function borrarInsumo(id) {
  const i = db.get('insumos', id); if (!i) return;
  const fs = db.all('formulas').filter((f) => f.insumo_id === id); const prods = [...new Set(fs.map((f) => db.get('productos', f.producto_id)?.nombre).filter(Boolean))];
  confirmar(`Se eliminará <b>${esc(i.nombre)}</b>${prods.length ? ` y se sacará de ${prods.length === 1 ? 'la receta' : 'las recetas'} de ${esc(prods.join(', '))}` : ''}.`, () => {
    db.removeMany('formulas', fs.map((f) => f.id));
    db.removeMany('movimientos_stock', db.all('movimientos_stock').filter((m) => m.tipo_item === 'insumo' && m.item_id === id).map((m) => m.id));

function borrarReceta(prodId) {

const ESTADOS_CITA = { solicitada: ['Por confirmar', 'warn'], agendada: ['Agendada', ''], confirmada: ['Confirmada', 'acc'], asistio: ['Asistió', 'asis'], completada: ['Pagada', 'ok'], no_asistio: ['No vino', 'bad'], cancelada: ['Cancelada', 'bad'], rechazada: ['Rechazada', 'bad'] , vencida: ['Venció sin confirmar', 'bad'] };

const lunesDe = (iso) => { const d = new Date(iso + 'T12:00:00'); const dow = (d.getDay() + 6) % 7; return addDays(iso, -dow); };

function itemsDelDia(f, emp = S.ui.agenda.emp) {
  const out = [];

    const s = db.get('servicios', c.servicio_id); const e = db.get('empleados', c.empleado_id);
    out.push({ kind: 'cita', id: c.id, hora: hhmm(c.hora), titulo: cli(c.cliente_id)?.nombre || 'Cliente', sub: [s?.nombre, e?.nombre].filter(Boolean).join(' · '), estado: c.estado, ref: c, s, cl: cli(c.cliente_id) });
  }

    out.push({ kind: ev.tipo, id: ev.id, hora: hhmm(ev.hora), titulo: ev.tipo === 'entrega' ? (cl?.nombre || ev.titulo || 'Entrega') : ev.titulo, sub: ev.tipo === 'entrega' ? [ev.titulo && cl ? ev.titulo : '', ev.direccion].filter(Boolean).join(' · ') : (ev.nota || ''), estado: ev.estado, ref: ev, cl });

const enAgenda = (i) => !INACTIVOS.includes(i.estado) && i.estado !== 'cancelada';
const KIND = { cita: { label: 'Cita', cls: 'k-cita' }, entrega: { label: 'Entrega', cls: 'k-entrega' }, tarea: { label: 'Recordatorio', cls: 'k-tarea' } };

        <input type="date" class="in ag-fecha-in" style="width:auto;min-height:34px;padding:4px 8px" data-change="ag-fecha" value="${ui.fecha}" aria-label="Ir a una fecha"></div>

function agendaDia() {
  const ui = S.ui.agenda; const items = itemsDelDia(ui.fecha);
  const semana = Array.from({ length: 7 }, (_, i) => addDays(ui.fecha, i - 3));
  const esperado = sum(items.filter((i) => i.kind === 'cita' && enAgenda(i)), (i) => Number(i.s?.precio || 0)) + sum(items.filter((i) => i.kind === 'entrega' && enAgenda(i) && !i.ref.pagado), (i) => Number(i.ref.monto || 0));

  return `<div class="chips scroll" aria-label="Días cercanos">${semana.map((f) => `<button class="chip ${f === ui.fecha ? 'on' : ''}" data-act="ag-set" data-f="${f}">${new Date(f + 'T12:00:00').toLocaleDateString('es-CL', { weekday: 'short', day: 'numeric' })} · ${itemsDelDia(f).filter(enAgenda).length}</button>`).join('')}</div>

    ${bloqueosDel(ui.fecha).map((b) => `<button class="ag-bloq" data-act="bloqueo" data-id="${b.id}">${icon('lock')}<span><b>Bloqueado ${esc(textoBloqueo(b))}</b>${b.titulo && b.titulo !== 'Bloqueado' ? ` · ${esc(b.titulo)}` : ''}</span><small>Nadie puede reservar</small></button>`).join('')}

}

function filaAgenda(i) {
  const r = i.ref; const k = KIND[i.kind];
  const [est, cls] = (i.kind === 'cita' ? ESTADOS_CITA : ESTADOS_EV)[i.estado] || ['', ''];
  const abierta = enAgenda(i) && !['completada', 'entregada', 'hecha'].includes(i.estado);
  const acciones = [];
  const tel = i.cl?.telefono;
  if (i.kind === 'cita') {
    if (abierta && tel) acciones.push(`<a class="btn sm" target="_blank" rel="noopener" href="${waLink(tel, msg('recordatorio', { nombre: primerNombre(i.cl.nombre), servicio: i.s?.nombre || 'atención', fecha: fechaLarga(r.fecha), hora: hhmm(r.hora) }))}">${icon('chat')}Recordar</a>`);
    if (i.estado === 'solicitada' && tel && cfg().abono?.activo) acciones.push(`<a class="btn sm" target="_blank" rel="noopener" href="${waLink(tel, msgAbono(r, i.cl, i.s))}">Pedir abono</a>`);
    if (i.estado === 'solicitada') acciones.push(`<button class="btn sm" data-act="cita-estado" data-id="${r.id}" data-e="rechazada">Rechazar</button><button class="btn sm pri" data-act="confirmar-reserva" data-id="${r.id}">Confirmar</button>`);
    else if (abierta) acciones.push(`${i.estado === 'agendada' ? `<button class="btn sm" data-act="cita-estado" data-id="${r.id}" data-e="confirmada">Confirmar</button>` : ''}${i.estado !== 'asistio' ? `<button class="btn sm" data-act="cita-estado" data-id="${r.id}" data-e="asistio">Asistió</button><button class="btn sm" data-act="cita-estado" data-id="${r.id}" data-e="no_asistio">No vino</button>` : ''}<button class="btn sm pri" data-act="cita-cobrar" data-id="${r.id}">Cobrar</button>`);
    acciones.push(`<button class="btn sm ghost" data-act="cita" data-id="${r.id}" aria-label="Editar">${icon('edit')}</button>`);
  } else if (i.kind === 'entrega') {
    if (abierta && tel) acciones.push(`<a class="btn sm" target="_blank" rel="noopener" href="${waLink(tel, msg('entrega', { nombre: primerNombre(i.cl.nombre), pedido: r.titulo || '', fecha: fechaLarga(r.fecha), hora: hhmm(r.hora), hora_txt: r.hora ? ' cerca de las ' + hhmm(r.hora) : '', direccion: r.direccion || '', monto: money(r.monto) }))}">${icon('chat')}Avisar</a>`);
    if (r.direccion) acciones.push(`<a class="btn sm" target="_blank" rel="noopener" href="${mapsLink(r.direccion)}">Mapa</a>`);
    if (abierta && !r.pagado && Number(r.monto)) acciones.push(`<button class="btn sm" data-act="ev-cobrar" data-id="${r.id}">Cobrar</button>`);
    if (abierta) acciones.push(`<button class="btn sm pri" data-act="ev-estado" data-id="${r.id}" data-e="entregada">Entregada</button>`);
    acciones.push(`<button class="btn sm ghost" data-act="evento" data-id="${r.id}" aria-label="Editar">${icon('edit')}</button>`);
  } else {
    if (abierta) acciones.push(`<button class="btn sm pri" data-act="ev-estado" data-id="${r.id}" data-e="hecha">Hecho</button>`);
    acciones.push(`<button class="btn sm ghost" data-act="evento" data-id="${r.id}" aria-label="Editar">${icon('edit')}</button>`);
  }
  const monto = i.kind === 'cita' ? (i.s ? money(i.s.precio) : '') : i.kind === 'entrega' && Number(r.monto) ? `${money(r.monto)}${r.pagado ? ' · pagado' : ''}` : '';
  return `<div class="row ag-row ${k.cls}" style="flex-wrap:wrap">
    <div class="ag-hora num"><b>${i.hora || '—'}</b><div class="small muted">${k.label}</div></div>
    <div class="grow"><div class="t">${esc(i.titulo)}</div><div class="s">${esc(i.sub)}${monto ? ` · ${monto}` : ''}</div></div>
    <span class="pill ${cls}">${est}</span>
    <div class="hstack">${acciones.join('')}</div></div>`;
}

function agendaMes() {

  return `<div class="card month-wrap"><div class="month">${DIAS_CORTOS.map((d) => `<div class="month-dow">${d}</div>`).join('')}
    ${Array.from({ length: semanas * 7 }, (_, k) => {
      const f = addDays(ini, k); const items = itemsDelDia(f).filter(enAgenda); const fuera = mesDe(f) !== ym;

        ${items.length ? `<span class="month-dots">${kinds.map((x) => `<i class="${KIND[x].cls}"></i>`).join('')}<small>${items.length}</small></span>` : ''}

function vistaEquipo() {
  const ui = S.ui.equipo; ui.mes ||= mesActual();
  const todos = db.all('empleados');
  const items = db.all('venta_items').filter((i) => i.empleado_id); const ventaMes = new Map(ventasDelMes(ui.mes).map((v) => [v.id, v]));
  const filas = todos.map((e) => {
    const its = items.filter((i) => i.empleado_id === e.id && ventaMes.has(i.venta_id));
    const coms = db.all('comisiones').filter((c) => c.empleado_id === e.id && mesDe(c.fecha) === ui.mes);
    return { e, n: sum(its, (i) => Number(i.cantidad)), vendido: sum(its, (i) => i.cantidad * i.precio_unitario), com: sum(coms, (c) => Number(c.monto)), pend: sum(coms.filter((c) => !c.pagada), (c) => Number(c.monto)) };
  });
  // quienes ya no están solo aparecen si ese mes tuvieron movimiento
  const visibles = filas.filter((f) => f.e.activo !== false || f.n || f.com);
  const totV = sum(filas, (f) => f.vendido); const totC = sum(filas, (f) => f.com);
